# 真实爆款简介参照集 —— 故事/简介质量 pairwise 竞品对标的基准。
# ---------------------------------------------------------------------------
# 用途：services/premise_appeal_arena.py 把【候选书的简介】与【同题材真实爆款
# 简介】做双盲、位置交换的两两对比（哪个更让读者忍不住点进来），胜率=达标证据。
# 这是「故事质量硬门」——不依赖任何 LLM 的绝对分（绝对分不可信），只用相对盲评
# 胜率（与 benchmark_arena 正文层同款方法论）。
#
# 键 = genre_taxonomy 的 canonical genre key。每条 = (title 仅供审计/不进判官 prompt,
# blurb 为公开作品简介的忠实重构)。候选若题材无专属参照，回退 generic 池。
# ---------------------------------------------------------------------------

xuanhuan:
  - title: 斗破苍穹
    blurb: |
      天才少年萧炎四岁练气、九岁斗之气九段，十一岁却武功尽失沦为废物，遭未婚妻当众退婚。
      直到一缕名为药尘的灵魂住进他的戒指——这一次，他要凭异火与斗气一路烧回巅峰，
      让所有看轻他的人，仰着头求他。
  - title: 诡秘之主
    blurb: |
      他在蒸汽与魔法的世界醒来，面前是诡异的笔记、一把左轮和墙上的血字。
      想活下去，就得在克苏鲁式的低语里藏好穿越者的身份，靠"扮演"序列途径步步晋升。
      愚者的牌局已经发出，而他，是唯一知道自己在演戏的人。
  - title: 完美世界
    blurb: |
      荒古禁地走出的少年石昊，肩负灭族血仇，逆乱阴阳，颠倒乾坤。
      从一座边荒小村到诸天万界，他一刀斩尽不公，要让那些高高在上的所谓仙神，
      也尝一尝跪着仰望的滋味。

xianxia:
  - title: 凡人修仙传
    blurb: |
      普通山村少年韩立，靠一个神秘小瓶和谨小慎微到极致的性子，踏进尔虞我诈的修真界。
      没有惊世天资，他偏要在这个一步踏错就尸骨无存的世界里活到最后，逆天求得那一线长生。
  - title: 我师兄实在太稳健了
    blurb: |
      重生为炼气士的李长寿，把一个"苟"字刻进骨子里：从不浪、从不浪、绝对不浪。
      封神大劫将至，他只想稳健苟到飞升——奈何实力藏都藏不住，被徒弟当成了深不可测的绝世高人。
  - title: 诛仙
    blurb: |
      草庙村惨案里幸存的少年张小凡，被青云门收作弟子。资质愚钝的他偶得噬魂，
      一根烧火棍化作诛仙古剑。正邪两难、爱恨交缠，他被命运推着，问出那一句：何为正，何为邪？

urban:
  - title: 赘婿
    blurb: |
      现代金融巨子穿越成江宁布商家的上门赘婿。成婚当日新娘逃婚，他被人一板砖拍晕在喜堂。
      这个被全城轻贱的赘婿，却用一身现代见识和商战手腕，从后宅一路搅动起家国天下的风云。
  - title: 国民老公带回家
    blurb: |
      她被亲妹妹和未婚夫联手算计，一夜之间身败名裂。再抬头，身边却站着那个传闻冷酷无情的
      商业帝国之主：嫁给我，我帮你拿回属于你的一切。所有人都在等她出丑，他却宠她宠到全城眼红。

history:
  - title: 庆余年
    blurb: |
      身负前世记忆的范闲，在波谲云诡的庆国朝堂里长大。从澹州的海边到京都的庙堂，
      他要查清母亲的死、护住在意的人，与皇权、巨贾、宗师层层博弈，把一手烂牌打成翻盘的活路。
  - title: 大奉打更人
    blurb: |
      现代刑警穿成了等死的打更人，一睁眼就身陷大牢、三日后流放、全族待斩。
      他靠现代刑侦手段，在儒释道妖巫蛊并存的诡谲王朝里破案翻身，一边苟命，一边把朝堂搅得天翻地覆。

game:
  - title: 全职高手
    blurb: |
      荣耀职业第一人叶修被俱乐部扫地出门，隐姓埋名当起了网吧网管。十年磨出的技术还在，
      他用一个新建的小号、一把自制的武器，从最低级的新手村，一步步重新杀回那座属于他的巅峰。

suspense:
  - title: 诡秘悬疑
    blurb: |
      凌晨三点，整座城市的人同时收到同一条短信：游戏开始，违规者死。
      电梯不能在十三楼停、镜子里的人不会眨眼——所有规则都在杀人。而他，是唯一能看穿规则裂缝的人。
  - title: 法医秦明
    blurb: |
      一具具沉默的尸体，是凶手留给世界的最后供词。新晋法医面对接连发生的离奇命案，
      要在腐烂、谎言与人心最深的恶里，替死者说出那句没能说出口的真相——而真凶，或许就在身边。

scifi:
  - title: 三体
    blurb: |
      一个濒临崩溃的文明，向宇宙发出了一声呼救。回应它的，是四光年外一支已经启程的舰队。
      当人类抬头仰望星空，才发现黑暗森林里，暴露坐标的代价是整个文明的湮灭。倒计时，已经开始。
  - title: 异常生物见闻录
    blurb: |
      房东把房子租给了一群"非人类"：会做饭的吸血鬼、上网成瘾的狼人、离家出走的海妖。
      一个普通房东的日常，从此变成了横跨人间与异界的奇妙见闻——鸡飞狗跳，却暖到心里。

apocalypse:
  - title: 末世重生囤货
    blurb: |
      重生回丧尸爆发的前一天。前世她饿死在第七天，这一世，她把整座仓库的物资搬空。
      三天后天降红雨，门外是哀求的邻居，门内是堆成山的物资——末世里最硬的通货不是黄金，是命。

pure-love:
  - title: 知否知否应是绿肥红瘦
    blurb: |
      庶女明兰自幼丧母、藏拙隐忍，在嫡庶倾轧的深宅里把一手烂牌过成了好日子。
      谁也没想到，那个看似最不起眼的六姑娘，最后嫁得最好、活得最稳——先婚后爱，步步生莲。
  - title: 重生之将门毒后
    blurb: |
      她被最信任的人挖去双目、推入火海。一朝重生回到豆蔻年华，前世的债，这一世她要亲手讨回。
      只是那个传闻心狠手辣的男人，为何偏偏护她入骨：你想要的命，我替你取；你想要的天下，我陪你打。

female-growth:
  - title: 真千金归来
    blurb: |
      被抱错十八年的真千金回到豪门，认亲宴上等着看她出丑的人，没等到怯懦的乡下丫头，
      却等来国际医学峰会的请柬、商业帝国的股权和神秘大佬的电话。她笑着拨通号码：哥，他们欺负我。
  - title: 嫡女谋
    blurb: |
      前世她痴傻天真，被继母与庶妹一步步算计到家破人亡。重活一世，她敛去天真，
      执棋落子，要让当年所有踩着她往上爬的人，连本带利地还回来——这一局，她不再是棋子。
