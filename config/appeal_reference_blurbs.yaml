# 真实爆款简介参照集 —— 故事/简介质量 pairwise 竞品对标的基准。
# ---------------------------------------------------------------------------
# 用途：services/premise_appeal_arena.py 把【候选书的简介】与【同题材真实爆款
# 简介】做双盲、位置交换的两两对比（哪个更让读者忍不住点进来），胜率=达标证据。
# 这是「故事质量硬门」——不依赖任何 LLM 的绝对分（绝对分不可信），只用相对盲评
# 胜率（与 benchmark_arena 正文层同款方法论）。
#
# 键 = genre_taxonomy 的 canonical genre key。每条 = (title 仅供审计/不进判官 prompt,
# blurb 为公开作品简介的忠实重构)。候选若题材无专属参照，回退 generic 池。
# ---------------------------------------------------------------------------

xuanhuan:
  - title: 斗破苍穹
    blurb: |
      天才少年萧炎四岁练气、九岁斗之气九段，十一岁却武功尽失沦为废物，遭未婚妻当众退婚。
      直到一缕名为药尘的灵魂住进他的戒指——这一次，他要凭异火与斗气一路烧回巅峰，
      让所有看轻他的人，仰着头求他。
  - title: 诡秘之主
    blurb: |
      他在蒸汽与魔法的世界醒来，面前是诡异的笔记、一把左轮和墙上的血字。
      想活下去，就得在克苏鲁式的低语里藏好穿越者的身份，靠"扮演"序列途径步步晋升。
      愚者的牌局已经发出，而他，是唯一知道自己在演戏的人。
  - title: 完美世界
    blurb: |
      荒古禁地走出的少年石昊，肩负灭族血仇，逆乱阴阳，颠倒乾坤。
      从一座边荒小村到诸天万界，他一刀斩尽不公，要让那些高高在上的所谓仙神，
      也尝一尝跪着仰望的滋味。

xianxia:
  - title: 凡人修仙传
    blurb: |
      普通山村少年韩立，靠一个神秘小瓶和谨小慎微到极致的性子，踏进尔虞我诈的修真界。
      没有惊世天资，他偏要在这个一步踏错就尸骨无存的世界里活到最后，逆天求得那一线长生。
  - title: 我师兄实在太稳健了
    blurb: |
      重生为炼气士的李长寿，把一个"苟"字刻进骨子里：从不浪、从不浪、绝对不浪。
      封神大劫将至，他只想稳健苟到飞升——奈何实力藏都藏不住，被徒弟当成了深不可测的绝世高人。
  - title: 诛仙
    blurb: |
      草庙村惨案里幸存的少年张小凡，被青云门收作弟子。资质愚钝的他偶得噬魂，
      一根烧火棍化作诛仙古剑。正邪两难、爱恨交缠，他被命运推着，问出那一句：何为正，何为邪？

urban:
  - title: 赘婿
    blurb: |
      现代金融巨子穿越成江宁布商家的上门赘婿。成婚当日新娘逃婚，他被人一板砖拍晕在喜堂。
      这个被全城轻贱的赘婿，却用一身现代见识和商战手腕，从后宅一路搅动起家国天下的风云。
  - title: 国民老公带回家
    blurb: |
      她被亲妹妹和未婚夫联手算计，一夜之间身败名裂。再抬头，身边却站着那个传闻冷酷无情的
      商业帝国之主：嫁给我，我帮你拿回属于你的一切。所有人都在等她出丑，他却宠她宠到全城眼红。

history:
  - title: 庆余年
    blurb: |
      身负前世记忆的范闲，在波谲云诡的庆国朝堂里长大。从澹州的海边到京都的庙堂，
      他要查清母亲的死、护住在意的人，与皇权、巨贾、宗师层层博弈，把一手烂牌打成翻盘的活路。
  - title: 大奉打更人
    blurb: |
      现代刑警穿成了等死的打更人，一睁眼就身陷大牢、三日后流放、全族待斩。
      他靠现代刑侦手段，在儒释道妖巫蛊并存的诡谲王朝里破案翻身，一边苟命，一边把朝堂搅得天翻地覆。

game:
  - title: 全职高手
    blurb: |
      荣耀职业第一人叶修被俱乐部扫地出门，隐姓埋名当起了网吧网管。十年磨出的技术还在，
      他用一个新建的小号、一把自制的武器，从最低级的新手村，一步步重新杀回那座属于他的巅峰。
  - title: 超神机械师
    blurb: |
      末世游戏降临现实，所有人都在拼天赋拼运气，他却选了最冷门、最被嘲笑的职业——机械师。
      别人靠脸吃饭，他靠造。当机甲军团碾过战场，那些看不起他的天才才发现：原来工业，才是最强的金手指。

suspense:
  - title: 诡秘悬疑
    blurb: |
      凌晨三点，整座城市的人同时收到同一条短信：游戏开始，违规者死。
      电梯不能在十三楼停、镜子里的人不会眨眼——所有规则都在杀人。而他，是唯一能看穿规则裂缝的人。
  - title: 法医秦明
    blurb: |
      一具具沉默的尸体，是凶手留给世界的最后供词。新晋法医面对接连发生的离奇命案，
      要在腐烂、谎言与人心最深的恶里，替死者说出那句没能说出口的真相——而真凶，或许就在身边。

scifi:
  - title: 三体
    blurb: |
      一个濒临崩溃的文明，向宇宙发出了一声呼救。回应它的，是四光年外一支已经启程的舰队。
      当人类抬头仰望星空，才发现黑暗森林里，暴露坐标的代价是整个文明的湮灭。倒计时，已经开始。
  - title: 异常生物见闻录
    blurb: |
      房东把房子租给了一群"非人类"：会做饭的吸血鬼、上网成瘾的狼人、离家出走的海妖。
      一个普通房东的日常，从此变成了横跨人间与异界的奇妙见闻——鸡飞狗跳，却暖到心里。

apocalypse:
  - title: 末世重生囤货
    blurb: |
      重生回丧尸爆发的前一天。前世她饿死在第七天，这一世，她把整座仓库的物资搬空。
      三天后天降红雨，门外是哀求的邻居，门内是堆成山的物资——末世里最硬的通货不是黄金，是命。
  - title: 第一序列
    blurb: |
      大灾变后的世界，人类龟缩在巨城里苟活，城外是吞噬一切的黑雾与变异。
      一个从废土爬出来的少年，要在弱肉强食的序列体系里一路向上——他想做的，不只是活着，是给所有还在挣扎的普通人，撑出一片光。

pure-love:
  - title: 知否知否应是绿肥红瘦
    blurb: |
      庶女明兰自幼丧母、藏拙隐忍，在嫡庶倾轧的深宅里把一手烂牌过成了好日子。
      谁也没想到，那个看似最不起眼的六姑娘，最后嫁得最好、活得最稳——先婚后爱，步步生莲。
  - title: 重生之将门毒后
    blurb: |
      她被最信任的人挖去双目、推入火海。一朝重生回到豆蔻年华，前世的债，这一世她要亲手讨回。
      只是那个传闻心狠手辣的男人，为何偏偏护她入骨：你想要的命，我替你取；你想要的天下，我陪你打。

female-growth:
  - title: 真千金归来
    blurb: |
      被抱错十八年的真千金回到豪门，认亲宴上等着看她出丑的人，没等到怯懦的乡下丫头，
      却等来国际医学峰会的请柬、商业帝国的股权和神秘大佬的电话。她笑着拨通号码：哥，他们欺负我。
  - title: 嫡女谋
    blurb: |
      前世她痴傻天真，被继母与庶妹一步步算计到家破人亡。重活一世，她敛去天真，
      执棋落子，要让当年所有踩着她往上爬的人，连本带利地还回来——这一局，她不再是棋子。

wuxia:
  - title: 射雕英雄传
    blurb: |
      憨厚少年郭靖自幼在大漠长大，一身傻气，却一步步卷入江湖与家国的洪流。
      从蒙古草原到中原武林，他要查清父辈的血案、守住心中的「侠之大者」——而身边那个古灵精怪的姑娘，是他这一生最大的劫，也是最大的幸。
  - title: 昆仑
    blurb: |
      乱世之中，数学奇才与绝世武学在一个少年身上相遇。蒙古铁骑南下，山河破碎，
      他以一身武功与满腹机变穿行于庙堂与江湖，背负血海深仇，要在崩塌的天下里，挣出一条只属于自己的路。

military:
  - title: 弹痕
    blurb: |
      一个被特种部队退回的「问题兵」，骨子里却藏着最狠的战斗天赋。魔鬼训练、跨国任务、生死搏杀——
      他要用一身伤痕证明：真正的兵王，不是天生的，是从尸山血海里一寸寸爬出来的。
  - title: 亮剑
    blurb: |
      他没读过几天兵书，打起仗来却像头不要命的狼。面对装备精良的敌人，别人讲规矩，他只信一条：
      狭路相逢，亮剑者胜！从独立团到铁血军魂，这是一个泥腿子将军，用骨气和血性硬生生打出来的传奇。

occult:
  - title: 鬼吹灯
    blurb: |
      一本祖传的残破《十六字阴阳风水秘术》，把三个胆大包天的盗墓人，带进了一座座深埋地底的古墓。
      粽子、机关、诅咒、人心——摸金校尉点上墓室东南角那支蜡烛，规矩立下：鸡鸣灯灭不摸金。可这一次，灯，灭了。
  - title: 我当阴阳先生的那几年
    blurb: |
      爷爷临终前塞给他一个罗盘和半本笔记，从此他的人生再没安宁过。
      替死人办事、与活人斗法，走阴差、破凶宅、解古怨——他渐渐发现，自己家这门手艺背后，藏着一个瞒了三代人的天大秘密。

infinite-flow:
  - title: 无限恐怖
    blurb: |
      一群素不相识的普通人，被一个冰冷的「主神空间」强行抓走，扔进一个个由恐怖电影构成的死亡轮回。
      生化危机、异形、咒怨……活下来才能回家，而每一次任务，都在把人逼成神，或逼成鬼。这一场，没有观众，只有幸存者。
  - title: 诸天投影
    blurb: |
      当现实与万千世界的投影重叠，普通人也能踏入诸天，摘取属于自己的机缘。
      但机缘的背面是杀机：每一个投影世界都是一场豪赌，赌赢了脱胎换骨，赌输了万劫不复。他要做的，是从一个个世界里，赌出一条通天路。

light-novel:
  - title: 关于我转生变成史莱姆这档事
    blurb: |
      一个平凡的上班族被随机捅死，再睁眼，竟转生成了异世界最弱的史莱姆。
      可谁规定史莱姆不能逆袭？他靠「捕食」一路吞技能、收小弟、建国家，把一手烂到家的开局，过成了让整个异世界都得叫一声「大人」的传说。
  - title: 我家大师兄脑子有坑
    blurb: |
      穿越成修仙门派的废柴大师兄，他只想躺平摆烂混吃等死。可偏偏一群师弟师妹把他当成深藏不露的绝世高人，
      他随口一句敷衍，被奉为旷世真理；他摆烂的每一步，都被脑补成神机妙算。这个误会，越闹越大，越大越收不住。

gu-yan:
  - title: 甄嬛传
    blurb: |
      她本只想做个被父母呵护的闲散女子，却被一道圣旨送进了那座吃人的深宫。
      从天真到城府，从挚爱到看透，一步踏错便万劫不复。她要在步步惊心的后宫里活下去，更要让负她的人，连本带利地偿还。
  - title: 东宫
    blurb: |
      她是西凉最受宠的小公主，为了和亲嫁入东宫，嫁给了那个温润如玉的太子。
      可洞房夜的一杯忘川水，让她忘了一切——也忘了，她与他之间，曾隔着一条流满族人鲜血的河。爱与恨，注定要她亲手了断。

xian-yan:
  - title: 何以笙箫默
    blurb: |
      七年前，她不告而别；七年后，他依旧未娶。再相遇，他成了顶尖律师，眉眼间却还是当年那副冷淡模样。
      「如果世界上曾经有那个人出现过，其他人都会变成将就。」而他，从来不愿将就——这一次，他不会再让她走。
  - title: 你是我的荣耀
    blurb: |
      过气女明星为了翻身，下场玩一款硬核网游，却被一个技术碾压全场的大神「捡」回了战队。
      白天她是镁光灯下的女神，深夜却在游戏里被对方花式吊打。她不知道的是，屏幕那头那个臭屁的大神，是前途无量的航天精英——一场势均力敌的双向奔赴，正在开局。

fantasy-romance:
  - title: 三生三世十里桃花
    blurb: |
      青丘的小狐狸上神，本以为此生只爱风月、不沾情劫，却一次次撞上那个清冷矜贵的九重天太子。
      三生三世，十里桃花，痴缠、误会、生死别离……上一世她为他剜骨跳诛仙台，这一世，换他用整个天下，来求她回头。
  - title: 花千骨
    blurb: |
      她生来命格大凶，是注定要倾覆三界的妖神；他是清冷自持、不动情欲的上仙尊者。
      一个拜入门下，一个收为弟子——师徒情、生死劫，当满身白衣染血、当爱成了天下的祸根，她问他：杀阡陌都为我倾尽所有，你又为我做过什么？

female-derivative:
  - title: 穿书自救指南
    blurb: |
      一觉醒来，他变成了自己吐槽过的小白文里那个作恶多端、注定要被主角虐杀的反派师尊。
      为了保住小命，他只能硬着头皮把人人喊打的剧本演下去——可那个本该恨他入骨的主角徒弟，看他的眼神，怎么越来越不对劲？
  - title: 快穿之反派只想活命
    blurb: |
      绑定了一个坑货系统，她被迫穿进一个个世界，专门替「炮灰反派」改命。
      白莲花的剧本、恶毒女配的死局、必死的结局……别人穿越是开挂，她穿越是拆弹。可拆着拆着，那个跨越无数世界一直追着她的男人，又是怎么回事？

realistic:
  - title: 大江东去
    blurb: |
      改革开放的大潮里，三个出身迥异的年轻人——下海经商的、进国企的、办乡镇厂的，各自挣扎着想抓住时代。
      风口、政策、人情、命运，浮沉起落二十年。这不是某一个人的发家史，是一代人被时代推着往前走的活法。
  - title: 欢乐颂
    blurb: |
      同一层楼里住着五个性格、出身、际遇天差地别的都市女性。职场倾轧、原生家庭、爱情博弈、阶层落差——
      她们彼此看不惯，又彼此撑着。在这座现实到骨子里的城市里，每个人都在用力地活，把日子过成自己的答案。
