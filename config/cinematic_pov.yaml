# =============================================================================
# Cinematic POV · 镜头化·体验优先（最高写作铁律）
# =============================================================================
# 目的：
#   解决最顽固、占文风质量约 50% 的 AI 味——"写信息而非写体验、结论先行、
#   旁观叙述、无效镜头"。这是凌驾其它文采杠杆的第一规则，always-on，高优注入
#   PROSE_SCENE，永不被 token 预算饿死。
#
#   经真实模型(MiniMax-M3)逐版 A/B 验证：加这条后开头/物件揭示/反应侧写
#   明显从"交代信息"转为"读者跟着角色体验"；reaction-shot 必须"有效"是
#   2026-06-13 用户逐句打磨出的关键约束（无效镜头=水文，比直说更糟）。
# =============================================================================

version: 2026.06.13

directive: |
  【镜头化·体验优先（最高写作铁律，违反即重写）】
  凌驾一切的第一规则：不要告诉读者发生了什么，要让读者亲眼看见、亲身体验。
  AI 写"信息"，人写"体验"。下面逐句遵守：

  1. 单一视角沉浸。全程只写本场视角人物能亲身感知到的（看见/听见/摸到/想到）。
     别人的心理、来历、动机，只能从他观察到的外在（动作/神态/语气/物件）去推断，
     不能由叙述者直接说出。

  2. 体验先于信息，禁旁白交代。每个拍点先落视角人物当下的感知或动作，再带必要信息。
     严禁把来历/前情/机制/背景当独立旁白丢出来——下列一出现即违规，必须改写：
     "X 是…分下来的 / 三年没人用"、"这是他惯用的手段：先…再…"、"那是她…的后遗症"、
     "没人看见…"、"他不知道的是…"、"如今三年过去，他修为停滞、连着两次垫底…"。
     一律拆成人物此刻摸到/看见/认出/做出的那一下。回忆只能是一个具体画面，一两笔即收回当下。

  3. 画面感 + 情绪外显。只用具体可见的物、动作、身体反应，让读者脑中拼出完整画面。
     不下抽象评价（矮得可怜/强大/神秘/可怕），不直接命名情绪（震惊/紧张/愤怒）——
     情绪用身体外显写（手抖/咽口水/捏紧/盯着不动），让读者自己得出结论。

  4. 镜头实时推进，先动作、后结果。结果是读者跟人物一起发现的 payoff，不是预先 announce
     的标签。凡"先报结果/反应/含义，再回头补动作或解释"的句子一律倒过来。
     禁群体反应贴标签（倒抽一口冷气/死一般静/鸦雀无声）→ 改成某一个具体人的一个具体动作。
     禁"不是…而是…/不是…，是…/与其…不如…/既…又…"句式（含"不是黑墨，是暗金的浓墨"，
     直接写"墨里浮着一丝暗金"）。

  5. 反应镜头必须"有效"。主角的威慑/震慑/强大，不直接写主角，切到配角、在场 NPC 或
     物件的反应去侧写——但选的细节必须让读者一眼读出含义：
     - 写完自问"这个动作代表什么？"答不上来 = 无效镜头（水文），删。
     - 最强的震惊/失态信号 = 被打断的意图动作 + 不受控的生理反应：
       伸到一半停住 / 话卡在喉咙 / 握着的东西松开或掐紧 / 不由自主迈半步。
     - 禁"他没 X"式否定克制（没去擦/没接话/没回头/没松手当反应）→ 换成正向、带戏剧载荷的信号。
     ✗「殷泱袖中交叠的双手，分开了。」（动作模糊，读不出含义=无效镜头）
     ✓「殷泱话头停了，那只要落黜落笔的手抬到一半，没再落下，腰间佩玉还在晃。」

  6. 建立镜头→推近。进新场景先给一个空间广角锚点（高台/人群/案上九方砚），再推到主角
     当下的手或眼。关键物件给特写（砚底那道缺口、封泥上没干的朱、墨面裂开的缝），用细节顶张力。

  7. 体验优先、克制，都不等于写少。必须把场景写到目标字数，该展开的逐拍展开——
     关键动作一步一步拍（不要"他研墨"一句带过，要写指节怎么压、墨怎么渗、声音怎么变）、
     关键物件给足触感、紧要关头放慢镜头。宁可慢，不可跳着概述。字数不足＝没写完，继续写。

  每写一句自检两遍：①这是"报信息"还是"让读者看见/体验"？②是"先报结果再解释"还是
  "镜头跟着动作走、结果自己落地"？不对就重写。整段写完再核：是否写到了目标字数？不够就展开。
