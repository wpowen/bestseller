# 概念淘汰赛（services/concept_tournament.py，2026-07-09）
# ---------------------------------------------------------------------------
# 背景：真机书《谁敢动我山头》暴露概念层均值回归——LLM 被要求"写个古典仙侠"时
# 输出必然是该题材语料的众数（废脉藏宝/破宗门重建/债主逼门），读者可自动补全全书。
# 表达层已有淘汰赛（blurb_copywriter），概念层此前是 finalize 一锤子买卖。
#
# 本工序把同一套"N 候选→确定性筛→判官淘汰赛"上移到概念层，跑在构思多agent
# 展开【之前】，冠军高概念注入 ctx.description 成为全部下游 prompt 的源头。
# enabled=false → 完全跳过，构思行为与现状逐字节一致（no-op 契约）。
# 预算 ≈ n_candidates 次生成 + 存活数×1 次判官 ≈ 7-8 次调用/书。
# ---------------------------------------------------------------------------

enabled: true
n_candidates: 4          # 3 路杂交 + 1 路纯题材对照组(防"强行猎奇总是赢")
winner_min: 5.5          # 冠军综合分低于此线 → 不注入(宁可回落现状,不硬塞烂概念)
judge_weights:
  freshness: 0.4         # 新颖度:与榜单参照集对撞,"没见过"程度
  click: 0.4             # 想点欲:目标读者3秒想不想点进去
  unpredictability: 0.2  # 不可预测性:能否自动补全后续(可补全=平庸)

# 杂交维度池：与题材"异质"的成熟领域。候选生成时随机抽取强制杂交——
# "题材 × 异质维度"的交点上才有没人写过的位置(诡秘=克苏鲁×蒸汽朋克,
# 道诡异仙=修仙×精神病学,十日终焉=规则怪谈×无限流)。
dimension_pool:
  - 供应链与物流调度
  - 保险与精算定价
  - 法医病理与死因鉴定
  - 直播打赏与流量经济
  - 考古修复与文物断代
  - 瘟疫防治与流行病学
  - 审计查账与做假账
  - 气象预报与灾害预警
  - 殡葬入殓与遗产执行
  - 电网调度与停电分配
  - 同声传译与外交斡旋
  - 育种嫁接与品种改良
  - 职业体育联赛与转会市场
  - 精神医学与诊断手册
  - 刑侦痕迹学与现场重建
  - 城市拆迁与产权博弈
  - 债券做空与信用评级
  - 海关缉私与报关单
  - 灯塔航标与海图测绘
  - 邮驿系统与信件审查
  - 医院分诊与器官移植排序
  - 戏班科班与角儿传承

# 反俗套禁用清单：按 canonical 题材键(genre_taxonomy.canonicalize)取,
# generic 永远合并进来。命中任何一条关键词的候选直接出局(确定性筛),
# 同时整份清单作为负面约束写进候选生成 prompt 和最终注入块。
cliche_seeds:
  generic:
    - 废材觉醒逆袭
    - 退婚打脸
    - 穿越自带系统面板
    - 签到变强
    - 开局获得神级天赋
    - 重生复仇虐渣
    - 隐藏身份扮猪吃虎
  xianxia:
    - 废脉其实是宝脉
    - 破宗门重建崛起
    - 天才陨落从头再修
    - 夺舍重生找仇人
    - 宗门大比一鸣惊人
    - 捡到至宝被全世界追杀
    - 老祖飞升前留下传承
  urban:
    - 战神归来
    - 赘婿逆袭
    - 神医下山
    - 隐豪装穷
  suspense:
    - 天才侦探破连环案
    - 死者托梦指认凶手
  female-growth:
    - 替嫁冲喜
    - 先婚后爱冰山总裁
    - 重生撕渣男白莲花
