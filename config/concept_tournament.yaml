# 概念淘汰赛（services/concept_tournament.py，2026-07-09）
# ---------------------------------------------------------------------------
# 背景：真机书《谁敢动我山头》暴露概念层均值回归——LLM 被要求"写个古典仙侠"时
# 输出必然是该题材语料的众数（废脉藏宝/破宗门重建/债主逼门），读者可自动补全全书。
# 表达层已有淘汰赛（blurb_copywriter），概念层此前是 finalize 一锤子买卖。
#
# 本工序把同一套"N 候选→确定性筛→判官淘汰赛"上移到概念层，跑在构思多agent
# 展开【之前】，冠军高概念注入 ctx.description 成为全部下游 prompt 的源头。
# enabled=false → 完全跳过，构思行为与现状逐字节一致（no-op 契约）。
# 预算 ≈ N次轻量种子 + N次钩子判官 + 前2名的承载扩展/判官 ≈ 12次调用/书。
# ---------------------------------------------------------------------------

enabled: true
# 生产默认只走题材原生的故事发动机。旧的 current 模式会把全局异质维度池
# （法医/殡葬/器官移植等）强制注入每一本书，造成跨题材污染；它只保留在
# 测试配置中，不得作为新书生产默认值。
candidate_prompt_mode: engine_first
# engine_first 模式先设计题材原生的可持续故事发动机，再从冻结发动机压缩钩子。
# 外部领域只有在用户明确选择允许跨题材的创意方向时才能作为实验输入。
raw_idea_prompt_arm: author_pitch
# 2026-07-13：全栈统一 MiniMax M3。真机验证仅 M3 能稳定完成结构化长输出；M2.7
# 多次把 4500-8000 token 消耗在隐藏推理并返回空正文（决赛判官因此偶发全候选空判
# → 误伤淘汰）。其他 catalog 条目分别遇到余额/权限/认证错误。生成、初筛、项目卡初审
# 与最终决赛统一固定 M3；跨家族独立裁判待有可用的异家族强模型再恢复。
generation_model_key: minimax-m3
judge_model_key: minimax-m3
raw_idea_judge_model_key: minimax-m3
premise_judge_model_key: minimax-m3
finalist_judge_model_key: minimax-m3
# 某些独立裁判模型会先消耗隐藏推理 token；450 会 finish_reason=length 且正文为空。
judge_max_tokens: 1800
seriality_judge_max_tokens: 1800
finalist_judge_max_tokens: 5000
finalist_seriality_judge_max_tokens: 7000
engine_judge_floor: 7.0   # 钩子文案生成前先审长篇机器，任一结构轴低于此线即淘汰
finalist_pool_size: 4     # M3 初筛后只送少量候选给独立模型复核
seriality_finalist_count: 3
# 2026-08-25：追读性判官此前整段挂在写死的 `chapter_count >= 200` 后面，对所有
# 正常长度的书完全空转（真机 12 章书：has_decision 0/5、3/5 章 flat，只能等
# 正文写完由整书质量门拦）。分档而不是一刀放开——config 里 2026-07-17 记着
# 收紧概念层阈值 → 淘汰赛干涸 → 回落保底概念（比任何被拒候选都差）的教训。
seriality_min_chapters: 200           # ≥ 此值：判官带杀权（维持既有行为）
seriality_advisory_min_chapters: 8    # ≥ 此值 且 < 上者：只跑判官留痕，不发否决
raw_idea_pool_multiplier: 3
# 2026-08-10 消融定案：跨书「殡葬/阴间」同质化的根因是**采样结构**，不是任何一条
# prompt 措辞。多样性是集合层面的属性——一次只生成一个创意，就没有集合可言，
# 8 次独立抽样必然收敛到该题材分布的众数（玄幻＝殡葬/阴间）。
#
# 单变量实测（东方玄幻/男频/light，其余与生产逐字一致，每格 40-48 样本）：
#   无 focus，每次 1 个  → 死亡族 60.4%
#   无 focus，一次 12 个 →           7.5%   ← 8 倍差，唯一变量是批量
#   有 focus，每次 1 个  →          41.7%   （focus 只是批量的弱替代品）
#   无 focus，一次  8 个 →          20.0%
# 历次治理都在改 prompt 里的词（删禁令/加正向/换措辞），治不了众数塌缩。
#
# batch = pool_count：整池一次生成，模型必须在一次输出里给出互不重复的一组。
# 代价是偶发短产（实测 83%），由下面的补齐兜底消化。
raw_idea_generation_batch_size: 12
# 一次 12 条完整 pitch；3500 会截断成半池。2026-08-26 上调 6000→9000：v2d
# prompt 给 graft 加了因果桥义务（嫁接是什么 + 机制搬进新场景为何仍成立，
# 两句），单条 pitch 长约 20%，实测截断率 1.5%→11.7%（avg_out 3565→4303，
# 撞帽那次的后半池直接丢失、还要额外 topup 补）。改输出契约就必须同步改
# 输出预算——这是数值契约自洽的同一条规矩。A/B 验证时用的 9000 从未撞帽。
raw_idea_pool_max_tokens: 9000
raw_idea_pool_topup_calls: 2    # 短产时最多补几次，保住 batch=1 时代的 100% 产出率
# focus 只在退化到「每次一个」时才有意义（那时它是唯一的区分手段）。批量生成时
# 给一条 focus 等于把整池 8-12 条全焊死在一个维度上——实测反而更差。
raw_idea_batch_focuses:
  - 人物关系、身份错位与私人欲望
  - 题材原生职业、资源争夺与势力夹缝
  - 成长道路、移动世界与建设目标
premise_card_count: 4
# 项目卡初审是便宜的排序层，不是最终故事门。真实运行中 4 张已付费生成的完整卡
# 被单模型一次性压到 2 张，其中 1 张又命中尸体母题，最终只剩 1 个项目方向撞
# 八轴硬门。保留最多 4 张干净近失卡进入钩子终审；污染卡仍在更早的确定性门淘汰。
premise_card_min_survivors: 4
engine_kernel_max_tokens: 3500  # M3项目卡较长；给完整JSON与一次结构修复留出正文预算
raw_idea_floor: 7.0
raw_idea_progression_floor: 5.0  # 仅获 premise card 展开资格；不代表通过最终生产门禁
raw_idea_rank_batch_size: 4  # M2.7 每批6项实测仍会打满4500 token截断
raw_idea_rank_max_tokens: 8000  # M2.7实测4500仍可能全部耗在隐藏推理并返回空正文
premise_judge_max_tokens: 8000  # 四张项目卡结构较长，必须为隐藏推理和JSON正文同时留预算
n_candidates: 6          # 六路题材原生故事发动机候选
control_candidates: 2    # 兼容旧配置；engine_first 不再从全局异质池抽样
# 2026-08-28 对标验证台定罪：hook 只赢 12 本里的 1 本（concrete 75%/sustain 58%），
# 而冠军是按 composite 选的——click 权重虽最高(0.2)仍被另外八轴平均掉。
# 头部 N 名按 composite 取（保住质量下限），再在头部里选 click 最高的：改谁赢、
# 不改谁出局，避开 2026-07-17 收紧阈值致淘汰赛干涸的教训。
hook_shortlist: 3
winner_min: 5.5          # 冠军综合分低于此线 → 不注入(宁可回落现状,不硬塞烂概念)
judge_hard_floors:       # 任何单轴不达标直接出局，禁止用其他高分平均掉硬伤
  # 2026-08-01 两轮真实轻松玄幻：最佳干净候选题材/表达/运动均达 7-9，仍因
  # freshness=4、mechanism=6、predictable=6 三个软缺陷被独立终审全灭。4 分本身
  # 不是题材错位或逻辑灾难；污染与题材漂移另有确定性门，下游还有长篇承载和
  # logline 终审。
  catastrophe_floor: 4.0
  soft_miss_allowance: 3
  # 2026-07-17 校准(五轮真机E2E取证):freshness 7.0/click 7.5 在脑洞关闭的默认
  # 建书下=淘汰赛干涸常态(16+候选零通过;click 8.0/motion 8.0 的候选因 fresh 6.0
  # 被整个丢弃)。而干涸的下场是注入【保底概念】——比任何被拒候选都弱,2/3 直接死
  # 在 logline 门。硬地板的职责是拦灾难(纯俗套),不是完美主义:俗套灾难另有
  # cliche_seeds 一票否决兜底,新颖度的精调交给 composite 加权与下游 logline 门。
  freshness: 6.0
  click: 7.0
  predictable_max: 5.5
  character_logic: 7.0
  mechanism_causality: 7.0
  genre_fidelity: 7.0
  plain_language: 7.0
  # 2026-07-17 第7轮取证:判官打分聚在7.0,7.5地板造成"8轴过7轴、motion差0.5单轴死"
  # (矿工骨片候选 plain 9.0/mech 8.0/genre 8.0 仍出局)。与 freshness/click 同理由校准。
  story_motion: 7.0
seriality_hard_floors:
  renewability: 7.5
  escalation: 7.5
  anti_reset: 7.0
  coherence: 7.5
  promise_survival: 7.5
  unit_density: 7.5
judge_weights:
  freshness: 0.175       # 新颖度:与榜单参照集对撞,"没见过"程度
  click: 0.2             # 想点欲:目标读者3秒想不想点进去
  unpredictability: 0.1  # 不可预测性:能否自动补全后续(可补全=平庸)
  character_logic: 0.1   # 第一人称决策可信度:靠降智/强塞代价推进则硬淘汰
  mechanism_causality: 0.1 # 代价必须由行为后果内生,禁止随机折寿/失忆类外置惩罚
  genre_fidelity: 0.075  # 杂交只能改造玩法,不能替换所选题材
  plain_language: 0.05   # 一遍就懂,禁止术语堆砌和抽象解释
  story_motion: 0.1      # 一句话自身必须出现持续行动与可反制阻力,不能靠后文圆
  # 2026-08-25 新增。真机 custom-xuanhuan-1787625194:批准的故事引擎是纯被动循环
  # 【废料→爆款→被眼红→新对头冒头→被迫再找更偏门的废料】,正文 has_decision 0/5、
  # 3/5 章 flat。八条轴没有一条问「主角要不要做选择」,这类引擎在概念层无损通过。
  # 权重从「写得通不通顺」那几条各匀 0.025 而来(它们此前合计 0.45,过重:一个概念
  # 可以完全自洽、完全没意思)。**刻意不设硬地板**——只改排序不改淘汰,避免干涸。
  protagonist_agency: 0.1  # 推进来自主角取舍,还是外部压力施加、他只做反应

# 确定性筛模式(基线=eliminate 命中即出局;wild_mode 覆盖为 penalize 罚分不淘汰)。
# 基线不设这些键 → tournament 读默认 "eliminate" → 与现状逐字节一致。
cliche_mode: eliminate   # eliminate|penalize:俗套命中→出局 / 罚分
audit_mode: eliminate    # eliminate|penalize:最小故事种子审计失败→出局 / 罚分
cliche_penalty: 1.5      # penalize 模式下俗套命中从 composite 扣的分
audit_penalty: 1.0       # penalize 模式下审计失败从 composite 扣的分

# 脑洞全开模式:story_enhancers.wild_concept=true 时由 conception 深合并覆盖基线。
# 扩大搜索空间并允许非常规机制参加评审，但不降低最终质量门槛。生成可以更野，
# 冠军验收不能更松，否则“脑洞全开”会成为低质量旁路。
wild_mode:
  n_candidates: 8        # 8路题材原生发动机，扩大搜索面但不放松质量门槛
  winner_min: 5.5
  cliche_mode: penalize
  audit_mode: penalize
  cliche_penalty: 1.5
  audit_penalty: 1.0
  judge_weights:
    freshness: 0.25      # 更奖新颖
    click: 0.2
    unpredictability: 0.1
    character_logic: 0.1
    mechanism_causality: 0.075
    genre_fidelity: 0.05
    plain_language: 0.025
    story_motion: 0.1
    protagonist_agency: 0.1  # 与基线同步(2026-08-25);缺这条则权重合计 1.1

# 历史杂交维度池：仅供隔离 A/B 实验和旧数据复盘。生产的 engine_first
# 路由不读取它，避免法医/殡葬/器官移植等异质维度跨题材渗入新书。
dimension_pool:
  - 供应链与物流调度
  - 保险与精算定价
  - 法医病理与死因鉴定
  - 直播打赏与流量经济
  - 考古修复与文物断代
  - 瘟疫防治与流行病学
  - 审计查账与做假账
  - 气象预报与灾害预警
  - 殡葬入殓与遗产执行
  - 电网调度与停电分配
  - 同声传译与外交斡旋
  - 育种嫁接与品种改良
  - 职业体育联赛与转会市场
  - 精神医学与诊断手册
  - 刑侦痕迹学与现场重建
  - 城市拆迁与产权博弈
  - 债券做空与信用评级
  - 海关缉私与报关单
  - 灯塔航标与海图测绘
  - 邮驿系统与信件审查
  - 医院分诊与器官移植排序
  - 戏班科班与角儿传承

# 反俗套禁用清单：按 canonical 题材键(genre_taxonomy.canonicalize)取,
# generic 永远合并进来。命中任何一条关键词的候选直接出局(确定性筛),
# ⚠️ 这份清单**只**用于生成后的确定性筛（关键词命中即出局）。
# 绝不可把词条写进 prompt：否定式指令点名母题词就是种词（2026-08-06 立的
# 铁律，实证：prompt 里禁「半寸」→ 模型改用「一寸」；枚举全部单位→违规翻倍）。
# render_cliche_avoidance_block() 因此只给类别与正向方向，并明写
# 「具体禁用文本不进入本轮提示词」。这条注释此前写反了（说整份清单会进
# prompt），会诱导后来人把种词行为加回来，2026-08-16 更正。
cliche_seeds:
  generic:
    - 废材觉醒逆袭
    - 退婚打脸
    - 穿越自带系统面板
    - 签到变强
    - 开局获得神级天赋
    - 重生复仇虐渣
    - 隐藏身份扮猪吃虎
    - 继承死人的债
    - 替死人还债
    - 把人情债变现成关系网
    # 死亡/复活模板——全平台最烂大街,放 generic 让所有题材继承(证据书连撞两本)
    - 死者借尸还魂归来讨旧账
    - 亡夫亡妻诈尸复活回来认亲
    - 借尸还魂登基当帝王
    - 灭门遗孤血脉觉醒复仇
    - 亲手埋葬的亲人十七年后归来
  xuanhuan:
    - 废脉觉醒是隐藏宝脉
    - 灭门遗孤靠血脉/剑骨复仇
    - 亡亲借尸还魂回来讨账认亲
    - 上古大能残魂认主传功
    - 钻天道/规则漏洞白嫖变强
    - 扮猪吃虎打脸各路天骄
  xianxia:
    - 废脉其实是宝脉
    - 破宗门重建崛起
    - 天才陨落从头再修
    - 夺舍重生找仇人
    - 宗门大比一鸣惊人
    - 捡到至宝被全世界追杀
    - 老祖飞升前留下传承
  urban:
    - 战神归来
    - 赘婿逆袭
    - 神医下山
    - 隐豪装穷
  suspense:
    - 天才侦探破连环案
    - 死者托梦指认凶手
  female-growth:
    - 替嫁冲喜
    - 先婚后爱冰山总裁
    - 重生撕渣男白莲花
