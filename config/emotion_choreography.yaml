# =============================================================================
# Emotion Choreography · 情绪编排
# =============================================================================
# 目的：
#   解决"情绪虚浮"——LLM 默认用抽象标签替代人物在场景中的选择与后果。
#   规则：关键节点优先让情绪改变动作与局面；标签按信息价值判断，不按词面清零。
# =============================================================================

version: 2026.05.14

# =============================================================================
# 情绪类型（7 种基础情绪 × 5 种承载方式）
# =============================================================================
emotion_taxonomy:
  basic_emotions:
    - anger
    - fear
    - grief
    - joy
    - shame
    - desire
    - disgust

  expression_layers:
    physiological:
      description: 非自主变化（仅在会限制下一步动作或造成后果时使用，不作为情绪默认替身）
      examples:
        anger: 正在做的精细动作失准，迫使角色改用另一种做法
        fear: 熟练流程漏掉关键一步，危险随即扩大
        grief: 继续执行一个已经失去对象的日常动作，直到物件产生后果
        shame: 当场撤回一句话或一项决定，并承担关系后果

    behavioral:
      description: 自动化行为
      examples:
        anger: 把杯放重 / 转身 / 离开 / 咬唇
        fear: 数物件 / 摸标志物（主角摸旧疤）/ 找出口
        shame: 不看对方 / 退半步

    object_interaction:
      description: 与物件的互动承载情绪
      examples:
        anger: 把茶杯握碎 / 把纸撕了 / 桌上的笔被掰断
        fear: 银针在指间转 / 紫檀串捻得更快
        grief: 信件按在胸口 / 看着旧物不放

    silence_pause:
      description: 沉默 + 停顿承载情绪
      examples:
        anger: "三息没说话"
        grief: "他低头看着地，看了很久"

    dialogue_minimal:
      description: 极少的对白（≤ 5 字）+ 不解释
      examples:
        anger: 开门。 / 出去。
        grief: 不必。

# =============================================================================
# 审计候选：低信息情绪标签
# =============================================================================
banned_emotion_labels:
  description: 叙述中需要复核是否仅替读者下结论的情绪标签（不是生成提示词禁词表）
  banned:
    - 愤怒 / 怒火中烧 / 怒不可遏
    - 悲伤 / 悲痛欲绝
    - 紧张 / 心慌 / 慌张
    - 高兴 / 喜悦 / 兴奋
    - 害羞 / 羞愧 / 羞耻
    - 害怕 / 恐惧 / 惊恐
    - 厌恶 / 反感
  enforcement: 命中只作为复核候选；仅当该用法不增加信息、只替读者下结论时扣分
  exception: 角色对白、人物自我命名、过场和必要内心导航可以直接说清

# =============================================================================
# 章节情绪曲线
# =============================================================================
chapter_emotion_curve:
  compress_phase:
    description: 压抑积累（开头 - 中段）
    visual: 情绪向内挤 / 节奏稳 / pulse 词点缀

  release_phase:
    description: 爆发 / 释放（中后段）
    visual: 一个外部触发 → 情绪外显（动作 / 对白 / 沉默）

  aftermath_phase:
    description: 余震（章末）
    visual: 一个静止画面 / 一个不寻常的细节让情绪沉下来

  per_chapter_rule: 每章至少有一次完整的 compress → release → aftermath 弧

# =============================================================================
# Writer 注入
# =============================================================================
writer_injection: |
  写本场 / 本章前先决定：
  - 主导情绪是哪一种？（anger / fear / grief / joy / shame / desire / disgust）
  - 关键情绪节点用什么动作、物件、选择或后果承载？从 expression_layers 选 ≥ 2 种组成动作—后果链，不为凑数并列堆叠。
  - 情绪标签不按词面禁用；只改写不增加信息、仅替读者下结论的用法。过场和必要内心导航可以简洁概括。
  - 不得用通用身体反应、感官清单或陈词比喻补位。

# =============================================================================
# Critic 检查
# =============================================================================
critic_checks:
  emotion_label_violation:
    rule: 叙述中 banned 词出现次数
    threshold: 0
  emotion_layer_diversity:
    rule: 章内主要情绪是否用 ≥ 2 种 expression_layer 承载
    threshold: 0.70
  emotion_curve_health:
    rule: 章内是否有 compress → release → aftermath 弧
    threshold: 0.70
