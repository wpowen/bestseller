# Canonical 题材体系(频道 → 题材 → 子题材 → 标签 + 别名)
#
# 这是题材的**单一权威源**,用来收敛框架里 5 套互不相认的题材叫法:
#   ① 展示层 62 卡(writing_presets._GENRE_PRESETS)
#   ② facet 层 dimensions.yaml 的 primary_genre / trope_tags
#   ③ 能力层 13 个 novel_categories
#   ④ 场景库 material_library 的 ~37 个自由中文串
#   ⑤ 文笔层 29 个 prompt_packs
#
# 约束:
#   * 每个 sub_genre.category ∈ config/novel_categories/*.yaml 的 13 个 key
#   * 每个 sub_genre.pack / genre.pack_default ∈ config/prompt_packs/*.yaml 的现有 key
#   * aliases 必须覆盖 material_library 里出现的所有自由题材串(供 canonicalize 收敛检索,治 0 命中)
#
# 设计文档:docs/题材体系-全量调研与实施计划-20260619.md
#           docs/题材选择体系重设计-genre-taxonomy-redesign-20260619.md

