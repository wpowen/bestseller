note: 正样本=2026-08-10榜单实抓钩子(书名+首个故事句,已剔锚例书);负样本=用户2026-08-11逐条定罪原句;ctrl=用户唯一认可条。判官必须:pos中位≥7,neg中位≤4,ctrl≥6,且neg最高不得超过pos中位。
