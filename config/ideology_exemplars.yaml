# 核心理念示例库 + 创作原则 (Ideology Exemplars + Principles)
# =============================================================================
# 取自《从天地不仁到逆命而行的小说方法论》报告的 10 个可直接展开的短大纲(题名+母题配方
# +短大纲) + 四条实操原则。用途：
#   1. exemplars — 作为 LLM 推导 IdeologyKernel 的 few-shot 范例(都是报告自带的、符合主流
#      认知的成熟样例), 让模型"照着分化"而不是凭空硬造。
#   2. principles — 报告的世界观构建/节奏/商业化原则, 注入推导与规划 prompt。
# 由 ideology_library 加载。
# =============================================================================

version: ideology-exemplars.v1

# --- 10 个母题配方范例(报告"创作流程与长篇提案") ---
exemplars:
  - title: 刍狗城
    recipe: [tiandi_buren, zhenxiang, daijia]
    synopsis: 边城百年一次被"天罚"清洗, 幸存少年拜入仙门才知所谓天罚只是上宗收割灵脉的周期工程; 为救城他不断交易寿命换真相, 最后在毁掉仙门与保全城民之间抉择。
  - title: 生死簿外包员
    recipe: [mingyun, yinguo, rending_shengtian]
    synopsis: 落魄书生死后被地府误录为"生死簿修补吏", 补缀人间错漏寿数; 他发现许多"意外死亡"来自上层勾结, 于是带一群冤魂在人间、阴间、朝堂之间改命册、补漏数、续错断的寿数。
  - title: 假佛国
    recipe: [shenfo_jiewei, shane_diandao, zhenxiang]
    synopsis: 西域佛国号称普度众生, 实则以香火换血肉; 被选作"活佛容器"的孤儿逃出圣城, 与被通缉的"妖僧""邪女"和屠夫一路揭开真相, 最终发现所谓邪道才真正救过人。
  - title: 三年一醒
    recipe: [changsheng_zhouzhou, zhongsheng_jieku, zhenxiang]
    synopsis: 主角中了蜉蝣咒, 每三年只醒一天; 用一日见证一代人的爱恨兴亡, 本想旁观, 却逐渐看见横跨六十年的改朝换代阴谋; 每次醒来都要决定救一个人还是改一段历史。
  - title: 梦蝶司
    recipe: [zhenshi_xuhuan, zhenxiang, mingyun]
    synopsis: 王朝设"梦蝶司"调查会污染现实的群体梦境; 新任缉梦使发现自己每破一案现实就少一段历史, 开始怀疑究竟是他在查梦, 还是整座王朝本身就是一场被维护的梦。
  - title: 天道执律
    recipe: [dadao_wuqing, daijia, nitian]
    synopsis: 修真世界人人修道, 却无人知道每次破境都会被天道悄悄抽走某样看不见的东西——一段记忆、一个至亲的名字、一截阳寿; 一个最懂破境规律的执律弟子, 在追查母亲离奇消亡时发现这抽取从不公示、且专挑人最在乎的东西下手, 于是从规律的执行者变成规律的反叛者。
  - title: 白骨慈航
    recipe: [zhongsheng_jieku, yinguo, shenfo_jiewei]
    synopsis: 战乱年代河上浮起一艘不靠风的白骨舟, "慈航娘娘"号称可渡苦海却要灾民献上最珍贵的记忆; 女主为救弟弟登舟, 逐渐发现这船不是渡人, 而是收集众生之苦炼成新神。
  - title: 逆命书院
    recipe: [mingyun, nitian, rending_shengtian]
    synopsis: 天下孩童六岁批命, 命格低者终生不得读书; 一个"下下命"少年偷进书院靠抄书偷听活下来, 发现批命系统并非天授而是人为锁阶层的装置, 于是决定写一本真正能改命的书。
  - title: 无常戏班
    recipe: [yinguo, zhenshi_xuhuan, shane_diandao]
    synopsis: 戏班走到哪哪就死人; 新来的说书人发现每出戏都在重演一桩旧案, 台下观众里总藏着当年的凶手与受害者后人; 越演真相越乱, 直到他发现自己也是戏里被删去的一个角色。
  - title: 天裂之后
    recipe: [tiandi_buren, rending_shengtian, zhenxiang]
    synopsis: 天穹裂开后仙灵雨滋养万物也让怪物横行; 各大仙门争夺"补天权", 底层工匠少年却发现真正能补天的不是仙法而是失传的古代巨构技术; 故事从修仙争霸转成一场文明复建战争。

# --- 四条创作原则(报告实操重点) ---
principles:
  motif_weighting: 母题不要平均用力——一主二辅一暗线; 主母题定调, 一副母题管行动、一副管悬念, 隐藏终局母题晚揭(常 50-60% 进度后)做全书后劲。
  worldview_from_cost: 世界观要从"代价表"往回建, 不要从地图往前堆。先回答五问——①能量/力量从哪来 ②代价是什么 ③谁在收税(谁靠这套规则获利) ④谁能例外 ⑤例外为何要付更大代价; 五问清楚, 境界/体系自然长出来, 否则越细越像游戏攻略。
  pacing_dual_track: 节奏双轨——每章有小勾子、每卷有大翻面、每季有价值重估; 不靠每卷一个大高潮, 而靠"卷级爆点 + 日常亮点"并行。
  ip_preembed: 商业化是前期写可转译元素, 不是后期贴标签; 连载阶段就为可转译资产预埋位置——门派标识、法器视觉、强记忆场景、反派口号、地图节点、支线角色、单元故事、可反复召回的情感母题。
  closing_rule: 先写世界为什么不帮你, 再写你为什么还要做选择; 先写真相如何伤人, 再写人怎么在真相之后继续活。
