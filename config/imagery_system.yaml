# =============================================================================
# Imagery System · 书级意象系统（整书 2-3 主意象，回返并推进意义）
# =============================================================================
# 目的（补 LitStyle「意象系统」维度的真实缺口）：
#   框架的 prose_craft.image_juxtaposition 只到【单句】意象；scene_grounding 只到
#   【单段】镜头。缺的是【整书/整章】级的「2-3 个主意象反复回返、每次回返含义推进
#   一步」——这正是 LitStyle 意象系统维度（10 分）测的东西，也是「镜局/借运/青囊」
#   这类书的辨识度来源。
#
# 两段式（与既有 soft 杠杆一致）：
#   1. design（立项/conception 期，LLM 一次性）：为本书产出 ≤3 个主意象的 artifact
#      （载体/情绪功能/主题功能/首现/变形/回收），存进 story_bible.imagery_system。
#   2. recall（正文 PROSE_SCENE 期，每章 soft 提示）：render_imagery_system_block
#      把本书已设计的主意象回返给写手——「本章若自然用到，让它比上次含义进一步」。
#      **soft，永不强制每章都出现意象；artifact 缺失则整块为空（graceful no-op）。**
#
# 防回归红线（与 prose_craft / scene_grounding 一致）：
#   - 蒸技法不蒸词句：design 产出的是「载体+功能」骨架，不是成品句。
#   - ≤3 意象：purple_guard 反例就是「意象堆砌」。
#   - 分题材反紫化：现代题材（都市/科幻/职场/现实）意象用【本世界的物】
#     （电梯/工牌/旧手机/监控/电弧），不带古风滤镜（红尘/孤舟/残月）。
#   - soft：不进任何 hard_gate / floor / must_rewrite。
# =============================================================================

version: 2026.06.06

# -----------------------------------------------------------------------------
# 通用回返技法（recall 块的开头说明，题材无关）
# -----------------------------------------------------------------------------
technique:
  principle: |
    一本书只守 2-3 个主意象，让它们反复回返；同一意象第二、三次出现时，含义要比
    上一次推进一步（照脸 → 照罪证 → 照出分裂），而不是单纯重复或每章换一套新意象。
  structure: 主意象（具体载体）→ 首次出现立形 → 二次回返时意义变形 → 结尾回收闭环
  purple_risk: 一段并置 ≥3 个意象且不收口 = 辞藻流水账；载体抽象（红尘/繁华/苍茫）= 空对空；每章换新意象 = 不成系统

# -----------------------------------------------------------------------------
# Designer（立项期 LLM 产 artifact 的指令；LitStyle 意象系统设计器本土化）
# -----------------------------------------------------------------------------
designer:
  system: |
    你是中文小说的意象系统设计师。请为给定的故事设定设计「核心意象系统」。
    硬规则：
    1. 只给 2-3 个主意象，绝不超过 3 个。
    2. 每个意象必须给出：物理载体（具体到能看见/能动的物，不能是抽象词）、情绪功能、
       主题功能、第一次出现、第二次变形（含义推进）、结尾回收。
    3. 现代题材（都市/职场/科幻/现实）的意象用【本故事世界里的具体物】，
       不要用古风意象（红尘/孤舟/残月/江湖）。
    4. 意象要能统摄全书主题，彼此不重复。写成中文小说语言，不要写成学术论文。
    只输出 JSON。
  output_schema: |
    {"theme_core":"一句话主题核",
     "images":[{"name":"意象名","carrier":"物理载体(具体)","emotion_fn":"情绪功能",
                "theme_fn":"主题功能","first_appearance":"首次出现","transform":"二次变形",
                "payoff":"结尾回收"}]}
  user_template: |
    故事设定（题材：{genre}）：
    {premise}
    请据此设计 2-3 个主意象，按上面的 JSON schema 输出。

# -----------------------------------------------------------------------------
# 题材路由（哪些题材尤其吃意象系统；careful 题材强制本世界物）
# -----------------------------------------------------------------------------
genre_emphasis:
  strong: [古风, 仙侠, 言情, 治愈, 东方美学, 悬疑, 武侠, 历史架空]
  careful: [都市, 都市异能, 科幻, 职场, 现实, 青春]   # 可用，但意象必须是本世界的物

# -----------------------------------------------------------------------------
# 反面教材 · 意象堆砌守卫
# -----------------------------------------------------------------------------
purple_guard:
  - id: too_many_images
    bad: 一本书铺 ≥4 个主意象，或一段并置一串意象（落花、流水、残月、孤舟、断雁）
    fix: 砍到 2-3 个，每个反复回返
  - id: abstract_carrier
    bad: 意象载体是抽象词（红尘/繁华/命运/苍茫），无法成像
    fix: 换成一个具体的、能看见能动的物
  - id: gu_feng_filter_on_modern
    bad: 给都市/科幻题材套古风意象（孤舟/残月/江湖）
    fix: 换成本世界的物（电梯/工牌/旧手机/监控/电弧/账本）
