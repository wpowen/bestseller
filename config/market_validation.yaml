  xuanhuan: [玄幻, 东方玄幻]
  xianxia: [仙侠, 武侠仙侠, 修真]
  wuxia: [武侠, 武侠仙侠]
  urban: [都市]
  history: [历史, 架空历史]
  scifi: [科幻]
  apocalypse: [末世, 科幻末世]
  suspense: [悬疑, 悬疑灵异]
  occult: [灵异, 悬疑灵异]
  game: [游戏, 体育, 游戏竞技]
  gu-yan: [古代言情, 古言]
  xian-yan: [现代言情, 都市言情]
  fantasy-romance: [玄幻言情, 幻想言情]
