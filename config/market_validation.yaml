# ---------------------------------------------------------------------------
# 题材映射：taxonomy genre_key（config/genre_taxonomy.yaml）→ 番茄分类（按相关度排序）。
# sub_overrides 按 sub_genre_key 覆盖（比 genre 级更准时才写）。
# 七猫/微信读书不在此硬映射：运行时用 taxonomy 标签 + qimao_label_aliases 做名称匹配。
# ---------------------------------------------------------------------------
genre_map:
  xuanhuan:
    fanqie: {channel: 男频, categories: [传统玄幻, 玄幻脑洞]}
    sub_overrides:
      otherworld-continent: {fanqie: {channel: 男频, categories: [西方奇幻, 传统玄幻]}}
      high-martial: {fanqie: {channel: 男频, categories: [都市高武, 传统玄幻]}}
      beast-taming: {fanqie: {channel: 男频, categories: [玄幻脑洞, 传统玄幻]}}
  xianxia:
    fanqie: {channel: 男频, categories: [东方仙侠]}
    sub_overrides:
      urban-cultivation: {fanqie: {channel: 男频, categories: [都市修真, 东方仙侠]}}
      spiritual-revival: {fanqie: {channel: 男频, categories: [都市修真, 都市高武]}}
  wuxia:
    fanqie: {channel: 男频, categories: [东方仙侠]}
  urban:
    fanqie: {channel: 男频, categories: [都市日常, 都市脑洞]}
    sub_overrides:
      urban-psionic: {fanqie: {channel: 男频, categories: [都市高武, 都市脑洞]}}
      divine-doctor-soldier: {fanqie: {channel: 男频, categories: [战神赘婿, 都市高武]}}
      urban-slacker: {fanqie: {channel: 男频, categories: [都市日常, 都市种田]}}
  history:
    fanqie: {channel: 男频, categories: [历史古代, 历史脑洞]}
  military:
    fanqie: {channel: 男频, categories: [抗战谍战]}
  scifi:
    fanqie: {channel: 男频, categories: [科幻末世]}
  apocalypse:
    fanqie: {channel: 男频, categories: [科幻末世]}
    sub_overrides:
      rule-apocalypse: {fanqie: {channel: 男频, categories: [悬疑脑洞, 科幻末世]}}
  game:
    fanqie: {channel: 男频, categories: [游戏体育]}
  suspense:
    fanqie: {channel: 男频, categories: [悬疑脑洞, 悬疑灵异]}
    sub_overrides:
      rule-horror: {fanqie: {channel: 男频, categories: [悬疑脑洞, 悬疑灵异]}}
      tomb-raiding: {fanqie: {channel: 男频, categories: [悬疑灵异]}}
      folk-mystery: {fanqie: {channel: 男频, categories: [悬疑灵异, 悬疑脑洞]}}
  occult:
    fanqie: {channel: 男频, categories: [悬疑灵异]}
  infinite-flow:
    fanqie: {channel: 男频, categories: [玄幻脑洞, 悬疑脑洞]}
    sub_overrides:
      anime-crossover: {fanqie: {channel: 男频, categories: [动漫衍生]}}
  light-novel:
    fanqie: {channel: 男频, categories: [动漫衍生]}
  gu-yan:
    fanqie: {channel: 女频, categories: [古言脑洞, 宫斗宅斗, 古风世情]}
    sub_overrides:
      palace-intrigue: {fanqie: {channel: 女频, categories: [宫斗宅斗]}}
      gu-farming: {fanqie: {channel: 女频, categories: [种田, 古风世情]}}
  xian-yan:
    fanqie: {channel: 女频, categories: [现言脑洞, 豪门总裁]}
    sub_overrides:
      sweet-ceo: {fanqie: {channel: 女频, categories: [豪门总裁, 青春甜宠]}}
      marriage-emotion: {fanqie: {channel: 女频, categories: [职场婚恋]}}
      entertainment-romance: {fanqie: {channel: 女频, categories: [星光璀璨]}}
      era-romance: {fanqie: {channel: 女频, categories: [年代]}}
      workplace-romance: {fanqie: {channel: 女频, categories: [职场婚恋]}}
  fantasy-romance:
    fanqie: {channel: 女频, categories: [玄幻言情]}
  female-growth:
    fanqie: {channel: 女频, categories: [现言脑洞, 古言脑洞]}
  pure-love:
    fanqie: {channel: 女频, categories: []}   # 番茄无对应分类；该平台节降级
  female-derivative:
    fanqie: {channel: 女频, categories: [快穿, 女频衍生]}
  realistic:
    fanqie: {channel: 男频, categories: [都市日常]}

# 七猫名称匹配的补充别名（运行时基础集 = 题材 label + 全部 sub_genre label）
