# 市场验证能力配置（advisory-only；关掉即字节级不变）
# 设计文档：docs/dev-plans/2026-08-08-market-validation-capability.md
# 人工 SOP 来源：docs/book-title-market-validation-process.md
#
# enabled=false 时 run_market_validation 直接返回 SKIPPED 报告，不发起任何外部请求。
version: 1
enabled: true

sources:
  # FanqieHub 第三方聚合站：一次请求返回番茄当日全量榜单（37 个频道×分类）。
  # 2026-08-08 实测参数：category=<精确中文分类名>、platform=男频/女频、per_page 可拉满；
  # 旧版 rank_type=reading 参数已失效，榜单类型需客户端按「榜单类型」字段过滤。
  fanqiehub:
    enabled: true
    base_url: "https://www.fanqiehub.com"
    timeout_seconds: 25.0
  # 七猫官方站 JSON 接口（2026-08-08 实测可用，无签名）：
  # /api/rank/book-list?is_girl={0男|1女}&rank_type={1大热|2新书|3完结|4收藏|5更新}&date_type={1日|2月}&page=N
  qimao:
    enabled: true
    base_url: "https://www.qimao.com"
    timeout_seconds: 20.0
    rank_pages: 3          # 每榜抓几页（20 本/页）
  # 微信读书分类书单（免登录，__INITIAL_STATE__ 内嵌 JSON）：评分/好中差分布=口碑维度。
  # 口径提示：偏付费精品侧，与番茄/七猫免费大盘互补，只作参考信号。
  weread:
    enabled: false
    base_url: "https://weread.qq.com"
    timeout_seconds: 20.0
  # Web 检索查重（复用 services/search_client.py；无 TAVILY/SERPER key 时自动 Noop 降级）
  websearch:
    enabled: true
    site_filters:
      - "fanqienovel.com"
      - "qimao.com"

genre_heat:
  min_sample: 10
  top_books: 5

competitor_scan:
  max_candidates: 24      # 送 LLM 判官前按热度截断

title_check:
  near_distance_max: 1    # 归一化编辑距离阈值（去掉标点/空白后）
  core_token_min_len: 3   # 核心词包含判定的最小长度
  shell_crowd_min_books: 3
  shell_weak_heat_median: 100000   # 同壳书热度中位数低于此=壳弱
  # 书名格式壳抽取规则（正则按序匹配，第一个命中即为壳）；X/Y 槽位用 (.+?) 表达
  shells:
    - name: "我在X当/做Y"
      pattern: "^我在(.{1,8})(当|做|开|收|养|修|学|卖|送|签|带)(.{1,8})$"
    - name: "开局X"
      pattern: "^开局"
    - name: "全民X"
      pattern: "^全民"
    - name: "从X开始Y"
      pattern: "^从(.{1,8})开始"
    - name: "重生X"
      pattern: "^重生"
    - name: "穿越/穿书X"
      pattern: "^(穿越|穿书|穿成)"
    - name: "X：Y副标题壳"
      pattern: "^(.{2,10})[：:](.+)$"
      advisory_only: true   # 冒号副标题是主流健康形态，只统计不判罚
    - name: "X后壳（被…后/成为…后）"
      pattern: "^(被|成为)(.+)(后|之后)"

verdict:
  llm_enabled: true

blurb_benchmark:
  min_board_samples: 8

