# =============================================================================
# Material Concreteness · 物料具体化（Layer 3 — 治"对着抽象机制写作文"的根因）
# =============================================================================
# 背景（实验证据 docs/scene-grounding-cinematic-narration-2026-06.md §9）：
#   横向 A/B 证明，正文"作文感"的【主杠杆】不是写手 prompt，而是上游物料具体度——
#   同一写手、同样开 scene_grounding 块，喂【抽象机制物料】比喂【具体血肉物料】
#   多出 ~14 倍的作者旁白（A_intrusion 0.66 vs 0.05），镜头感 7.8 vs 8.3。
#
#   根因：题材若在 material_library 没有具体 forged 物料，就兜底到通用 §default-*
#   机制语言（"商业类型状态引擎 / 状态变化规则 / 品类承诺 / 阻力方 / 代价记账"）。
#   这些是【给规划用的骨架】，不是【写进正文的血肉】。写手对着它们只能写"读后感"。
#
# 本文件提供两件东西：
#   1. concretization_directive —— 写手侧【修复】prompt：落笔前把抽象机制实例化成
#      本书具体的人/物/动作/场景，正文里只出现具体血肉，绝不出现机制名词。
#      （注入 methodology_compiler PROSE_SCENE；soft，永不硬阻断。）
#   2. abstract_markers —— 规划期【度量/软闸门】用：扫 bible/material_reference_block，
#      抽象机制词占比过高 → 标记"物料抽象，需具体化"。检测器作用于【物料】不是正文
#      （写手会把术语释义成模糊散文，正文里术语命中≈0；术语只在 bible 里成片出现）。
#
# 防回归红线（与既有一致）：
#   - soft 优先：directive 不进 hard_gate；abstract 软闸门初期只提示不硬卡
#     （见 [[story-design-kernel-gate-blocker]] fallback 级联硬卡教训）。
#   - 反继续漂移：directive 明确要求"用本书已有设定/人物/前文实例化，不新造冲突专名"
#     （避免凭空造名导致连续性漂移）。
#   - 题材中立：markers 是跨题材的通用机制词，不硬编码某一题材。
# =============================================================================

version: 2026.06.06

# -----------------------------------------------------------------------------
# 写手侧修复指令（注入 PROSE_SCENE；compact、soft）
# -----------------------------------------------------------------------------
concretization_directive:
  header: "【物料具体化 · 把抽象机制写成具体血肉（落笔前先做这一步）】"
  body: |
    你拿到的部分设定/物料是【抽象机制骨架】（如"状态变化规则""商业类型状态引擎"
    "品类承诺""阻力方""代价记账""状态账"）——这些是给规划用的，不是写进正文的内容。
    落笔前，把每一条用得上的抽象机制【实例化】成本书具体的人、物、动作、场景细节：
    - 用本书已有的设定 / 人物 / 前文来实例化，不新造与大纲冲突的专名；
    - "状态变化"→写成读者能看到的一个具体变化（一件物、一个数字、一处身体反应、一句话）；
    - "阻力方/代价"→写成一个具体的人做了一件具体的事，或一笔具体的损失；
    - 正文里【只出现具体血肉】，绝不出现机制名词、规划术语或"本章要体现…"式自述。
  position_hint: 这是写前的"翻译"步骤，正文主体仍走 show-don't-tell 的连续镜头。

# -----------------------------------------------------------------------------
# 物料抽象度检测器（作用于 bible / material_reference_block 文本）
# -----------------------------------------------------------------------------
# 这些是 §default-* 通用兜底物料的机制语言。它们成片出现在 bible 里 = 物料抽象，
# 需在写作前具体化。检测器扫【物料文本】，不是正文。
abstract_markers:
  - 商业类型状态引擎
  - 状态变化规则
  - 状态变化
  - 品类承诺
  - 通用品类
  - 阻力方
  - 代价记账
  - 状态账
  - 读者承诺
  - 升级时钟
  - 有限揭示
  - 阵营反馈
  - 状态变量
  - 局部胜利
  - 公开代价
  - 可记录的
  - 核心阻力
  - 阶段回报
  - 承诺-选择-状态
  - 压力-反转-回报
  - 适应型对手
  - 资源把门人
  - 后果见证者
  - 条件盟友
  - 状态钩子

# §default-* slug 直接出现在 material_reference_block 里，是兜底物料最强信号。
default_slug_marker: "default-"

detector_thresholds:
  # bible/material 文本中抽象机制词每千字密度上限；超过 = 物料偏抽象，建议具体化。
  abstract_markers_per_kchars: 8.0
  # material_reference_block 里 §default-* 引用条目占比上限（0-1）。
  default_slug_ratio_ceiling: 0.6
