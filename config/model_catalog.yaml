# Switchable LLM model catalog for per-book model selection.
# Each entry is a concrete vendor/version a book can be run on. The runtime
# marks an entry "available" only when its api_key_env is present in the
# environment. A book stores the chosen entry id in
# project.metadata.llm_model_id and the LLM layer applies it to every role.
models:
  - id: minimax-m3
    display_name: "MiniMax M3"
    vendor: MiniMax
    version: "M3"
    model: "openai/MiniMax-M3"
    api_base: "https://api.minimaxi.com/v1"
    api_key_env: MINIMAX_API_KEY
    notes: "高质量、较慢。"

  - id: minimax-m2.7-highspeed
    display_name: "MiniMax M2.7 Highspeed"
    vendor: MiniMax
    version: "M2.7-highspeed"
    model: "openai/MiniMax-M2.7-highspeed"
    api_base: "https://api.minimaxi.com/v1"
    api_key_env: MINIMAX_API_KEY
    notes: "速度快，适合验证整条流程。"

  - id: deepseek-v4-flash
    display_name: "DeepSeek V4 Flash"
    vendor: DeepSeek
    version: "V4-Flash"
    model: "deepseek/deepseek-v4-flash"
    api_base: "https://api.deepseek.com"
    api_key_env: DEEPSEEK_API_KEY
    notes: "快、便宜。"

  - id: glm-5.1
    display_name: "GLM 5.1 (via NVIDIA NIM)"
    vendor: "Zhipu / NVIDIA"
    version: "GLM-5.1"
    model: "openai/z-ai/glm-5.1"
    api_base: "https://integrate.api.nvidia.com/v1"
    api_key_env: NVIDIA_API_KEY
    notes: "限流回退模型。"

  - id: claude-opus-4-5
    display_name: "Claude Opus 4.5"
    vendor: Anthropic
    version: "Opus-4.5"
    model: "anthropic/claude-opus-4-5"
    api_base: null
    api_key_env: ANTHROPIC_API_KEY
    notes: "最强推理（需配置 ANTHROPIC_API_KEY）。"

  - id: claude-sonnet-4-5
    display_name: "Claude Sonnet 4.5"
    vendor: Anthropic
    version: "Sonnet-4.5"
    model: "anthropic/claude-sonnet-4-5"
    api_base: null
    api_key_env: ANTHROPIC_API_KEY
    notes: "强写作（需配置 ANTHROPIC_API_KEY）。"
