key: cozy-fantasy
name: Cozy Fantasy
version: '1.1'
description: 'Techniques for low-pressure fantasy: maintain the selected tone and narrative continuity without prescribing
  characters, places, events, or chapter outcomes.'
genres:
- Fantasy
- Cozy Fantasy
tags:
- cozy fantasy
- found family
- cottagecore
- low stakes
- comfort read
- slice of life
- gentle magic
source_notes:
- Built for the English-language cozy fantasy boom that followed Legends and Lattes
- Prioritizes warmth, atmosphere, and character over conflict intensity
- Optimized for KU comfort-reading sessions and Goodreads cozy-fantasy shelves
anti_patterns:
- High-stakes world-ending conflict that contradicts the cozy promise
- Violence, gore, or graphic content that breaks the comfort atmosphere
- A protagonist who is anxious, stressed, or miserable for extended stretches without cozy relief
- Romance that overshadows the found-family and community-building core
- Conflict that feels forced or artificially dramatic for a low-stakes genre
- Magic system that is complicated or threatening rather than whimsical and warm
writing_profile_overrides:
  market:
    prompt_pack_key: cozy-fantasy
    pacing_profile: slow
  world:
    mystery_density: low
    worldbuilding_density: medium
  style:
    prose_style: commercial-genre
    sentence_style: balanced
    info_density: lean
fragments:
  global_rules: Respect the selected low-pressure tone and current creative contract. Do not prescribe a location,
    occupation, relationship, fixed event, or emotional resolution. Genre techniques are suggestions; adopted story
    facts and author choices take precedence.
  scene_writer: Use precise sensory detail and character voice where relevant to the current scene. Let the adopted
    scene goal and tone guide intensity; no mandatory props, meals, magic demonstrations, or relationship beats.
  scene_review: Check consistency with the adopted tone, character motives and scene context. Distinguish a demonstrated
    contradiction from an optional style suggestion; do not require a fixed event or count of emotional beats.
  scene_rewrite: Repair only the evidenced issue within the current scene. Preserve adopted facts and author choices;
    do not add stock events to satisfy genre expectations.
  chapter_review: Check continuity, voice and the selected low-pressure tone against the current creative contract.
    Do not mandate a happy resolution, a relationship milestone or a fixed number of comfort beats.
  chapter_rewrite: Revise the evidenced issue within the authorised range. Preserve the existing story and its intended
    ending; optional sensory or pacing improvements do not authorise new plot obligations.
story_profile_overrides:
  market:
    prompt_pack_key: cozy-fantasy
    platform_target: Kindle Unlimited
    reader_promise: Wrap the reader in warmth from page one. Deliver the comfort of a quiet life, gentle magic,
      good food, and people who slowly become family. The stakes are personal, the victories are small, and the
      world feels like a hug.
    selling_points:
    - found family warmth
    - gentle magic
    - small-town charm
    - low stakes comfort
    - cozy atmosphere
    trope_keywords:
    - cozy fantasy
    - found family
    - slice of life
    - comfort
    hook_keywords:
    - new beginning
    - warm welcome
    - small magic
    - community
    opening_strategy: Open with the protagonist arriving at or discovering the place that will become home — a bookshop,
      a bakery, a village. The first chapter should establish the cozy atmosphere, the protagonist's need for a
      fresh start, and a hint of the gentle conflict to come.
    chapter_hook_strategy: Cozy hooks are about anticipation and community — a mysterious new neighbor, a festival
      to prepare for, a recipe to perfect, a friendship deepening, a small problem to solve together. The reader
      should want to keep reading not from anxiety but from warmth.
    pacing_profile: slow
    payoff_rhythm: Small, warm payoffs every chapter (a shared meal, a kind gesture, a small success). Medium payoffs
      every few chapters (a friendship milestone, a community event, a personal breakthrough). The big payoff is
      the protagonist realizing they have found home.
  character:
    protagonist_archetype: Retired adventurer or gentle soul seeking a quiet life
    protagonist_core_drive: Build something meaningful — a shop, a home, a community
    antagonist_mode: Gentle conflict — a business rival, a misunderstanding, a town tradition at risk, or an old
      wound to heal
  world:
    mystery_density: low
    worldbuilding_density: medium
  style:
    prose_style: commercial-genre
    sentence_style: balanced
    info_density: lean
