key: wuxia-jianghu-honor
name: 武侠江湖恩怨录
version: '1.0'
description: 适合传统武侠、新派武侠、国术武技、武侠幻想写法。区别于仙侠/玄幻的超凡力量阶梯,武侠以「内力—招式—秘籍」为骨,以「江湖恩怨—门派纷争—侠义家国」为魂,力量克制讲究招式相生相克与临场博弈,而非数值碾压。融入情绪工程与核心循环方法论。
genres:
- 武侠
- 江湖
- 国术
- 武侠幻想
tags:
- 内力
- 招式
- 秘籍
- 门派
- 恩怨
- 侠义
- 快意恩仇
- 家国
source_notes:
- 与 xianxia/xuanhuan 分流:武侠不走「境界数值碾压」,胜负靠招式克制、内力运用与临场博弈
- 融入猫神写作方法论(情绪工程/核心循环/钩子轮换)
- 强调「侠之大者」的道义内核与江湖人情
anti_patterns:
- 武功体系数值化成修真境界(一拳一个境界),失去招式博弈的临场感
- 江湖只是打斗背景,没有恩怨情仇、门派人情与规矩
- 主角武功一路无敌,没有以弱胜强、以巧破力的智斗
- 侠义沦为口号,主角行事与「侠」无关,只顾自己升级
- 反派只会比武功高低,没有立场、苦衷与江湖逻辑
- 秘籍/兵器当数值道具,没有来历、代价与争夺的恩怨链
writing_profile_overrides:
  market:
    prompt_pack_key: wuxia-jianghu-honor
    platform_target: 起点中文网/纵横中文网
    reader_promise: 前几章给出主角的江湖困局、一桩恩怨的引线,以及第一次以巧破力或以义动人的高光。
    selling_points:
    - 招式博弈
    - 江湖恩怨
    - 以弱胜强
    - 侠义抉择
    - 门派纷争
    trope_keywords:
    - 落魄少侠
    - 灭门之仇
    - 绝世秘籍
    - 名门正派
    - 快意恩仇
    hook_keywords:
    - 神秘高手
    - 武林秘籍
    - 血海深仇
    - 江湖大会
  character:
    protagonist_archetype: 重情重义的成长型侠客
  world:
    power_system_style: 内力—招式—秘籍制,讲究相克与临场博弈
  methodology:
    emotion_spring_min_chapters: 2
    emotion_spring_max_chapters: 4
    core_loop_cycle_length: 3
    hook_min_active: 3
    hook_max_active: 6
    hook_max_age_chapters: 12
    visual_writing_mode: action_over_description
fragments:
  global_rules: '武功提升必须绑定秘籍、师承、顿悟、苦练或机缘,且胜负讲究招式克制与内力运用,不允许纯数值碾压。江湖行事要符合「侠义—恩怨—规矩」的逻辑。

    '
  scene_writer: '正文打斗要写「招式名+破解思路+内力消长+胜负代价」,突出以巧破力与临场博弈,而非光效与等级。江湖场景要带门派规矩、市井人情与恩怨张力。

    '
  chapter_review: '检查本章是否推进了武功、恩怨链、江湖地位或侠义抉择之一。

    检查胜负是否靠招式/智斗/内力博弈,而非数值碾压。

    检查情绪压缩释放:被欺辱/被冤屈是否压够再释放?以弱胜强前是否有铺垫?

    检查钩子:章末是否留新恩怨/新谜团,消解旧钩子?

    '
  emotion_engineering: '武侠情绪工程核心:

    - 压缩期:被灭门、被冤屈、被名门轻贱、心爱秘籍/亲人被夺

    - 释放期:以巧破力反杀、当众洗冤、快意恩仇、侠义动人

    - 弹簧法:压至少2章再释放;以弱胜强前必须有被低估/被逼入绝境的铺垫

    - 爽感公式:实力落差越大 × 冤屈越深 × 反击越漂亮(以巧破力)= 爽感越强

    - 道义加成:释放时若兼顾「侠义」(护弱、守诺、舍身),爽感叠加共鸣

    '
  conflict_stakes: "冲突筹码设计:\n- 每场比武/恩怨有明确筹码(名声→秘籍→门派存续→亲人性命→家国大义)\n- 极限施压:以一敌众/内力被废/兵器受制/时限(比武大会、仇家追杀)/必须守护的弱者\n- 不允许无意义的炫技切磋——动手必有恩怨、赌注或道义\n"
  hook_design: '武侠钩子设计:

    - information_gap型:隐藏身世、师门真相、秘籍下落、仇家身份

    - deadline型:比武大会/复仇时限/门派危亡倒计时

    - mystery型:江湖悬案、神秘高手、武林异动

    - desire型:绝世秘籍、报仇雪恨、与心上人的约定

    - threat型:仇家追杀、名门构陷、魔教来袭

    章末钩子示例:"他收刀回鞘,客栈外却传来一声冷笑——那正是十年前灭他满门的声音。"

    '
  core_loop: "武侠核心循环(每2-3章一轮):\n1. 触发:恩怨被勾起 / 强敌挡路 / 秘籍或线索现世 / 江湖事件爆发\n2. 行动:苦练/查案/比武/闯荡(详写,约70%篇幅)\n3. 奖励:武功精进/真相揭露/恩怨了结/侠名远播(带随机性)\n4. 投入:新实力与名望带来的江湖地位与道义分量\n\n变体循环:每3-4轮插入1个呼吸口(儿女情长/市井温情/师徒情义)。\n"
  dialogue_rules: "武侠对话规则:\n- 老江湖说话留三分,话里藏机锋与试探\n- 名门正派表面客套、暗藏轻贱,反派话里有立场与苦衷\n- 主角侠者本色:认死理、重承诺,危急处一句话定生死\n- 潜台词示例:对手说\"阁下这路剑法,倒像是听月楼的手段\"\n  (潜台词:我认得你的来历,我在威胁你。)\n"
  visual_writing: '武侠画面感规则:打斗写「招式拆解+内力消长+环境借力+胜负转折」,江湖场景写「市井烟火+门派气象+人情冷暖」,以动作和博弈推进,克制形容词堆砌。

    '
