key: xuanhuan-power-fantasy
name: 玄幻异界血脉征途
version: '1.0'
description: 适合东方玄幻、异世大陆、高武世界、王朝争霸、洪荒封神、御兽流写法。区别于仙侠的「修真境界/渡劫飞升」,玄幻强调血脉天赋、斗气/武魂/异火等多元力量体系、种族与王朝格局、位面征服与气运之争。融入情绪工程与核心循环方法论。
genres:
- 玄幻
- 异世大陆
- 高武世界
- 王朝争霸
- 洪荒封神
- 御兽
tags:
- 血脉
- 斗气
- 武魂
- 异火
- 王朝
- 种族
- 越阶战
- 打脸
source_notes:
- 与 xianxia-upgrade-core 分流:玄幻不走「修真境界+渡劫」单一阶梯,而是血脉/天赋/异宝多元力量
- 融入猫神写作方法论(情绪工程/核心循环/钩子轮换)
- 强调异界世界观的「种族—王朝—位面」三层格局
anti_patterns:
- 力量体系照搬修真境界(炼气筑基金丹),失去玄幻的血脉/斗气/武魂差异化
- 异世大陆只是换皮的地球,没有独立种族、地理、王朝史
- 血脉/天赋觉醒后一路平推,没有同阶天才压制和越阶代价
- 王朝/家族/学院只是背景板,不参与资源与权力分配
- 御兽/契约兽只当工具,没有成长线和情感羁绊
- 反转靠天降神器而非血脉伏笔/身世伏笔回收
writing_profile_overrides:
  market:
    prompt_pack_key: xuanhuan-power-fantasy
    platform_target: 起点中文网/番茄小说
    reader_promise: 前几章给出主角的血脉/天赋困境、第一次觉醒入口,以及打破天才压制或家族轻视的契机。
    selling_points:
    - 血脉觉醒
    - 天赋逆袭
    - 越阶斩杀
    - 王朝/家族争锋
    - 异界地图扩张
    trope_keywords:
    - 废柴逆袭
    - 血脉觉醒
    - 天才云集
    - 家族倾轧
    - 打脸
    hook_keywords:
    - 血脉异象
    - 上古传承
    - 天才榜
    - 王朝召唤
  character:
    protagonist_archetype: 血脉觉醒型逆袭主角
  world:
    power_system_style: 血脉天赋制与斗气/武魂多元体系并行
  methodology:
    emotion_spring_min_chapters: 2
    emotion_spring_max_chapters: 4
    core_loop_cycle_length: 3
    hook_min_active: 3
    hook_max_active: 6
    hook_max_age_chapters: 12
    visual_writing_mode: action_over_description
fragments:
  global_rules: '力量提升必须绑定血脉、天赋、传承、异宝或代价,不允许凭空变强。玄幻的力量阶梯是多元的(斗气/武魂/血脉/异火/兽契),不要退化成单一修真境界。

    '
  scene_writer: '正文要突出血脉差、天赋差与等级威压。战斗服务于地位变化、家族/王朝格局与气运争夺,招式要有体系命名与代价,不要只堆光效。异界场景要带种族、地理、王朝史的质感。

    '
  chapter_review: '检查本章是否推进了血脉/天赋/地位/气运/仇恨链之一,而非原地踏步。

    检查力量体系是否保持玄幻差异化(没有滑回修真境界)。

    检查情绪压缩释放:有没有无痛爽点?打脸前是否有≥2次被轻视铺垫?

    检查钩子生命周期:章末是否留新钩子、消解旧钩子?

    '
  emotion_engineering: '玄幻情绪工程核心:

    - 压缩期:血脉低劣被断言无望、被天才碾压、被家族放弃、机缘被夺

    - 释放期:血脉异变觉醒、越阶斩杀天才、当众打脸豪族、夺回传承

    - 弹簧法:压至少2章再释放;打脸前必须有≥2次明确的轻视/羞辱

    - 爽感公式:天赋落差越大 × 被轻视越深 × 觉醒越炸裂 = 爽感越强

    - 随机奖励:觉醒/突破后偶尔附带意料之外的血脉记忆/上古传承

    '
  conflict_stakes: "冲突筹码设计:\n- 每场战斗/争锋有明确筹码(失去什么:颜面→资源→家族地位→亲人→气运传承)\n- 极限施压BUFF:同阶天才压制/血脉克制/王朝势力围攻/时限(召唤将启、大比在即)/必须守护的弱者\n- 不允许无筹码的切磋——比试必须押上排名、资源或尊严\n"
  hook_design: '玄幻钩子设计:

    - information_gap型:隐藏血脉真相、身世之谜、异宝完整威能

    - deadline型:家族大比/天才榜测试/王朝召唤倒计时

    - mystery型:血脉异象、上古遗迹、位面裂缝异动

    - desire型:更高阶血脉的诱惑、传说传承、复仇

    - threat型:豪族追杀、天才宿敌盯上、王朝清洗

    章末钩子示例:"他刚压下体内躁动的血脉,远处一道带着王族威压的目光,已穿过重重人群,落在了他身上。"

    '
  core_loop: "玄幻核心循环(每2-3章一轮):\n1. 触发:血脉/天赋瓶颈出现 / 更强天才挡路 / 新地图(秘境/王朝/位面)开启\n2. 行动:觉醒/历练/争锋(详写,约70%篇幅)\n3. 奖励:血脉异变/夺宝/排名跃升(带随机性,超出预期)\n4. 投入:新实力带来的地位感/安全感/家族翻身\n\n变体循环(防疲劳):每3-4轮插入1个支线呼吸口(御兽羁绊/感情线/异界探索)。\n"
  dialogue_rules: "玄幻对话规则:\n- 豪族/天才说话带俯视与傲慢,话里有等级判决\n- 主角隐忍期话少,关键处用行动(一招越阶)代替辩解\n- 长辈/传承者说话带历史厚重感,透露世界观线索\n- 潜台词示例:族老说\"你的血脉,倒是比族谱上写的有意思\"\n  (潜台词:你的血脉来历不简单,我在试探。)\n"
  visual_writing: '玄幻画面感规则:战斗写「体系招式+血脉异象+环境破坏+对手地位崩塌」四件套,异界场景写「种族风貌+地理奇观+王朝气象」,用动作与因果推进,不堆形容词。

    '
