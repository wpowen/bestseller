# Reference corpus for action-progression / 升级爽文 (玄幻 · 仙侠 · 末世 · 都市异能).
#
# SYNTHETIC excerpts inspired by (but not copied from) top-charting Chinese
# progression novels. Each sample is annotated with WHY it qualifies as 榜单级,
# and what structural moves it makes in its first ~400 Chinese characters.
#
# The LLM judge reads these as calibration anchors for action-progression books
# (resolve_reference_corpus_key maps category 'action-progression' → this file).
#
# 关键反模式(本类型最常翻车处):①金手指靠「系统说明书」直接念面板,而非用动作show;
# ②无痛升级(没有前置压缩/代价就给爽点);③打脸前没有≥2次被轻视的铺垫。
#
# target platforms: 起点, 番茄, 七猫
# chapter length: 2000-3500 characters

version: "1.0"
genre: action-progression
subgenres:
  - 东方玄幻
  - 血脉觉醒
  - 天灾囤货
  - 末日求生
  - 都市异能

samples:
  # ───────────────────────────────────────────────────────────────────────────
  - id: sample_a_xuanhuan_bloodline
    label: "玄幻血脉觉醒型 — 被轻视压制→觉醒show不tell→留威胁钩子"
    excerpt: |
      测灵石第三次没有亮，叶家祠堂里就有人笑出了声。

      "废脉。"长老把玉简往案上一搁，连看都懒得再看叶迟一眼，"按族规，废脉子弟迁去后山药圃,明日就走。"

      叶迟没有辩。他只是伸手，把那块冰凉的测灵石重新按回掌心——三年来他被打断过两根肋骨，是这块石头从没告诉过任何人的事:它每次接触他的血,边缘都会结一层极细的白霜。

      此刻满堂哗然，因为那层白霜正顺着他的手腕往上爬，把半块测灵石冻成了一只透明的拳。

      "这……这是冰灵根?"

      "不对，冰灵根不会让灵石倒流灵气。"

      叶迟松开手。测灵石"咔"地裂成两半，断面里冻着一缕他自己都没见过的、像是从骨头里渗出来的银线。

      他终于抬头，看向那位刚刚还在念族规的长老,声音不高:"后山药圃，我去。但这块石头，得赔我一块新的——这块,被我用坏了。"

      祠堂外，一只灰羽的信鸦扑棱棱飞起，朝着叶家最忌惮的那座山头去了。

    word_count: 320
    why_bestseller_quality:
      - "开篇'测灵石第三次没亮+有人笑'三句立刻建立'被全族轻视'的压制场,无废字。"
      - "金手指用动作show:白霜爬上手腕、冻住灵石、银线渗出——读者亲眼看见异常,而不是主角念一段系统面板说明书。"
      - "压制在前(废脉/迁药圃/打断肋骨),觉醒在后,符合'弹簧法':先压够再释放。"
      - "围观者的两句台词('冰灵根?''不对')替主角佐证了金手指的不凡,且制造信息缺口(到底是什么血脉)。"
      - "最后主角'赔我一块新的'是克制的打脸——姿态而非碾压,留住后续空间。"
      - "结尾信鸦飞向'最忌惮的山头'是威胁型钩子:觉醒立刻招来更高层的注意,章末挂新危机。"
      - "信息密度受控:1个具名主角+1个长老,1个超自然概念(银线血脉),0术语堆砌(没有报境界名)。"

  # ───────────────────────────────────────────────────────────────────────────
  - id: sample_b_apocalypse_hoarding
    label: "末世天灾囤货型 — 信息差先手→囤货行动show→可见损失压力"
    excerpt: |
      苏晚把最后一箱矿泉水搬进次卧时,楼下王姐还在阳台上晒被子。

      "晒什么呢，要变天了。"苏晚没解释。她重生回来的第七天,只剩这一天——明天凌晨四点十七分,第一场黑雨会把这座城市泡进零下二十度的冬天,而现在是七月。

      她不能说。说了,没人信,只会把她当疯子,顺手抢光她囤的东西。

      所以她只做了三件事:把全部积蓄换成了米、盐、煤油和两台不插电也能用的手摇发电机;把次卧的窗用木板从内侧封死,只留一道能塞进手臂的缝;最后,她下楼,敲开了独居老人陈伯的门，递进去半箱压缩饼干。

      "苏丫头,这是?"

      "陈伯,这两天别下楼,门窗封好。"她顿了顿,"信我一次。"

      陈伯看着她的眼睛,没问为什么,只是点了点头,把饼干收了进去。

      凌晨四点十七分,第一滴黑雨砸在木板上,发出烧灼般的"滋"声。整栋楼的灯,在同一秒里全灭了。

      楼下传来王姐的尖叫,和被子被烫穿的、棉花焦糊的味道。

    word_count: 340
    why_bestseller_quality:
      - "开篇用'搬水/晒被子'的日常反差,把'我知道而你们不知道'的信息差爽感前置,无需解释设定。"
      - "金手指(重生+精确时间)用一句'明天凌晨四点十七分'交代,立刻转入行动,不停留在面板说明。"
      - "囤货全是具体物资(米/盐/煤油/手摇发电机/木板),画面感强,符合本类型'物资即安全感'的核心爽点。"
      - "不能说'的两难制造张力:信息差不是无脑碾压,而是有代价(说了会被抢/被当疯子)。"
      - "给陈伯送饼干一笔,把主角从'自私囤货'拉成有人情的可代入者,同时埋下配角羁绊钩子。"
      - "结尾黑雨'滋'声+全楼灯灭+王姐被烫穿的被子——可见的、感官化的灾难落地,验证主角判断,爽感兑现。"
      - "全程零术语、零旁白说教,用行动和感官推进,信息密度受控。"

binary_checklist:
  - id: GF_SHOW_NOT_TELL
    label: 金手指 show 不 tell
    description: >
      金手指/重生/系统/血脉的能力必须通过【具体动作或感官细节】被读者看见(如白霜冻石、精确预言落地),
      而不是主角或面板直接念一段"你获得了XX能力"的说明书。引用具体展示句;若开篇是系统/面板说明书式罗列,记 FAIL。
  - id: PRESSURE_BEFORE_PAYOFF
    label: 爽点前有压缩
    description: >
      第一次突破/打脸/反击之前,必须有【可感的被压制/被轻视/危机】铺垫(≥1处具体事件)。
      无痛升级(没有任何前置代价或压力就直接变强)记 FAIL。
  - id: VISIBLE_STAKES
    label: 可见的损失/威胁
    description: >
      本章存在【主角会失去什么】的具体、感官化的筹码或威胁(身份、性命、亲人、物资、机缘),
      而非抽象的"危险"。引用具体句。
  - id: CONTROLLED_INFO_DENSITY
    label: 信息密度受控
    description: >
      世界观/力量体系的术语【渐进释放】,黄金三章不前置堆砌境界表/设定百科。
      若开篇连报多个生造术语且不影响理解,记 FAIL。
  - id: CHAPTER_END_HOOK
    label: 章末钩子
    description: >
      章节结尾留有新的悬念/威胁/目标(更高层势力注意、新危机降临、未解之谜),
      推动读者追读。引用结尾钩子句。

calibration:
  score_anchors:
    - score: "0.90+"
      label: 榜单级
      description: >
        金手指全程 show 不 tell;压制→释放节奏清晰;损失具体可感;术语渐放;章末有强钩子。
        五项 checklist 全过,且画面感与爽点密度俱佳。
    - score: "0.75"
      label: 合格但有短板
      description: >
        故事能读,但缺 1-2 项:或金手指略有"说明书味",或爽点前压缩不足,或钩子偏弱。
    - score: "0.55 及以下"
      label: 结构性翻车
      description: >
        开篇即系统/面板说明书;无痛升级无代价;损失抽象;术语前置堆砌。缺 3 项及以上。
