# Reference corpus for relationship-driven / 情感线驱动 (现代言情 · 古代言情 · 纯爱 · 幻想言情).
#
# SYNTHETIC excerpts inspired by (but not copied from) top-charting Chinese
# romance/character-driven novels. Annotated with WHY each is 榜单级 and what
# structural moves it makes in its first ~400 Chinese characters.
#
# resolve_reference_corpus_key maps category 'relationship-driven' → this file.
#
# 关键反模式:①情绪靠喊口号("我好喜欢他""我好难过")而非具象细节;②CP/关系第一次
# 交锋没有张力(平淡寒暄);③主角是恋爱工具人,没有自己的目标与立体感。
#
# target platforms: 晋江, 番茄(女频), 七猫
# chapter length: 2000-4000 characters

version: "1.0"
genre: relationship-driven
subgenres:
  - 都市甜宠
  - 豪门总裁
  - 古言情缘
  - 现代纯爱

samples:
  # ───────────────────────────────────────────────────────────────────────────
  - id: sample_a_modern_sweet_firstmeet
    label: "现代甜宠初遇型 — 张力前置→情绪具象→双向人设立体"
    excerpt: |
      电梯停在十七层,门开了,温意和那个男人同时伸手按了"关门"。

      指尖撞在一起。她缩回手,他却没动,反而把"开门"键也按亮了:"你先。"

      "我不下。"温意盯着楼层显示,"我按的是关门。"

      "巧了。"他收回手,西装袖口擦过她的手背,凉的,"我也不想这层有人上来。"

      温意终于侧头看他。她今早被合伙人坑掉一个项目,化好的妆在洗手间哭花过一次又补上,自以为天衣无缝。可这个陌生男人只看了她一眼,就把手里那杯没动过的热美式递了过来。

      "苦的。"他说,"哭过的人喝甜的会更想哭。"

      电梯无声地往上走。温意没接那杯咖啡,却也没再看楼层显示。

      "你怎么知道我哭过。"

      "因为我也是。"他松了松领带,露出一截被红印勒过的脖颈,"刚被董事会赶出我自己开的公司。十七层,是天台的下一层。"

      电梯"叮"地停了。两个人都没动。

    word_count: 350
    why_bestseller_quality:
      - "初遇用'同时按关门键+指尖相撞'制造物理与心理的双重张力,远胜平淡寒暄。"
      - "情绪具象:女主'妆哭花过又补上''自以为天衣无缝'——不喊'我好难过',用细节让读者读到她的强撑。"
      - "男主递苦咖啡+'哭过的人喝甜的会更想哭'是有信息量的体贴,人设立刻立体(观察力+反套路)。"
      - "双向揭示:女主被坑项目,男主被赶出自己公司——两个都有独立困境,不是一方拯救一方。"
      - "'十七层是天台的下一层'一句把甜中带痛的张力拉满,暗示两人都站在某种边缘。"
      - "结尾'电梯叮地停了,两个人都没动'是情感悬置钩子:留白,让读者追问下一步。"
      - "全程零'我喜欢你'式直白,情绪靠动作、台词潜台词和细节承载。"

  # ───────────────────────────────────────────────────────────────────────────
  - id: sample_b_ancient_tension
    label: "古言情感张力型 — 身份错位→克制对峙→未了心结钩子"
    excerpt: |
      沈昭跪在偏殿外的雪里,已经一个时辰。

      她是来请罪的——昨夜她替长姐挡下了那盏泼向皇后的茶,如今满宫都说三公主目无尊卑。可真正泼茶的人,此刻正站在廊下,披着她去年亲手绣的那件白狐裘。

      "起来吧。"

      声音从身后传来。沈昭没回头,她认得这个声音,是那个本该恨她入骨的人——三年前,她父亲的判词,就是出自他手。

      谢临走到她面前,蹲下身,伸手拂去她睫毛上的雪。他的指尖很稳,稳得不像是在碰一个仇人的女儿。

      "你明知泼茶的不是你。"他说。

      "我知道。"

      "那你跪什么。"

      沈昭终于抬眼。她的眼睛冻得发红,声音却很轻:"跪我自己——明知道是陷阱,还是替她挡了。谢大人,你说,人为什么会做明知会输的事。"

      谢临的手停在半空。良久,他把自己的大氅解下来,盖在她肩上,转身往雪里走,留下一句几乎听不见的话:"因为有些人,输了也甘心。"

    word_count: 360
    why_bestseller_quality:
      - "开篇'跪雪一个时辰'+'替长姐挡茶'立刻建立身份错位与冤屈,冲突前置。"
      - "'泼茶的人披着她亲手绣的白狐裘'——用一件具体物件把背叛感具象化,不靠旁白控诉。"
      - "男女主关系张力来自'本该恨她入骨'(杀父判词出自他手)的宿敌设定,情感有阻力才有张力。"
      - "对话克制有潜台词:'你跪什么''跪我自己'——女主的清醒与自苦立体,不是恋爱脑工具人。"
      - "'人为什么会做明知会输的事'是点题之问,把情感升华为人物内核,有思想厚度。"
      - "结尾男主盖大氅+'输了也甘心'是双向情愫的克制流露,留下未了心结钩子。"
      - "情绪全靠动作(拂雪、解氅)与潜台词承载,无一句直白告白。"

binary_checklist:
  - id: RELATION_TENSION_EARLY
    label: 关系张力前置
    description: >
      核心关系(CP/对手/羁绊)在黄金三章内有【具张力的交锋】(对峙、错位、阻力),
      而非平淡寒暄或一见钟情无理由。引用具体张力句;若关系毫无阻力,记 FAIL。
  - id: EMOTION_CONCRETE
    label: 情绪具象非喊口号
    description: >
      情绪通过【动作、物件、潜台词、感官细节】呈现(如妆哭花又补、亲手绣的狐裘),
      而非"我好喜欢/好难过/好心动"式直白宣告。若情绪靠喊口号,记 FAIL。
  - id: PROTAGONIST_AGENCY
    label: 主角有独立人设与目标
    description: >
      女主/主角有自己的困境、判断或目标(被坑项目、明知陷阱仍挡),不是只为恋爱服务的工具人。
      引用体现其能动性的句子。
  - id: EMOTION_HOOK
    label: 情感钩子
    description: >
      章末留有情感悬置/未了心结/关系悬念(留白、暧昧未明、心事未解),推动追读。引用结尾钩子句。

calibration:
  score_anchors:
    - score: "0.90+"
      label: 榜单级
      description: >
        关系张力足、情绪全程具象、双方人设立体、章末有情感钩子,且有可回味的潜台词与留白。四项全过。
    - score: "0.75"
      label: 合格但有短板
      description: >
        能读,但缺 1-2 项:或情绪偶有直白、或一方人设偏工具、或张力略平。
    - score: "0.55 及以下"
      label: 结构性翻车
      description: >
        情绪靠喊口号;关系无阻力/恋爱脑;主角是工具人;无情感钩子。缺 3 项及以上。
