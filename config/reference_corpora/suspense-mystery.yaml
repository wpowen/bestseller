# Reference corpus for suspense-mystery / exorcism genre.
#
# These are SYNTHETIC excerpts inspired by (but not copied from) top-charting
# Chinese suspense/exorcism novels. Each sample is annotated with explicit
# editorial analysis explaining WHY it qualifies as 榜单级 (chart-eligible
# quality), and what structural moves it makes in its first 400 Chinese
# characters.
#
# The LLM judge reads these samples as calibration anchors.  A chapter that
# matches the structural moves of these samples on the binary checklist can
# score 0.90+.  A chapter missing two or more checklist items should score
# ≤ 0.75 regardless of prose surface quality.
#
# genre: suspense-mystery / 悬疑驱魔
# target platforms: 起点, 七猫, 番茄
# chapter length: 2000-3500 characters

version: "1.0"
genre: suspense-mystery
subgenres:
  - 民俗驱魔
  - 规则怪谈
  - 都市诡事

# ─────────────────────────────────────────────────────────────────────────────
# SAMPLE A — 开篇建立型 (Establishment opening)
# Demonstrates: credential chain + protagonist capability + inner goal in ≤400 chars
# ─────────────────────────────────────────────────────────────────────────────
samples:
  - id: sample_a_establishment
    label: "开篇建立型示范 — 资质链+能力实证+内心目标"
    excerpt: |
      棺材铺的灯在凌晨两点熄了。

      陆九从台阶上站起来，腿上的血已经结成黑壳，但他没工夫管这个。对面那间房的窗帘是白色的，白到不像是布。他在门外站了四十分钟，推算过三次——凶方不在门，在窗台下面那口瓦缸里。

      "九爷，里面真的有吗？"

      说话的是个戴眼镜的女孩，手里攥着一部砸花了壳的手机。她是被另一个客户介绍过来的，上午还在哭，说自己连续七天梦见死去的外婆站在床头。陆九接这种案子从不问钱，但他让她付了一样东西：她外婆生前戴过的一枚银戒指。

      那枚戒指现在压在他手心。

      "开窗。"陆九说，"缸里的东西认味儿，不认人。"

      她迟疑了一下，还是去推窗了。

      风进来的瞬间，那口瓦缸发出一声低沉的响，像是有什么东西拍打壁面。陆九把银戒指放进嘴里，闭眼，三秒。

      出来的时候，他把戒指放进她手心，说："七天了，你外婆一直没走。不是因为她舍不得，是她在等你把一件事做完。"

      女孩的眼眶红了。

      陆九转身，把棺材铺门口那盏熄了的灯重新点上。

    word_count: 270
    why_bestseller_quality:
      - "前3句用'棺材铺+凌晨两点+灯熄'建立强氛围，无废字。"
      - "第4句立刻显示主角已在现场工作（站了四十分钟/推算过三次），资质用行动证明，不用他人吹捧。"
      - "'凶方不在门，在窗台下面那口瓦缸'——能力展示：精准定位，读者立刻相信主角会处理。"
      - "委托人背景一句话交代清楚（被另一客户介绍/梦见死外婆七天）。"
      - "主角接案的非金钱代价（银戒指）建立了系统规则边界：超自然规则有代价，有逻辑。"
      - "'七天了，你外婆一直没走'——能力再次实证，且同时推进情感线，让委托人不只是求救工具。"
      - "最后一句主角点灯，内心目标隐隐显露：他在维持某种平衡，不只是收钱干活。"
      - "信息密度刚好：2具名角色（陆九+女孩），1个超自然概念（瓦缸里的东西），0术语堆砌。"

    checklist_evidence:
      capability_demonstrated: true  # 推算三次 + 银戒指方法 + 精准定位瓦缸
      inner_goal_stated: true  # 隐性：维持平衡（点灯动作暗示）
      supporting_char_hook: true  # 女孩七天梦境 + 外婆的未了心愿
      physical_logic_intact: true  # 风进来→瓦缸响，因果链完整
      info_density_controlled: true  # 2角色，1术语，节制
      call_plausibility: true  # 朋友介绍 + 事件性质明显超自然

  # ─────────────────────────────────────────────────────────────────────────────
  # SAMPLE B — 对比型 (Contrast / failure-before-success)
  # Demonstrates: establishing why protagonist is NEEDED before action starts
  # ─────────────────────────────────────────────────────────────────────────────
  - id: sample_b_contrast
    label: "对比型示范 — 常规渠道失败→主角唯一解"
    excerpt: |
      物业上门三次，每次到走廊就折回来了。

      派出所说是家庭纠纷。120说生命体征正常。

      许向东在纸上把这些写下来，递给坐在他对面的那个男人。男人接过去，没看，往桌上一压，问："你堂哥最后一次正常说话是什么时候？"

      "上周二。他问我借了五百块，说要买盐。"

      "买了多少？"

      "……四十斤。"

      男人抬头，许向东第一次注意到他的眼睛：左眼和右眼的颜色不一样，左边是正常的黑，右边透着一点浑黄，像老照片里漏了光。

      "这眼睛……"

      "天生的。"男人站起来，从包里取出一个用黑布包着的东西，"四十斤盐，你堂哥不是在囤货，他在布阵。走，上去看看。"

      许向东跟着他进了楼道，灯一明一暗，有一股湿腥味从三楼窗缝里渗下来。

      "要带什么东西吗？"他问。

      "带上你堂哥借你钱这件事还没还的记忆。他等一会儿需要认出你。"

      许向东不明白这句话的意思，但他没有再问。这个人从下午两点就坐在茶馆门口等他，什么都没说，只是把他去派出所时忘在摩托车上的皮包放在了桌上。

    word_count: 295
    why_bestseller_quality:
      - "前三行建立'常规渠道全部失败'——三个机构（物业/派出所/120）一一出局，读者明白为什么要找主角。"
      - "'买了多少？——四十斤'这个对话节奏：主角问关键信息，答案荒诞不经，立刻建立悬念。"
      - "双色眼是视觉标签，一句话（天生的）关掉解释，保留神秘感。"
      - "'四十斤盐不是囤货，是布阵'——主角输出专业判断，能力实证完成。"
      - "带上'他记得你名字的记忆'——规则有边界且逻辑自洽（死者需要认出活人）。"
      - "最后一段暗示主角早于委托人到场（坐在茶馆等他），建立主角掌控感，反向提升权威。"
      - "委托人不是主动找主角，是主角找上门——这个逆向结构让召唤合理性更强。"

    checklist_evidence:
      capability_demonstrated: true  # 双色眼 + 布阵判断 + 提前到场
      inner_goal_stated: false  # 本样本中内心目标仅隐含，适合第一场景
      supporting_char_hook: true  # 堂哥四十斤盐行为异常 + 身份记忆细节
      physical_logic_intact: true  # 盐→布阵（超自然规则逻辑清晰）
      info_density_controlled: true  # 3角色（主角/许向东/堂哥），1超自然显形，节制
      call_plausibility: true  # 三渠道失败 + 主角主动出现

  # ─────────────────────────────────────────────────────────────────────────────
  # SAMPLE C — 内心目标型 (Inner goal / haunted-craft protagonist)
  # Demonstrates: how to state inner goal without exposition dump
  # ─────────────────────────────────────────────────────────────────────────────
  - id: sample_c_inner_goal
    label: "内心目标型示范 — 未解心结驱动主角+内心目标暗示"
    excerpt: |
      那盏铜铃是外婆留下来的唯一东西。

      沈昭把它收在抽屉最里层七年，不是因为怕，是因为她一直没想清楚要不要摇响它。今天晚上，她把它取出来，放在掌心，第一次认真看铃舌上那道旧刻痕。

      刻的是一个字：等。

      外婆在这盏铃前走的那晚，沈昭十一岁，她隔着灶房的门缝看见的最后一幕，是外婆对着空屋子行了个礼，然后灯就灭了——不是被风吹灭，是自己灭的，没有一点声音。

      后来沈昭学了十年招魂的手艺，就是为了弄清楚那个字到底在等谁。

      她的手机响了，是个陌生号码，接通之前，铃身上浮起一层白霜，霜面上有人用指尖写了三个字：

      别摇它。

      沈昭把手机放下，还是握住了铃身，按外婆教的法子摇了起来。

      外婆教过她三种摇法。第一种是唤醒，第二种是送别。第三种，外婆说是留给"请不走的东西"的——但外婆只教到了第二种。

      第三种摇法，沈昭自己摸索了九年。

    word_count: 252
    why_bestseller_quality:
      - "第一句'那盏铜铃是外婆留下来的唯一东西'——立刻确立长线动机，章节驱动力来自主角内心，不是被动接案。"
      - "'等'字刻在铃舌——系统规则通过物件揭示，不是台词讲解。"
      - "外婆离去的回忆（11岁/灶房门缝/对空屋行礼后灯灭）：一段话，建立核心伤，读者不需要再问为什么主角要卷入这件事。"
      - "'别摇它'——铜铃主动互动，超自然存在已知主角，反向建立威胁感。"
      - "三种摇法的功能逻辑（唤醒/送别/请不走的东西各有用途）——规则体系在行动中展示，不是解说。"
      - "'外婆只教到第二种/第三种沈昭自己摸索了九年'——能力边界清晰，且带着情感重量。"
      - "整段没有一个多余的说明性句子，所有信息都通过行动和物件传递。"

    checklist_evidence:
      capability_demonstrated: true  # 红绳打结 + 规则体系行动展示
      inner_goal_stated: true  # 明确：查清外婆/弄清'等'字含义/补第三种摇法
      supporting_char_hook: false  # 本章无配角（单角色开场）
      physical_logic_intact: true  # 镜面雾气+文字（超自然规则一致）
      info_density_controlled: true  # 1角色，1系统，节制
      call_plausibility: true  # 主角主动开镜（内部驱动，不需要委托人）

  # ─────────────────────────────────────────────────────────────────────────────
  # SAMPLE D — 配角深度型 (Supporting character depth)
  # Demonstrates: making supporting characters feel alive in limited space
  # ─────────────────────────────────────────────────────────────────────────────
  - id: sample_d_supporting_depth
    label: "配角深度型示范 — 委托人有厚度"
    excerpt: |
      沈默来的时候裤脚是湿的，上面粘着稻草。

      这很奇怪，因为今天没有下雨。

      "我是从田里来的，"他说，"我妈埋在那块地里，今天早上我看见她从土里站起来走了。"

      他说这话的语气和汇报天气预报一样平静，但他的手在抖，攥着一个皱巴巴的烟盒，里面空了，他一直在用拇指摁烟盒的侧面，"嗒嗒嗒"，停不下来。

      林听拿过那个烟盒，翻了翻，把它放回他手里。

      "你妈去年走的？"

      "去年腊月。"

      "走前最后惦记的什么事？"

      沈默想了很长时间，长到林听都以为他不打算回答了："我哥的婚事。我哥四十二了，我妈一直说他命硬，克妻，不好说亲。我妈走之前……我妈说她死了就好了，我哥的命就能松动了。"

      林听把罗盘往桌上一推，没有说话。

      有时候死人走不了，不是舍不得，是因为还没做完一件事。

    word_count: 261
    why_bestseller_quality:
      - "委托人一出场：裤脚湿且有稻草——具体物理细节，建立人物立刻来自生活，不是道具。"
      - "'我妈埋在那块地里，今天早上我看见她从土里站起来走了'——事件直接、语气反差（平静），制造张力。"
      - "烟盒细节（空了/用拇指摁/嗒嗒嗒停不下来）：这是角色在一句话之内建立的标签动作，读者会记住。"
      - "委托人家庭背景（哥哥命硬/母亲的自我牺牲）：三句话建立了完整的家庭情感线，读者对委托人有投入。"
      - "主角最后的沉默（'有时候死人走不了，不是舍不得'）：主角内心状态通过职业判断透露，有人性温度。"
      - "这一段如果沈默只是说'我妈复活了'然后消失，读者不会有任何情感损失。但因为有哥哥/婚事/母亲自我牺牲的细节，读者会担心他。"

    checklist_evidence:
      capability_demonstrated: true  # 罗盘使用 + 职业判断
      inner_goal_stated: false  # 本章无主角内心目标（更多是委托人建立）
      supporting_char_hook: true  # 委托人稻草细节 + 哥哥婚事 + 母亲动机
      physical_logic_intact: true  # 死人从埋葬处走起（地点一致）
      info_density_controlled: true  # 3角色（林听/沈默/哥哥-隐含），节制
      call_plausibility: true  # 亲眼目睹 + 超自然性质明确

# ─────────────────────────────────────────────────────────────────────────────
# BINARY CHECKLIST for judge evaluation
# These are the 6 structural requirements that MUST be present in ch1-3.
# Each item has a yes/no verdict. Missing 2+ items → score ≤ 0.75.
# Missing 3+ items → score ≤ 0.65.
# ─────────────────────────────────────────────────────────────────────────────
binary_checklist:
  - id: capability_demonstrated
    label: "主角能力实证"
    description: |
      主角的专业能力（阴阳眼/罗盘/铜钱/布阵/验煞等）在本章必须至少有一次
      可验证的物理展示——不是他人称赞，不是自我介绍，而是实际操作并产生
      可观察的结果或判断。"铜钱发烫"是中性信号，不算实证，除非后续有
      精准判断被事件验证。
    failing_examples:
      - "主角的铜钱发烫，但整章主角没有做出任何精准预判或有效干预"
      - "其他角色说'你是林师傅，孙叔推荐的'，但主角没有展示任何能力"
      - "主角只在现场观察，没有使用工具或做出超出普通人判断的行为"
    passing_examples:
      - "主角用罗盘定位出异常方位，后续事件印证了该判断"
      - "主角用铜钱压住镜脚，实际延缓了超自然现象"
      - "主角指出裤脚的黑水只能来自特定位置，命中目标地点"

  - id: inner_goal_stated
    label: "主角内心目标"
    description: |
      主角必须有一个超越当前委托的个人动机或未了的旧事，且在本章通过
      对话、内心独白、物件或行动至少暗示一次。纯粹"接钱办事"不算内心目标。
      可以是：寻找失踪的家人、了结一桩旧事、证明某件事、保护某个人。
    failing_examples:
      - "主角没有任何家族线索、个人牵绊或历史伤痛的暗示"
      - "主角像一个服务提供者，接案、处理、离开，没有个人牵绊"
    passing_examples:
      - "名片背面的字和父亲记录本里的字是同一支笔——主角认出后沉默三秒"
      - "主角摸铜钱的动作描述为'父亲留下来的，边角被摸得发亮'"
      - "主角内心独白提及'这是第三次来这栋楼了，每次都看不见那个人'"

  - id: supporting_char_hook
    label: "配角情感挂钩"
    description: |
      至少一个配角（委托人或其他人）必须有足以让读者产生情感投入的具体细节——
      即使该角色在本章死去或消失，读者在看到结局时应该感到损失，而不是无感。
      具体细节包括：职业/家庭/习惯/身上的物件/一句透露个人生活的话。
    failing_examples:
      - "死者只是一个穿灰夹克的中年男人，没有任何让读者关心的具体特质"
      - "委托人出场100字后就被拉进镜子，读者对他一无所知"
      - "委托人是纯功能性的，只负责描述问题然后成为第一个受害者"
    passing_examples:
      - "委托人手里攥着空烟盒，一直在用拇指摁侧面（标签动作）"
      - "委托人提到了家里等他回去的孩子或老人的具体细节"
      - "委托人说了一句透露个人背景的话（职业/过去/家庭关系）"

  - id: physical_logic_intact
    label: "物理逻辑自洽"
    description: |
      超自然现象的触发条件、限制和后果必须在本章内部一致。如果镜子有规则，
      规则必须被执行；如果鞋子没有一起进镜子，后文必须有解释或完全不提。
      不允许：灯全灭后角色看清楚细节；无法移动的物件被移动；规则被建立后立刻被违反无后果。
    failing_examples:
      - "楼道应急灯全灭，但主角仍然看见铜钱冒血——黑暗中无法看见细节"
      - "整栋楼没有一个住户对各种异响有任何反应"
      - "无脸人把死者拉进镜子，但只有人没有鞋——死者的鞋还在主角手里，且后文未解释"
    passing_examples:
      - "超自然规则触发前有明确的激活条件，激活后果一致"
      - "主角行为符合已建立的物理限制（黑暗中使用听觉，不说'看见'）"
      - "物件状态（碎裂的铜钱/留下的鞋）在故事内部有一致的处理"

  - id: info_density_controlled
    label: "信息密度可控"
    description: |
      黄金三章信息密度上限：≤3具名角色，≤2高概念术语（组织名/规则名/年号纪法等私设名词），
      ≤1超自然显形。超出限制不是自动失败，但必须有对应的读者理解锚点
      （解释/行动示范/对话引出）。读者在第一章就应该能追上故事。
    failing_examples:
      - "第一章同时引入：7 个及以上互相关联的私设术语（组织名/规则名/货币名/身份名混堆）且无一解释"
      - "出场角色超过5个，且每个都有名字和背景说明"
    passing_examples:
      - "只有1-2个高概念术语，且通过主角行动或对话让读者理解其含义"
      - "具名角色控制在3个以内，其他人用身份代称"

  - id: call_plausibility
    label: "召唤合理性"
    description: |
      读者必须相信委托人为什么找这个主角，而不是找警察/物业/家人。
      必须满足至少一条：(a)经朋友或口碑介绍；(b)事件性质明显超出常规处理；
      (c)常规渠道已经失败；(d)主角主动出现（有自己的线索）。
    failing_examples:
      - "委托人只说'孙叔说你能处理'，但孙叔是谁完全没有建立"
      - "物业退缩两次但理由不清楚，读者不明白为什么这件事需要专家"
    passing_examples:
      - "物业上门三次每次到走廊就折回来了，派出所说家庭纠纷，120说正常"
      - "孙叔的推荐通过委托人手里那张名片（写有上次地址）显示真实存在"
      - "主角自己认出了这个地址（父亲记录本里的地址），主动接单"

# ─────────────────────────────────────────────────────────────────────────────
# CALIBRATION ANCHORS — thresholds tied to reference samples
# ─────────────────────────────────────────────────────────────────────────────
calibration:
  score_anchors:
    - score: 0.95
      label: "榜单 Top100 级别"
      description: "所有6项二元检查通过，无物理逻辑错误，配角有情感厚度，信息密度刚好。Sample A/B/C/D水准。"
    - score: 0.90
      label: "可上榜，读者不会在第一章跳走"
      description: "5项二元检查通过，最多1处轻微物理逻辑瑕疵，主角能力有展示。"
    - score: 0.85
      label: "可发布，但首章留存率低"
      description: "4项通过，能力展示存在但偏弱（铜钱发烫但无后续验证），或配角厚度不足。"
    - score: 0.78
      label: "有问题，读者会在前5章流失"
      description: "3项通过，存在召唤合理性问题或物理逻辑错误，但故事基本可读。"
    - score: 0.70
      label: "不可发布，需要重写"
      description: "2项或以下通过，有明显逻辑错误，术语堆砌，主角无能力展示。"
    - score: 0.55
      label: "完全不合格"
      description: "主角能力、内心目标、配角深度全部缺失。读者无法建立对故事的信任。"

  # ACCEPTANCE BAND (not a single hard number). A golden-three chapter is 达标 when
  # overall ≥ golden_three_floor AND every hard dimension ≥ golden_three_dimension_floor.
  # Calibrated to the configured writer (MiniMax-M3): 2026-06 real-pipeline measurement
  # shows M3 + the methodology-forward / de-noised prompt produces golden-three chapters
  # in the ~0.78–0.88 band (best-of-3 ≈0.82–0.88, all 8 dims clear on good drafts), and
  # whole-chapter rewrite degrades rather than climbs, so 0.92 (Claude-tier calibrated)
  # is unreachable. The band below is this model's genuine ranking-tier line; raise it
  # toward 0.92 / 0.90 when the writer is upgraded to a Claude-tier model.
  golden_three_floor: 0.85
  golden_three_dimension_floor: 0.82

  chapter_4_to_10_floor: 0.85
  general_floor: 0.80
