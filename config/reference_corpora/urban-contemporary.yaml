# Reference corpus for urban-contemporary / 都市现实 (都市生活 · 商战职场 · 行业 · 现实).
#
# SYNTHETIC excerpts inspired by (but not copied from) top-charting Chinese
# urban/realistic novels. Annotated with WHY each is 榜单级 and what structural
# moves it makes in its first ~400 Chinese characters.
#
# resolve_reference_corpus_key maps category 'urban-contemporary' → this file.
#
# 关键反模式:①金手指(系统/重生/异能)替代专业,主角不懂行也能赢;②对手蠢化成纸老虎,
# 打脸毫无博弈;③职场/行业悬浮,没有规则、合同、资源的真实约束。
#
# target platforms: 起点(都市), 番茄, 七猫
# chapter length: 2000-3500 characters

version: "1.0"
genre: urban-contemporary
subgenres:
  - 都市生活
  - 商战职场
  - 行业职场
  - 神医兵王

samples:
  # ───────────────────────────────────────────────────────────────────────────
  - id: sample_a_skill_monetize
    label: "能力变现型 — 专业 show→现实规则有代价→打脸有真实博弈"
    excerpt: |
      投标会还有四十分钟,陈牧把对手的标书翻到第九页,停了。

      "这里。"他把纸推给身边脸色发白的实习生,"他们报的工期是九十天。但你看材料清单——他们用的这款防水卷材,冬季施工要养护七天才能上下一道工序,光这一项,九十天就是假的。"

      "那……那我们要不要也压工期?"

      "不压。"陈牧拿起笔,在自己的标书上把工期从八十天改成了九十五天,"我们写实话:九十五天,但附一张冬季施工节点图,告诉评委为什么别人的九十天是骗人的。"

      实习生愣住:"可是甲方就喜欢工期短的……"

      "甲方喜欢的是不返工。"陈牧把笔帽合上,"上一个工程,就是被九十天的标书坑过的人,坐在评委席正中间。"

      四十分钟后,陈牧走出会议室。对家的项目经理堵在门口,皮笑肉不笑:"陈工好手段,临时改工期。"

      "我没改手段。"陈牧绕过他,"我改的是,把你们没敢写在纸上的那七天,替你们写了出来。"

    word_count: 330
    why_bestseller_quality:
      - "开篇用'投标会四十分钟+翻到第九页停了'制造专业悬念,不靠金手指。"
      - "专业能力 show:防水卷材冬季养护七天→九十天是假的——具体到行业细节,读者信服主角是真懂行。"
      - "反套路决策(不压工期,反而写长)体现主角的现实判断,不是无脑爽。"
      - "'甲方喜欢的是不返工''坐在评委席正中间'——把现实规则(评委是被坑过的人)变成主角的信息优势。"
      - "打脸有真实博弈:对手不是纸老虎,而是同样专业的项目经理,主角赢在认知与诚实,不是嘴炮。"
      - "结尾'把你们没敢写在纸上的七天替你们写出来'是有行业含金量的高光收束。"
      - "全程零系统/金手指,资源与规则约束真实,信息密度受控。"

  # ───────────────────────────────────────────────────────────────────────────
  - id: sample_b_returnee_underdog
    label: "失意者归来型 — 旧账压制→以实力破局→口碑回流钩子"
    excerpt: |
      林深递出去的简历,被前台用两根手指夹着还了回来:"林总监,我们经理说,公司不招……有案底的人。"

      他没接。三年前他确实"有案底"——一份他没签字的财务报表,把他从这家公司的总监位上掀了下去,顶罪的人现在坐在他原来的办公室。

      林深转身要走,大厅的电梯却开了,出来一群西装革履的人,簇拥着一个客户模样的中年男人。那男人一眼看见他,愣住,随即快步走过来:"林深?真是你?我找了你三年!"

      前台的脸僵了。

      "当年那个新能源的盘子,"中年男人握着他的手不放,"全公司只有你说那笔应收账款收不回来。后来果然爆雷,我亏了八千万——要不是你那份没人听的报告,我连为什么亏的都不知道。"

      林深笑了笑:"那份报告,就是让我'有案底'的那一份。"

      大厅里一片死寂。中年男人回头,看向前台:"你们李经理,现在还在吗?让他下来。我这单三个亿的代理,本来是给你们的。"

    word_count: 350
    why_bestseller_quality:
      - "开篇'简历被两根手指夹着还回来'+'有案底'把被压制的屈辱感前置,画面具体。"
      - "旧账(没签字的报表/顶罪的人坐他位置)用一句话交代,信息差爽点埋好,不啰嗦。"
      - "翻盘不靠金手指,靠'三年前那份没人听的报告是对的'——专业判断的延迟兑现,逻辑自洽。"
      - "中年客户的具体数字(亏八千万/三个亿代理)让打脸有真实分量,不是空喊。"
      - "对手(李经理/顶罪者)是有立场的现实角色,不是工具人,博弈感真实。"
      - "结尾'让他下来,这单三个亿本来是给你们的'是口碑/价值回流的爽点兑现,且留下后续清算钩子。"
      - "屈辱→实证→反转节奏清晰,情绪靠事件而非旁白说教。"

binary_checklist:
  - id: SKILL_NOT_CHEAT
    label: 靠专业不靠金手指
    description: >
      主角的优势来自【可验证的专业能力/行业认知/信息判断】(防水卷材养护、应收账款判断),
      而非系统/重生/异能直接给答案。若主角不懂行靠外挂取胜,记 FAIL。
  - id: REAL_RULES_COST
    label: 现实规则有约束
    description: >
      职场/行业/商战有【真实的规则、合同、资源或代价】约束(工期养护、评委背景、案底),
      而非悬浮的"霸道总裁随手解决"。引用体现规则约束的句子。
  - id: RIVAL_NOT_STRAWMAN
    label: 对手非纸老虎
    description: >
      打脸/冲突的对手有立场、能力或苦衷,博弈有来有回,而非被蠢化成一推就倒的纸老虎。
      若对手智商掉线只为衬托主角,记 FAIL。
  - id: VALUE_FEEDBACK_HOOK
    label: 价值/口碑回流钩子
    description: >
      章末有主角的能力/选择【回流为资源、口碑或机会】的兑现或悬念(三个亿代理、评委席的人),
      推动追读。引用结尾钩子句。

calibration:
  score_anchors:
    - score: "0.90+"
      label: 榜单级
      description: >
        优势全靠专业、现实规则约束真实、对手有博弈、章末有价值回流。四项全过,且行业细节扎实可信。
    - score: "0.75"
      label: 合格但有短板
      description: >
        能读,但缺 1-2 项:或偶有外挂味、或对手略扁平、或行业细节不够实。
    - score: "0.55 及以下"
      label: 结构性翻车
      description: >
        主角不懂行靠金手指赢;对手纸老虎;职场悬浮无规则;无价值回流。缺 3 项及以上。
