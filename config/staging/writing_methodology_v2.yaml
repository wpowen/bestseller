version: writing_methodology_v2
feature_flag: BESTSELLER_METHODOLOGY_V2
description: >
  Staging profile for the methodology lineage spine. Selection happens during
  chapter outline materialization; draft, review, repair, and health consume
  the selected lineage read-only.

lineage:
  owner_stage: outline_chapter
  storage_path: chapter_contract.metadata.methodology_lineage
  max_cards_per_chapter: 6
  max_prompt_tokens: 900
  downstream_reselect_allowed: false

capability_slots:
  premise_engine:
    owner_stage: conception
    gate_mode: advisory
    primary_indicator: premise_readiness_score
  character_change_tracker:
    owner_stage: outline_chapter
    gate_mode: warn
    primary_indicator: character_change_score
    binding_artifacts:
      - cast.arc
      - chapter_contract.character_delta
      - causal_contract.protagonist_choice
  worldview_theme:
    owner_stage: conception
    gate_mode: advisory
    primary_indicator: worldview_landing_score
  scene_causality_engine:
    owner_stage: outline_chapter
    gate_mode: block
    primary_indicator: scene_causality_score
    binding_artifacts:
      - causal_contract
      - scene_contract.methodology_contract
  hook_ledger:
    owner_stage: outline_chapter
    gate_mode: block
    primary_indicator: hook_ledger_closure_rate
  payoff_ledger:
    owner_stage: outline_chapter
    gate_mode: block
    primary_indicator: payoff_ledger_closure_rate
  pacing_compression_engine:
    owner_stage: outline_volume
    gate_mode: warn
    primary_indicator: compression_ratio_compliance
  opening_three_function:
    owner_stage: outline_chapter
    gate_mode: block
    primary_indicator: opening_gate_findings
  pov_distance_controller:
    owner_stage: outline_chapter
    gate_mode: warn
    primary_indicator: pov_stability_score
  dialogue_subtext_engine:
    owner_stage: outline_chapter
    gate_mode: warn
    primary_indicator: dialogue_subtext_score
  revision_repair_engine:
    owner_stage: repair
    gate_mode: block
    primary_indicator: repair_closure_rate

advisory_pool:
  replace:
    - id: prose_stage_random_selector
      reason: downstream stages must consume stored lineage instead of selecting cards again
    - id: generic_methodology_compliance_only
      reason: review evidence must attribute failures to AppliedMethodology.rule_id
  augment:
    - id: chapter_causality_gate
      with:
        - causal_contract.protagonist_choice
        - causal_contract.next_reader_desire
        - chapter_contract.character_delta
    - id: hook_ledger_audit
      with:
        - payoff_ledger_audit
        - methodology_lineage_evidence
    - id: ensemble_arc_progress_gate
      with:
        - project.metadata.ensemble_arc_kernel
  keep:
    - opening_three_function_gate
    - qimao_opening_gate
    - pov_consistency_gate
    - dialogue_voice_gate

health:
  report_slots: all
  dormant_to_active_when:
    coverage_min: 0.2
    evidence_min: 0.5
    failure_rate_max: 0.4
