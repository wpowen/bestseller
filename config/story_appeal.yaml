# 故事/大纲/简介 吸引力评估体系 · 单一真源配置
# ---------------------------------------------------------------------------
# 由 services/story_appeal.py 加载，驱动：
#   - services/premise_appeal_judge.py  (故事吸引力 9 维，LLM)
#   - services/blurb_appeal_gate.py      (简介点击力 10 维，确定性)
# 设计：soft/additive。enabled=false → 整体跳过，构思产物字节级不变。
# 题材：维度级 genre_aware 的判据靠 services/judge_genre_context + 下方 lexicons
#       解析（canonicalize → 专属词库或 generic 兜底），达标线对所有题材同一把尺。
# ---------------------------------------------------------------------------

enabled: true

# 低于 blurb_min 即触发 finalize 重生；有界、保优、fail-open。
# 产品决策(2026-06-21)：达标线提到 80 —— 70 分的稿（如《废代码库》）算"差"，不放行。
regeneration:
  enabled: true
  regen_below_bar: true      # 只要未达 meets_bar(blurb<80) 就重生（不再用 floor_grade 评级）
  floor_grade: consider      # 兼容旧逻辑：评级≤consider(<80) 也触发重生
  max_attempts: 3            # 重生上限（不含首次）；门槛抬高后多给一次机会
  keep_best: true            # 永远保留得分最高的变体，绝不变差
  feedback_token_budget: 600 # 注入 finalize 的改进反馈截断上限

# 评级档位（score_100 → grade）。对标 script coverage 三档。
grades:
  recommend: 80              # 强签
  consider: 65               # 可签/需改
  # < consider → pass（毙）

# 达标（meets_bar）= 榜单级门槛；每题材同一把尺。
# ── 竞品锚定校准（scripts/calibrate_appeal_against_bestsellers.py，跨家族 DeepSeek 判官）──
# 对真实爆款(诡秘/凡人/斗破/赘婿/全职/大奉/亵渎/庆余年/诛仙/师兄)与烂稿/AI稿实测：
#   * 确定性 blurb gate：真爆款 vs 烂稿 Δ=+12.2，可复现、零家族偏见 → 稳定信号。
#     烂稿 blurb 最高 63.9，现代爆款 70-79 → blurb_min=65 可全拒烂稿、纳现代强简介。
#   * LLM premise 绝对分不可信：一句 prompt 改动即从「给烂稿 88」荡到「给凡人 38」，
#     与 [[benchmark-arena-closure-plan]] 的 LitStyle 结论一致 → 仅作 advisory，不当达标硬标尺。
# 因此达标由【确定性 blurb gate】把关；premise 的 LLM 绝对分仅展示/给批评建议。
# ── 产品决策(2026-06-21)：达标线 65 → 80（"低于 80 分不通过"）──
# 65 只过滤了垃圾；但 70 分的稿（简介过长/首句钩子弱/情绪不足，如《废代码库》）
# 产品方判定"非常差"。故把门槛提到 80 = 只放行"执行优秀"的简介（首句炸、情绪前置、
# 长度合规、卖点齐），低于 80 一律不达标并触发重生。代价：很多稿要重生才达标——
# 这是刻意的高标准（宁可重生，不放行平庸）。真实老牌爆款的"朴实简介"也会被此门拦下，
# 因为本系统生成的是现代点击型简介，其优秀样本可达 80+（玄幻样本 84、都市 79+）。
meets_bar:
  blurb_min: 68               # 达标线：贴合真实榜单(2026-06对标:斗破71/诡秘68/大奉68/凡人68,floor=68)。
                              # 旧值80脱离现实——真爆款简介都到不了80,导致好简介(persona 8.0却闸门69)恒判不达标
                              # +每本书跑满重生轮次拖慢生成。block_below_bar=false 故为软目标线,只控重生与标签。
  title_min: 80               # 产品硬线：书名点击力<80 也不通过（标题是榜单列表第一眼，此前完全没设门）
  premise_min: 0              # advisory：LLM 绝对分不参与硬门（绝对值不可信）
  forbid_gated_to_pass: false # gating/premise 评级仅 advisory（gated_grade 含 LLM 总分，不入硬门以保可复现）
  # 真拦截开关（2026-06-22）：此前"低于80不通过"只接成重生触发线，run_conception_pipeline
  # 跑完没有任何拦截——meets_bar=False 也照样 return、照样进规划（advisory）。开此开关后：
  # 有界重生用尽仍 meets_bar=False → 抛 AppealBarNotMetError，web 层置可见拦截态，不进规划。
  # ── 去同质化降级（2026-06-24，审计 P0-5）──
  # 改回 false：blurb_min=80 仍作【有界重生的目标线】（继续触发重生、追求执行优秀），
  # 但确定性 blurb 打分器【不再 HARD-block 整本书出构思】。原因：注释自承真实爆款"朴实简介"
  # 与本系统好样本（都市 79+）会被 80 线拦下，开此硬开关后顽固差 1-2 分的稿会抛
  # AppealBarNotMetError 把整本书卡死在构思外——这正是"确定性打分器硬约束压制输出"。
  # 降为 advisory：meets_bar=False 仍照常 return 进规划，但带可见告警，由下游/人工判断，
  # 而非一票毙书。质量推力（重生追 80）保留，硬阻断去除。
  block_below_bar: false
  # 点击命门 floor（一票否决，2026-06-22 修）：钩子强度+情绪强度是真正驱动点击的两维。
  # 此前加权平均让一堆"表面达标"维(三要素/具体化/反模板/问号结尾)把这两维的低分稀释掉
  # ——烧脑不抓人的《规则漏洞不保护我》钩子3.0/情绪1.5 却堆到 85.2 通过。故设硬 floor：
  # 任一命门维未过线 → blurb 总分封顶 critical_floor_cap(<80)，表面分再高也不达标。
  blurb_critical_floors:
    hook_strength: 3.5        # 首句必须是真钩(短+疑问/反差/冲突信号)，强稿可达 3.7-4.4
    emotion_charge: 3.0       # 必须有高唤起情绪且前置，强稿可达 3.9-5.0
  critical_floor_cap: 78      # 任一命门未过线 → 总分封顶 78（<80，不达标）
  # 新读者可懂度 独立 cap（不与钩子/情绪 AND）：生造黑话过载 → 列表页新读者一眼劝退。
  comprehensibility_floor: 2.5   # 可懂度 < 2.5 即判黑话过载
  comprehensibility_cap: 60      # 黑话过载 → 总分封顶 60（低于 blurb_min=68，必触发去黑话重生）

# 立意↔调性一致 cap（2026-06-23）：高级/严肃立意(宇宙恐怖/规则系/正剧/悲剧)被简介稀释成
# 爽文套路(打脸/跪地/碾压/逆袭/全村喊冤)= 调性背叛、显廉价、劝退目标读者。真实案例
# 《祭词改写后我疯了》:立意"读规则降理智、封神即成怪物"的悲剧，简介却"打脸全村跪地、
# 逆袭碾压漫天邪神"。只罚【high-concept 立意 + 爽文套词扎堆】的错配；纯爽文题材(立意本就
# 是打脸逆袭)不罚——靠"立意里严肃信号≥serious_signal_min"来区分。
tone_consistency:
  serious_signal_min: 2        # 立意命中≥此数严肃信号 ⇒ 判为高概念/严肃调性
  cliche_saturation_min: 3     # 简介命中≥此数爽文套路 ⇒ 判为爽文套词扎堆
  tone_cap: 78                 # 错配 ⇒ 简介总分封顶 78（<80，不达标）
  serious_concept_signals: [代价, 理智, 人性, 异化, 牺牲, 沉沦, 不可名状, 反噬, 诅咒,
    救赎, 孤独, 背负, 罪, 命运, 抉择, 污染, 腐蚀, 怪物, 献祭, 禁忌, 真相, 沉默, 悲剧, 宿命]
  shuangwen_cliche_beats: [打脸, 跪地, 喊冤, 碾压, 逆袭, 震惊全场, 全村, 扇耳光, 狠狠,
    跪下, 求饶, 不敢相信, 悔不当初, 瑟瑟发抖, 啪啪打脸, 当场跪, 颤抖着, 嚣张, 装逼打脸]

# ---------------------------------------------------------------------------
# 一句话卖点【前置·严格】闸门（logline_gate v2）：在扩充世界观/角色/卷章大纲之前，先站在
# 【读者视角】判「这个卖点是不是真卖点、值不值得点」。不过 → 不予扩充(REJECT)或回炉(REGEN)。
# v2 依据 Save the Cat 官方 logline 法 + 番茄/起点爆款简介公式 + 方法论 ch3/ch4，把 3 轴升级为
# 【7 维/两档】：4 核心命门(一票否决) + 3 增益维(加权)。确定性器测不了这些语义维，故由 LLM
# 读者判官打分；LLM 不可用 fail-open 到 neutral lean-pass —— 绝不在无 LLM 时误毙卖点。
logline_gate:
  enabled: true
  block_expansion: false       # 默认 advisory：跑分+持久化+日志，不硬阻断；真机校准后再置 true 硬卡
  fallback_score: 3.7          # LLM 不可用时各维中性 lean-pass（≥overall_floor，真放行不误毙）
  # —— 严格卡控 ——
  reject_floor: 2.5            # 任一【核心命门】< 此 → REJECT：根本性硬伤，不予扩充
  pass_floor: 3.5             # 任一【核心命门】< 此 → REGENERATE：回炉重写卖点
  overall_floor: 3.6          # 加权总分 < 此 → REGENERATE：各维勉强但整体平庸，不放行
  max_regen: 3                # 回炉上限，用尽仍不过 → 升级人工/标记可见拦截态
  # 7 维 / 两档；权重和=100。代码按 CORE_AXES 常量区分核心命门(前4)与增益维(后3)。
  axes:
    # ① 核心命门（hard veto，任一不达标即拦）
    contrast_irony:            # 反差张力：Save the Cat 的 irony=钩子之核；网文人设反差=爽点之核
      label: 反差张力
      weight: 22
      high: 一句话即含强反差/反常识/期待违背（身份明×暗反差、处境悖论、恩人即加害者…）
      low: 平铺直叙、无反差、四平八稳，读者没有「咦?」的一下
    click_hook:                # 点击钩子：首句即未知/危机/悬念
      label: 点击钩子
      weight: 18
      high: 首句即抛未知/危机/冲突，读者只看一句就忍不住想点开
      low: 开头是设定/背景铺陈，钩子迟到或缺席
    motivation_credibility:    # 动机可信：非得不偿失
      label: 动机可信
      weight: 16
      high: 主角为何非做不可逻辑自洽——代价与收益匹配，或被逼到没有选择
      low: 动机得不偿失/牵强/圣母，读者不信他会反复这么做(如折寿救陌生人却图不到对等回报)
    unpredictability:          # 不可预测：非一眼望到头，且反转有铺垫可信
      label: 不可预测
      weight: 14
      high: 埋了读者预判不到、却有铺垫可信(非天降)的反转/悖论，走向有想象空间
      low: 套路可一眼望到头(如「能力查案→代价递增→揪凶手」)，意料之中、无惊喜
    # ② 增益维（计入加权总分，强烈建议但非一票否决）
    payoff_promise:            # 情绪承诺/爽感清晰：读者一眼知道图什么
      label: 情绪承诺
      weight: 12
      high: 读者一眼知道能得到哪种情绪满足(爽/悬/虐/治愈/代入)且与题材匹配
      low: 说不清「图什么」、卖点是「文笔好/世界观宏大」这类非情绪承诺
    differentiation:           # 差异化：避红海套路
      label: 差异化
      weight: 10
      high: 高概念/新组合，能指出「没人这么写」，避开该题材红海套路
      low: 与头部高度雷同、命中红海套路(赘婿逆袭/废柴觉醒/系统签到…)
    concrete_picture:          # 具体可视：Save the Cat 的 compelling mental picture
      label: 具体可视
      weight: 8
      high: 卖点是具体可视的人/事/画面(殡仪馆第七具遗体睁眼…)，读者脑中能成像
      low: 抽象设定罗列、形容词堆砌，读者脑中没有画面

# 故事质量硬门 = 对真实爆款简介做双盲位置交换 pairwise 胜率（services/premise_appeal_arena.py）。
# 相对盲评稳定（绝对分不稳），跨家族判官(DeepSeek)去同源高估，位置交换去位置偏。
# 因每本需 ~N×2 次判官调用，作【按需验收门】（scripts/verify_appeal_arena.py），不进每次构思。
# 实测(DeepSeek)：烂稿 win-rate 0.00、真爆款凡人 vs 同行 0.38、生成新书 0.50-0.88。
arena:
  story_winrate_min: 0.45     # vs 真实爆款胜率≥此 ⇒ 与榜单同档（competitive）
  min_refs: 4
  max_refs: 6
  judge_model_key: deepseek-v4-flash  # 跨家族；读 DEEPSEEK_API_KEY

# ---------------------------------------------------------------------------
# 书名/标题点击力 5 维 rubric（services/title_appeal_gate.py，零 token 确定性）。
# 权重/词库/长度甜区均有【内置默认】，此处仅为可调与文档化——config 缺这段也能正确评分。
# 逻辑命门 floor：coherence < coherence_floor → 总分封顶 critical_floor_cap(<80)，
# 不通顺/不成立的书名(如"规则漏洞不保护我"抽象概念充当施动者)绝不达标。
# ---------------------------------------------------------------------------
title_rubric:
  length: { min: 4, max: 12 }   # 榜单列表头部强标题甜区（番茄/起点多为 4-9 字）
  coherence_floor: 2.5          # 逻辑命门：低于此即封顶
  length_fit:        { label: 长度适配,   weight: 16 }
  hook_power:        { label: 钩子张力,   weight: 26 }   # 主角能动性/反转/强概念碰撞
  graspable_subject: { label: 可抓主体,   weight: 16 }   # 能想象的具体实体，非抽象黑话
  coherence:         { label: 逻辑通顺,   weight: 24 }   # 命门：无病句/功能词泄漏/半截句
  anti_generic:      { label: 反套路独家, weight: 18 }   # 避都市之/最强系统/绝世神医壳
  # lexicon: { hook_tokens: [...], identity_tokens: [...], abstract_jargon: [...],
  #            template_stems: [...], cliche_stems: [...] }  # 留空用内置默认

# ---------------------------------------------------------------------------
# 题材→高唤起情绪范例（按 canonical genre）。**仅用于【生成/重生提示】的题材感知引导**，
# 不参与确定性词库匹配。修复:玄幻简介情绪平→被拦根因之一=生成/重生提示写死都市情绪
# (退婚/背叛/重生)，对玄幻串台→重生补不进情绪。让每题材用自己的情绪 beat。缺则 generic。
# key 用 services/story_appeal._canonical_genre 的输出（玄幻→xuanhuan，言情→xian-yan…）。
# ---------------------------------------------------------------------------
genre_emotion_exemplars:
  generic:   [背叛, 绝境, 复仇, 逆袭, 被夺一切, 生死危机, 当众羞辱, 痛失至亲]
  xuanhuan:  [灭门血仇, 夺宝杀机, 绝境突破, 逆袭碾压, 打脸封神, 废材觉醒, 屠戮血海]
  xianxia:   [道侣背叛, 灭宗血仇, 夺舍危机, 绝境悟道, 飞升无望, 同门相残, 屠仙]
  urban:     [退婚打脸, 被踩到底, 扮猪吃虎, 当众羞辱, 逆袭翻身, 绝境反杀, 一夜归零]
  realistic: [裁员失业, 房贷压顶, 手术费, 离婚净身出户, 绝症, 讨债逼门, 走投无路]
  suspense:  [命案, 至亲失踪, 灭口追杀, 真相崩塌, 死亡威胁, 步步杀机, 嫁祸顶罪]
  xian-yan:  [背叛抛弃, 错过重逢, 被顶替, 白月光归来, 生离死别, 满门倾覆, 一朝失宠]
  history:   [灭族血仇, 谋反夺嫡, 抄家流放, 兵临城下, 复国雪耻, 满门抄斩]
  scifi:     [末日灭绝, 同伴牺牲, 背叛出卖, 孤舰死战, 文明存亡, 至暗孤勇]
  apocalypse: [丧尸围城, 断粮绝境, 人性崩塌, 至亲变异, 背叛火并, 末世求生]
  game:      [删号清空, 队友背刺, 垫底逆袭, 绝地翻盘, 巅峰对决, 满级回归]

# ---------------------------------------------------------------------------
# 故事吸引力 9 维 rubric（premise_appeal）
#   weight_long / weight_short：长篇/短篇权重（和=100）
#   genre_aware：判据是否随题材切换（词库）
#   gate_below / gate_cap：一票否决——该维 < gate_below 时把总评封顶到 gate_cap
# ---------------------------------------------------------------------------
premise_rubric:
  concept_strength:
    label: 概念强度/卖点
    weight_long: 16
    weight_short: 17
    genre_aware: false
    gate_below: 2
    gate_cap: pass
    high: 一句话可说清「主角+困境+目标+钩子」且这句本身钩人；含 What-if/反常识；自带紧迫冲突
    low: 三句话才说清；只有设定没冲突；卖点是"文笔好/世界观宏大"
  novelty:
    label: 新颖度/差异化
    weight_long: 13
    weight_short: 13
    genre_aware: true
    high: 对该题材常见套路有反转或新组合；可指出"没人这么写"；跨题材嫁接
    low: 与头部高度雷同；纯模仿；设定已写烂（命中该题材红海套路）
  conflict_stakes:
    label: 冲突强度/赌注
    weight_long: 11
    weight_short: 12
    genre_aware: false
    high: 有清晰对抗力量；失败代价严重(命/亲人/尊严)；冲突开篇即现
    low: 无明确反派；代价模糊；冲突登场晚
  emotional_value:
    label: 情绪价值/爽感
    weight_long: 12
    weight_short: 13
    genre_aware: true
    high: 说得清"目标读者图什么"；爽点有蓄-放结构；情绪曲线清晰且匹配题材
    low: 说不清爽在哪；只有"主角强"无铺垫；与读者期待错配
  hook_suspense:
    label: 钩子/悬念
    weight_long: 12
    weight_short: 15
    genre_aware: false
    gate_below: 2
    gate_cap: consider
    high: 第一章即强钩子；大纲可见周期性卡点序列；结尾留扣
    low: 开篇大段铺垫钩子迟到；通篇无悬念
  immersion:
    label: 代入感/主角魅力
    weight_long: 9
    weight_short: 9
    genre_aware: true
    high: 有可共情的欲望/缺失；身份便于代入；性格鲜明主动
    low: 动机模糊/被动；人设扁平；纯概念无人物
  sustainability:
    label: 可持续性/长线引擎
    weight_long: 11
    weight_short: 4
    genre_aware: false
    gate_below: 2
    gate_cap: consider
    gate_long_only: true       # 仅长篇触发（短篇此维近忽略）
    high: 自带可重复触发的冲突机制(升级/任务循环/关系网)；有阶段钩子
    low: 一锤子买卖，三章后没东西写；明显会卡文
  audience_fit:
    label: 目标读者匹配/商业适配
    weight_long: 8
    weight_short: 8
    genre_aware: true
    gate_below: 2
    gate_cap: consider
    high: 能说清"写给谁、放哪个分类、对标哪两本近年成功作"；男女频不串味
    low: 四不像；标签互相打架；找不到对标作
  structure_pace:
    label: 结构与节奏
    weight_long: 8
    weight_short: 9
    genre_aware: false
    high: 有清晰转折点；密度高详略分明
    low: 流水账无转折；开篇拖沓注水

# ---------------------------------------------------------------------------
# 简介点击力 10 维 rubric（blurb_appeal，确定性 0-5）
#   weight：权重（和=100）。前 5 项为核心命门，权重最高。
# ---------------------------------------------------------------------------
blurb_rubric:   # 权重和须=100(见 test_config_loads_and_weights_sum_to_100)
  selling_triad:   { label: 卖点三要素,   weight: 16 }   # 身份+冲突+代价
  hook_strength:   { label: 钩子强度,     weight: 15 }   # 首句短+三选二
  comprehensibility: { label: 新读者可懂度, weight: 12 }  # 生造黑话/编号/系统词密度(越低越可懂)
  differentiation: { label: 差异化独家,   weight: 10 }   # 非通用套话/低红海重叠
  anti_template:   { label: 原创性反模板, weight: 10 }   # AI腔黑名单+标点克制
  open_loop_end:   { label: 结尾留钩,     weight: 9 }    # 末句悬念非剧透
  genre_signal:    { label: 题材信号一致, weight: 8 }    # 书名/标签/简介同源
  emotion_charge:  { label: 情绪强度,     weight: 8 }    # 高唤起情绪前置
  concreteness:    { label: 代入具体化,   weight: 6 }    # 主角名/代号+具体细节(与可懂度部分重叠,降权)
  adjective_thrift: { label: 形容词节制,  weight: 3 }    # 形容词比值
  length_format:   { label: 长度排版合规, weight: 3 }    # 平台带+分段

# 平台简介字数带（CJK 字符数）。未匹配平台用 default。
platform_blurb:
  default:        { min: 80,  max: 220 }
  番茄小说:        { min: 80,  max: 130 }
  fanqie:         { min: 80,  max: 130 }
  起点中文网:      { min: 140, max: 220 }
  qidian:         { min: 140, max: 220 }
  七猫:           { min: 80,  max: 140 }
  晋江文学城:      { min: 120, max: 220 }

# ---------------------------------------------------------------------------
# 词库（lexicons）。generic 为兜底；canonical 题材键覆盖则叠加/替换。
# 题材键 = genre_taxonomy 的 canonical key（xuanhuan/urban/xianxia/scifi/...）。
# ---------------------------------------------------------------------------
lexicons:
  generic:
    # 高唤起情绪词（驱动点击；T3）—— 含玄幻/仙侠 + 都市/现实/职场全题材
    # 注意：金钱/生计压力词（裁员/房贷/欠债/讨债等）不放 generic —— 它们只属于
    # 都市/现实向；放在这里会奖励所有题材的简介写债务/账单，造成跨题材同质化。
    high_arousal_emotion:
      [退婚, 背叛, 重生, 逆袭, 打脸, 复仇, 灭门, 被灭, 血海, 杀机, 死局,
       死期, 仇人, 仇家, 觉醒, 穿越, 反杀, 绝境, 死亡, 崩溃, 暴怒, 震撼, 逆天,
       碾压, 翻盘, 黑化, 决裂, 生死, 屈辱, 雪耻, 雪恨, 夺回, 跪, 封神, 苟, 报应,
       绝症, 跳楼, 走投无路, 耻笑, 嘲讽,
       看不起, 扫地出门, 不配, 当狗, 滚出, 撕毁, 出局, 一无所有,
       众叛亲离, 当众羞辱, 被抛弃, 被陷害, 被顶替, 夺回一切,
       砸下来, 垮掉, 绝路, 重担, 病危, 重压]
    # 身份/标签词（卖点要素①；T4 代入）—— 含奇幻身份 + 现实职业/处境身份
    identity_markers:
      [废物, 废柴, 废体, 天才, 神医, 战神, 强者, 大佬, 反派, boss, 女帝, 王者,
       最强, 赘婿, 弃女, 弃子, 弃徒, 庶女, 真千金, 假千金, 首富, 影帝, 总裁,
       兵王, 龙王, 帝师, 散修, 杂役, 凡人, 刑警, 侦探, 幸存者, 罪人, 囚徒, 主角,
       上门女婿, 上门, 老实人, 打工人, 社畜, 北漂, 程序员, 码农, 保安, 司机,
       外卖员, 临时工, 实习生, 创业者, 寒门, 单亲妈妈, 农村娃, 普通职员, 小人物]
    # 冲突动词/事件（卖点要素②；T7 in medias res）—— 含奇幻冲突 + 现实冲突事件
    conflict_verbs:
      [被赶, 被退, 被弃, 被害, 被困, 被夺, 被踩, 被骗, 被判, 背刺, 算计, 围杀,
       追杀, 追命, 围猎, 挑衅, 决战, 对决, 反击, 揭穿, 夺回, 守护, 逃亡, 越狱,
       灭门, 灭村, 觉醒, 签到, 系统觉醒, 羞辱, 当众, 逐出, 流放, 殉职,
       离婚, 撕毁, 净身出户, 扫地出门, 清退, 出局, 退学, 摊牌,
       甩来, 撕了, 赶出, 顶替, 陷害, 抢走, 逼到]
    # 反转/逆袭预告（T5 愿望预告）
    reversal_markers:
      [没想到, 殊不知, 然而, 直到, 却不知, 谁知, 系统, 觉醒, 重生, 隐藏, 真实身份,
       一夜之间, 摇身一变, 扮猪吃虎, 真面目, 实际上, 真相, 而是, 竟是]
    # 代价/损失张力（卖点要素③；T6）—— 含奇幻代价 + 现实代价(还不起/养不起/出局)
    cost_markers:
      [否则, 三天后, 三日内, 不然, 代价, 反噬, 命换, 一旦, 若是, 倒计时, 必死,
       只剩, 最后, 仅有, 押上, 赌上, 失去, 牺牲, 性命, 时限,
       出局, 净身出户, 一无所有, 滚出,
       否则就, 再不, 就要失去, 撑不过, 输了就, 三天内, 限期]
    # 好奇缺口/悬念标志（T1/T10；结尾留钩）
    curiosity_markers:
      [为何, 为什么, 究竟, 到底, 谁, 何人, 何去何从, 会不会, 能否, 如何, 是否,
       什么, 难道, 竟然, 居然, 神秘, 离奇, 诡异, 反常, "?", "？"]
    # 结局泄露词（结尾不该出现；剧透扣分）
    spoiler_markers:
      [大结局, 终成眷属, 终于在一起, 走到最后, 圆满, 报仇成功, 终成霸主, 修成正果,
       happy ending, 从此幸福, 终获新生, 大功告成]
    # AI腔/模板句黑名单（反模板扣分）
    template_blacklist:
      [本以为, 却没想到, 何去何从, 因机缘巧合, 命运的齿轮, 殊不知这, 一段, 的故事,
       谱写, 演绎, 一场, 之旅, 究竟会, 让我们拭目以待, 敬请期待, 各位读者, 读者朋友,
       这一切的背后, 命运的安排, 缘分, 注定, 邂逅, 不平凡, 传奇的一生]
    # 通用代入锚点（题材未覆盖时用）
    reader_anchors: [普通人, 小人物, 不甘, 不公, 被看轻, 被低估, 渴望, 改变命运]

