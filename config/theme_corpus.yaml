  - {id: shane_diandao_06, motif: shane_diandao, tone: 压抑, proposition: "当正义需要你闭眼，邪恶反而睁着眼。"}
  - {id: shane_diandao_07, motif: shane_diandao, tone: 冷峻, proposition: "给反派一个站得住的理由，戏才真正开始。"}
  - {id: shane_diandao_08, motif: shane_diandao, tone: 沉郁, proposition: "善恶不是阵营，是每一次具体选择的总和。"}
