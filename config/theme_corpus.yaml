  - {id: rending_shengtian_02, motif: rending_shengtian, tone: 冷峻, proposition: "真正的敌人不是天，是没人修的渠和没人问的冤。"}
  - {id: rending_shengtian_03, motif: rending_shengtian, tone: 昂扬, proposition: "英雄能救一次，制度能救很多次。"}
