  - {id: zhenshi_xuhuan_03, motif: zhenshi_xuhuan, tone: 壮烈, proposition: "当你无法确认什么是真，就只能用行动证明你还在。"}
  - {id: zhenshi_xuhuan_04, motif: zhenshi_xuhuan, tone: 惊悚, proposition: "这座城可能是被维护的一场梦，而你是清醒的故障。"}
  - {id: zhenshi_xuhuan_05, motif: zhenshi_xuhuan, tone: 冷峻, proposition: "记忆会骗人，但痛不会，所以跟着痛走。"}
  - {id: zhenshi_xuhuan_06, motif: zhenshi_xuhuan, tone: 迷惘, proposition: "两个世界都说自己是真的，只有代价能分辨。"}
  - {id: zhenshi_xuhuan_07, motif: zhenshi_xuhuan, tone: 沉郁, proposition: "不必知道哪个是真，只需决定为哪个负责。"}
  - {id: zhenshi_xuhuan_08, motif: zhenshi_xuhuan, tone: 孤独, proposition: "最可怕的不是世界是假的，是只有你觉得它假。"}

