  - {id: nitian_06, motif: nitian, tone: 沉郁, proposition: "每一次逆天都要更高的代价，直到代价就是你自己。"}
  - {id: nitian_07, motif: nitian, tone: 热血, proposition: "被压到最低的人，才敢去够最高的东西。"}
  - {id: nitian_08, motif: nitian, tone: 壮烈, proposition: "翻天的人不是无所畏惧，是已经无所可失。"}

  # --- 人定胜天 (主体抉择层) ---
