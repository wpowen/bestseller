  - {id: rending_shengtian_08, motif: rending_shengtian, tone: 苍凉, proposition: "打赢之后才发现，建设比战斗更要命。"}

  # --- 代价 (主体抉择层) ---
  - {id: daijia_01, motif: daijia, tone: 苍凉, proposition: "天赋不是白得的，它记着你，总有一天连着骨血找上门。"}
  - {id: daijia_02, motif: daijia, tone: 冷峻, proposition: "你拿到力量的那天，就有个东西悄悄跟你走了，只是还没现身。"}
  - {id: daijia_03, motif: daijia, tone: 沉郁, proposition: "变强的人越来越空，因为强是用别的东西换的。"}
  - {id: daijia_04, motif: daijia, tone: 压抑, proposition: "救赎认死理，只认你最不舍得的那一样。"}
