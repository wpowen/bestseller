# 主题语料库 (Theme Corpus) — 大范围、可扩展、与题材完全解耦
# =============================================================================
# 这是「核心理念层」的**表层主题池**：一个很大的、可增长到 1000-2000 条的子题
# (sub-theme / thematic proposition) 集合。每本书选 1 个**主主题 (primary theme)** +
# 若干**穿插子题 (sub-themes)**，贯穿整个故事。
#
# 关键设计（回应"主题不能绑死题材"的硬要求）：
#   * **没有 genre 字段** —— 主题与题材完全解耦。同一题材的不同书会落到不同主题，
#     避免"所有仙侠都是天地不仁"式的同质化与乏味。
#   * 每条只标 `motif`(13 母题之一，用于组织/深度) 与 `tone`(情绪基调，用于按"前提氛围"
#     而非"题材"做软匹配)。`layer` 由 motif 推导，不重复存。
#   * 选择由 **premise/书目身份的确定性 seed** 驱动（见 ideology_library.select_themes），
#     而不是 genre；故不同前提→不同主题，且同一本书可复现。
#   * 这是**单一事实源**，可由 scripts/expand_theme_corpus.py 用 LLM 扩充并去重，
#     loader 不限条数（current seed = 104，目标 1000-2000）。
#
# 一条主题 = 一句能当作一本书"灵魂"的命题。它是灵感与多样性之源，不是限制：LLM 推导
# 时可直接选用、改写，或据前提另创——语料库提供"可能性的广度"。
# =============================================================================

version: theme-corpus.v1

themes:
  # --- 天地不仁 (宇宙秩序层) ---
  - {id: tiandi_buren_01, motif: tiandi_buren, tone: 苍凉, proposition: "灾难从不挑选好人，活下来的只是离得远的人。"}
  - {id: tiandi_buren_02, motif: tiandi_buren, tone: 沉郁, proposition: "你拜的神早搬走了，神龛里住的是回声。"}
  - {id: tiandi_buren_03, motif: tiandi_buren, tone: 悲悯, proposition: "救人没有报酬，唯一的回报是下一次还能救。"}
  - {id: tiandi_buren_04, motif: tiandi_buren, tone: 冷峻, proposition: "天不塌在恶人头上，它只是塌在最近的人头上。"}
  - {id: tiandi_buren_05, motif: tiandi_buren, tone: 孤独, proposition: "幸存本身就是一种亏欠，欠那些替你死的人。"}
  - {id: tiandi_buren_06, motif: tiandi_buren, tone: 荒诞, proposition: "世道不公不是要惩罚你，它根本没在看你。"}
  - {id: tiandi_buren_07, motif: tiandi_buren, tone: 温柔, proposition: "善良换不来庇护，但能换来另一个善良的人。"}
  - {id: tiandi_buren_08, motif: tiandi_buren, tone: 压抑, proposition: "最大的残忍不是天降灾祸，而是灾祸毫无道理。"}

  # --- 大道无情 (宇宙秩序层) ---
