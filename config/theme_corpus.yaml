  - {id: dadao_wuqing_02, motif: dadao_wuqing, tone: 压抑, proposition: "你以为的保护伞，是还没收紧的绞索。"}
  - {id: dadao_wuqing_03, motif: dadao_wuqing, tone: 沉郁, proposition: "眼泪不能兑换资源，跪下也不能。"}
  - {id: dadao_wuqing_04, motif: dadao_wuqing, tone: 冷峻, proposition: "天平不会因为你可怜就倾斜，它只称重量。"}
  - {id: dadao_wuqing_05, motif: dadao_wuqing, tone: 苍凉, proposition: "越往上走，越发现善意是最贵的奢侈品。"}
  - {id: dadao_wuqing_06, motif: dadao_wuqing, tone: 冷峻, proposition: "法则面前没有例外，例外要付出更大的例外代价。"}
  - {id: dadao_wuqing_07, motif: dadao_wuqing, tone: 反讽, proposition: "公平不是给弱者的，是给懂规则的人的。"}
  - {id: dadao_wuqing_08, motif: dadao_wuqing, tone: 沉郁, proposition: "这世界讲道理，只是它的道理里没有人情。"}

  # --- 众生皆苦 (宇宙秩序层) ---
  - {id: zhongsheng_jieku_01, motif: zhongsheng_jieku, tone: 悲悯, proposition: "你救得了一个人，救不了那个人身后的队伍。"}
  - {id: zhongsheng_jieku_02, motif: zhongsheng_jieku, tone: 苍凉, proposition: "强者的苦是没人能分担，弱者的苦是没人来分担。"}
  - {id: zhongsheng_jieku_03, motif: zhongsheng_jieku, tone: 沉郁, proposition: "看见别人的苦之后，自保就成了一种残忍。"}
  - {id: zhongsheng_jieku_04, motif: zhongsheng_jieku, tone: 反讽, proposition: "谁都在受苦，区别只是苦得体不体面。"}
  - {id: zhongsheng_jieku_05, motif: zhongsheng_jieku, tone: 悲悯, proposition: "慈悲不是没有边界，是明知没用还伸手。"}
  - {id: zhongsheng_jieku_06, motif: zhongsheng_jieku, tone: 温柔, proposition: "把别人的苦背上身，你才第一次觉得自己活着。"}
  - {id: zhongsheng_jieku_07, motif: zhongsheng_jieku, tone: 压抑, proposition: "苦难不会让人高尚，它只会逼人选边。"}
  - {id: zhongsheng_jieku_08, motif: zhongsheng_jieku, tone: 壮烈, proposition: "渡人者最先沉没，因为他停下来回头看了。"}

  # --- 因果 (宇宙秩序层) ---
