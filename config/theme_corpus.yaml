  - {id: changsheng_zhouzhou_03, motif: changsheng_zhouzhou, tone: 沉郁, proposition: "长生不是奖赏，是被时间反复审问你为什么还活着。"}
  - {id: changsheng_zhouzhou_04, motif: changsheng_zhouzhou, tone: 苍凉, proposition: "不死的人最怕的不是死，是再也找不到值得的事。"}
  - {id: changsheng_zhouzhou_05, motif: changsheng_zhouzhou, tone: 苍凉, proposition: "时间给你无限，却拿走了来不及这件珍贵的事。"}
  - {id: changsheng_zhouzhou_06, motif: changsheng_zhouzhou, tone: 温柔, proposition: "看尽成住坏空之后，还能为一朵花停留才是修行。"}
  - {id: changsheng_zhouzhou_07, motif: changsheng_zhouzhou, tone: 孤独, proposition: "永恒是一种孤独，因为没人陪你记得。"}
  - {id: changsheng_zhouzhou_08, motif: changsheng_zhouzhou, tone: 温柔, proposition: "长生者的慈悲，是替所有短命的人记住他们。"}

  # --- 善恶颠倒 (伦理反转层) ---
  - {id: shane_diandao_01, motif: shane_diandao, tone: 冷峻, proposition: "你奉命去诛的妖，正在护着你想救的村。"}
  - {id: shane_diandao_02, motif: shane_diandao, tone: 反讽, proposition: "名门未必高义，异端未必无情。"}
