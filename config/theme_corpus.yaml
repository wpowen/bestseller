  - {id: zhenxiang_03, motif: zhenxiang, tone: 迷惘, proposition: "真相不是答案，是一个更大的问题。"}
  - {id: zhenxiang_04, motif: zhenxiang, tone: 惊悚, proposition: "历史是被人删改过的，删的人还在。"}
  - {id: zhenxiang_05, motif: zhenxiang, tone: 冷峻, proposition: "墓里的骨头和史书对不上，对不上的那段才是真的。"}
  - {id: zhenxiang_06, motif: zhenxiang, tone: 沉郁, proposition: "查清真相会救人，也会亲手毁掉你想救的人。"}
  - {id: zhenxiang_07, motif: zhenxiang, tone: 迷惘, proposition: "越接近核心，越发现自己也是被写进去的一笔。"}
  - {id: zhenxiang_08, motif: zhenxiang, tone: 孤独, proposition: "知道得越多，能信的人越少。"}

