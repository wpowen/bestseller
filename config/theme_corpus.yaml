  - {id: yinguo_02, motif: yinguo, tone: 沉郁, proposition: "没有凭空的好运，只有还没认出你的报应。"}
  - {id: yinguo_03, motif: yinguo, tone: 冷峻, proposition: "善因未必结善果，但恶因一定结果。"}
  - {id: yinguo_04, motif: yinguo, tone: 惊悚, proposition: "每一个被你跳过的人，都会变成回来找你的人。"}
  - {id: yinguo_05, motif: yinguo, tone: 苍凉, proposition: "因果不是报应，是你忘了的事记得你。"}
  - {id: yinguo_06, motif: yinguo, tone: 压抑, proposition: "救错一个人，比放过一个人后果更重。"}
  - {id: yinguo_07, motif: yinguo, tone: 惊悚, proposition: "旧因从不消失，它只是换了张脸等你。"}
  - {id: yinguo_08, motif: yinguo, tone: 沉郁, proposition: "你种下的不是结果，是迟早要面对的自己。"}

  # --- 命运 (主体抉择层) ---
