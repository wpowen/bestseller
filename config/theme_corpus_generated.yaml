version: theme-corpus.generated
themes:
  - {id: tiandi_buren_gen_00, motif: tiandi_buren, tone: "", proposition: "祈祷时你在说话，神明那边没人接听。"}
  - {id: tiandi_buren_gen_01, motif: tiandi_buren, tone: "", proposition: "香灰落在绝望者手上，不是救赎，是灰烬。"}
  - {id: tiandi_buren_gen_02, motif: tiandi_buren, tone: "", proposition: "跪着求天不如站着替人撑伞。"}
  - {id: tiandi_buren_gen_03, motif: tiandi_buren, tone: "", proposition: "祭坛上堆满供品，屋顶该塌还是塌。"}
  - {id: tiandi_buren_gen_04, motif: tiandi_buren, tone: "", proposition: "庙宇还在，香火还旺，门外却无人活着。"}
  - {id: tiandi_buren_gen_05, motif: tiandi_buren, tone: "", proposition: "你给神磕的头，最后换来另一个人拉你一把。"}
  - {id: tiandi_buren_gen_06, motif: tiandi_buren, tone: "", proposition: "善行不会变成护身符，但会在废墟里遇见同类。"}
  - {id: tiandi_buren_gen_07, motif: tiandi_buren, tone: "", proposition: "焚香时烟是向上飘的，其实是在对一个空洞说话。"}
  - {id: tiandi_buren_gen_08, motif: tiandi_buren, tone: "", proposition: "世道从没收过贿赂，也不收祭品。"}
  - {id: tiandi_buren_gen_09, motif: tiandi_buren, tone: "", proposition: "天地不仁，所以活人之间才需要彼此负责。"}
  - {id: tiandi_buren_gen_10, motif: tiandi_buren, tone: "", proposition: "没有死得其所，只有死得毫无预兆。"}
  - {id: tiandi_buren_gen_11, motif: tiandi_buren, tone: "", proposition: "运气不是奖励，是暂时轮不到你受难。"}
  - {id: tiandi_buren_gen_12, motif: tiandi_buren, tone: "", proposition: "求神拜佛的人不是愚昧，是需要有东西可怪。"}
  - {id: tiandi_buren_gen_13, motif: tiandi_buren, tone: "", proposition: "香炉可以烧得很高，屋顶该漏还是漏。"}
  - {id: tiandi_buren_gen_14, motif: tiandi_buren, tone: "", proposition: "神明不需要你善良，它只需要你继续跪着。"}
  - {id: tiandi_buren_gen_15, motif: tiandi_buren, tone: "", proposition: "最冷的不是灾祸本身，是灾祸过后没人陪你站着。"}
  - {id: tiandi_buren_gen_16, motif: tiandi_buren, tone: "", proposition: "供桌上的水果烂了，你的祈祷也没人签收。"}
  - {id: tiandi_buren_gen_17, motif: tiandi_buren, tone: "", proposition: "你替神明找借口，神明连你是谁都不知道。"}
  - {id: tiandi_buren_gen_18, motif: tiandi_buren, tone: "", proposition: "信神的人死在庙里，不信的人死在庙外。"}
  - {id: tiandi_buren_gen_19, motif: tiandi_buren, tone: "", proposition: "祭品堆得越高，荒诞感越重。"}
  - {id: dadao_wuqing_gen_00, motif: dadao_wuqing, tone: "", proposition: "底牌没亮之前，别怪庄家把你当弃子。"}
  - {id: dadao_wuqing_gen_01, motif: dadao_wuqing, tone: "", proposition: "想活下去，先学会把自己的眼泪折算成筹码。"}
  - {id: dadao_wuqing_gen_02, motif: dadao_wuqing, tone: "", proposition: "所有捷径都在暗处标好了你付不起的价。"}
  - {id: dadao_wuqing_gen_03, motif: dadao_wuqing, tone: "", proposition: "弱者以为的绝路，强者眼里是突围的起点。"}
  - {id: dadao_wuqing_gen_04, motif: dadao_wuqing, tone: "", proposition: "这盘棋里，棋子不哭，棋手才不动声色。"}
  - {id: dadao_wuqing_gen_05, motif: dadao_wuqing, tone: "", proposition: "把希望寄托给公平，就像把命交给天气。"}
  - {id: dadao_wuqing_gen_06, motif: dadao_wuqing, tone: "", proposition: "规则没有温度，但它给所有人相同的机会。"}
  - {id: dadao_wuqing_gen_07, motif: dadao_wuqing, tone: "", proposition: "当你学会用代价衡量一切，困境就成了选择题。"}
  - {id: dadao_wuqing_gen_08, motif: dadao_wuqing, tone: "", proposition: "怜悯是奢侈品，你还没资格消费。"}
  - {id: dadao_wuqing_gen_09, motif: dadao_wuqing, tone: "", proposition: "输在起跑线的人，往往死在规则转折点。"}
  - {id: dadao_wuqing_gen_10, motif: dadao_wuqing, tone: "", proposition: "没有谁是不可替代的，除非你比规则更锋利。"}
  - {id: dadao_wuqing_gen_11, motif: dadao_wuqing, tone: "", proposition: "善意的退让，是给对手递刀。"}
  - {id: dadao_wuqing_gen_12, motif: dadao_wuqing, tone: "", proposition: "真正的成熟，是不再问为什么，只问怎么办。"}
  - {id: dadao_wuqing_gen_13, motif: dadao_wuqing, tone: "", proposition: "这世上最稳的靠山，是你自己建起的规则。"}
  - {id: dadao_wuqing_gen_14, motif: dadao_wuqing, tone: "", proposition: "弱者把命运当敌人，强者把命运当对手。"}
  - {id: dadao_wuqing_gen_15, motif: dadao_wuqing, tone: "", proposition: "每一个妥协，都是在给未来埋下要命的伏笔。"}
  - {id: zhongsheng_jieku_gen_00, motif: zhongsheng_jieku, tone: "", proposition: "痛苦最残忍的不是它本身，是它让你看清了自己的无能。"}
  - {id: zhongsheng_jieku_gen_01, motif: zhongsheng_jieku, tone: "", proposition: "你躲开了别人的苦，生活就把苦送到你眼前。"}
  - {id: zhongsheng_jieku_gen_02, motif: zhongsheng_jieku, tone: "", proposition: "苦难不是考验，是一场你不想赢也得输的比赛。"}
  - {id: zhongsheng_jieku_gen_03, motif: zhongsheng_jieku, tone: "", proposition: "越想少受苦，就越要看着别人受更多的苦。"}
  - {id: zhongsheng_jieku_gen_04, motif: zhongsheng_jieku, tone: "", proposition: "善良的代价是你得学会在愧疚里活下去。"}
  - {id: zhongsheng_jieku_gen_05, motif: zhongsheng_jieku, tone: "", proposition: "没有人是无辜的受苦者，每个人都在参与制造别人的不幸。"}
  - {id: zhongsheng_jieku_gen_06, motif: zhongsheng_jieku, tone: "", proposition: "你选择不看，不是因为不在乎，是因为看了就得做点什么。"}
  - {id: zhongsheng_jieku_gen_07, motif: zhongsheng_jieku, tone: "", proposition: "苦海没有岸，低头划的永远是自己那条船。"}
  - {id: zhongsheng_jieku_gen_08, motif: zhongsheng_jieku, tone: "", proposition: "同情心是诅咒，它让你无法再心安理得地活着。"}
  - {id: zhongsheng_jieku_gen_09, motif: zhongsheng_jieku, tone: "", proposition: "最深的苦不是得不到，是得到之后发现也不过如此。"}
  - {id: zhongsheng_jieku_gen_10, motif: zhongsheng_jieku, tone: "", proposition: "你以为自己在受苦，其实你只是终于睁开了眼。"}
  - {id: zhongsheng_jieku_gen_11, motif: zhongsheng_jieku, tone: "", proposition: "苦难不问缘由，它只负责淹没每一个抬头的人。"}
  - {id: mingyun_gen_00, motif: mingyun, tone: "", proposition: "你认命的那一刻，才真正开始改命。"}
  - {id: mingyun_gen_01, motif: mingyun, tone: "", proposition: "逃到无路可逃，才发现起点才是出口。"}
  - {id: mingyun_gen_02, motif: mingyun, tone: "", proposition: "越想挣脱设定，越像在配合演戏。"}
  - {id: mingyun_gen_03, motif: mingyun, tone: "", proposition: "命只划定边界，里面怎么住是你定的。"}
  - {id: mingyun_gen_04, motif: mingyun, tone: "", proposition: "知道终点在哪，才知道往哪走。"}
  - {id: mingyun_gen_05, motif: mingyun, tone: "", proposition: "不是不抗争，是看清了抗什么才有效。"}
  - {id: mingyun_gen_06, motif: mingyun, tone: "", proposition: "命像出题的人，不负责替你写答案。"}
  - {id: mingyun_gen_07, motif: mingyun, tone: "", proposition: "你恨它的时候，它早就在等你了。"}
  - {id: mingyun_gen_08, motif: mingyun, tone: "", proposition: "认命不是放弃争，是换条能赢的赛道。"}
  - {id: mingyun_gen_09, motif: mingyun, tone: "", proposition: "看清楚命运的笔迹，才知道在哪划掉。"}
  - {id: mingyun_gen_10, motif: mingyun, tone: "", proposition: "怕什么来什么，不是因为命，是因你一直盯着它。"}
  - {id: mingyun_gen_11, motif: mingyun, tone: "", proposition: "和命运对视之后，才知道该往哪走。"}
  - {id: nitian_gen_00, motif: nitian, tone: "", proposition: "认命是活着的唯一条件，不认命是活着的唯一意义。"}
  - {id: nitian_gen_01, motif: nitian, tone: "", proposition: "你以为是绝路，其实是天给的最后一道选择题。"}
  - {id: nitian_gen_02, motif: nitian, tone: "", proposition: "最锋利的刀，是用自身锻造的。"}
  - {id: nitian_gen_03, motif: nitian, tone: "", proposition: "不是神需要祭品，是祭品需要成为神。"}
  - {id: nitian_gen_04, motif: nitian, tone: "", proposition: "所有退路被堵死那天，你才真正开始走路。"}
  - {id: nitian_gen_05, motif: nitian, tone: "", proposition: "天给的路走到尽头，正好是自己开路的时候。"}
  - {id: nitian_gen_06, motif: nitian, tone: "", proposition: "最深的绝望里，埋着最强的火种。"}
  - {id: nitian_gen_07, motif: nitian, tone: "", proposition: "你本是棋子，掀翻棋盘的力气只能自己给。"}
  - {id: nitian_gen_08, motif: nitian, tone: "", proposition: "等所有人都说不可能时，才是可能的开始。"}
  - {id: nitian_gen_09, motif: nitian, tone: "", proposition: "被打碎的不是骨头，是'这辈子只能这样'的念头。"}
  - {id: nitian_gen_10, motif: nitian, tone: "", proposition: "逆天第一步：承认天也有错。"}
  - {id: nitian_gen_11, motif: nitian, tone: "", proposition: "把天规踩在脚下那天，你就是下一个天。"}
  - {id: rending_shengtian_gen_00, motif: rending_shengtian, tone: "", proposition: "赢了这一仗，账还没算完"}
  - {id: rending_shengtian_gen_01, motif: rending_shengtian, tone: "", proposition: "以为天塌了，其实是地基烂了"}
  - {id: rending_shengtian_gen_02, motif: rending_shengtian, tone: "", proposition: "最难的仗是打赢之后没人接"}
  - {id: rending_shengtian_gen_03, motif: rending_shengtian, tone: "", proposition: "扛过去不算赢，让后来人不必扛才算"}
  - {id: rending_shengtian_gen_04, motif: rending_shengtian, tone: "", proposition: "气魄救得了急，建制才救得了命"}
  - {id: rending_shengtian_gen_05, motif: rending_shengtian, tone: "", proposition: "天灾是一阵子，人祸才是长久的"}
  - {id: rending_shengtian_gen_06, motif: rending_shengtian, tone: "", proposition: "英雄退场后，留下的烂摊子谁收拾"}
  - {id: rending_shengtian_gen_07, motif: rending_shengtian, tone: "", proposition: "一个人拼命换来的胜利，三代人可能还不起"}
  - {id: rending_shengtian_gen_08, motif: rending_shengtian, tone: "", proposition: "靠勇气打赢的仗，靠制度才能守住"}
  - {id: rending_shengtian_gen_09, motif: rending_shengtian, tone: "", proposition: "不是天不可战胜，是光靠人不行的"}
  - {id: rending_shengtian_gen_10, motif: rending_shengtian, tone: "", proposition: "最深的坑不是自然挖的，是没人填的"}
  - {id: rending_shengtian_gen_11, motif: rending_shengtian, tone: "", proposition: "赢了一时，输了万年，那叫什么赢"}
  - {id: daijia_gen_00, motif: daijia, tone: "", proposition: "每一分得到，都从你尚未察觉的地方取走等量的东西。"}
  - {id: daijia_gen_01, motif: daijia, tone: "", proposition: "你以为在选择，其实是在签一张无法毁约的欠条。"}
  - {id: daijia_gen_02, motif: daijia, tone: "", proposition: "强大的代价，是把你的软肋卖给了每一个敌人。"}
  - {id: daijia_gen_03, motif: daijia, tone: "", proposition: "代价从不说谎，它只在你撒谎时来清账。"}
  - {id: daijia_gen_04, motif: daijia, tone: "", proposition: "你用什么换力量，力量就注定无法弥补那个空缺。"}
  - {id: daijia_gen_05, motif: daijia, tone: "", proposition: "真正的代价不是失去，而是失去后才知道它曾属于你。"}
  - {id: daijia_gen_06, motif: daijia, tone: "", proposition: "每场胜利都在暗处标好了你将偿还的时间与分量。"}
  - {id: daijia_gen_07, motif: daijia, tone: "", proposition: "所有捷径都有利息，你走的时候有多快，还的时候就有多疼。"}
  - {id: daijia_gen_08, motif: daijia, tone: "", proposition: "你省下的每一样东西，最后都变成必须偿还的亏空。"}
  - {id: daijia_gen_09, motif: daijia, tone: "", proposition: "代价不是惩罚，是宇宙从不打折的收支平衡。"}
  - {id: daijia_gen_10, motif: daijia, tone: "", proposition: "拥有越多选择，失去时就越无处可逃、无从抵赖。"}
  - {id: daijia_gen_11, motif: daijia, tone: "", proposition: "你透支的不是未来，是某个已经存在的当下。"}
  - {id: zhenxiang_gen_00, motif: zhenxiang, tone: "", proposition: "查清一件事，就欠下一笔永远还不清的债。"}
  - {id: zhenxiang_gen_01, motif: zhenxiang, tone: "", proposition: "以为是自己查案，其实是案子在挑人来查。"}
  - {id: zhenxiang_gen_02, motif: zhenxiang, tone: "", proposition: "真相让人自由，也让人成为唯一知情者。"}
  - {id: zhenxiang_gen_03, motif: zhenxiang, tone: "", proposition: "说出来的真相会伤人，说不出的会杀人。"}
  - {id: zhenxiang_gen_04, motif: zhenxiang, tone: "", proposition: "真相永远有两层，第二层是'为何没人说'。"}
  - {id: zhenxiang_gen_05, motif: zhenxiang, tone: "", proposition: "查清那一刻，你就不再是原来的身份了。"}
  - {id: zhenxiang_gen_06, motif: zhenxiang, tone: "", proposition: "历史只记结果，过程欠的债要谁来还。"}
  - {id: zhenxiang_gen_07, motif: zhenxiang, tone: "", proposition: "真相不是终点，是你必须重新开始的起点。"}
  - {id: zhenxiang_gen_08, motif: zhenxiang, tone: "", proposition: "说出口的真相像投出去的刀，收不回来。"}
  - {id: zhenxiang_gen_09, motif: zhenxiang, tone: "", proposition: "找到真相的人，往往成了下一个该被掩盖的真相。"}
  - {id: zhenxiang_gen_10, motif: zhenxiang, tone: "", proposition: "每个真相背后都站着一个人，等你来问责。"}
  - {id: zhenxiang_gen_11, motif: zhenxiang, tone: "", proposition: "真相从不主动现身，要你用代价去换。"}
  - {id: shenfo_jiewei_gen_00, motif: shenfo_jiewei, tone: "", proposition: "神不需要信徒，是信徒需要神来安置自己的无能。"}
  - {id: shenfo_jiewei_gen_01, motif: shenfo_jiewei, tone: "", proposition: "神坛上的泥塑不伤人，跪下去的那个膝盖才伤。"}
  - {id: shenfo_jiewei_gen_02, motif: shenfo_jiewei, tone: "", proposition: "最虔诚的祈祷，往往是给最不存在的东西的贿赂。"}
  - {id: shenfo_jiewei_gen_03, motif: shenfo_jiewei, tone: "", proposition: "神像越精美，藏在它背后的手就越粗。"}
  - {id: shenfo_jiewei_gen_04, motif: shenfo_jiewei, tone: "", proposition: "香火燃尽的灰，是给恐惧交的过路费。"}
  - {id: shenfo_jiewei_gen_05, motif: shenfo_jiewei, tone: "", proposition: "神不是假的，是被用错地方的工具。"}
  - {id: shenfo_jiewei_gen_06, motif: shenfo_jiewei, tone: "", proposition: "检验神的标准只有一个：活人比死人重要。"}
  - {id: shenfo_jiewei_gen_07, motif: shenfo_jiewei, tone: "", proposition: "神之所以神圣，是因为没人敢让它不神圣。"}
  - {id: shenfo_jiewei_gen_08, motif: shenfo_jiewei, tone: "", proposition: "神迹是演给活人看的，死人不需要奇迹。"}
  - {id: shenfo_jiewei_gen_09, motif: shenfo_jiewei, tone: "", proposition: "每个时代的神，都是那个时代最需要被打破的谎言。"}
  - {id: shenfo_jiewei_gen_10, motif: shenfo_jiewei, tone: "", proposition: "神像是钉在地上的锁链，提醒你永远别站起来。"}
  - {id: shenfo_jiewei_gen_11, motif: shenfo_jiewei, tone: "", proposition: "真正的虔诚，是敢于质问神为什么沉默。"}
  - {id: changsheng_zhouzhou_gen_00, motif: changsheng_zhouzhou, tone: "", proposition: "你认识的所有人都在你眼前老去，只有你自己留在原地。"}
  - {id: changsheng_zhouzhou_gen_01, motif: changsheng_zhouzhou, tone: "", proposition: "记得太多是病，忘记也是病，长生者两种都染上了。"}
  - {id: changsheng_zhouzhou_gen_02, motif: changsheng_zhouzhou, tone: "", proposition: "每个时代你都在场，却从未真正属于任何一个时代。"}
  - {id: changsheng_zhouzhou_gen_03, motif: changsheng_zhouzhou, tone: "", proposition: "你看着所有关系建立又断裂，最后连建立都懒得了。"}
  - {id: changsheng_zhouzhou_gen_04, motif: changsheng_zhouzhou, tone: "", proposition: "告别成为你唯一擅长的事，熟练到心已麻木。"}
  - {id: changsheng_zhouzhou_gen_05, motif: changsheng_zhouzhou, tone: "", proposition: "见证历史的人没有历史，只有被历史穿过。"}
  - {id: changsheng_zhouzhou_gen_06, motif: changsheng_zhouzhou, tone: "", proposition: "时间对你来说从河流变成墙壁，你撞穿的全是别人的生命。"}
  - {id: changsheng_zhouzhou_gen_07, motif: changsheng_zhouzhou, tone: "", proposition: "你的存在本身就在提醒每个人：活着毫无意义。"}
  - {id: changsheng_zhouzhou_gen_08, motif: changsheng_zhouzhou, tone: "", proposition: "等你活够了想死，却发现连死都需要排队等别人批准。"}
  - {id: changsheng_zhouzhou_gen_09, motif: changsheng_zhouzhou, tone: "", proposition: "时间太多是灾难，多到连悲伤都要排队轮流。"}
  - {id: changsheng_zhouzhou_gen_10, motif: changsheng_zhouzhou, tone: "", proposition: "你拥有所有时刻，却哪个都不属于你。"}
  - {id: changsheng_zhouzhou_gen_11, motif: changsheng_zhouzhou, tone: "", proposition: "见证了太多开始与结束，连自己的故事都讲不下去了。"}
  - {id: shane_diandao_gen_00, motif: shane_diandao, tone: "", proposition: "你举起的剑越正，手里的血越脏。"}
  - {id: shane_diandao_gen_01, motif: shane_diandao, tone: "", proposition: "被追杀的往往是无辜的，被歌颂的往往是刽子手。"}
  - {id: shane_diandao_gen_02, motif: shane_diandao, tone: "", proposition: "庙堂之上站满伪善，江湖之远倒卧真人。"}
  - {id: shane_diandao_gen_03, motif: shane_diandao, tone: "", proposition: "标签贴久了，连贴的人自己都信了。"}
  - {id: shane_diandao_gen_04, motif: shane_diandao, tone: "", proposition: "制度养出来的恶，比个人作恶更难追责。"}
  - {id: shane_diandao_gen_05, motif: shane_diandao, tone: "", proposition: "审判过你的人，往往比被你审判的更该受审。"}
  - {id: shane_diandao_gen_06, motif: shane_diandao, tone: "", proposition: "沉默地看着好人受难，和亲手施害没有距离。"}
  - {id: shane_diandao_gen_07, motif: shane_diandao, tone: "", proposition: "所谓正道，是让坏事穿上合法的外衣。"}
  - {id: shane_diandao_gen_08, motif: shane_diandao, tone: "", proposition: "历史由胜利者书写，罪行由后人来洗白。"}
  - {id: shane_diandao_gen_09, motif: shane_diandao, tone: "", proposition: "当你终于分清善恶，却发现站哪边都是罪。"}
  - {id: shane_diandao_gen_10, motif: shane_diandao, tone: "", proposition: "最深的恶，是让人相信作恶是在行善。"}
  - {id: shane_diandao_gen_11, motif: shane_diandao, tone: "", proposition: "身份是别人给的，人是自己做的。"}
