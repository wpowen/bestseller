# BestSeller · bookengine 网页服务
#
#   docker compose up -d --build     # 打开 http://127.0.0.1:8787
#   docker compose logs -f bookweb
#   docker compose down
#
# 书稿与检查点都在宿主机 ./books（BOOKS_HOST_DIR 可改），容器只是运行环境。
# 模型密钥只从宿主机 .env 只读挂载，不进镜像、不进日志。
# 老框架（PostgreSQL / API / worker / scheduler / MCP / 旧 Web Studio）已归档到
# git 标签 legacy-final-20261104 与分支 legacy；需要时 `git checkout legacy-final-20261104`。

services:
  bookweb:
    build:
      context: .
      dockerfile: engine/Dockerfile
    image: bestseller-bookweb:latest
    restart: unless-stopped
    environment:
      BOOKS_DIR: /books
      BOOKENGINE_ENV: /run/bookengine/.env
      BOOKWEB_HOST: 0.0.0.0
      BOOKWEB_PORT: "8787"
      BOOKWEB_PUBLIC_PORT: ${BOOKWEB_PORT:-8787}
      BOOKWEB_BUDGET_USD: ${BOOKWEB_BUDGET_USD:-20}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${BOOKWEB_PORT:-8787}:8787"
    volumes:
      - ${BOOKS_HOST_DIR:-./books}:/books
      - ./.env:/run/bookengine/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8787/api/config',headers={'Host':'127.0.0.1:'+os.environ['BOOKWEB_PUBLIC_PORT']}),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
