# 真实爆款「第一章开头」参照库 —— 章节层盲评对标语料
#
# 用途：outline_arena.run_outline_arena(kind="opening") 把本书已物化的第一章开头
# 与同题材真实爆款的第一章开头做双盲成对盲评，产出 win-rate。盲评只在本书 ch1 草稿
# 已生成后才有候选；未生成 → 该屏显示「待章节生成后可评」。
#
# ⚠️ 必须是手工录入的【真实爆款】第一章开头（约 400–700 字原文），与 blurb 库同等策展标准。
#    arena 可信的前提是对标真实头部作品；切勿填入 AI 生成或杜撰内容。某题材未填 →
#    该题材盲评自动跳过（pairs==0）。注意版权：仅作内部质量对标，不对外分发。
#
# 结构（canonical genre key 见 services/genre_taxonomy.py）：
# xuanhuan:
#   - title: "<真实书名>"
#     opening: "<该书第一章开头约 400-700 字原文>"
# urban:
#   - title: "..."
#     opening: "..."
#
# 填充后删除本说明上方留空即可。
