# 小说写作数据；来源、固定提交与许可见同目录 NOTICE.md。
# 标签、建议、regex 均为本次自写概括；不含上游小说示例、代码或禁用词表。
version: 1
language: zh
usage_notes:
  - 仅作小说写作与局部修订参考，数据文件本身不发起调用或改写。
  - sentence_patterns 使用 Python re 语法，只筛查完整中文叙述句；命中须结合上下文复核。
  - 排除对白、引文、书信、告示、角色明确的内心原话和设定中的字面事件后再筛查。
  - 命中不是作者身份或文字质量的证明；无法确认冗余时保留原句，不作机械替换。
  - 不以短段落、单句段、单个常用词或必要修辞判错；英文混入由已有专门流程处理。

# 按上游十三类逐项自写中文标签；不是原文标题的复制。
hook_types:
  - 新事实推翻旧判断
  - 眼前危险逼近
  - 关键行动悬停
  - 熟人身份改观
  - 两条路各有代价
  - 异常物件待解释
  - 截止时刻将到
  - 誓言或威吓落地
  - 人物物件无故失踪
  - 话中漏洞露端倪
  - 旧意象发生变化
  - 首尾照面生新义
  - 留下未答的反应
hook_notes:
  - 钩子来自本章已铺垫的人物行动和后果，下章及时承接，不能靠截断普通动作凑数。
  - 身份变化要能回看出根据；物件异状要给读者可理解的疑问，不能只丢陌生名词。
  - 意象收尾先让意象参与场景；首尾呼应应改变含义，不重复一句空泛结论。
  - 沉默留白应让读者知道人物在回应什么，避免反复藏起视角人物本来知道的事实。
  - 收尾阶段优先回应已有问题，不为使用钩子另开主线。

dialogue_notes:
  - 先想清双方此刻各想得到什么，再让问答改变行动、理解或关系；寒暄也可以承担试探。
  - 用词、语速、直说或绕弯随人物经历和关系区分，不能让所有人轮流讲同一种金句。
  - 紧急时可以打断和省句，试探时可以停顿；不把迟疑和回避设成每个人的固定口癖。
  - 能辨清说话人时少加标签；必要时用朴素的说、问，不逐句补情绪副词。
  - 动作可以支持台词，也可以泄露口是心非，但不要为每句台词配同一个小动作。
  - 潜台词服务于隐瞒、顾虑或试探；人物有理由坦白时，允许清楚说完。
  - 谁抢话、谁换题、谁迫使对方回答，可表现权力变化；下一句应接住上一句的压力。
  - 不让人物彼此讲解双方早已知道的背景；必须交代的信息借当前争执、需求或误解带出。

# 自写的窄模板候选，kind 沿用现有 summary/epiphany/poetic 三类。
# 禁止据此全局删除“不禁/仿佛/然而/不是…而是”等正常小说表达。
sentence_patterns:
  - id: narrator_essay_preface
    kind: summary
    regex: '^\s*(?:值得注意的是|需要强调的是|需要指出的是)[，,：:][^。！？!?\n]{4,100}[。！？!?]?\s*$'
    note: 叙述忽然转成文章提示语时复核；保留人物故意使用的正式说话方式。
  - id: narrator_universal_lesson
    kind: summary
    regex: '^\s*(?:这一切|这段经历)(?:让|使)(?:他|她)(?:终于)?(?:懂得|明白)了?人生的真谛[^。！？!?\n]{0,32}[。！？!?]?\s*$'
    note: 场面之后泛化成人生结论的候选；只在重复已有信息时局部改。
  - id: narrator_empty_beginning
    kind: summary
    regex: '^\s*(?:而|但|然而)?(?:这|那|这一切|一切)(?:都)?(?:才|仅仅|不过)(?:只是|是)?(?:刚刚)?开始(?:而已)?[。！!]?\s*$'
    note: 无具体后果的收尾宣告候选；确有阶段转折或人物原话时保留。
  - id: abstract_epiphany_explanation
    kind: epiphany
    regex: '(?:他|她)(?:在这一刻|此刻)?终于(?:明白|懂得)(?:了)?[，,：:]?(?:所谓的?)?(?:成长|勇气|信任|责任)的真正意义[^。！？!?\n]{0,48}'
    note: 顿悟只重说抽象主题时复核；新认识若改变后续选择，应保留信息。
  - id: fate_gears_cliche
    kind: poetic
    regex: '命运的齿轮(?:在这一刻|此刻|终于|悄然|缓缓|再次){0,2}(?:开始|重新)?(?:转动|咬合)[^。！？!?\n]{0,24}'
    note: 套用宏大命运意象的候选；机械设定或刻意引用不在处理范围。
  - id: repeated_emotion_explanation
    kind: epiphany
    regex: '(?:他的|她的)心中不禁油然而生(?:出)?(?:一股|一种|一阵)[^。！？!?\n]{1,12}(?:之情|的情绪|的感觉)'
    note: 多层情绪套语叠用的候选；核对前面动作是否已经表达同一情绪。

novel_notes:
  - 文风负面清单针对空泛解释、同义堆砌和失效重复，不是词语黑名单。
  - 动作或对白已经交代的情绪不再补一遍结论；含义仍有歧义时保留必要解释。
  - 对照句应有可辨的差别；人物辨认声响、纠正判断或真实反转所需的否定不能删。
  - 修辞要增加可感信息；比喻不再附一段解释寓意，同一意象重现须有新含义。
  - 同主语或小动作连续重复时看场景作用，不为句长变化拆句，也不合并必要短段。
  - 创作可发展符合既有设定的新行动；表达润色不凭空添事实、动机、心理或因果。
  - 修订保留原段落边界、叙述视角、条件、否定、时间和情绪强度；不明的指代先保留。
  - 书信、记录、编号和人物特殊口吻可以有自己的格式；局部建议不改变它们的用途。
  - 召回旧事应选确实发生且与当前人物选择有关的事件，回收时写出后果，不拼贴旧段。

# 非 MIT 项目仅记录一般设计概念，未移植其实现、提示词、措辞清单或小说文本。
design_notes:
  ainovel_cli:
    - 可枚举的流程状态由程序判断，文学判断另行处理。
    - 远期保留方向，临近的章节再细化，展开前参考已发生的摘要和角色状态。
    - 找旧章可看未结伏笔、相关人物、状态改变及关系变化，再按需回读。
  ai_novel_writing_assistant:
    - 已写章节带来的角色与伏笔变化，可作为后续章节的参考信息。
