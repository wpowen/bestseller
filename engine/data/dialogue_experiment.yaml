schema_version: 1
purpose: 独立对白口语润色实验；只供实验调用方读取，不接入生产引擎。
polish_prompt: |-
  只润色给定引文内部，原有事件、信息、人物关系与旁白逐字保留。
  按给定人物口吻卡说话；归属不可靠时 speaker 保留 Unknown，不猜人物。
  口吻维度包括口头语、句长、粗口或文雅程度、方言；仅按已有口吻卡和情境选用，不强加任何一项。
  允许短句、打断、省略、犹豫与话说一半；先有情绪，再有回应。
  禁止对白里讲道理、总结、下判断、解释机制；不把日常争执改成原则宣讲。
  本次候选中至少一处自然的玩笑，须适合人物及情境，不编造新事实。
  口语习惯要随处境变化，不机械重复口头禅，不让所有人物一个口吻。
  可修改任意短段，包含一个字的引文；不用凑字数或重写整个自然段。
  不得全空删除引文；保留信息，允许一个字短句，不设置最短段长。
  不新增换行或英文词，不插入嵌套引号，不替换外层引号，不改引号外任何字符。
  输出 edits 列表，每项为原引文 id、原文 original 和替换后的 text；不输出旁白或解释。
rules:
  abstract_nouns:
    - 命运
    - 意义
    - 价值
    - 本质
    - 规则
    - 秩序
    - 逻辑
    - 机制
    - 原则
    - 选择
    - 责任
    - 自由
    - 理想
    - 信念
    - 真理
    - 正义
    - 尊严
    - 权力
    - 力量
    - 实力
    - 成长
    - 希望
    - 绝望
    - 未来
    - 人生
    - 世界
    - 可能性
    - 确定性
    - 存在
    - 认知
    - 情绪
    - 关系
    - 利益
    - 代价
    - 人性
    - 见证
    - 真相
    - 证词
  contrast_pattern: '不是[^。！？.!?；;\n]*?(?:而是|(?<!不)是)'
  aphorism_pattern: '(?:所谓.+?(?:就是|不过是)|(?:人生|人性|命运|真理|正义|自由|尊严|力量|世界|生活|成长|成功|失败)(?:的[^，,]{1,8})?(?:就是|本就是|从来都是|意味着)|只有.+?才|只要.+?就|凡是.+?(?:都|就))'
  parallel_predicate_pattern: '(?:能够|可以|应该|需要|必须|能|会|要|敢|肯|该|应|需|想|愿)[\u4e00-\u9fff]'
  spoken_dialogue:
    paragraph_break_pattern: '[\r\n\u2028\u2029]+'
    label_prefix_pattern: '(?:写着|刻着|印着|标着|写有|刻有|名叫|所谓|称作|称为|叫作|字样|几个字|[一二两三四五六七八九十百\d]+个?字|名称|显示|文字|注明|标注|标明|标签|标题|题为)[^。！？!?；;“”"「」『』]*$'
    label_suffix_pattern: '^\s*(?:的)?(?:字样|几个字|[一二两三四五六七八九十百\d]+个?字|一词|这个词|这个名字|(?:这个|这一)?名称|显示|文字|标签|标题)'
    speech_prefix_pattern: '(?:说|问|道|喊|叫|答|回应|嘀咕|嘟囔|喝)(?:了|着)?\s*[：:,，]?\s*$'
    action_prefix_pattern: '[：:]\s*$'
interfaces:
  dialogues: 'dialogues(text) -> list[dict]；id 为 D编号-start-end，start/end 为引号内部半开 Unicode 字符偏移。'
  spoken_dialogue: 'spoken_dialogue(text, row) -> bool；校验原文 row 后按 rules.spoken_dialogue 判高置信发言白名单，speaker 不变；供缓存 edits 离线筛选，不自动改变扫描、指标或替换接口。'
  metrics: 'metrics(text) -> dict；只含 JSON 值，可直接写入盲评指标，不含来源或方案映射。'
  apply_dialogue_edits: 'apply_dialogue_edits(text, edits) -> (text, accepted)；accepted 是按原文排序的已接受编辑列表。'
  edit: '{id: 原引文id, original: 原引文内容, text: 替换内容}；也可用精确 start/end 代替 id；original 必填并逐字校验。'
diagnostics:
  authority: 词表与句式启发式，仅供诊断，不代表人工读感或模型质量验收。
  chars: 全篇汉字数，不含标点、英文和数字。
  dialogue_ratio: 成对中文或直双引号内汉字数除以全篇汉字数；引文不保证就是人物发言。
  scope: 其他指标仅扫描引文内部，不跨引文拼句；嵌套引文按外层计一次，不允许替换。
  pattern_counts:
    contrast: 同句不是…是或不是…而是的次数。
    parallelism: 三个相邻分句重复双字句首且长度差不超过二字，或两句等长且有共享句首、句尾或同位置内部谓语骨架；内部谓语按 rules.parallel_predicate_pattern 匹配情态词加动词，前后须有内容，不因共享普通名词就命中；每句至多一次。
    aphorism: 所谓…就是、人生就是等泛化判断，以及只有…才等条件格言的词式命中数。
    long_sentence: 单句汉字严格超过35的句数。
  abstract_noun_density: rules.abstract_nouns 有限词表（含见证、真相、证词）最长非重叠命中的汉字数除以引文汉字数；另报命中词数。
  rule_loading: tools 模块导入时按自身路径读取本文件 rules 并编译；离线重算应重新导入模块或重启进程，不读取工作目录下的同名文件。
  sentence_length_variance: 整体对白句长的总体方差，仅作同腔的句长代理，不代表逐人物口吻差异或同腔结论；以汉字计句长，按句号问号叹号分号或换行分句，逗号不分句，空样本为零。
  speaker: Unknown；仅靠引号和邻近姓名不能可靠归属，不虚构口吻卡。
  spoken_dialogue: 写着、刻着、名叫、所谓、称作、字样、几个字、名称、显示等文字标签引出或后缀优先排除（包括跨换行引出的标签）；其余放行段首引文、说问道等引出及一般中文或英文冒号引出，不再枚举动作。未匹配或嵌套引文返回 false；这是启发式，不保证穷尽所有发言。
  acceptance: 保留一个字短句；拒绝空串或纯空白删除、缺失或不匹配的 original、失效偏移、重复目标、嵌套引文、新引号、新增换行及新增或增量英文词；其他有效编辑继续接受。既有换行按种类计数不得增加。
execution:
  real_model_calls: 0
  production_integration: false
  blind_assignment: 不生成、不存储、不打印盲码与实验方案的对应关系。
