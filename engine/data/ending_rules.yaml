version: 1
notes:
- name/identity/time 必须与末两段中的悬念语境同时出现才返回候选。
- known 只表示捕获值在前文、bible 或 outline 中字面出现；不证明身份关系或时间关联已经铺垫。
- 旧人新身份、旧日期新关联和正常旧真相揭底都可能返回候选；不得按数量或 known 自动判开坑。
- Main 将候选送 combined 模型并通过统一 finish 接口判断、重写与复核；本模块不调用模型。
- rewrite_block 仅拒绝明确仍待展开的新冲突承诺，不能代替模型的语义验收；普通回顾和已解旧案不拒绝。
- apply_tail 接收恰好两项字符串列表/元组或恰好两自然段字符串；不接收整章或判决对象。
suspense: (?:[？?]|究竟|到底|竟然|竟是|居然|原来|赫然|真正的|自己的(?:笔迹|字迹)|从未见过|陌生的|未解之谜|另有其人|才刚刚开始)
signals:
  name: (?:名叫|名为|叫作|名字是|(?=[\u4e00-\u9fff]{2,4}——))[“"「]?(?P<value>[\u4e00-\u9fff]{2,4})(?=——|[”"」，,。；;：:\s])
  identity: (?:——|身份(?:竟|原来)?是|(?:原来)?(?:他|她|那人)(?:竟|原来)?是|竟是|就是)(?P<value>[\u4e00-\u9fff]{2,12})(?=[”"」，,。；;！？!?\s]|$)
  time: (?P<value>(?:[〇零一二两三四五六七八九十百千\d]+(?:年|月|天)(?:前|后)|\d{4}年(?:\d{1,2}月(?:\d{1,2}日)?)?|(?:明|昨|今)夜|明天|后天))
rewrite_block: (?:(?:真正的|另一个|新的?)(?:幕后)?(?:主使|主谋|凶手|敌人|对手|谜团|危机|任务)[^。！？\n]{0,24}(?:仍未|尚未|还没|未曾|等着|等待|才刚|即将|将要)|(?:新的?|另一个)(?:谜团|秘密|主线)[^。！？\n]{0,16}(?:开始|开启|浮现|出现)|(?:这|一)切(?:才)?刚(?:刚)?开始|(?:究竟|到底)(?:是|还藏着|还有)(?:谁|什么)|(?:凶手|主谋|主使)另有其人)
scene_limit: 600
paragraph_limit: 150
scene_boundary: (?m)^[ \t]*(?:---[ \t]*|###[^\r\n]*)(?:\r?\n|$)
english_fragment: (?<![A-Za-z0-9_])[A-Za-z0-9_]*[A-Za-z][A-Za-z0-9_]*(?:[’\x27-][A-Za-z0-9_]+)*
position_label: '[A-Z]\d{1,3}'
scene_exposition: 意为|这意味着|换言之|也就是说|其原理是|这说明了|总结起来|真正的含义
scene_dialogue: '[“「\"].+?[”」\"]'
count_basis: same chinese_count Han-character measure used by chapter word bands
model_notes:
  english_word_gate: 12
  paragraph_min_english_words: 3
  paragraph_english_ratio: 0.3
  cue_pattern: '(?i)\b(?:need|ensure|maybe|scene|chars?|words?|insert|avoid|let''s|should|must|write|draft|ending|hook|chapter|concrete)\b'
  marker_pattern: '</?mm:think>'
final_closure:
  tail_paragraphs: 8
  new_mystery: '此前从未(?:显现|出现)|未解之谜|新(?:的)?(?:谜团|秘密|主线)|(?:祖使|主使|受命者)[^。！？\n]{0,20}(?:缺位|补位)|裂缝深处浮出[^。！？\n]{0,30}(?:小字|文字|名字)'
  new_identity: '认下了一个新(?:的)?[\u3400-\u9fff]{2,8}|新(?:的)?身份|(?:原来|真正)[^。！？\n]{0,12}(?:身份|身世)|另一个[\u3400-\u9fff]{2,8}'
  new_task: '(?:仍|还|尚)[^。！？\n]{0,24}(?:待|要)(?:追查|查清|寻找|找到)|(?:追查|查清|寻找)[^。！？\n]{0,24}(?:任务|线索|真相)|(?:明日|接下来)[^。！？\n]{0,16}(?:出发|启程)'
  new_stigma: '新(?:的)?(?:污名|罪名|通缉|冤屈)|(?:背上|留下|蒙受)[^。！？\n]{0,12}(?:污名|罪名|骂名)'
momentum:
  active_types:
  - 迫近危险
  - 刚揭事实
  - 悬停动作
  - 两难选择
  - 反常物件
  - 关系裂痕
  flat_type: 平收
  signals:
    迫近危险: 追兵|敌人|杀意|刀光|剑光|异响|低吼|兽吼|脚步(?:声)?(?:逼近|临近|冲来|密集)|逼到|逼近|堵住|封住.{0,12}(?:路|口)|包围|破门|冲进|扑来|袭来|箭雨|(?:冰层|冰封|风口).{0,20}(?:合拢|闭合)|火势(?:逼近|烧到)
    刚揭事实: 原来|竟(?:然|是)|居然|这才发现|赫然|真相|落款|名单|日期|名字|字迹|记号|令尾|证词|纸背|残令|写着|绣着|刻着|答的是|亲口|认出|看清|(?:没|无)人(?:知道|知晓)|从一开始.{0,20}(?:错口|陷阱|圈套|埋伏)
    悬停动作: 刚要|正要|尚未|还没来得及|还在(?:往前|向前|朝前)?(?:爬|走|挪|推|拉|追)|停在半空|只开了?一线|开到一半|先动了|手(?:指|掌)?一顿
    两难选择: 要么.{0,30}要么|只能.{0,30}(?:否则|却会|便会|先拿|先选)|必须.{0,30}(?:选择|舍弃)|当场选|二选一
    反常物件: (?:铃|镜|剑|刀|门|灯|纸|书|玉|石|符|钥匙|戒指|绳|血|尸|钟|印|骨|物件)[\s\S]{0,40}(?:自己|无风|忽然|突然|竟然|反常|发亮|响了|动了|裂开|渗血|变热|变冷|自鸣)
    关系裂痕: 不再相信|从此两清|别再叫我|关系破裂|留下裂痕|背叛|决裂|站到了?对面|转身离开|没有(?:回答|答应|回应|看|松手)|按回掌心|笑意.{0,12}藏
  flat_terminal: (?:[“「\"]?(?:好|走吧|行|知道了|那就一起|不行|回去吧|出发)[。！…]?[”」\"]?|车轮终于转动(?:起来)?|终于上路|众人(?:点头|散去|离开|睡下)|他(?:点了点头|转身离开|背起包袱))[。！…]?$
