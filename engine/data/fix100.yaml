# 自写补充；planning/review按阶段使用，B默认正文只附writer_budget。
planning: |
  每章只排两场戏，只推进主线及最多一条辅线，其余线延期到后章，不挤入同章；保留既有线编号与未到期要求。
  每卷至少一半章节以逃、追、救、打、骗、抢等具体行动为核心冲突；滚动五章裁决类场景合计最多一场，未获meeting_allowed时不得出现裁决/核验/签认场景。先人物行动、选择与后果，不用判词、签认或新术语代替冲突。
  续写时只规划已完成章之后的未写部分，不撤销已写结局、胜利或已回收主线；续写取自既有机制和关系后果。不凭空治手、补寿或恢复改判能力，沿用当前封禁、左右肢体限制与余额。
review: |
  跨章核对至少十字的同句台词及人物卡口头禅：滚动十章同句最多一次；每人每种标志性台词十章最多一次，只归原人物，不得转给别人。正常短对白不计，必要引述须辨清归属，不当作本人惯用语。
  按修后章末实际悬念语义归类，沿用既有hook_types；含本章的近十章内，同型实际末钩最多两章，clue保留更严配额，换标签不重置。“另一个我／再次苏醒”语义家族全史达到三章后，新增章节禁止再用双身、复醒同型末钩；正常睡醒或昏迷苏醒不算。
  每章首次新术语最多一个，用一句白话解释，旧术语、人物地名与常用词不算。相邻重复行仅删冗余一行，保留独立信息。
  只改确有问题的命中句；新发现错误先给原句编号与原因，再局部修改。未命中字符、自然段、引语边界与因果不动，不把场面压成梗概；保留现有状态及宽松降级契约。
writer_budget: '只写章纲中的两场戏，约2000–2400汉字。'
