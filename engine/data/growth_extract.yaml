schema:
  type: null
  hook_type: null
  payoff:
    type: 无兑现
    fulfilled: false
    pid: null
  opens_new_mainline: false
  ending_reason: ''
  body: ''
  scene: null
  rename: {}
  edits: []
  patch: null
  summary: ''
  scene_types: []
  demotion_event: null
  gains: []
  costs: []
  solutions: []
  injuries: []
  realm_displayed: false
  realm_display_pid: null
  events: []
  advances: []
  previous_delta: {}
  state: {}
items:
  gain:
    type: 收获
    content: 实得内容
    pid: 1
  solution:
    type: 菜单主类
    content: 决定性破局因果
    pid: 1
    primary: true
  injury:
    type: 身体代价
    content: 一项新代价
    pid: 1
  patch:
    after: 1
    text: 一段正文
    replace: false
  edit:
    id: 1
    text: 一原句
    reason: 候选命中
  paragraph_edit:
    paragraph: 1
    text: 对应P段替换内容
injury_pattern: 受伤|新伤|负伤|骨折|失明|断臂|流血|血痕|划伤|划破|灼伤|撕裂|寿命|失觉|旧伤|伤口|喷出血|皮肤.{0,6}裂
length_first: '当前{actual}汉字，本章目标{target}，范围{low}—{high}汉字。偏短仅在章纲已有的人物决定或行动后果确实被跳过时补那一处；偏长只压缩一处重复叙述。若只修改一个连续片段即可达到范围，body返回修订后全文，其余上下文逐字保留。否则body留空，按原文提取状态，不因字数增加描景或比喻。不添加分场标记。

