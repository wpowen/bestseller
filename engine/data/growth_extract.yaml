  这是改动后的最终事实提取，不再修订或恢复旧章，不输出body/scene/rename/edits/patch。'
schema:
  type: null
  hook_type: null
  payoff:
    type: 无兑现
    fulfilled: false
    pid: null
  opens_new_mainline: false
  ending_reason: ''
  body: ''
  scene: null
  rename: {}
  edits: []
  patch: null
  summary: ''
  scene_types: []
  demotion_event: null
  gains: []
  costs: []
  solutions: []
  injuries: []
  realm_displayed: false
  realm_display_pid: null
  events: []
  advances: []
  previous_delta: {}
  state: {}
items:
  gain:
    type: 收获
    content: 实得内容
    pid: 1
  solution:
    type: 菜单主类
    content: 决定性破局因果
    pid: 1
    primary: true
  injury:
    type: 身体代价
    content: 一项新代价
    pid: 1
  patch:
    after: 1
    text: 一段正文
    replace: false
  edit:
    id: 1
    text: 一原句
    reason: 候选命中
  paragraph_edit:
    paragraph: 1
    text: 对应P段替换内容
injury_pattern: 受伤|新伤|负伤|骨折|失明|断臂|流血|血痕|划伤|划破|灼伤|撕裂|寿命|失觉|旧伤|伤口|喷出血|皮肤.{0,6}裂
length_first: '程序已确认当前正文不在字数带内，本次必须返回body完整修订稿，不能body为空、只改一两句或只给状态。先完成body再列其他字段。若超2700则整章净压到2000–2300汉字，两场各约1000字；不足下限则只扩写原场景至2200。完整保留人物选择、情节点和现场对白，不增加新剧情。不得把已知原文称为合格而跳过压缩。

  '
