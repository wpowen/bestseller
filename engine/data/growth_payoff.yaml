solution_review_required:
  共同见证: 须按主破局quote判断是作证表态还是实际共同行动
  拆册: 须按作用因果复核不设口头alias
  拆册共管: 重新分配既有资源归资源重配，拆分控制连接归断链脱控，缺证保留未审
  分印共管: 按控制或分配的实际因果归类，不直接当群体表态
growth_interfaces:
  growth_obligation: display_before_upgrade为true时即使排了升级也须先展示level当前阶，required_action说明先后，不假报已展示
  injuries: 带content和正文quote的新身体伤残或代价列表，costs中身体代价或physical=true也计入，injuries_count统计所有正文事实，injuries仅保留一项主新增，injury_facts保留全部；Main将计数写row
  final_volume_start: choose_contract可传末卷起章，reduce_growth从canon读取；state提供全书解法账本；group_history_unknown为保守占额的待正文核条数
  primary: solutions可标primary=true，历史缺标按因果描述优先否则首条待正文复核
solution_usage: 旧集体认同未审proxy保守占group预算并报告unknown数，不追溯全改口头；群体表态须由Main按明确正文候选的主quote分类。仅选择本题材及既有世界机制适用的候选，不强行执行全题材通用首项；旧标签含义有歧义时按正文机理重归类，不以改名重置近三十章历史。
payoff_criteria:
  升级: 只由当前阶跨到下一合法阶，原文明确新阶名及当场能力效果；感到变强、夺到灵力不自动算境界升级。
  打脸: 主角以自己的行动当场推翻对手的挑衅或判断，对手实际败退或失去所争目标，不能仅靠口头申辩。
  收获: 主角实际取得、能留用或当场使用的资源/战利品；仅找到下章线索、拿到待核材料不算。
  身份抬升: 主角赢得明确新资格或地位，待遇/行动权限当场实变；众人喊话不算正式获得。
  碾压: 以既有合法能力正面压制并赢下冲突，不依赖新伤、临时规则或勉强逃脱。
