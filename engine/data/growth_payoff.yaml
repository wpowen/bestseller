solution_mechanisms:
  断源制停: 切断持续输入的能量或补给，使对方无法维持行动。
  耗竭制胜: 不切外部输入，以防守或拖延耗尽对方已有的有限储备或有效时限。
  脱域避险: 将人或危险载体移出已知生效的时空范围，不靠正面击败对手。
  触发反用: 利用已确立的条件、顺序或对象限制，让既有规则不触发或反向生效。
  弱点克制: 使用已知相克属性或生理短板，以针对性克制压低对方效能。
  通路重构: 改变地形连通关系，建立新通路或毁掉必经路。
  实力压制: 以实际技能或战力正面胜过对手，包括缴械、制服和硬碰硬突破。
  夺取控制: 取得已有控制节点的操作权，使系统转由己方操控。
  信息欺骗: 制造错误认知诱使对方选错对象、位置或行动；诱饵、分追、引敌换地、伪装、掉包均属此类。
  隐蔽绕行: 不主动制造假信号，利用观察盲区或未封路线避开对方发现。
  追踪定位: 沿真实物理痕迹或交接路径定位原本隐藏的人、物或源头。
  实验复现: 通过可重复的实地试验排除错误机制，实际验证破局条件。
  物证鉴别: 用材料、痕迹或成像差异辨真伪、同源及替换，不靠供述认定。
  时序还原: 利用时间基准或事件先后约束，排除不可能成立的事件顺序。
  证词排伪: 交叉比对陈述的互斥细节，揭出谎言并解除错误指控。
  公开解胁: 主动公开被隐瞒的信息，消除勒索赖以成立的信息差。
  利益分化: 利用敌方成员目标冲突，使其合作或服从关系瓦解。
  对价交换: 交付对方认可的实际对价，换回所需资源、释放或合作。
  外援协同: 引入互补能力或重新分工，完成单人无法同时完成的任务。
  替代依赖: 找到可实际使用的替代来源，使原有独家供应或唯一手段失去钳制力。
  弃权止损: 主动放弃奖励、资格或依附，令以该利益为钩的操纵失效。
  主体归位: 让原权利人亲自决定或取回其物，切断他人冒领、代办所得的控制。
  隔离封存: 以边界或容器阻断接触传播，使危险无法继续扩散。
  反馈抑制: 抑制已有自激反馈，令循环放大的失控过程稳定，不等于直接断开输入。
  断链脱控: 移除识别标记或信息连接，令定位、遥控或附着失去联系。
  修复故障: 修正已有设施或流程的损坏环节，恢复原本正常功能。
  资源重配: 不新增或交易资源，重排已有资源的用途与先后，使关键需求得到满足。
  履约修复: 用已履行的承诺、赔偿或补救重建信任，使原来的合作障碍消失。
  逆向归因: 从异常结果反推必要成因及受益者，确定因果源头而非单纯沿踪追人。
  群体表态: 以口头或书面共同表态、齐声喊名、众人作证的表达行为直接破局；全书最多两次，末卷最多一次。实际共同行动须按作用因果归类，不因参与者多就计入。
  集体认同: 旧历史未审proxy，保留旧标签与事实；明确content含齐声、作证、共同拒绝可归群体表态，其余独立保留但保守占group预算；group_history_unknown统计待正文核的主记录条数，不宣称确为口头，不作新章候选。
solution_examples:
  断源制停:
  - 截断攻城器械的补给，使其不能继续发射。
  耗竭制胜:
  - 守住掩体直到对方有限弹药用尽。
  脱域避险:
  - 趁已知退潮窗口带人离开受限区域。
  - 把附着危险的物件送出人群所在的作用域。
  触发反用:
  - 按已有触发顺序先解除前置条件，使陷阱不能启动。
  弱点克制:
  - 使用前文已知能克制对手能力的材料挡住攻击。
  通路重构:
  - 搭桥越过断口撤人。
  - 拆掉追兵必经的栈桥截断路线。
  实力压制:
  - 在正面对决中夺下对方兵器并制服对手。
  夺取控制:
  - 夺下已有闸门的控制柄，打开困人的出口。
  信息欺骗:
  - 用假目标分走追兵。
  - 引敌换地后伏击。
  - 换装混入或事前掉包，使敌人认错对象。
  隐蔽绕行:
  - 沿未被监视的侧道穿过封锁，不放假消息诱导守卫。
  追踪定位:
  - 沿沾泥足迹追到藏人的仓房。
  实验复现:
  - 重做现场操作，验证原先认定的不可能通路实际可用。
  物证鉴别:
  - 比对材料纹理，认出被替换的关键物件。
  时序还原:
  - 校正两只时钟的差值，推翻伪造的不在场时间。
  证词排伪:
  - 让两名证人分别陈述，找出不能同时成立的细节。
  公开解胁:
  - 主动公开自己的旧事，使威胁曝光的勒索失效。
  利益分化:
  - 使同盟成员发现首领将牺牲自己，导致其撤回支持。
  对价交换:
  - 以自己可支配的货物换回被扣住的同行者。
  外援协同:
  - 一人稳住险桥，另一人利用其专业技能把被困者带出。
  替代依赖:
  - 启用已找到的备用水源，摆脱独占水井者的控制。
  弃权止损:
  - 主动放弃附带控制条件的奖励，停止被对方牵制。
  主体归位:
  - 把被冒领的遗物交还当事人，由其本人终止代领授权。
  隔离封存:
  - 封住会传播污染的破口，阻止伤害进入居住区。
  反馈抑制:
  - 开启已有泄压通道，使越积越高的压力回路恢复稳定。
  断链脱控:
  - 移除已经确认的追踪标记，摆脱对方持续定位。
  修复故障:
  - 换回损坏的传动零件，让停住的升降台恢复运行。
  资源重配:
  - 把闲置照明用的储备转给正在断电的救援设备。
  履约修复:
  - 兑现先前答应的补救，令受损伙伴重新愿意合作。
  逆向归因:
  - 由受损结果所需的特定条件，反推唯一有能力造成它的人。
  群体表态:
  - 众人齐声喊出真名解除冒名控制。
  - 众人各自陈述拒绝使强制代签失效。
  集体认同:
  - 旧历史标签待主破局quote复核，不将共同行动改写为口头表态。
