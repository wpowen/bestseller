scheduling:
  upgrade_gap: [4, 8]
  setup_lead_chapters: 1
  seed_source: canon.seed
  policy: 逐书可复现升级日历；前章蓄势；其余爽点在连续与十章覆盖约束下逐章随机，不按最少计数固定轮换。
payoff_policy:
  window_chapters: 10
  max_per_type: null
  max_due_per_window: 10
  due_spacing_chapters: 1
  max_consecutive_per_type: 2
  min_types_per_window: 3
  suspense_due_spacing_chapters: 2
  fulfillment_denominator: due_chapters
  target_fulfillment_rate: 0.95
  solution_window_chapters: 30
  solution_max_per_type: 2
  solution_no_repeat_chapters: 5
  group_solution_book_max: 2
  group_solution_final_volume_max: 1
  realm_display_after_upgrade_chapters: 3
  realm_display_before_next_upgrade: true
  new_physical_cost_max: 1
  notes:
  - 爽文每章due且主类有值，同类连续最多两章、任意十章至少三类；reserved与actual各自规范归主类，不按子类规避；悬疑保留原频率；due仅供程序比较契约，95%仅按due章计算。
  - 未兑现债务保留原类型并优先排下一章；排期冲突交调用方处理，不伪报已兑现。
  - 实力与地位按列表顺序；实力最多升一级，跳级拒绝并保留旧级；下降须本章demotion_event原句确证；升级后三章内展示能力，realm_displayed=true且realm_display_quote命中正文才认可。
  - 题材阶梯开书写入canon，此后不临时增级改名；非超能题材实力指实际解决问题能力，不等于身体伤残或恋爱身份。
  - 解法按正文消除障碍的因果机理归类，同义必须并入同类，不按子动作、对象或措辞拆类别；每章仅一主类别，30章同类最多两次且5章不重复；旧多类别保留solution_history及primary_basis待复核，不改历史正文；未破局为[]，菜单首项不是默认选择。
  - 爽文每卷至少两项实得增益且仪表盘至少一项上升；代价条目超过收获条目一点五倍仅报警，不改旧事实。
