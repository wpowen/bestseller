name_rules:
  - 按书记录已用全名、名字部分及人物别称；同一批书主要人物的全名和名字部分均不复用，换姓不算去重。
  - 从当前批次人物卡与既有圣经读取避让项，再组合姓与双字名；本池不是已分配人物，也不回改旧人物姓名。

# 键全部沿用 q1_schemas.yaml 或 borrowed_style.yaml 中的 hook_types。
# 仅在章末实际悬念范围 search；正文中途出现不计末钩，命中须语义复核。
hook_patterns:
  人物当场隐瞒: '(?:没有说出口|把话咽了回去|隐瞒了[^。！？\n]{1,16}|瞒着[^。！？\n]{1,12}|不敢让[^。！？\n]{1,12}知道)'
  证词矛盾: '(?:两人|两份|双方)[^。！？\n]{0,16}(?:说法|证词|口供)[^。！？\n]{0,12}(?:矛盾|对不上|相反)|(?:说法|证词|口供)[^。！？\n]{0,16}(?:不一致|对不上|矛盾)'
  错误判断后果: '(?:认错|看错|猜错|误判|中计)[^。！？\n]{0,24}(?:害了|错过|失去|来不及|代价|被困)|(?:代价|后果)[^。！？\n]{0,16}(?:判断错|选错|认错)'
  关系破裂: '(?:从此|以后|再也)[^。！？\n]{0,12}(?:不是朋友|不信你|别来找我)|(?:反目|决裂|割袍断义|背叛了|拔刀相向)'
  新势力登场: '(?:从未见过|陌生|另一方)[^。！？\n]{0,16}(?:旗号|徽记|势力|来客)|(?:一队|一群)[^。！？\n]{0,12}(?:闯入|围住|现身)'
  反转揭示: '(?:原来|竟然|竟是|居然)[^。！？\n]{0,24}(?:凶手|主使|假的|还活着|早已死|一直是)|(?:真相|身份)[^。！？\n]{0,12}(?:揭开|翻转|暴露)'
  眼前危险逼近: '(?:刀锋|枪口|利爪|杀意|脚步声)[^。！？\n]{0,16}(?:逼近|抵住|身后|门外)|(?:退路被封|已无退路|包围了|追兵到了)'
  关键行动悬停: '(?:正要|即将|刚要)[^。！？\n]{0,20}(?:扣下|推开|揭开|说出|落下)|(?:手指|刀尖|脚步)[^。！？\n]{0,12}(?:停在|悬在|僵住)'
  截止时刻将到: '(?:只剩|还剩|最后)[^。！？\n]{0,8}(?:秒|分钟|一刻钟|一炷香|一息)|(?:天亮之前|午夜之前|钟响之前)[^。！？\n]{0,16}(?:必须|否则|来不及)'
  熟人身份改观: '(?:熟悉的|一模一样的)[^。！？\n]{0,12}(?:脸|声音|身影)|(?:另一个|第二个)(?:自己|我)|(?:他|她|那人)[^。！？\n]{0,8}(?:不是本人|竟是旧友)'
  clue: '(?:发现|露出|留下|浮现)[^。！？\n]{0,16}(?:线索|血字|脚印|指纹|字迹|暗号)|(?:线索|脚印|指纹|暗号)[^。！？\n]{0,12}(?:指向|通往|不属于)'
hook_limits:
  window_chapters: 10
  max_per_type: 2
  count_unit: chapter
  notes:
    - 使用连续十章滑动窗口；同章同类型多处命中只计一次，换措辞不重置配额。
    - regex 未命中不等于无末钩；结合既有 hook_type 与结尾语义归类。多类型确实并存时分别计数，不择低频标签逃配额。
    - clue 同时保留既有五章至多一次的更严限制；本文件不撤销该限制。
hook_families:
  double_or_reawakening:
    max_per_book: 3
    count_unit: chapter
    regex:
      - '(?:另一个|第二个|第三个)(?:我|自己)|(?:与我|和我|与他|和他|与她|和她)(?:长得)?一模一样[^。！？\n]{0,12}(?:人|脸|身体)'
      - '(?:又|再次|重新)(?:一次)?(?:醒了|醒来|苏醒)|(?:死过|死后|已死|尸体|尸身|遗体)[^。！？\n]{0,16}(?:坐起|睁开[^。！？\n]{0,4}眼|醒来|醒了|苏醒)'
      - '(?:下一具|另一具|第二具|第一具)(?:身体|躯体|尸体)[^。！？\n]{0,16}(?:醒|坐起|睁眼|睁开)|(?:这一次|下一个)(?:却|才)?轮到(?:我|他|她)'
    semantic_rules:
      - 合并计数双身、替代自我、不同躯体接力苏醒、死而复醒、重复死亡后重启这类末钩；同章重叠命中只占一次全书额度，同时计入原末钩类型额度。
      - 又醒了仅为候选；普通一夜睡醒、午睡、被叫醒、正常昏迷苏醒及其转述，不因一次或再次醒来就计入本家族，更不据此判新主线。
      - 他人说这次轮到我承担既有任务、镜中正常倒影、假设或否定的另一个我，均须排除；确实揭示独立自我或死亡循环才计数。

# 只作世界机制、能力、特殊物件的显式候选；不用泛化汉字串抓全篇名词。
term_suffixes: [剑意, 权环, 魂录, 命印, 血契, 灵核, 封能锁, 判定层, 存续印]
term_patterns:
  - '[“「『](?P<term>[\u4e00-\u9fff]{0,6}(?:剑意|权环|魂录|命印|血契|灵核|封能锁|判定层|存续印))[”」』]'
  - '(?:称为|叫作|名为|所谓的?)[“「『]?(?P<term>[\u4e00-\u9fff]{0,6}(?:剑意|权环|魂录|命印|血契|灵核|封能锁|判定层|存续印))(?=[”」』，,。！？：:\s]|$)'
  - '[“「『](?P<term>[\u4e00-\u9fff]{2,8})[”」』](?:指的是|就是指|是指|的作用是|意味着)'
  - '(?:称为|叫作|名为)[“「『](?P<term>[\u4e00-\u9fff]{2,8})[”」』]'
term_exclusions:
  exact: [核心, 规则, 判定, 顺序, 见证, 存续, 总灯, 名字, 身体, 代价, 寿命, 余额, 能力, 意志, 力量, 关系, 线索, 真相, 世界, 时间, 地点, 朋友, 母亲, 父亲, 互助会, 早上, 晚上, 今天, 明天]
  entity_sources: [characters.name, characters.address, world.stages, world.factions]
  regex:
    - '(?:先生|女士|姑娘|公子|师傅|大人|叔|婶|哥|姐)$'
    - '(?:城|村|镇|街|巷|路|桥|河|湖|山|谷|峰|楼|公寓|夜市|禁地|遗宫|祭台|洗衣房|停尸间|殡葬行)$'
  notes:
    - 人物全名、别名、称呼及其名字部分优先排除；实体来源须拆出实际名称，不将整个舞台描述当作唯一名称。
    - 地名、机构名及日常词不因引号或后缀自动成为术语；有特殊机制的常见词须由已有术语表或明确的设定定义确认，不能只按词面入表。
term_rules:
  max_new_per_chapter: 1
  first_use_requires_plain_definition: true
  notes:
    - 候选先去除人物地名与常见词，再按语义确认是否专门命名了世界机制、能力或特殊物件；候选命中不是新术语事实。
    - 与圣经术语表比对含义并合并同义别称，已解释的旧术语及正常常用词不重复计新增；历史不足不能假定首次出现。
    - 首次采用至多一个新术语，在其首次出现句用一句白话说清具体作用、条件或代价；不再引入陌生术语作解释，不为定义编造设定。
    - 如需解释却无已有设定支持，改回已有普通说法或报告不确定；术语表只记录实际采用正文已经确认的名称、白话定义和首次章号。

review_prompt: |
  一次调用合并连贯、精准润色、一致性与状态检查，使用编号原句、命中句、上下文及所附人物卡、state、continuity、术语表、末钩历史和末章标记。字数仅越出1870—2700才按既有规则修一次，本次不整章压缩。S编号只是原位置标记，保留原自然段；跨S连续引语是同一段对白，不要把每一句独立补成一对引号。仅在全章引号确不配对或程序标记quote_candidate时局部补修，不能按每个S补引号。
  仅改有确证问题的命中句；新发现错误须定位原句id和原因。一条edit对应一个原句，未命中字符、空白及段落边界逐字不动。保留场景、动作、对白、情绪、视角、时序、否定、条件与因果，不改成梗概。真正冗余的重复句允许text为空串删除，独立信息和因果连接不能删。
  保留quote引文边界、引号层级和说话人；引号错位、标签错绑仅凭上下文局部修复，不吞并邻句。允许正常短对白、短句、单句段及必要重复应答，不按句长判错。正文与概念文本夹入英文只改所在句，保留必要专名，不全局替换常用词。
  对照人物卡性别、称呼及typed continuity，沿用类型、键和层级：blocked为被封能力，limbs为左右肢体限制，balances为有单位的寿命、资源或代价余额。只修实际行动违反限制或余额算错的句子；假设、回忆、否定、失败尝试、别人代劳不算恢复。不得虚构解封、治愈、换手、补余额，仅有正文确证的恢复或收支才更新。保留已兑现收获与主动胜利，代价按卷递增，不逐章追加损伤，不把卷纲当事实。空blocked/limbs/balances不擦旧值；仅continuity.released数组可移除对应blocked，须正文明确解封且相关句修已采用，正常无解封不填released。
  balances仅据明确数值及单位、明确收支更新；“像被抽走/四天像被勒断”等感受不等于归零或扣掉全部。未知数值amount为null，不推算成0或负数，不无故补值。余额不足以支付正文所写代价时必须定点修扣费句和后续余额句，遵守既定代价区间，不新增充值或规则。不能把超额扣费改成“全部/剩余寿命”，随后却继续存活施法；已知余额内付出合法代价，未知则保留未知，不伪造足够余额。
  terms返回列表，最多一项，仅含实际采用正文首次确认的term与definition，无新增则[]。合并同义别称，排除人物、地名、机构、普通词与旧术语。首次在命中句用一句白话说清作用、条件或代价，definition与正文一致，不借新术语解释，不编机制；无依据时改用已有普通说法或说明不确定，历史不足不冒认首次。
  hook_type沿用q1_schemas.yaml的hook_types，不造标签；滑动十章同类型≤2，clue保留既有更严配额。双身/复醒全书合计≤3章，同章重叠只计一次并同时占类型额度；不得换措辞绕配额。超额只修末钩命中句，承接旧因果。
  double_or_reawakening返回布尔值，按实际改后章末是否以独立自我、换躯苏醒、死而复醒或死亡循环作悬念判断；排除普通睡醒、午睡、被叫醒、正常昏迷苏醒、正常倒影、假设否定及轮到我做既有任务，不凭“醒”字计数。
  全书末章先判断原结尾是否新增须后续解决的核心目标、对手或机制；若确开新主线，必须同一次调用定位整串承诺新冲突的命中句并修成回应旧冲突的动作或对白，使用已有事实，不新造事件。不能保留尸体坐起/换躯苏醒却只改末句宣称“已经闭合”，须连同引入独立意志的新行动一起收束。再按修后结尾给opens_new_mainline布尔值和reason，说明与旧冲突关系；非末章false并注明不适用。
  只返JSON：{"edits":[{"id":1,"text":"","reason":""}],"terms":[{"term":"","definition":""}],"hook_type":"","double_or_reawakening":false,"opens_new_mainline":false,"reason":"","state":{}}。
  state只返实际采用正文已发生的变动，未采用的修订保留旧值，部分采用按最终正文重算，不把建议当事实。缺字段、空对象或类型不符宽松保默认与旧值，不造事实；无问题edits=[]。不确定写reason，默认false不代表收束。
