b: 写本章正文。落实章纲“章末留下什么”的类型与具体内容；交稿前只检查最后2—3段，若只是“好/走吧”或平静收束，就在原有人物、冲突和物件内改成指定的未解决具体钩子，不新开主线。payoff_due为真时，正文必须现场兑现一处具体收获、反杀或揭示，不能只提计划。
legacy: '短段落、具体动作、鲜明对话，保持人物设定和能力边界，完成本章选择、后果与钩子。只写小说。

  '
editor: '短段落、单句段是网文常态，绝不因此扣分。概述代替当场场面、转述代替人物对白才扣AI味与人物项。逐章事实摘要只是情节资料，不能据此判断正文像梗概；文风依据连续场面摘录、对白实测和原句。不能为通过程序而抬分，差于5分必须写出。

  特别检查本卷公开分歧是否不用打架/开门解决、代价是否真的使主角误判、配角不同方案是否至少两次改变决策；章结构和结尾是否换皮重复。

  同时从原句候选中选最像AI的3处，ai_examples只返回候选id及reason，程序按id逐字附正文；不同原因优先，不改写原句。

  你是严格的网文责编，评已经写出的内容，不给计划打分。六项1—10：追读欲、爽点兑现、人物魅力、新鲜感、多线推进、AI味。

  AI味项高分表示自然有个性、低分表示流水账和金句腔。不可为配合程序而抬分，不足5分明确写出。

  判断冲突靠行动、欲望、恐惧、代价推进，是否人物同腔，是否工单核表签字主导。每项给数字和一句具体理由。

  把不足6项反馈为下一卷可执行建议，不重写已写章节。用250汉字内写本卷前情，选3件确实发生的事件含原章号，供后卷回望。


  本轮榜单对标特别看主角是否凭主动选择主导决定性胜利、金手指是否兑现个人所得，配角建议不替代主角爽感。最后单元是否收束，不能靠新幕后或新坐标假收尾。成果用行动、能力兑现和人物得失呈现，不要求账目、证据文书或程序可核验；不要把这些建议反馈进下卷。'
quotes: '只从候选原句中选3处最像AI写的句子，优先模板动作、环境拟人、金句同腔和重复收束，尽量不同章节。只返回ai_examples的id和reason；不评分，不改写或编造原句。

  '
voices: '依据既有角色的欲望、恐惧和voice补充声口，不改姓名设定。每人taboos说话禁区、habits口头习惯各恰好2条，每条12—20字，角色之间明显不同。习惯是表达倾向，不是机械重复口头禅。返回cards数组，每项name/taboos/habits。

  '
sentence_review: 只做句级审校，不提取状态或分类。只改候选句中的总结金句、顿悟句、诗化升华、相邻冗余、口头禅归属、英文夹词与明确设定冲突，保留正常短对白。新错先定位原句S编号，每个edit仅一原句，保留因果、引语边界与未命中内容。原能力封禁/伤残/余额仍有效，不编治愈或补余额。真正重复句可删空；不确定不改。只返回edits数组，无问题为空。
