events_prompt: "状态事件只记正文明确事实，按段落顺序；人物/地点/物品用固定名称。quote逐字复制所在段落的短原句。人物kind=character，name/location/action；action只用enter入场、leave离场、move转场、stay原地。跨场景到达须记enter/move，不把已写明转场误当原地；离场后未返回仍在场才是矛盾。电话/短信另一端的人物记remote=true，不表示重新入场，不改实体所在场景。物品kind=object，name/location/owner/action(move或stay)，随身物owner填人物名，无主人填空串。时间kind=time，day从故事第0天起递增，minute为当日分钟0—1439；只在明确时间锚点提取，不确定就不编造；回忆事件flashback=true，不改当前状态。预定/预计/预约的未来时间用projected=true，不推进当前时钟。伏笔kind=foreshadow，name为固定短名，status=open或closed。所有事件都有paragraph和quote，只需填所属类型必要字段，不复制无变化的旧事件。"
