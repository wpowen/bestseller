living_selection: >-
  提3个全新、生活落地的网文选题，每个独立。主角有具体职业、具体小地方和年代、眼前想要的东西、可行动解决的危机；怪事从日常长出。
  给职业/地方/年代/民俗/人物利害/抽象规则依赖各0–10分，按真实内容评分。
  抽象签名、见证、席次、契约、层级规则系统降权；不要复用旧选题。不要列意象堆气氛。
plan: >-
  为一部长篇只设计第1章，不提前收全书。返回完整characters至少3人，恰一protagonist，每人明确性别、欲望、说话方式、已登记aliases。
  若给了固定人物名单，所有全名逐字保持，不改姓、不做跨书重命名，不另编昵称。没有登记的砚哥等称呼不得出现。
  归属词如某氏剑纹必须在entity_owners明确属于谁；seat_map明确谁驾驶/副驾/后排，positions只在明确移动时改变。
  outline恰2场，场1只受阻或暂时压制，场2才能有一次最终胜利；同一对手同一冲突不能获胜领赏后重打一遍。
  scenes每项contest_id/opponent/result用结构字段，临时优势写temporary，最终胜利写final_win，同一冲突只能1次最终胜负。
  每章至多推进2条线，定好唯一的核心冲突、兑现、具体章末钩子。只第1章，不生成第2章标题或跨章正文。
  每本一张narrator_card：态度、幽默方式、地方词汇、与人物处境有关的物件、禁用通用意象；人物卡含习惯/禁区各2条。
  所有措辞示范自行写，不能引用任何作家或作品原文。物件清单是可用而非必须罗列。
golden: >-
  第1章前300汉字给主角眼前欲望和危机，前1000字发生第一次实际兑现，写对手/围观者反应。
  不提前揭尽长线，以未完行动、可见的怪事或危险收钩，不用感悟升华。
voice: >-
  叙述口吻卡与人物口吻卡决定说话方式。开头先落在人物身上：一句当下的喊、疼痛、饥寒或着急办的事。
  景物须经人物身体、处境、比较或偏见，少而有地方性，不摄像机空镜，不堆风雨霓虹灯箱。
  叙述者可有市井调侃、自嘲、偏心和不均匀的语气，遇到人物真疼时收住玩笑。
  不讲解设定；从人的选择与结果反推。地方词、方言、物件不逐项打卡，不强加粗口。
facts: >-
  独立检查事实，不评价文风。只报明确串姓/无来历昵称/性别/亲属或所属错误、同一人未移动却同时前后排、同场对同对手最终获胜两遍、跨入第二章、重复句。
  真实移动、引用他人称呼、回忆、假设不要误判；不确定不写confirmed。每项给原文pid、kind、problem、confirmed。无问题issues=[]。
  车辆属于谁不代表谁在车里；背景位置/起始所属不禁止后续明确移动和转交。异常订单界面、伪装身份、人物声称不等于客观事实。
  箱子没打开不代表物主不知道里面是什么，物主的自述不等于已开箱核实；不要据此误报。
paragraph_repair: >-
  只返回点名P段的替换正文，未点名段不动，不重写全章。保留事件、角色、信息、因果、时间、否定与物品归属。
  事实冲突按固定人物卡与章纲改。若是写景候选，把空镜、意象罗列、光影拟人、精细微动作改为人物处境中的感受和行动，不新增风景或事件。
  不新增标题、角色、英文，不用章末金句。每段约保持原长度，只改必要内容。
  既有英文残片译为自然中文，事实与引号边界不变。
dialogue_facts: >-
  逐槽比较改前改后对白是否改了事实。允许完全不同的口语句法、方言近义、脾气、反问；这些本身不是事实错误。
  仅标明确改变否定、条件、时间、数量、身份、归属、说话人意图/承诺/位置的slot。返回issues [{slot,problem,confirmed:true}]，无则[]；不确定不报。
