user_input: |
  面向番茄的规则怪谈/无限流榜单级新书期30章试写，先给12个设定与2个长钩子书名，取综合第一。
  尖锐的一句话卖点与规则反转，金手指有代价、上限，主角前3章亲自赢一局而不靠讲道理，机制可持续300章以上。
  主角有主动欲望、具体性格、口头禅和绝不做的事，靠冒险与决定改变局面，别让同伴替他做每个判断。
  悬疑恐怖靠人物行动和错误代价，真相有预埋因果，禁止临时增加一条新规则逃脱困难。
  禁止救援、维保、审计、档案、文书、核对记录主导，不再写声学救援小队。
  30章完成第一个完整怪谈故事单元，机制可延伸但只写本单元；最后10%只收不开，末3章收束主冲突并回应首卷旧事。
  最多留一个已有非主线钩子，不能以新坐标、另一套设施或真正的幕后开启新主线。写正文用极简B。
