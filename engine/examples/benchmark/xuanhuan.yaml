chapters: 30
words_per_chapter: 2200
user_input: |
  面向番茄的东方玄幻/高武榜单级新书期30章试写，先给12个设定与2个长钩子书名，取综合第一。
  要求一句话能说清尖锐卖点，金手指有明确代价与上限，第一爽点在3章内真正发生，机制能持续300章以上。
  主角强烈想要一件东西，有脾气、有怪癖，主动抢机会，主导决定性胜利与个人收获，不能每次等人教他判断。
  人物卡明确性别、称呼、主动欲望、性格标签、口头禅、绝不做的事，配角各有自己的算盘。
  禁止救援、维保、审计、档案、查账、程序核对成为题材或主要冲突，不再写失忆救援小队。
  规划可延伸300章，但这30章是完整第一故事单元；最后10%只回收，末3章兑现本单元主冲突与旧事。
  最多一个已有支线的续作钩子，不能另起真正幕后、新坐标或新主线来假装结尾。写正文用极简B。
