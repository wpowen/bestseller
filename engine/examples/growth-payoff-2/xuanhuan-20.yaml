user_input: 番茄玄幻成长爽文，新开20章独立闭合单元。主角有主动欲望、脾气与独有说话方式，靠自己选择赢取机会和实际所得；每章指定爽点当场兑现，至少三类交替。金手指代价可管理，不以不断加残疾制造紧张；境界一步一阶，晋阶后三章内正面展示新能力，旧伤不靠编治愈解决。新故事不要再围绕血誓、力量契约、账册、印章、核验程序或集体表态展开。每章两场戏、主线加至多一辅线、约2200字；结尾关闭本单元主冲突，不新开身份、年代、对手或机制谜。极简B正文，多现场对白。初始从本书阶梯第一阶开始。
