user_input: 番茄悬疑，20章独立闭合故事，新选题：暴雪封路的山中客栈，一名成年客人坠崖，旅客各自隐藏与他有关的旧事；女向导必须在雪停前从现场行动与相互矛盾的说法找出真相。围绕封闭客栈、索道站与雪地足迹设计12个不同高概念与书名，选择最强一个；不使用失踪者被集体遗忘、婚礼换席、真假自我或儿童拐卖主题，不描写露骨血腥。主要角色最多7名，名字、欲望、秘密和口吻在圣经固定，不能十章换主角；每个配角有会影响选择的个人利益，允许斗嘴和幽默。主角无超能力，固定成长阶梯表示调查能力；每次最多升一级。每章两场戏、主线加至多一条辅线、约2200字，以现场对话、人物行动、判断及其后果推进；证据来自风雪、绳结、声音、路线等场面，禁止核对工单、账册、编号签字和保存文件夹主导剧情，不能靠齐声作证破局。每章最多新增一处伤病或代价，不能反复拿全身受伤充紧张。最后两章解决坠崖事件与既有人物动机，末场当面完成选择与收束，不把主谜转交警方、转去另一个地点或新幕后人，不开续篇谜。极简B正文，人物直接说话。
