user_input: 番茄玄幻成长爽文，20章独立闭合故事，新选题：边荒武试中，一个少年能夺走敌人正在蓄起的一口势，把抢来的劲力练进自己的呼吸。围绕他主动抢回入城资格、守住自己挣来的修炼机会，设计12个不同高概念与书名，选最强一个；不得偏离夺势与武试。主角有脾气、有私心和幽默，主要角色最多7人，全部在圣经固定姓名、欲望和口吻，章纲不得临时改名。初始从固定实力阶梯第一阶起，每次升一级；升级间隔4–8章浮动，前章有卡关蓄势，新能力要正面赢一场。金手指代价有上限、可管理，旧伤复发不是新代价，不逐章加残疾，每章最多新增一处伤病或代价。冲突靠赌斗、追逐、伙伴分歧、抢机会和实际选择推进，不靠喊原则或群体表态；不写修阵、力量契约、账册核验、签章登记和工坊维护。每章只推进主线加至多一条辅线、两场戏、约2200字、现场对白自然。最后两章收清本单元人物与武试胜负，末章不开新身份、物件来源、幕后人或新任务；回到既有角色的行动与生活，不用解释段总结道理。正文采用极简B。
