user_input: 番茄悬疑/规则怪谈，新开50章独立事件。先给12个不同高概念与长钩子书名，取综合第一。主角从辨认异常成长为能独立调查和破局的人，有尖锐主动欲望、恐惧与鲜活声口，配角有不同算盘。前三章靠主动选择真正赢一次；解谜、关键事实坐实、推翻判断与反转须在当场人物行动中发生，不只是拿到下一条线索或预告。能力边界和真相因果预埋，不临时增加规则，不反复靠众人喊真名、拆册共管破局；不以档案核对、文书签认、审计或救援小队为主线。两卷都让人物取得实际进展和所得。每章两场戏、主线加至多一条辅线；最后五章只收不开，回应本单元主冲突，不另开真幕后、另一个自己或新主线。正文采用极简B。
  开局为固定能力阶梯第一阶段，成长指真实解决问题能力而非单纯身体伤残。
