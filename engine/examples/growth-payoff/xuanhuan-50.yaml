user_input: 番茄东方玄幻成长爽文，新开50章独立第一单元。先给12个不同高概念与长钩子书名，取综合第一。主角有强烈欲望、脾气和弱点，主动夺取机会、主导决定性胜利，实力真正向上成长；两卷各有属于自己的能力、资源、地位或盟友所得，五十章内至少两次境界跃升。金手指代价有上限且可管理，不逐章把主角写残，不让他总替别人忙碌而无所得。前三章兑现第一次胜利，冲突靠人物行动与选择；不写账册、审计、维保救援、签章核表或协议争论主导的故事。每章两场戏、主线加至多一条辅线。最后五章收束已有主冲突，不用新幕后或新地点假装结局。正文采用极简B。
  开局为固定阶梯第一阶，财富从零开始，但不是身份、人格或行动力归零。
