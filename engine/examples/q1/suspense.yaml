  番茄悬疑成长长篇100章，四卷各25章，所有主线收束。山城急救员宋迟在暴雨隧道事故中发现失踪妹妹留下的口哨暗号。
  他能准确重构一段声音的方向，却会被旧事故的耳鸣干扰，不能听见不存在的内容；越急着救人越可能误判。
  从洪水老街到废弃索道山村、边境客运枢纽、海岛风暴救援，阶段成长必须靠面对自身错误并付代价。
  女搜救员有独立寻找失踪队友的目标，感情从互不信任到共同选择，不代替查案；反派由执行者到获益者再到幕后动机分层。
  明暗线、隐藏真相、感情、成长和配角线交织，真相三层不得提前揭底。用现场搜索、救援、追踪、人物取舍推进，不用会议、案卷核表、回执、账册和协议戏拖延。
  第一章前300字有现实危险，第三章首次解救兑现并打开长线悬念。末章正确回望第一卷三件旧事，不靠临时新证人或新能力解局。
