user_input: |
  番茄都市异能成长100章，四卷各25章完整收束。失业跑酷教练江野能在危险来临前听见十秒回声，但使用后会失去一段熟悉旋律，过度使用会短时失衡。
  他想证明自己并非只会逞强，更怕救不了人后被当成骗子。能力不能读心、预知远期未来或凭空修复设备，上限和代价固定。
  从老街夜市抢险，到新区体育馆、跨江山城救援、沿海大型赛事，至少两次换主舞台，以真实行动改变专业能力、收入、名声和伙伴归属。
  女攀岩教练争取自己的参赛资格，有吸引、误解、竞争和共同承担的关系阶段；配角各有目标和退场选择，反派逐级升级且利益具体。
  冲突靠救援、竞技、追赶、取舍，允许幽默和脾气，禁止工单、回单、印章、账册、合同、核验或协议争论作为主戏。
  前三章让读者看到第一次能力兑现与不可逆损失，第100章以当下选择自然引用第一卷三件已发生的事。
