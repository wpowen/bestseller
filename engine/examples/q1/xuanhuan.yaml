  番茄玄幻成长长篇100章，四卷各25章，完整收束。矿镇少年顾砚与怕冷贪吃的幼兽相依为命，借兽力会永久失去一段温暖记忆。
  他嘴硬又怕被抛下，愿望是带妹妹离开矿镇；越强越可能忘记自己为什么出发。金手指上限、代价、等级开篇固定。
  从暴雪矿镇、兽谷试炼、边境猎场到王城兽潮，每卷更换主要舞台，实力、收入、地位与归属随选择改变。
  反派各有要保护的人和利益；女药师先与他争夺营救名额，再因共同代价相互吸引，保留独立目标。
  多线交织，有幽默、妒忌、脾气和软弱。胜负靠追逃、救援、战斗与冒险中的选择；禁止文书、核账、协议、证明程序主导。
  前三章完成第一次兑现并抛长线悬念，结尾自然回望第一卷三件旧事，解决主线，不新增终章谜团。
