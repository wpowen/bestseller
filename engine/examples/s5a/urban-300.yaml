user_input: 都市异能成长长篇，300章完整收束。被裁员的电梯维保工周屿，触摸故障机械能看见最后一次人为改动，但每次使用都会暂时丧失一种熟悉的感官辨识能力，代价与恢复条件开篇固定。靠技能和伙伴从旧小区维修站做起，经历同行挤压、客户信任、城市产业竞争，逐卷改变工作、收入和社会地位。能力不能读取人心或预知未来，胜利靠实际行动和早先铺垫，不能全程围绕账册、验证程序和协议争论。配角有独立目标；姓名固定。每25章一卷，卷末完成局部目标，最后30章收束主线，不新开悬案，只留最多2个续作钩子。
  每章2200汉字，两场戏；伏笔编号固定，优先回收，不无限开坑。
