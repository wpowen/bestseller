[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookengine"
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = ["PyYAML>=6", "python-docx>=1"]

[project.scripts]
bookengine = "bookengine.__main__:main"
deai = "deai.__main__:main"

[tool.setuptools.packages.find]
include = ["bookengine*", "deai*", "exporter*", "ideation*", "tools"]

[tool.setuptools.dynamic]
version = {attr = "tools.version.__version__"}

[tool.setuptools.package-data]
deai = ["data/*.yaml"]

[tool.ruff]
line-length = 120
extend-exclude = ["reports"]
