characters:
- name: 顾长风
  habits:
  - 敲左腕三下
  - 独吞苦药
  - 先看退路
  wound: 十岁那年，陆兆川以木手锁住他左腕，逼他亲手刺伤同门师兄。
  cares_for: 木元铮，怕残存意识被傀儡术彻底抹去。
  contrast: 别人以为他沉默顺从，实际早把每次受控都记在木指关节上。
- name: 苏亦衡
  habits:
  - 先记时辰
  - 折角封签
  - 追问到底
  wound: 兄长失踪那夜，她被刑律堂封在值房，连最后一声呼救也没能喊出。
  cares_for: 失踪兄长的下落，怕真相证明他死于宗门之手。
  contrast: 别人以为她冷硬无情，实际会把最后的药留给伤员。
- name: 柳以宁
  habits:
  - 铜钱敲柜
  - 边算边骂
  - 藏坏件
  wound: 师门机关图被官坊焚毁那日，她只抢回一只烧焦的木匣。
  cares_for: 尚能修复的旧傀儡，怕亲手拆出的零件再也拼不回去。
  contrast: 别人以为她只认钱，实际刀架到同伴颈边仍会护住旧物。
- name: 沈允禾
  habits:
  - 刮掉徽纹
  - 拇指压腕
  - 先报姓名
  wound: 宗室武籍被削去姓名后，他被旧部当作冒名者按在刑台上。
  cares_for: 宗室武籍上的真实姓名，怕再被权势抹成无名替死者。
  contrast: 别人以为他只顾私仇，实际会把复仇延后到救下同袍之后。
- name: 木元铮
  habits:
  - 木指扣响
  - 偏头听歌
  - 重复旧令
  wound: 被残木心炼成后，他听见旧部军歌，仍想不起自己曾叫什么。
  cares_for: 顾长风给他的名字，怕有一天连这名字也会忘记。
  contrast: 别人以为他只是无脑傀儡，实际会在旧指令前停下脚步。
- name: 陆兆川
  habits:
  - 捻断垂线
  - 坐空首席席
  - 含笑试手
  wound: 继任首席那日，他忘了上一任首席接掌木手时的全部声音。
  cares_for: 首席席位和王印，怕控制线转接后自己跪回傀儡席。
  contrast: 别人以为他掌权无惧，实际比谁都怕听见身后的牵线声。
- name: 韩冬岚
  habits:
  - 锁链试重
  - 焚碎纸角
  - 先闭门
  wound: 年轻时他替上一任首席封死禁库，回身便看见自己名字也在名录上。
  cares_for: 禁库最深的封门，怕门后留着他也是活傀儡的证据。
  contrast: 别人以为他忠于首席，实际每夜都在藏匿可能反噬自己的傀儡术。
- name: 裴初棠
  habits:
  - 校准齿轮
  - 报出人数
  - 踩碎木牌
  wound: 早年饥荒中，他卖过同袍换粮，归来却只得到一支傀儡军。
  cares_for: 藩镇军权和王朝承认，怕麾下傀儡忽然反咬控制线。
  contrast: 别人以为他算无遗策，实际从不相信活人会主动选边。
- name: 李千岳
  habits:
  - 抹去刻字
  - 核点碑位
  - 高声赐名
  wound: 少年时他曾被王朝抹去军籍，靠替国舅效命才重新有了姓名。
  cares_for: 武名碑的御用兵权，怕被抹名武卒集体归来索命。
  contrast: 别人以为他只重虚名，实际把兵权看得比人命更牢。
- name: 宇启榆
  habits:
  - 转动王印
  - 俯视众域
  - 割断旧盟
  wound: 登王座那夜，他烧掉旧盟约，却没发现自己的王印也是一枚傀儡核。
  cares_for: 诸域共尊的王印，怕所有傀儡都从掌中挣脱。
  contrast: 别人以为他不受任何约束，实际比谁都依赖那根看不见的线。
