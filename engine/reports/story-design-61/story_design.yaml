truth_reveals:
- layer: 1
  truth: 顾长风的木手并非普通法器，其中封着他被抹去的宗族血脉印记。
  chapter: 19
  overturns: 读者原以为木手只是陆兆川强加给顾长风的傀儡法器。
  anchor: 宗族脉纹
- layer: 2
  truth: 禁库最深处保存能同时改写傀儡与宗门命籍的上古无提木册。
  chapter: 20
  overturns: 读者原以为禁库只封存失踪名录与普通傀儡术。
  anchor: 无提木册
- layer: 3
  truth: 历代首席、藩镇统领与王朝国舅都只是更高层控制网中的宿主，真正终点是诸域之外的提线者。
  chapter: 47
  overturns: 读者原以为陆兆川、韩冬岚、裴初棠、李千岳和宇启榆是控制网各自的首领。
  anchor: 域外牵线
arc:
- kind: flaw_cost
  chapter: 7
  event: 顾长风隐瞒断线计划独自进入演武台下层，木元铮误把追兵的命令当作顾长风旧令，替其挡下三道傀儡鞭并失去右臂。
- kind: fear_faced
  chapter: 48
  event: 宇启榆重启顾长风旧控制线，顾长风没有斩线逃走，而是主动握住牵线处，让众人把转接权限分散到共尊台，再亲手劈开自己腕上的主线。
- kind: growth_end
  chapter: 49
  event: 顾长风夺下宇启榆的王印，斩断诸域提线枢纽，并让人类与傀儡共同选择是否加入反控傀儡军。
relationships:
- people:
  - 顾长风
  - 苏亦衡
  steps:
  - stage: 1
    event: 顾长风藏起受控的左手替苏亦衡挡下傀儡鞭，苏亦衡割断鞭梢并拉他退出演武场。
    before: 苏亦衡只把顾长风视作需要查证的受控弟子。
    after: 苏亦衡开始拿他挡刀的动作冒险救人。
  - stage: 2
    event: 禁库外廊起火，苏亦衡与顾长风分头引走追兵，在封门前并肩挡住失控傀儡。
    before: 苏亦衡仍想靠规训和证据约束顾长风。
    after: 她开始把关键后背交给顾长风。
  - stage: 3
    event: 断粮渡口塌桥时，两人背靠背守住木桥，亲手打退围上来的傀儡兵。
    before: 两人遇险仍各自承担，不愿让同伴涉险。
    after: 两人约定受伤必须出声，不再以沉默证明可靠。
  - stage: 4
    event: 苏亦衡拒绝替李千岳指认顾长风，带他闯出封锁城道并亲自挡下武名碑射出的傀儡箭。
    before: 苏亦衡担心证词救不了被控制的人。
    after: 她愿意先护住活人，再用亲手取得的证据追责。
  - stage: 5
    event: 共尊台上，顾长风把最后一道主线的转接权交给她，由苏亦衡亲手握住王印与他共同斩线。
    before: 顾长风仍习惯独自承受反控痛楚。
    after: 两人约定任何重大选择都必须共同承担。
- people:
  - 顾长风
  - 柳以宁
  steps:
  - stage: 1
    event: 柳以宁从火堆里抢回顾长风的原木手，顾长风没有丢下她，而是背着她冲出官坊追兵。
    before: 顾长风只把柳以宁当作提供机关的匠人。
    after: 他开始把无法交给旁人的修复工作交给她。
  - stage: 2
    event: 柳以宁拆开旧傀儡外壳找回机关图，顾长风挡住守卫并带她从木元铮引出的暗道离开。
    before: 柳以宁只愿以价钱交换风险。
    after: 她愿意为顾长风和木元铮免费拆开最珍贵的旧件。
  - stage: 3
    event: 断粮渡口被围时，柳以宁拼出承重木桥，顾长风守在桥口等她撤完最后一批伤员。
    before: 顾长风习惯先护住最核心的机关。
    after: 他开始把匠人和匠物都纳入必须带走的同伴。
  - stage: 4
    event: 武名碑机关启动后，柳以宁钻进碑腹拆掉卡死的阵盘，顾长风留下替她挡住落石。
    before: 柳以宁舍不得毁掉祖传机关。
    after: 她第一次主动砸碎旧机关换取同伴生路。
  - stage: 5
    event: 顾长风把建立反控傀儡军所需的阵盘交给柳以宁，并当众同意由她决定匠人铺的去留。
    before: 顾长风把重建视作自己一个人的责任。
    after: 他愿意让柳以宁主持新傀儡军的制造。
- people:
  - 顾长风
  - 沈允禾
  steps:
  - stage: 1
    event: 沈允禾在演武场外打退追捕顾长风的执事，顾长风带他避开首席耳目离开。
    before: 沈允禾只想借顾长风打听削名旧案。
    after: 他开始承认顾长风不是独自反抗的疯子。
  - stage: 2
    event: 韩冬岚放出追门傀儡，沈允禾凭失名武籍闯阵，替顾长风和柳以宁争到进入暗道的空隙。
    before: 顾长风只把沈允禾当作熟悉兵阵的帮手。
    after: 他愿意让沈允禾参与决定撤退路线。
  - stage: 3
    event: 裴初棠的傀儡阵围住边城兵营，沈允禾冲入阵中救出被编进军队的宗族弟子，顾长风守住缺口等他出来。
    before: 沈允禾会先追自己的宗室仇人。
    after: 他为了救整队俘虏放弃了亲手复仇。
  - stage: 4
    event: 宗室武场上，沈允禾以真实姓名挑战傀儡替身，顾长风斩断控制线替他挡下反噬。
    before: 顾长风仍想替沈允禾承担所有反控伤害。
    after: 沈允禾坚持与他换位，共同承受破阵代价。
  - stage: 5
    event: 共尊台断线前，沈允禾率宗室武卒守住傀儡城入口，顾长风把侧翼阵旗交给他调度。
    before: 沈允禾只愿凭武力夺回自己的姓名。
    after: 他愿意让新军共同使用宗室战阵。
- people:
  - 顾长风
  - 木元铮
  steps:
  - stage: 1
    event: 顾长风当着陆兆川的面斩断木手上的第一条控制线，木元铮扑上去替他抱住失控木手。
    before: 顾长风把木元铮当作自己才能使用的替身。
    after: 他开始记住木元铮每一次自主选择。
  - stage: 2
    event: 木元铮在禁库听见旧口令后主动辨出错误，带顾长风从守门傀儡身侧穿过暗道。
    before: 顾长风害怕他完全受控。
    after: 他愿意把脱身路线交给木元铮判断。
  - stage: 3
    event: 木元铮在军歌声中恢复一段被抹记忆，仍选择先救被编入军阵的弟子，顾长风随他冲进营帐。
    before: 顾长风仍把木元铮的记忆当成自己的责任。
    after: 他承认木元铮有权选择自己的名字和道路。
  - stage: 4
    event: 木元铮抵住武名碑发出的傀儡役令，顾长风没有命他后退，而是与他同时斩向阵眼。
    before: 木元铮把顾长风的命令当作自己唯一的方向。
    after: 他第一次在顾长风未下令时主动护住撤退队伍。
  - stage: 5
    event: 顾长风邀请木元铮决定反控傀儡军的第一道军令，木元铮以自己的名字选择共同守住断线桥。
    before: 顾长风认为自己必须永远保护木元铮。
    after: 两人以彼此的自主选择并肩作战。
