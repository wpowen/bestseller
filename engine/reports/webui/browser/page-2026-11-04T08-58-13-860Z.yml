          - generic [ref=f3e2365]: “十二份证词，写的是同一个人。” 沈允禾声音不高，却压住了满廊雨声。 服务台前挤着十二名住客，湿伞滴下的水积在脚边。十二张纸摊在台面上，姓名、房号、落款各不相同，内容却都指向她。 “我在二楼楼梯转角看见沈允禾。” “我看见她从十三号房出来，右手拿刀。” “我听见她承认自己改了名字，冒用死者身份。” 唐安澜指尖压着其中一张：“十二个人，十二份独立证词。你还要说，是巧合？” 高如筝把另一份拍在桌上：“别装了，沈小姐。大家亲眼看见的还能有错？” “我没说自己是被冤枉的。”沈允禾扫过众人，“你们当中，有人不认识我。” 高如筝一怔：“什么意思？” 沈允禾指着证词：“第一份说我在二楼；第二份说我从十三号房出来；第三份说我在后院；第四份说案发时我在一楼。目击位置可以不同，但方向、时间、随身物品，总该有一样能对上。” 唐安澜冷笑：“雨夜昏暗，看错方向也正常。” “正常。”沈允禾点头，“可十二份证词里，没有一个人写出我当晚穿什么。那不是看见，是照着同一个名字填空。” 走廊里响起低语。 沈允禾点了高如筝与唐安澜的两张纸：“高先生的证词写，唐女士将刀塞给我，转身替我掩饰；唐女士的证词却写，高先生亲眼见我行凶。两张纸互相证明，都把另一个人写成了目击者。” 高如筝脸色一变：“你胡说，我从没——” “原稿就在这里。”沈允禾按住两张纸，“我用你们证词里彼此的称谓，换一次人物名位的对调。” 话音落下，纸上的名字竟像被水浸开，无声错位。原本署在高如筝名下的证词里，“唐安澜”换成了“高如筝”；另一张则作了对调。事实没改，指向却乱了。 高如筝扑过去夺纸，唐安澜一把按住他：“别碰！你想毁掉原件？” “是你们先算计我！” 唐安澜尖声道：“你拿我三年前那份事故照片逼我闭嘴时，怎么不说自己被算计？” 走廊霎时静了。 高如筝嘴唇发抖：“那张照片……不是我想拿的。” “够了。”沈允禾冷声打断，“你们当年为保前程，已经互相撕过一次。今天又端出旧账，不觉得可笑吗？” 她答应过替两人压下旧事，如今承诺连同他们最不能见光的怨气被当众摊开。再无人相信他们会替她作证，她也不能再拿“保护你们”当筹码。 周启榆在人群外开口：“名字写错，或许只是誊抄出错。况且这些纸从哪里来？谁能证明不是沈小姐自己安排的？” “证词是谁交的？”沈允禾问。 “住客们自愿交给旅馆。” “原始证词呢？” “自然也由旅馆保管。” 沈允禾看向他的右手。袖口沾着未干的蓝黑墨迹，与证词边缘颜色相同。她没有声张，只将十二张纸依次翻过。 “第三份写于案发后两小时，笔迹与第一份相同；第五份的落款压住第六份的墨水，说明后交的压在先交的上面。十二张纸的顺序全乱了。” 高如筝怔住：“我的纸明明第一个交！” “我也是。”唐安澜盯着证词，“我的应该是第二个。” “有人在你们之后重新抄写、编号，再摆到我们面前。”沈允禾抬起眼，“指向我的不是十二个人，是一个人想让你们相信的十二个人。” 顾冬岚问：“如何证明原始内容不是后来改的？” “墨迹能改，落笔顺序改不了。”沈允禾将台灯斜过来，“纸背有书写压痕。原件若写我的名字，墨迹会渗入纤维；若是后来添上去，纤维先被刮薄，墨会浮在表面。更重要的是，写字的人惯用右手，十二份证词中却有四处向左转折。这是同一个人戴着不合适的手套写的。” 她抽出一沓纸：“原始证词不在台上。收走原件的人，就在刚才这十二个人里。” 走廊后方忽然传来三下敲击。 咚。 声音来自十三号房那面墙后，像有人用指骨缓慢敲击木板。众人齐齐回头。 周启榆笑着扶正装饰画：“老房子的水管响罢了。这里登记在册的住客，一直只有十二人。” “你确定只有十二人？”顾冬岚问。 周启榆笑意淡了一瞬：“当然。” 墙后的敲击又响了一下，这次更轻。 --- 十二名住客被顾冬岚拦在服务台外。周启榆说去取原始证词，趁众人等待，从柜台下拿走一只牛皮纸袋，转身进了后侧储物间。 沈允禾跟了进去。 储物间堆满旧账簿、备用台灯和没拆封的雨衣。门一合，外面的议论声立刻模糊。 周启榆背对她拆开纸袋：“证词若真有假，查出来对谁都没好处。” “谁收了原件？”沈允禾问。 “我。” “谁重抄的？” “我不知道。” “谁把它们排在服务台上，指认我？” 周启榆叹气：“外面雨这么大，谁有闲心做这种事？也许大家害怕，把同一个人看成了所有凶手。” 沈允禾抽出最上面一张，对着门缝透进的灯光侧过纸面，指腹缓缓擦过字迹下方。 “你说证词是住客自愿交给旅馆的。” “没错。” “那为什么要重新誊写？” 周启榆手指一顿：“谁说是重新誊写？” 沈允禾把纸翻到背面。淡蓝复写纸纹路浮出来，墨色浓淡不均，纸纤维被钢笔压出细小凹槽。她又取出一张空白纸，在相同位置写下“沈允禾”，笔画、字距、顿笔几乎分毫不差。 “原件不是这十二张。”她将纸叠在一起，“‘沈’字第一笔先重后轻，是原本就有的旧墨；‘允’字第三笔浮在纸面，是后补的。原件先写的是‘周启榆’，后来才有人用蓝黑墨盖成我的名字。” 周启榆的笑意彻底消失：“你用什么证明？” “指纹。” 沈允禾将十二张证词平铺在桌角。每张右下角都有两组指印，一组来自执笔人，一组来自按印确认的住客。 “写证词时，墨水会沾在书写者右手中指第一关节。可十二张纸上的书写者指印全是左拇指横纹，位置也一样。你拿纸袋时，墨迹留在右拇指与食指之间。你若没碰过原件，为什么每张纸都像从同一个人手里原样抽出，连指纹方向都没变？” 周启榆声音发冷：“纸袋是我拿的，不代表纸是我写的。” “但你说原始证词也由旅馆保管。”沈允禾向前一步，“谁能取走？” 周启榆没有回答。 “十二份证词同时改了我的名字，改写和重排发生在今天早晨。有人造了十二个目击者，再故意让高如筝和唐安澜发现纸上有错，逼他们公开争抢。这样一来，真假反而没人能查。” “你没有证据。” “原件就在旅馆。”沈允禾将纸推到他面前，“能重写名字，说明原件还在这里。你拿走的不是原件，是用来顶替原件的十二张誊本。” 门外传来唐安澜的声音：“顾先生，里面怎么了？” 周启榆迅速浮起苦笑：“账本被雨泡坏了，沈小姐正帮忙整理。” 沈允禾扬声道：“顾先生，进来。” 顾冬岚推门而入，目光从周启榆身上扫到桌面证词。 周启榆摊手：“旅馆丢了原始证词，沈小姐却认定我拿走了。我只负责保管住客亲手交来的纸。” “你否认见过原始证词？”沈允禾问。 “自然没见过。”周启榆答得干脆，“若早知道它们是假的，我何必把纸留在旅馆？” 沈允禾盯了他两秒，忽然收起桌上的誊本：“那就请周先生把保管登记簿拿来。上面应有每次取纸的时间、经手人和归还印。少一页，也算失职。” 顾冬岚立即道：“我去取。” 周启榆向前半步，又停住：“登记簿在经理办公室，门锁着。” “那就等雨停，请经理来开。”沈允禾站在门边，“真相查清前，谁也别离开。” 众人重新聚到走廊。她当众说明誊本上的旧墨、新墨与指纹不符，又指出十二人的称谓错位。没人再提所谓十二份独立目击。高如筝垂着头，唐安澜脸色难看，却都未再反驳。 雨声渐渐小了。有人回房，有人仍守在服务台前等经理。 顾冬岚走在最后。经过周启榆身边时，沈允禾忽然停下：“你方才说自己没碰过原始证词。” “是。” “那口袋里那张呢？” 周启榆衣摆微微一僵。 沈允禾没有当场揭穿，只看着他：“你否认得越快，就越值得查。” 她与顾冬岚离开走廊。身后的门悄无声息地合上。周启榆等脚步声彻底消失，才转身进入储物间。他从牛皮纸袋最底层抽出一张纸——那不是十二份誊本之一，墨迹尚新，右下角按着鲜红的指印。 纸上只有三个字。 沈允禾。 周启榆两指一折，将纸塞进左袖口。
