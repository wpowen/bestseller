键词。 growth_end: 从被动的嫌疑人成长为敢于指认真凶的证人。 goal: 找出自己那段证词里被替换的细节。 exit_volume: 1 attraction: '' obstacle: '' relationship_stages: [] ladder_volume: 0 gender: 男 address: 高先生 active_desire: '' personality_tags: - 急躁 - 敏感 - 嘴硬 catchphrase: 我说过的话，一个字都没改。 never_do: [] - name: 唐安澜 role: support desire: 让所有人看清周启榆如何借规矩操纵众人。 fear: 自己的旧身份被公开，成为真正的替罪者。 flaw: 过于在意体面，常延迟关键行动。 bottom_line: 不让无辜者因她的沉默受罚。 voice: 尖刻利落，善用反讽掩饰不安。 growth_end: 从自保型聪明人变成敢当众撕破伪证的行动者。 goal: 诱使周启榆在自己的证词里露出矛盾。 exit_volume: 1 attraction: '' obstacle: '' relationship_stages: [] ladder_volume: 0 gender: 女 address: 唐女士 active_desire: '' personality_tags: - 聪明 - 讽刺 - 怕丢脸 catchphrase: 别急着定罪，先看看谁在安排座位。 never_do: [] title: 《证词里，我是凶手》 premise: 暴雨封锁山村旅馆，十二名住客轮流讲述同一夜的经历。每份证词都只差一个称谓，却都恰好把沈允禾写成凶手。沈允禾发现自己能交换两份证词中的人物称谓，于是决定先把自己从证词中换出去，再让真凶在众人面前成为自己的共犯。 reader_expectation: 前三章建立十二证词、称谓交换和‘越洗越像凶手’的诡异机制；每章留下新的不可解释细节。读者期待沈允禾以行动拆穿证词循环，同时发现旅馆启榆与一桩旧案相连。 selling_points: - 每份证词只差一个称谓，却共同拼出不可能的罪责。 - 主角不靠辩解洗白，而是主动篡改证词顺序。 - 每次交换都公开两人之间最强烈的私人恩怨，阵营即时改变。 - 雨夜旅馆的封闭空间与连续追问制造持续压迫感。 - 线索、规则、动机互相咬合，真相分三层揭开。 power: cost: 每次交换都会公开两名当事人之间最强烈的私人恩怨；关系恶化、阵营分裂，交换无法还原。连续使用会让沈允禾失去他人的信任，并把自己的罪责推给无辜者。 limit: 只能交换任意两份证词中的人物称谓，不能改写事实内容；一次只能交换两份，不能凭空创造证词。每次公开恩怨都会使旁观者获得新的怀疑方向。 world: rules: - 旅馆在暴雨封山期间只开放一层客房，住客不得离开。 - 案发夜共有十二份证词，所有证词都必须由当事人亲自说出。 - 十二份证词在细节上互相吻合，但关键人物称谓存在一处可替换差异。 - 称谓交换只能改变证词指向的主体，不能改变动作、时间或现场物证。 - 每次交换都会公开两人之间最强烈的私人恩怨，且无法撤销。 - 当多数证词把同一人指向罪名时，旅馆会将其视为‘最可能的凶手’，并把该人留在核心位置。 levels: - 辨认异常 - 独立调查 - 核实线索 - 重建现场 - 识破复杂诡计 - 破解连环谜局 - 统合跨案真相 factions: - name: 旅馆住客 interest: 尽快确认凶手、打开山门并避免被集体指认。 - name: 周启榆一方 interest: 维持随机抽选的表象，让十二份证词继续把责任导向同一人。 - name: 林夏珩与旧案家属 interest: 找回失踪者的记录，揭开旅馆过去如何制造替罪者。 - name: 顾冬岚 interest: 查清证词交换的来源，在不牺牲同行者的前提下带众人逃生。 - name: 山村旧邻 interest: 保护村落名声，同时隐瞒旅馆封山和失踪住客的旧事。 stages: - volume: 1 stage: 暴雨山村旅馆 truth_layers: - layer: 1 truth: 十二份证词并非自然形成，而是由周启榆利用住客之间的旧怨预先拼合。 reveal_not_before: 2 - layer: 2 truth: 沈允禾的称谓交换能力并非诅咒，而是旅馆旧规则留下的反制入口；它会公开被隐藏的私人恩怨。 reveal_not_before: 3 - layer: 3 truth: 周启榆曾用同样的证词循环替一名旧案凶手脱罪，并把另一名无辜者留在旅馆；林夏珩的儿子正是上一轮的替罪者。 reveal_not_before: 5 main_foreshadows: - id: F1 description: 林夏珩保存的旧住客名单缺少一个人的名字，却留着沈允禾母亲使用过的称谓。 close_volume: 1 - id: F2 description: 周启榆每次说‘随机抽选’时都会先看墙上第十三枚房牌。 close_volume: 1 - id: F3 description: 高如筝证词里的雨声节拍与旅馆旧钟声完全重合。 close_volume: 1 - id: F4 description: 沈允禾交换证词时短暂看见母亲留下的划痕，像在提醒她不要相信第十三号房。 close_volume: 1 summary: 暴雨封山之夜，山村旅馆的十二名住客轮流讲述同一晚的案发经过。所有证词只差一个称谓，却都恰好证明沈允禾是凶手。她不先辩解，而是利用能交换两份证词中人物称谓的能力，把自己从嫌疑位置换出，再把责任引向真正的操纵者。每次交换都会公开两人最深的私人恩怨，令住客互相猜疑并暴露旧案。沈允禾必须在证词彻底闭合前找出周启榆的布局，同时判断顾冬岚究竟是同行者还是下一名替罪者。五章内，旅馆、十二名住客与一场雨夜旧案将被逼到同一张桌面上。 initial_dashboard: strength: 辨认异常 wealth: 3200元 status: 普通当事人 affiliation: 旅馆住客 stage: 暴雨山村旅馆 volumes: - number: 1 start: 1 end: 5 stage: 暴雨山村旅馆 goal: 让沈允禾从十二份证词共同指向的凶手位置上脱身，并逼出真正操纵证词的人。 change: 众人从互相指认转为被迫站到沈允禾一边；沈允禾从被动辨证转为主动改写证词的行动者。 cost: 第一次称谓交换公开了她与顾冬岚未解释的旧怨，旅馆内部阵营裂开；周启榆开始把她视为必须留下的核心嫌疑人。 canon: ladder: strength: - 辨认异常 - 独立调查 - 核实线索 - 重建现场 - 识破复杂诡计 - 破解连环谜局 - 统合跨案真相 wealth_unit: 元 status: - 普通当事人 - 可靠协查者 - 独立调查者 - 地方名探 - 跨区顾问 - 领域权威 genre_kind: 悬疑 payoff_menu: - 解谜 - 证据落地 - 推翻判断 - 反转 solution_menu: - 证词排伪 - 物证鉴别 - 时序还原 - 实验复现 - 逆向归因 - 信息欺骗 - 隐蔽绕行 - 追踪定位 - 利益分化 - 对价交换 - 公开解胁 - 隔离封存 - 反馈抑制 - 替代依赖 - 主体归位 - 断源制停 - 耗竭制胜 - 脱域避险 - 触发反用 - 弱点克制 - 通路重构 - 实力压制 - 夺取控制 - 外援协同 - 弃权止损 - 断链脱控 - 修复故障 - 资源重配 - 履约修复 - 群体表态 hook_types: - 人物当场隐瞒 - 证词矛盾 - 错误判断后果 - 关系破裂 - 新势力登场 - 反转揭示 - clue - 新事实推翻旧判断 - 眼前危险逼近 - 关键行动悬停 - 熟人身份改观 - 两条路各有代价 - 异常物件待解释 - 截止时刻将到 - 誓言或威吓落地 - 人物物件无故失踪 - 话中漏洞露端倪 - 旧意象发生变化 - 首尾照面生新义 - 留下未答的反应 solution_aliases: 假目标分追: 信息欺骗 引敌换地: 信息欺骗 诱敌: 信息欺骗 伪装混入: 信息欺骗 事前掉包: 信息欺骗 放出假目标分散追兵: 信息欺骗 引敌离开熟悉地形再交战: 信息欺骗 换装混入敌方队伍穿过关口: 信息欺骗 预先掉包使敌方夺到无效物: 信息欺骗 诱导敌方火力击毁自身屏障: 信息欺骗 预设伏击在敌方返程截获目标: 信息欺骗 共同表态: 群体表态 齐声喊名: 群体表态 众人齐声喊名: 群体表态 群体表态: 群体表态 齐声: 群体表态 众人作证: 群体表态 众人齐声: 群体表态 众人共同拒绝: 群体表态 共同喊名: 群体表态 集体认同: 集体认同 断开外部供能使敌方装置停机: 断源制停 截断运输补给迫使围困者撤走: 断源制停 耗尽敌方有限弹药后反攻: 耗竭制胜 坚守既有防线拖过敌方有效时限: 耗竭制胜 搭建临时桥梁撤出被困者: 通路重构 破坏承重结构阻断追击路线: 通路重构 缴械制服施害者终止攻击: 实力压制 夺取控制器解除远程威胁: 夺取控制 沿观察盲区穿过封锁: 隐蔽绕行 绕开正面守军从侧路夺取关键物: 隐蔽绕行 切断已知追踪媒介后隐蔽转移: 断链脱控 分化敌方利益使其联盟瓦解: 利益分化 交换对方急需资源换回被扣物: 对价交换 抵押自有资产换取