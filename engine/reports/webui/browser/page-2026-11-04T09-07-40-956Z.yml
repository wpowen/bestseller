        - generic [ref=f4e529]: 雨将停时，檐下只剩断断续续的水声。 沈允禾站在锁死的房门前，手里捏着一张被雨气洇软的便条。上面只有一句话：最后一份证词，在十三号房。 “又是十三号。”高如筝咬着牙，“这地方是不是专门跟人过不去？” “便条谁送来的？”唐安澜问。 “没人看见。”顾冬岚道，“餐厅的人都盯着封存单，能把它塞进门缝的，只有一直待在这层的人。” 林夏珩忽然伸手去扯门锁。她力气不大，金属锁扣却在她掌下抖得厉害。 “里面有阿岸的名字。”她低声说，“我听见了。” 沈允禾按住她的手腕：“你只听见名字，便认定那是你儿子？” “他活着的时候，别人都叫他林岸。”林夏珩抬起浑浊的眼睛，“十几年了，只有我这么叫。” 唐安澜冷笑：“也可能是有人故意拿死人做饵。” “纸拿出来，你们慢慢争。”林婆婆甩开沈允禾，从衣襟里摸出一截铁丝。她把铁丝探进锁孔，手背青筋根根绷起，“我儿子若真在这里留过话，我得看。” 铁丝刚进去，门锁便咔地一响，像有什么从里面顶住了。 “别硬撬。”沈允禾道，“旧锁和别的锁不一样。门框里有机关，锁芯转错，里面会落闸。” “说得像你很熟。”高如筝道。 “我不熟。”沈允禾看向顾冬岚，“但有人熟。” 顾冬岚沉默地取下领带，绕住门边凸起的铁栓：“我固定门，你动锁。” 沈允禾没有拒绝。她将铁丝折成更细的钩，顺着锁孔探了两下，听着里面的动静向左轻旋。林夏珩贴近门缝，替他们数着锁齿。第三下时，她低声道：“阿岸从前也这样数。他说数错一个，门就再也开不了。” 锁芯突然向内一沉。 顾冬岚手臂一紧，低声道：“现在。” 沈允禾猛地回拧。 咔哒。 门锁松开，门栓却没有弹起。顾冬岚将铁栓往上托，沈允禾同时压下锁柄。两人的手隔着一扇旧木门几乎抵在一起，谁都没有后退。 “进去以后，”沈允禾说，“谁也不许再替谁开脱。” 顾冬岚看着她：“包括你？” “包括我。” 林夏珩把铁丝攥进掌心：“我要实话。哪怕实话叫我儿子也做过坏事。” 门开了。 屋里没有灯，只有一股封存多年的霉味。墙角堆着旧被褥，桌上摊着一本受潮的住客登记簿。十二张证词压在登记簿下面，纸张颜色深浅不一，右下角却都盖着同一枚褪色的红章。 最上面另有一只牛皮纸封套，封口没有拆，旁边压着一张折成四折的旧纸。 林夏珩刚碰到那张纸，手指便剧烈地颤了一下。 “阿岸……” 沈允禾按住纸角，没有抢走，只把它慢慢展开。 纸上是一份未写完的证词。字迹被水汽晕开，仍能辨出几行： “林岸，男，二十五岁。案发那夜，我在十三号房后窗看见周启榆取走短刀。沈家女儿随后赶到，挡在我身前。林夏珩若见到此纸，不要替任何人隐瞒……” 下面还有一行： “我的血落在周启榆的袖扣上。沈家女儿手上的伤，是替我挨的。她没有拿刀。” 林夏珩低下头，肩膀轻轻发抖。她没有哭，只反复用手掌擦去纸上的水痕，仿佛擦得慢一些，那些字就会消失。 唐安澜蹲到桌边，从登记簿中抽出一张夹页。上面有半枚铜钥匙牌，刻着“林岸”；旁边是一只带暗褐色斑痕的袖扣，登记时间正是旧案发生的前一夜。 “他来过。”林夏珩喃喃道，“东西也是他的。” “所以所有东西都指向他。”高如筝看着那份证词，声音发紧，“刀、钥匙、血，全是他的。” 沈允禾却盯着十二张证词：“不只他的。” 她将纸张一张张摊开。每份证词的字迹不同，叙述的时辰、天气和看见的细节也不同，可每张末尾都出现同一个称谓——沈家女儿。有人看见她从后廊经过，有人说她拾起短刀，有人说她追着林岸去了十三号房。 十二个互不相识的人，证词却像出自同一只执笔的手。 “这不是证人说的。”沈允禾道。 “字迹不是。”唐安澜道，“事情总得有人写吧？” “写事情的人，未必知道事情。” 门外传来脚步声。 周启榆撑着伞站在门口，衣摆滴水，脸上的笑仍像往常一样妥帖：“诸位找到想要的证词了？” 沈允禾抬眼：“你知道它在这里。” “雨夜旅馆，哪件东西不是先被雨找到？”他道，“何况第十三号房向来有点古怪。” 顾冬岚将门钥匙收进口袋：“这间房今晚没有住客。” “没有住客，才适合放旧东西。” 周启榆走进来，目光从林夏珩手中的纸上一掠而过。那一瞬很短，沈允禾还是看见了。 “你认得林岸。”她说。 “不认得。” “你认得沈家。” 周启榆笑容不变：“沈家的案子传得广，附近谁不知道？” “十二份证词都把不同的人换成了沈家女儿。”沈允禾指向铺开的纸，“你不知道他们各自经历过什么，却知道该让他们共同指向谁。” 高如筝立刻问：“谁？” 沈允禾没有回答。她把登记簿转向周启榆，手指点在住宿记录上：“十二名住客失踪后，姓名全被划掉，只留姓氏和‘沈家’两个字。你的笔迹不在上面，因为不是你划的，是印上去的。封存单能换名字，证词也能。有人把所有人的家属都引向沈家，再让所有人相信，十二次指认只是雨夜规矩重复生效。” 林夏珩猛地抬头：“阿岸呢？” “他的名字没有被换掉。”沈允禾看着她，“因为一旦连你也改掉，最后这份证词就不会有人认得。周启榆留下林岸的名字，是为了让整件事更可信。可他没想到，林婆婆只听一次，就永远不会忘。” 周启榆脸上的笑淡了。 “沈小姐，你总算开始往好处想了。” “我没往好处想。”沈允禾抬起最后那份证词，“我只是在倒着查。谁从‘所有证词都指认沈家’里获利，谁就有机会改掉十二份证词。” 顾冬岚看向周启榆：“不是沈允禾获利。十二名失踪住客的家人找不到真正该恨的人，只能恨一个已经被旧案磨得够耐磨的人。而你，仍能躲在旅馆老板和‘启榆’后面，继续选人、收证词、决定谁该被指认。” “你们总喜欢把所有事想得很有用处。”周启榆道。 “那就请你解释，”沈允禾说，“林岸为什么死在十三号房？” 林夏珩身体一晃，扶住桌沿。高如筝下意识伸手，却被唐安澜拉住。 周启榆盯着她：“你怎么知道是‘死’？” 沈允禾翻过纸背。那里还有几行被折痕遮住的字： “周启榆发现我藏在后廊，拿刀刺来。挣扎时，我撞伤后脑，倒在十三号房外。替他挡下第二刀的人，是沈家女儿。” “证词到此中断，是因为我没能再写下去。”沈允禾道，“可你怕它留下，所以封进这间房；又故意把林岸的旧物放在登记簿里，等着林婆婆找到后，以为儿子才是当年持刀的人。” 林夏珩的眼泪终于落下来。她却把那张证词按在胸口，一字一句道：“我不再替他开脱，也不替自己开脱。” 周启榆向后退了一步：“你们没有证据。” “证词在你准备销毁它的房间里。”唐安澜道，“登记簿上有你的章，旧物上有林岸的血。你刚才还承认他知道林岸藏在后廊。” “你没有承认。”沈允禾提醒。 唐安澜抿了抿唇：“……反应倒是承认了。” 高如筝转向周启榆：“所以那些抽签、封存、十二个住客失踪，都是你做的？你让所有人以为雨夜会随机选中谁，其实每次都是你决定？” 周启榆没有再否认。他慢慢收起笑容，眼神冷下来：“我只是让他们看到自己想看的答案。沈家旧案已经死过人，家属还在找凶手。与其让十二个陌生人彼此猜忌，不如给他们一个共同的仇人。” “共同的仇人是我？”沈允禾问。 “是你。”周启榆看着她，“你父亲当年做过什么，你知道多少？你为什么偏偏能进十三号房？只要所有人的恨都落在沈家，就没人再查这座旅馆。” 沈允禾将证词折好，放进自己的证物袋：“现在他们查了。” 周启榆盯着她，忽然朝门外冲去。 顾冬岚早已挡住门。他肩膀撞上门板，闷响一声，旧灯从梁上晃落。顾冬岚扣住他的手臂，唐安澜拉开门闩，高如筝随即上前压住另一边。林夏珩站在桌旁，看着儿子用过的袖扣，没有再避开，也没有再替任何人说话。 “周启榆，”沈允禾站在原处，声音很冷，“旧案里拿刀的人是谁，十二份证词为何指向沈家，林夏珩的儿子为何留在十三号房，如今都由这份证词和你的话接上了。” 周启榆挣了一下，没能挣开。 沈允禾继续道：“从现在起，没人替别人认罪，也没人替别人作证。” 林夏珩擦干眼泪，将那半枚刻着“林岸”的钥匙牌攥在掌心：“我叫了阿岸一辈子，不想再叫错了人。” 灯彻底亮起时，六个人都留在十三号房内。桌上的证词摊在白炽灯下，每一处指认都清楚，再没有模糊的称谓。
