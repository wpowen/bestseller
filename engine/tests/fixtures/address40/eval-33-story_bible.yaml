title: 《每借一剑，我就失去一点自己》
premise: 修补匠沈亦衡能从残兵握痕中借出旧主一招绝技，但兵器会夺走他最像前任的一项特征。他循着姐姐唐兆川被夺走的声音闯入五域兵冢，逐渐发现姐姐并非不愿获救，而是不愿再被弟弟替她选择。最后，他以拒绝任何兵器定义的军阵打破兵祖庭，并让姐姐保有拒绝自己的权利。
reader_expectation: 前三章兑现借招反杀与声音被夺的强钩子；此后每十章更换战场和对手，呈现越阶战斗、身份错位、关系拉扯与夺回主动权的连续爽点。终局不靠解释真相取胜，而由人物选择、行动代价与军阵对攻完成收束。
selling_points:
- 借招即失特征的高概念代价
- 姐姐主动拒绝营救的价值冲突
- 五域兵冢逐层升级的地图扩张
- 残兵器旧主反噬形成独特战斗
- 恋爱双方从保护走向允许选择
- 拒绝被定义者组成自由军阵
power:
  cost: 每借一招，永久失去一项个人特征；侵蚀越深，旧主意识越强。
  limit: 同时只能借一剑一招，失去沙哑嗓音后不能再伪装宗主声线，最终被完全覆盖便不再是沈亦衡。
world:
  rules:
  - 残兵器保留前任最得意的一招与最深握痕。
  - 借招者会短暂获得旧主境界与武技。
  - 兵器夺走最接近旧主的一项特征作为代价。
  - 侵蚀越深，旧主意识越能干涉借招者。
  - 残兵器认主后拒绝原主，也排斥彻底空壳。
  - 兵祖庭可把活人意识炼成残兵宿主的补丁。
  levels:
  - 醒脉
  - 凝纹
  - 蕴魂
  - 融血
  - 铸域
  - 王境
  - 皇境
  - 圣境
  factions:
  - name: 落霞宗
    interest: 追回宗门旧剑，维持外门威名
  - name: 九霄宗
    interest: 补全失传剑招，控制论武场话语权
  - name: 边荒古军
    interest: 让战死同袍保住意识并重返战场
  - name: 大晟王庭
    interest: 收拢王境兵器与残宿主，防止兵权失控
  - name: 兵祖庭
    interest: 统一诸域残兵意志，抹除自由武修
  stages:
  - volume: 1
    stage: 残兵巷追捕与入宗
  - volume: 2
    stage: 九霄宗论武场争锋
  - volume: 3
    stage: 边荒古战场寻母
  - volume: 4
    stage: 大晟王庭兵器库
  - volume: 5
    stage: 天外兵祖庭决战
  truth_layers:
  - layer: 1
    truth: 唐兆川的声音已被兵冢夺走，留在残剑中的回响属于她本人。
    reveal_not_before: 1
  - layer: 2
    truth: 唐兆川主动进入兵冢，以自身换取沈亦衡不被兵祖庭锁定。
    reveal_not_before: 15
  - layer: 3
    truth: 兵祖庭借历任旧主维持统一，唐兆川正在拆毁其根系而非等待救援。
    reveal_not_before: 38
main_foreshadows:
- id: F1
  description: 唐兆川留下的半句剑诀总是用沈亦衡的语气续完。
  close_volume: 3
- id: F2
  description: 每柄残兵夺走的特征都对应兵祖庭缺失的一角。
  close_volume: 4
- id: F3
  description: 姬宜秋没有自己的兵痕，却能驱使所有旧主。
  close_volume: 5
- id: F4
  description: 沈亦衡失去沙哑嗓音后，唐兆川的呼吸仍能唤回旧声。
  close_volume: 5
summary: 沈亦衡是落霞宗逐出的修补匠，能从残兵握痕中借出前任一招武技，但兵器会永久夺走他最像旧主的一项特征。第一章，他借残剑旧主的落日斩斩开执法剑阵，随即失去沙哑嗓音，并用宗主旧声反令三名执法者跪下。姐姐唐兆川失踪前留下的声音，也正被兵冢一点点改写。沈亦衡因此追入九霄宗，在论武场与姜允禾、裴天骁争夺失传剑招；又循线索进入边荒古战场，发现唐兆川可能并非受害，而是主动入冢。赫连如筝以保存同袍意识为名替兵祖庭服务，却逐渐动摇了控制同袍的信念。第四阶段，沈亦衡闯入大晟王庭兵器库，与姜允禾在姐弟救赎和彼此选择之间冲突，并发现兵祖庭正借历代兵主统一诸域。最终战场转入天外兵祖庭，唐兆川拒绝被当成待救之物，独自拆解兵祖根系。沈亦衡失去旧声、旧习惯与部分情感印记，却以同伴自愿授予的武技组成自由军阵，击败姬宜秋。唐兆川夺回声音后仍选择留在边荒处理残兵魂魄，兄弟关系从强行相认转为彼此尊重。沈亦衡最终建立拒绝被任何兵器定义的军阵，力量迈入皇境，留下通往圣境的开放道路。
