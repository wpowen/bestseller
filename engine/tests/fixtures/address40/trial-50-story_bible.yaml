title: 借兽之暖
premise: 被逐出驭兽宗的矿镇少年顾冬岚，与怕冷贪吃的幼崽雪耳结契。每次借来雪耳的极寒感知、爆发身法或蛮力，他都会永久失去一段已有的温暖记忆。为救雪崩中的妹妹，他踏上五段雪原险途，也必须决定记忆与归属究竟能否由自己选择。
reader_expectation: ''
selling_points:
- 每次借兽力都永久失去一段温暖记忆
- 借来的寒感、爆发与蛮力必须用体温和雪耳心力付账
- 嘴硬少年与怕冷贪吃幼兽的互相需要
- 雪原追杀、地形反制与契兽协作
- 力量代价最终逼出自主选择
power:
  cost: 每次借力永久失去一段已有温暖记忆；所得能力维持到顾冬岚体温耗尽，事后虚弱与失忆均不可撤销。能力规则始终保留，失忆不能用于遗忘借力限制。
  limit: 同一时刻只能借用雪耳的一项能力：极寒感知、爆发身法或蛮力；总时长受顾冬岚剩余体温与雪耳心力双重限制。只能借雪耳已有能力，不能造物、复活、读心或预知，也不能凭空制造寒气、速度或力量。达到凝纹后可短暂借用第二契兽的一项能力，但必须由该兽主动回应，仍只选一项。
world:
  rules:
  - 契兽能力须经结契与信任才能借用，借用不会提升契兽本身等级
  - 顾冬岚借力时体温会快速下降，雪耳心力耗尽则无法继续
  - 暖忆是承载日常温度的真实记忆，每次借力必定抹去其中一段
  - 失忆后事实仍能被旁人告知，但与该段记忆相连的温度、情感和细节无法恢复
  - 寒感可用于追踪热源与活物，不能读取思想或判断未来
  - 爆发身法依赖短距离发力，不能长时间悬空或无视地形
  - 蛮力可破障、扛重与近身压制，不能凭空增强武器
  - 凝纹后能与第二契兽短暂接力，但雪耳与另一契兽不可同时供力
  - 不同阶段从单项借力发展为协作诱敌、限制群体救援与自主决断
  - 兽潮会循血味、铃声与寒冷迁徙，不会听从抽象号令
  levels:
  - 醒脉
  - 凝纹
  - 蕴魂
  - 融血
  - 铸域
  - 王境
  - 皇境
  - 圣境
  factions:
  - name: 驭兽宗
    interest: 垄断契兽秘法，以宗门席位和秘术换取矿镇资源与血脉样本
  - name: 黑石矿镇
    interest: 摆脱献祭子弟换庇护的做法，保住矿脉与雪道 livelihood
  - name: 霜脊猎盟
    interest: 夺回被扣押的义兽，维护边境猎人不受驭兽宗控制
  - name: 白蓬流民盟
    interest: 在王城兽潮中建立可防守的雪堡，保存药民和驯雪人
  - name: 雪原祖窟
    interest: 维系古老血脉与寒忆秩序，不许外流者携祖血自由离去
  stages:
  - volume: 1
    stage: 暴雪矿镇
  - volume: 2
    stage: 雾骨兽谷
  - volume: 3
    stage: 边境猎场
  - volume: 4
    stage: 王城兽潮
  - volume: 5
    stage: 雪原祖窟
  truth_layers:
  - layer: 1
    truth: 雪耳并非普通幼崽，而是祖窟流失的守窟兽幼体
    reveal_not_before: 10
  - layer: 2
    truth: 每次借力失去的暖忆会被祖窟秘法收集，成为维系雪原边界的力量
    reveal_not_before: 30
  - layer: 3
    truth: 顾家并非忘恩弃义的弃徒，而是主动切断自身寒脉、拒绝祖窟控制的一支
    reveal_not_before: 41
