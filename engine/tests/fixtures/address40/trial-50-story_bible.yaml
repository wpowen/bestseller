volumes:
- number: 1
  start: 1
  end: 10
  stage: 暴雪矿镇
  location: 黑石矿镇与雪崩矿洞
  antagonist: 韩晏竹
  climax: 顾冬岚借雪耳蛮力撞开埋石，护顾安澜逃出矿洞
  exit_chapter: 10
  goal: 救出顾安澜并摆脱韩晏竹的追捕
  change: 顾冬岚从被逐散修变成主动追查顾家真相的契主
  cost: 损失：顾冬岚永久失去与顾安澜围火分热饼的滋味；心理：他开始把被抛下归咎于自己不够强，并隐瞒失去记忆的难受；等级：1；升级：首次代价
  core_development:
    new_use: 顾冬岚第一次真正借力：先用雪耳的极寒感知探出埋石下的空腔与气流走向，再在撞开埋石的瞬间改借雪耳蛮力，一击推开堵死矿洞的落石，亲手把顾安澜从塌方里拽出来。
    new_cost: 借蛮力推开埋石之后，顾冬岚永久失去了与顾安澜围火分热饼的那段滋味记忆：他还记得那夜有火、有饼、有一个妹妹，却再也尝不出热饼是什么味道，且事后虚弱与这段遗忘都不可撤销。
    new_limit: 同一时刻只能借用雪耳的一项能力，极寒感知与蛮力不可同时使用；所得能力维持到他体温耗尽为止，只能借雪耳已有的能力，不能凭空造出力气或寒气。
- number: 2
  start: 11
  end: 20
  stage: 雾骨兽谷
  location: 雾骨兽谷
  antagonist: 敖杉予
  climax: 顾冬岚借雪耳身法冲出骨阵，与陆岳霖合力夺回霜脊
  exit_chapter: 20
  goal: 穿过兽谷救出被扣押的霜脊并查清雪耳血脉
  change: 顾冬岚学会让契兽主动选择配合，不再把雪耳当工具
  cost: 损失：顾冬岚永久失去与沈夏珩共扛雪崩伤员的记忆；心理：他开始怀疑自己的判断会伤害伙伴，急于独自决定；等级：2；升级：他开始把被抛下归咎于自己不够强，并隐瞒失去记忆的难受→他开始怀疑自己的判断会伤害伙伴，急于独自决定
  core_development:
    new_use: 顾冬岚不再把雪耳当工具使唤，而是先问它愿不愿意、选哪一项：雪耳主动咬住他袖口给出回应后，他才在骨阵里借身法冲出缺口，又在凝纹之后短暂借来第二契兽的一项能力配合陆岳霖夺回霜脊。
    new_cost: 为在骨阵中连续借力突围，他永久失去了与沈夏珩共扛雪崩伤员的记忆；那场雪崩里两人抬过谁、说过什么，他再也想不起，只余下肩上的旧伤在提醒他曾被人一起扛过。
    new_limit: 凝纹后虽可短暂借用第二契兽的一项能力，但必须由该契兽主动回应，且回应后仍只能选一项、不能叠加；一旦雪耳心力或他剩余体温见底，能力立即断开，虚弱与失忆不可回退。
- number: 3
  start: 21
  end: 30
  stage: 边境猎场
  location: 边境猎场
  antagonist: 赫欣妍
  climax: 顾冬岚以寒感识破弃兽诱饵，协作诱敌反杀猎首
  exit_chapter: 30
  goal: 夺回被猎场扣押的契兽并救出霜脊
  change: 顾冬岚掌握协作诱敌，也首次发现顾家画像暗藏母亲线索
  cost: 损失：顾冬岚永久失去母亲替兄妹唱安眠曲的完整回忆；心理：他不再确信归家必然温暖，转而用寻找真相保护家人；等级：3；升级：他开始怀疑自己的判断会伤害伙伴，急于独自决定→他不再确信归家必然温暖，转而用寻找真相保护家人
  core_development:
    new_use: 顾冬岚把借来的极寒感知用于识破猎场弃兽诱饵里的假血腥气，再让雪耳与霜脊分头牵引猎首退路，自己居中反杀；同时他在猎场旧壁上第一次看出顾家画像里藏着母亲的线索。
    new_cost: 为换取寒感识破与连续引敌的时长，他永久失去了母亲替兄妹唱安眠曲的完整回忆，只记得那旋律存在过，却再也哼不出一个完整的调子。
    new_limit: 借力总时长受他剩余体温与雪耳心力双重限制，牵制猎首时他必须主动放弃一段感知时间去换爆发；他仍不能读心、预知或造物，一旦体温耗尽，能力当场失效并留下不可撤销的虚弱。
- number: 4
  start: 31
  end: 40
  stage: 王城兽潮
  location: 王城与外雪堡
  antagonist: 裴洛翡
  climax: 顾冬岚借两契兽轮流引开兽潮，带流民越过王城雪门
  exit_chapter: 40
  goal: 守住药民通道并阻止裴洛翡驱赶流民送兽
  change: 顾冬岚由个人救援者变成承担群体责任的领队
  cost: 损失：顾冬岚永久失去对黑石矿镇必然接纳自己的情感确信；心理：他不再把归属当作外部给予，开始主动选择与谁同行；等级：4；升级：他不再确信归家必然温暖，转而用寻找真相保护家人→他不再把归属当作外部给予，开始主动选择与谁同行
  core_development:
    new_use: 顾冬岚学会让两契兽轮流上场引开兽潮：借雪耳的爆发身法拉开兽群阵线，再借霜脊的蛮力撞开王城雪门侧门，带流民越过雪门并守住药民通道。
    new_cost: 连续引兽与开门之后，他永久失去了对黑石矿镇必然接纳自己的情感确信：那个总该收留他的念头没有了，他第一次知道留下要靠自己开口、靠自己被选。
    new_limit: 即便凝纹已开，两契兽的回应仍有先后之分——他一次只能借一项，另一契兽必须先主动回应才轮得到，且不能同时兼顾两条引兽线；一旦雪耳心力或他体温见底，整条引兽线立刻失控。
- number: 5
  start: 41
  end: 50
  stage: 雪原祖窟
  location: 雪原祖窟
  antagonist: 缄煦阳
  climax: 顾冬岚拒绝被迫借力，以自己的选择护伙伴穿过祖窟
  exit_chapter: 50
  goal: 找到顾母药记、带雪耳自由离开祖窟
  change: 顾冬岚确认归属由主动选择与共同经历决定，故事收束
  cost: 损失：顾冬岚永久失去被逐时仍相信宗门会接回自己的最后确信；心理：他不再以被接纳证明价值，转而承担选择造成的失去；等级：5；升级：他不再把归属当作外部给予，开始主动选择与谁同行→他不再以被接纳证明价值，转而承担选择造成的失去
  core_development:
    new_use: 面对缄煦阳要他被迫借力的祖窟，顾冬岚第一次拒绝动用能力，以自己的判断和取舍带伙伴穿过祖窟，并凭一路自己作出的选择护住同行者，只在最后关头借一次力换来脱身。
    new_cost: 他永久失去了被逐时仍相信宗门会接回自己的最后确信；此后他不再以“总有人会来接我”证明价值，而是承担每一次选择带来的失去，包括再也无法用被接纳来安慰自己。
    new_limit: 借兽之暖的规则始终保留：同一时刻只能借雪耳一项能力，能力维持到他体温耗尽，事后虚弱与失忆不可撤销；他也不能用已经失忆来抹去或规避借力限制，不能造物、复活、读心或预知。
opening_promises:
- 第1章前300字内矿洞塌方埋住顾安澜，顾冬岚立即借雪耳寒感定位并撞开落石
- 第1章结尾明确展示顾冬岚记得顾安澜怕苦，却忘了热饼滋味
- 第2章实际展示雪耳凭寒感追踪脚印，顾安澜主动留下标记协助救人
- 第3章以逃离矿道完成第一次胜利兑现，雪耳想吃炉火而冒险，顾安澜想替哥哥分摊
