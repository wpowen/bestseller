title: 愿望真能让我回到古物盛世吗？
premise: 白寄南是暮年博物馆清洁工，只能通过擦拭展品并许愿，让一件物及其相关人物短暂回到最辉煌的年代；被覆盖的人会忘记当下。残片每复原一次，愿望便会从白寄南的记忆中削去一部分。他必须在记忆耗尽前查明，谁正借愿望替旧物和旧人洗白。
reader_expectation: 看白寄南从只想安静扫地的老人，变成敢与博物馆和市场争夺真伪定义权的主角；每次许愿都带来可见奇观、即时反转和真实损失，读者会追查残片来源、幕后操盘者以及白寄南能否保住记忆。
selling_points:
- 清洁工与古物鉴定的强反差
- 愿望让整段时代覆盖现实的视觉奇观
- 每次复原都有人物和记忆付出代价
- 鉴宝打脸与身份反转并行
- 真品争夺延伸到博物馆、市场和历史真相
power:
  cost: 许愿会让愿望对象相关人物暂时忘记现在，并从白寄南身上随机削去一段古物记忆；覆盖越久，遗忘越深
  limit: 一次只能擦拭并复原一件展品，不能凭空制造物品；愿望必须由白寄南主动说出，强行中断会留下记忆空洞，残片只能认他一人使用
world:
  rules:
  - 白寄南擦拭展品并说出愿望后，展品会回到其最辉煌的一刻。
  - 被覆盖范围内的人会暂时忘记现在，只保留当时的关系与记忆。
  - 白寄南可以转移愿望、截取物件或交换见证者，但不能用愿望直接改写人的忠诚。
  - 每次愿望兑现都会随机削去白寄南一段古物记忆，记忆缺口无法靠普通休息补回。
  - 被覆盖的年代必须与展品本身的历史相连，愿望越宏大，覆盖范围越大。
  - 愿望着陆时，展品会回到现实，但相关人物可能永远停留在旧时关系中。
  levels:
  - 初醒
  - 稳定控制
  - 复合运用
  - 能力进阶
  - 领域成形
  - 领域圆熟
  - 超域
  factions:
  - name: 澄川博物馆
    interest: 保住馆藏、声誉和公共服务价值
  - name: 衡古拍卖行
    interest: 借鉴定结果抬高新古物价格并控制流通
  - name: 旧城修复会
    interest: 找回被市场和官方共同抹掉的匠人记录
  - name: 听钟人网络
    interest: 收集愿望残片，试验可覆盖现实的历史幻境
  stages:
  - volume: 1
    stage: 澄川博物馆夜间展厅
  - volume: 2
    stage: 旧城修表巷与衡古拍卖场
  truth_layers:
  - layer: 1
    truth: 白寄南第一次擦拭青铜镜时，镜面出现战国铸造现场，证明愿望确实能覆盖现实。
    reveal_not_before: 1
  - layer: 2
    truth: 残片并非铸钟匠主动留下的完整神器，而是记录了多名持有者愿望的失败残片。
    reveal_not_before: 12
  - layer: 3
    truth: 听钟人网络正在用愿望复原替权贵洗白的历史；赵清越和秦玉筠分别掌握伪造源头与覆盖媒介。
    reveal_not_before: 26
main_foreshadows:
- id: F1
  description: 青铜镜背面的匠师印记，与旧城修表巷一扇无门牌木门上的刻痕相同。
  close_volume: 1
- id: F2
  description: 沈思萦祖父留下的原始名册缺失一页，缺失页缝线里藏着残片的铜屑。
  close_volume: 2
- id: F3
  description: 白寄南每次失去的记忆都围绕同一件战国铜器展开。
  close_volume: 2
- id: F4
  description: 阿柯铭父亲失踪前寄出的最后一张照片，拍到一扇本不可能出现在现代展厅的铜门。
  close_volume: 2
summary: 白寄南只想在博物馆安静扫地，晚年不再为任何人和事操心。一天，他擦拭被判定为赝品的战国青铜镜，低声说了一句“让我看看它最风光的时候”，展厅瞬间被铸造现场覆盖，消失的匠师与真正主人同时出现。白寄南因此发现，博物馆、市场和拍卖行都藏着借错误鉴定牟利的人。残片能让一件古物回到盛世，也会让相关的人忘记现在，并从白寄南身上削去一段古物记忆。为查清残片与旧案，白寄南被迫和沈思萦、阿柯铭、韩汀蕙等人联手，在夜间展厅、旧城修表巷和衡古拍卖场之间追抢名册与见证者。随着记忆不断剥落，他必须决定：继续替别人寻找真相，还是先为自己守住一段安稳生活。
