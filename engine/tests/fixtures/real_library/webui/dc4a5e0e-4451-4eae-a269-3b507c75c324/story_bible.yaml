title: 《南瓜箱里藏了一座会滚的城》
premise: 面包师米娅想把一枚活南瓜催成滚轮，带着新点心冲下山坡；护送货物的小龙阿宜秋认定她偷窃。两人追着滚满山城的南瓜箱前进，发现箱中并非珍贵食材，而是一座会繁殖、能长出居民与街区的活体城市。
reader_expectation: 看食物追逐变成城市冒险，欣赏手艺人用小聪明解决大危机，以及两位嘴硬主角在追逃打闹中建立信任。
selling_points:
- 南瓜滚遍山城，追逐场面直接而热闹
- 点心每次变形都必须付出蔬菜代价
- 活体城市会不断长出居民、资源和麻烦
- 面包师与守规矩小龙互相拆台又不得不合作
- 温暖食物香气与城市争夺并置
power:
  cost: 米娅每改变一次南瓜形态，附近一枚普通蔬菜会永久变成不可食用的装饰菜；连续使用还会让她暂时失去辨认食材的能力。
  limit: 一次只能改变一枚南瓜的外形，不能凭想象造出城市；形态越复杂，失控越快，装饰菜也不会自行恢复。
world:
  rules:
  - 南瓜箱必须集齐指定数量的南瓜才会自动开箱，缺少一枚便永久锁死当前层级。
  - 箱中城市会吸收街道、房屋、居民与资源，持续扩张并非单纯灾害。
  - 米娅的形态诱导只改变南瓜，不会创造南瓜，也无法让装饰菜恢复食用。
  - 活体城市的居民拥有自己的欲望和选择，不能被当作货物买卖。
  - 龙族只承认开箱后的城市归属，箱外争夺不受龙族保护。
  - 山城每条街都有固定居民和摊位，城市扩张会挤压原有生计。
  levels:
  - 初学手艺
  - 独立制作
  - 稳定出品
  - 精巧改良
  - 传授专长
  - 独创名作
  factions:
  - name: 南街邻里会
    interest: 保住摊位、食材和原有街坊关系
  - name: 龙族护送队
    interest: 按规矩完整护送并开启南瓜箱
  - name: 豆芽庭樾所
    interest: 控制山城秩序，避免活体城市无序生长
  - name: 灰鬃商会
    interest: 抢占城市地产，垄断新街区资源
  - name: 箱中居民
    interest: 获得稳定住所、食物与不被交易的权利
  stages:
  - volume: 1
    stage: 南街摊位—石阶长坡—旧城水巷—货运广场
  truth_layers:
  - layer: 1
    truth: 南瓜箱里的南瓜正在孕育一座微型活体城市。
    reveal_not_before: 1
  - layer: 2
    truth: 城市会复制山城居民的需求与建筑，并因此不断扩张。
    reveal_not_before: 3
  - layer: 3
    truth: 箱中居民并非货物，他们能决定城市归属，也会把城市带回山城。
    reveal_not_before: 5
main_foreshadows:
- id: f1
  description: 阿宜秋反复确认箱上少一枚的刻痕，暗示缺枚并非运输失误。
  close_volume: 1
- id: f2
  description: 米娅的旧围裙沾着无法食用的金色装饰菜，暗示她曾付出代价。
  close_volume: 1
- id: f3
  description: 箱中传来小贩叫卖声，证明箱内已有居民活动。
  close_volume: 1
- id: f4
  description: 灰鬃商会知道箱中城市能繁殖，却故意把消息卖给庭樾所。
  close_volume: 1
- id: f5
  description: 缺枚刻痕每到新街区便多出一条线，暗示开箱规则会随城市扩张改变。
  close_volume: 1
summary: 米娅想在山城推出新点心，却误把龙族护送的一批南瓜当成偷窃目标。她把一枚南瓜催成滚轮，带着阿宜秋冲下长坡，撞开三道街门；箱盖也因少了一枚南瓜自动锁死。为追回滚满街巷的货物，两人一路逃过摊贩、庭樾和灰鬃商会的抢夺，在水巷与货运广场发现南瓜箱里藏着会自行生长、繁殖居民和街区的活体城市。米娅必须在保护食材与拯救城市之间选择，阿宜秋则要在龙族规矩与真实居民之间作出决定。
