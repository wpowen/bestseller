title: 一掌镇乾坤
premise: 矿奴苏元铮偷修掌法，企图带病母逃离绝地矿场，却发现整座矿场其实是一头远古巨兽的胃囊。巨兽以吞息维系矿脉与执法队，并将母亲选作下一枚封印钉。苏元铮必须在巨兽苏醒前夺钉救人，最终从巨兽腹中打穿世界。
reader_expectation: 前三章兑现越狱与巨眼异象，后续持续获得越阶反杀、矿奴翻身、巨兽揭秘和地图扩张的爽感，并见证主角从绝境求生成长为镇压乾坤的强者。
selling_points:
- 矿场实为上古巨兽胃囊的反转设定
- 掌法制造局部崩解的独特战斗能力
- 矿奴越狱、夺钉与巨腹夺位的高强度主线
- 越阶斩杀与打脸监工的连续兑现
- 从矿洞、封印井扩张至巨兽体外的世界地图
power:
  cost: 每次崩解都会引发巨兽吞息，范围越大苏醒越快；崩解反噬会撕裂经脉、损伤脏腑，并加速巨兽锁定施术者。
  limit: 苏元铮同时最多维持三处崩解点，第四处必然失控；超过上限，施术者会被巨兽化为食粮，崩解也会吞没附近生灵。
world:
  rules:
  - 境界依次为醒脉、凝纹、蕴魂、融血、铸域、王境、皇境、圣境，不可越阶跳过根基。
  - 矿脉、矿奴与执法队都依靠巨兽吞息维生，矿场战力越强，巨兽越不易完全苏醒。
  - 封印钉能固定巨兽胃壁通道，也能抽调矿奴生命力供其吞息。
  - 崩解掌可在巨兽体内制造局部崩解，并吞噬崩解区中逸散的灵力。
  - 三处崩解点是苏元铮的硬上限，超过上限后掌力会反噬并吸引巨兽。
  - 离开巨兽胃囊后，矿脉灵力会迅速枯竭，所有根基必须重新夺回。
  levels:
  - 醒脉
  - 凝纹
  - 蕴魂
  - 融血
  - 铸域
  - 王境
  - 皇境
  - 圣境
  factions:
  - name: 黑脊矿场
    interest: 维持矿奴产量，替执法队开采灵晶并向巨兽输送封印钉
  - name: 镇山执法队
    interest: 控制矿场通道，借巨兽吞息延长自身寿元并压制矿奴反抗
  - name: 沈家
    interest: 追回失窃阵图，切断封印钉与沈岳霖母亲的联系
  - name: 秦氏残党
    interest: 利用苏元铮的崩解掌打穿巨兽胃壁，夺走其中的上古灵脉
  - name: 赤炉矿奴
    interest: 活过今日，并找到逃出矿洞的路线
  stages:
  - volume: 1
    stage: 黑脊矿场
  - volume: 2
    stage: 巨兽胃囊
  truth_layers:
  - layer: 1
    truth: 矿场并非天然洞窟，而是远古巨兽的胃囊，所有矿道都沿其内壁生长。
    reveal_not_before: 1
  - layer: 2
    truth: 执法队依靠巨兽吞息续命，封印钉既固定胃壁，也在替巨兽筛选新的食物。
    reveal_not_before: 26
  - layer: 3
    truth: 苏元铮父亲当年并未死亡，而是以残躯卡住巨兽心口，成为第一枚无法拔出的封印钉；苏元铮的血脉因此能引发崩解。
    reveal_not_before: 41
main_foreshadows:
- id: F01
  description: 苏元铮掌心裂纹与胃壁血脉同频，暗示其血脉源于巨兽体内。
  close_volume: 2
- id: F02
  description: 母亲枕下断针每次靠近封印井都会自行弯曲。
  close_volume: 2
- id: F03
  description: 沈岳霖听见巨兽吞息时会响起家族禁曲。
  close_volume: 2
- id: F04
  description: 姜松筠体内封印钉与苏元铮掌纹形成互补图形。
  close_volume: 2
- id: F05
  description: 柳慕桐保存着矿场建成前的旧图，图上没有出口。
  close_volume: 2
summary: 苏元铮是黑脊矿场最不起眼的矿奴，母亲陈氏因吞息旧疾常年卧床。他偷得残缺掌法，以掌力震碎矿车与铁镐，在越狱当夜一掌崩裂刑台，带着母亲逃入矿洞，却见天穹睁开遮山巨眼。逃路尽头显出巨兽胃壁，黑脊矿场原来是它体内养出的巢穴，矿奴、矿脉和执法队都靠它的吞息活着。陈氏被选为下一枚封印钉，苏元铮必须在矿奴被当作食粮前夺钉。沈岳霖、铁弘策与柳慕桐先后入局，韩晴棣率执法队追杀，苏元铮一路吞脉崩墙，从刑台、运矿轨杀到封印井。巨兽提前苏醒，胃壁开始收缩，矿奴与执法队一同坠入深腹。第二卷中，苏元铮发现众执法者也在供养巨兽，姜松筠更想借钉登临皇境。苏元铮联合矿奴抢占三处崩解点，夺走封印钉，以父亲留下的断路为代价打出巨腹裂口。众人在逃亡与反杀中逼近心口，最终苏元铮以融血之力接管崩解，三掌打穿胃壁，将巨兽钉死在矿场之外，建立属于自己的根据地。
