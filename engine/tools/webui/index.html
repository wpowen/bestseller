<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书房 · BestSeller</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a href="/">书房 <small>BestSeller · B</small></a><nav><a href="#create">开一本新书</a><a href="#library">我的书库</a><a href="/LIBRARY.html" target="_blank" rel="noopener">完整书库 ↗</a></nav></header>
<main><section id="create"><p class="eyebrow">从一个念头，写到故事深处</p><h1>今天，写一个怎样的故事？</h1><p>先选题，再开书。十二个故事方向，由你亲自选定。</p><div class="quick"><button type="button" id="quick-suspense">悬疑 · 5章</button><button type="button" id="quick-fantasy">玄幻 · 10章</button></div>
<details id="saved-topics"><summary>恢复已有选题 · 不重复生成</summary><div class="fields"><label for="topic-id">已有选题 UUID<input id="topic-id" type="text" aria-describedby="restore-hint" placeholder="粘贴上一次返回的 topic id" autocomplete="off"></label><label for="recent-topics">本地最近选题<select id="recent-topics"><option value="">暂无保存的选题</option></select></label></div><div class="toolbar"><button id="restore-topic" type="button">读取已有选题（免费查询）</button><button id="restore-recent" type="button">恢复本地选题</button></div><p id="restore-hint" class="muted">首次恢复旧 UUID 时，请核对下方题材与章数；已保存的本地选题会自动恢复设置。</p><p id="restore-status" role="status" aria-live="polite"></p></details><form id="topic-form"><div class="fields"><label for="genre">题材<select id="genre" name="genre" required><option value="">正在读取题材…</option></select></label><label for="length">篇幅<select id="length"><option value="5">短篇 · 5章</option><option value="10">短篇 · 10章</option><option value="50">中篇 · 50章</option><option value="1000">长篇 · 1000章</option><option value="2000">长篇 · 2000章</option><option value="custom">自定章数</option></select></label><label for="chapters">章数<input id="chapters" name="chapters" type="number" min="1" max="2000" value="5" required></label></div><label for="idea">故事想法 <span>可留空，让灵感先来</span><textarea id="idea" name="idea" rows="3" placeholder="一个人、一桩旧事，或一个你始终忘不掉的画面…"></textarea></label><button class="primary" id="generate-topics" type="submit" disabled>生成 12 个选题</button><p id="topic-status" role="status" aria-live="polite">正在连接服务…</p></form>
<div id="candidate-section" hidden><h2>选择你的故事</h2><p id="candidate-help">请点击一个候选；不会默认选择。</p><div id="candidates" class="candidates" role="radiogroup" aria-label="故事候选"></div></div>
<form id="book-form"><h2>写作设置</h2><div class="fields"><label for="model">写手<select id="model" name="model" required><option value="">正在读取真实能力…</option></select></label><label for="budget">单书预算上限（美元 $）<input id="budget" name="budget" type="number" min="0.01" step="0.01" value="0.23" required></label><label for="jobs">并发数<input id="jobs" name="jobs" type="number" min="1" max="4" value="2" required></label></div><p id="model-info" class="muted"></p><p id="budget-info" class="muted"></p><label class="check" for="polish"><input id="polish" name="polish" type="checkbox">开启去 AI 润色 <span>默认关闭</span></label><button id="create-book" class="primary" type="submit" disabled>选定故事后，开始写作</button><p id="book-status" role="status" aria-live="polite"></p></form></section>
<section id="library"><div class="section-head"><div><p class="eyebrow">故事正在发生</p><h2>我的书库</h2></div><button id="refresh-books" type="button">刷新书库</button></div><div id="spending-summary" class="spending-summary" role="status"><span>本轮总预算</span><strong id="spending-value">正在读取…</strong><span id="spending-note"></span></div><p id="action-status" role="status" aria-live="polite"></p><p id="library-status" role="status" aria-live="polite"></p><div id="books" class="books"></div></section>
<section id="reader" hidden><div class="section-head"><h2 id="reader-title"></h2><button id="close-reader" type="button">收起阅读</button></div><p id="reader-meta"></p><div id="reader-actions"></div><div class="fields"><label for="chapter-select">章节目录<select id="chapter-select"></select></label><label for="read-mode">阅读模式<select id="read-mode"><option value="compare">左右对比</option><option value="draft">只读草稿</option><option value="final">只读最终稿</option></select></label><label for="version">复制／下载版本<select id="version"><option value="draft">草稿</option><option value="final">最终稿</option></select></label></div><div class="toolbar"><button id="prev-chapter" type="button">上一章</button><button id="next-chapter" type="button">下一章</button><button id="rewrite-chapter" type="button" disabled title="当前公开 CLI 没有单章强制重写命令；失败恢复从原检查点重试。">单章重写（公开CLI暂不支持）</button><button id="copy-chapter" type="button">复制本章</button><button id="copy-book" type="button">复制全书</button><a id="download-md">下载 Markdown</a><a id="download-docx">下载 Word</a><a id="download-txt">下载 TXT</a><a id="download-epub">下载 EPUB</a><a id="download-fanqie">番茄分章 ZIP</a></div><p id="reader-status" role="status" aria-live="polite"></p><h3 id="chapter-title" class="chapter-heading"></h3><div id="comparison" class="comparison" data-view="compare"><article id="draft-pane"><h3>草稿</h3><div id="draft" class="prose"></div></article><article id="final-pane"><h3>最终稿</h3><div id="final" class="prose"></div></article></div><details><summary>本章检测</summary><pre id="report"></pre></details><details><summary>人物圣经</summary><pre id="bible"></pre></details><details><summary>全书章纲</summary><pre id="outline"></pre></details></section></main><footer>留一点耐心，给正在长成的故事。</footer><script src="/app.js" defer></script></body></html>
