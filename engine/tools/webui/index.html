<!doctype html>
<html lang="zh-CN">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>书房 · BestSeller</title>
  <link rel="stylesheet" href="/style.css">
 </head>
 <body>
  <header id="top">
   <a class="brand" href="#/library">书房 <small>BESTSELLER</small></a>
   <nav>
    <a href="#/library">书库</a>
    <a href="#/new">开新书</a>
   </nav>
   <div class="spend">
    <span id="spending-value">正在连接…</span>
   </div>
   <button id="theme" aria-label="深浅色切换">◐</button>
  </header>
  <main>
   <section id="library" class="page" hidden>
    <div class="section-head">
     <div>
      <p class="eyebrow">MY LIBRARY</p>
      <h1>我的书库</h1>
      <p id="library-status" class="muted" role="status"></p>
     </div>
     <a class="primary button" href="#/new">＋ 开新书</a>
    </div>
    <div class="toolbar">
     <div id="filters" class="seg">
      <button data-filter="all" class="on">全部</button>
      <button data-filter="running">写作中</button>
      <button data-filter="complete">已完成</button>
      <button data-filter="paused">已暂停</button>
     </div>
     <input id="search" type="search" aria-label="搜索书名或题材" placeholder="搜索书名或题材">
     <select id="sort" aria-label="书库排序">
      <option value="created">创建时间</option>
      <option value="title">书名</option>
      <option value="chapters">章节进度</option>
     </select>
     <button id="refresh-books">刷新</button>
    </div>
    <div id="books" class="books"></div>
    <button id="archive-toggle" class="ghost">已归档 0 本</button>
    <div id="archives" class="books" hidden></div>
   </section>
   <section id="create" class="page" hidden>
    <p class="eyebrow">A NEW STORY</p>
    <h1>开一本新书</h1>
    <p class="muted">从一个念头，写到故事深处。</p>
    <div class="wizard">
     <aside id="steps">
      <button data-step="1" class="on">01　方向</button>
      <button data-step="2">02　选题</button>
      <button data-step="3">03　写作设置</button>
     </aside>
     <div>
      <div data-pane="1" class="panel">
       <h2>先找到故事的方向</h2>
       <div class="quick">
        <button id="quick-suspense">悬疑 · 5章</button>
        <button id="quick-fantasy">玄幻 · 10章</button>
       </div>
       <form id="topic-form">
        <div id="genre-tags"></div>
        <div class="fields">
         <label>题材<select id="genre" required></select></label>
         <label>频道<select id="channel"></select></label>
         <label>篇幅<select id="length">
           <option value="5">短篇 · 5章</option>
           <option value="10">短篇 · 10章</option>
           <option value="50">中篇 · 50章</option>
           <option value="1000">长篇 · 1000章</option>
           <option value="2000">长篇 · 2000章</option>
           <option value="custom">自定章数</option>
          </select></label>
         <label>章数<input id="chapters" type="number" min="1" max="2000" value="5" required></label>
         <label>每章字数<input value="2200" readonly aria-label="每章字数">
          <small>沿用当前写作配置</small></label>
        </div>
        <p id="length-notice" role="status" class="muted"></p>
        <label>一句话想法 <span class="muted">可留空</span>
         <textarea id="idea" rows="3" maxlength="3000" placeholder="一个人、一桩旧事，或一个忘不掉的画面…"></textarea></label>
        <button class="primary" id="generate-topics" disabled>生成新选题 →</button>
       </form>
       <details id="saved-topics">
        <summary>恢复已有选题</summary>
        <label>已有选题 UUID<input id="topic-id"></label>
        <label>本地最近选题<select id="recent-topics"></select></label>
        <button id="restore-topic">读取已有选题（免费查询）</button>
        <button id="restore-recent">恢复本地选题</button>
        <p id="restore-status" role="status"></p>
       </details>
      </div>
      <div data-pane="2" class="panel" hidden>
       <div class="section-head">
        <h2>选择你的故事</h2>
        <button id="refresh-topics" disabled>换一批</button>
       </div>
       <p id="topic-cost" class="muted">选题费用照常记录</p>
       <p id="topic-notes" class="muted"></p>
       <p id="topic-status" role="status"></p>
       <div id="candidate-section" hidden>
        <p id="candidate-help"></p>
        <div id="topic-collisions"></div>
        <div id="candidates" class="candidates" role="radiogroup" aria-label="故事候选"></div>
       </div>
       <div class="toolbar">
        <button data-step="1">← 修改方向</button>
        <button id="to-settings" class="primary" data-step="3" disabled>写作设置 →</button>
       </div>
      </div>
      <div data-pane="3" class="panel" hidden>
       <form id="book-form">
        <h2>写作设置</h2>
        <p id="picked" class="muted"></p>
        <div class="fields">
         <label>写手<select id="model" required></select></label>
         <label>并发数<input id="jobs" type="number" min="1" max="4" value="2" required></label>
        </div>
        <p id="model-info" class="muted"></p>
        <p id="estimate" class="muted"></p>
        <label class="check"><input id="polish" type="checkbox" checked>自动去 AI 润色</label>
        <div class="toolbar">
         <button type="button" data-step="2">← 返回选题</button>
         <button id="create-book" class="primary" disabled>开始写作</button>
        </div>
        <p id="book-status" role="status"></p>
       </form>
      </div>
     </div>
    </div>
   </section>
   <section id="detail" class="page" hidden>
    <a href="#/library">← 我的书库</a>
    <div id="book-hero" class="hero"></div>
    <div id="book-tabs" class="toolbar seg"></div>
    <div id="book-content" class="panel"></div>
   </section>
  </main>
  <footer class="app-footer">BestSeller <span id="app-version"></span></footer>
  <section id="reader" hidden>
   <div class="rbar">
    <button id="side-toggle" aria-label="开关目录" aria-expanded="true">☰</button>
    <a id="close-reader">← 返回</a>
    <span id="reader-title"></span>
    <button id="copy-chapter">复制本章</button>
    <button id="aa" aria-expanded="false">Aa 阅读设置</button>
   </div>
   <progress id="reading-progress" max="1" value="0" aria-label="全书阅读进度"></progress>
   <aside id="toc-side">
    <input id="toc-search" type="search" placeholder="搜索章节" aria-label="搜索章节">
    <nav id="toc-links"></nav>
   </aside>
   <button id="drawer-mask" aria-label="收起目录"></button>
   <div id="read-scroll">
    <div id="reading-column">
     <h1 id="chapter-title"></h1>
     <p id="chapter-meta" class="muted"></p>
     <p id="reader-status" role="status"></p>
     <div id="comparison">
      <article>
       <h3>草稿</h3>
       <div id="draft" class="prose"></div>
      </article>
      <article>
       <h3>终稿</h3>
       <div id="final" class="prose"></div>
      </article>
     </div>
     <div class="pager">
      <button id="prev-chapter">← 上一章</button>
      <button id="chapter-directory">目录</button>
      <button id="next-chapter">下一章 →</button>
     </div>
    </div>
   </div>
   <div id="read-settings" class="panel" hidden>
    <div class="section-head">
     <h3>阅读设置</h3>
     <button id="settings-close" aria-label="关闭阅读设置">×</button>
    </div>
    <p>查看修改对照</p>
    <div class="seg" id="read-modes">
     <button data-mode="final">终稿</button>
     <button data-mode="draft">草稿</button>
     <button data-mode="compare">对照</button>
    </div>
    <div id="setting-groups"></div>
   </div>
  </section>
  <div id="toast" hidden role="status">
   <span id="action-status"></span>
   <button id="undo" hidden>撤销</button>
  </div>
  <dialog id="manage-dialog">
   <form id="manage-form">
    <h2 id="dialog-title"></h2>
    <p id="dialog-hint"></p>
    <label>书名<input id="confirm-title" autocomplete="off" required></label>
    <p id="dialog-status" role="status"></p>
    <div class="toolbar">
     <button id="dialog-cancel" type="button">取消</button>
     <button id="dialog-confirm" class="danger">确认</button>
    </div>
   </form>
  </dialog>
  <script type="module" src="/app.js"></script>
 </body>
</html>
