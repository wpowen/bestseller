<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一章 · 多模型对比</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --line:#e3e6ee; --text:#1f2430; --dim:#7a8190; --blue:#2257d6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Noto Serif SC","Source Serif 4",serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--dim); font-size:13px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; padding:16px 24px 0; }
  .tab { padding:8px 16px; border:1px solid var(--line); border-radius:20px; background:var(--card);
    cursor:pointer; font-size:14px; font-family:system-ui,sans-serif; }
  .tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
  .tab .n { color:var(--dim); font-size:12px; margin-left:6px; }
  .tab.active .n { color:#dbe6ff; }
  .wrap { padding:20px 24px 60px; max-width:860px; margin:0 auto; }
  .chapter { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:32px 40px; line-height:2.0; font-size:17px; white-space:pre-wrap; }
  .chapter h1, .chapter h2 { font-size:20px; }
  .meta { color:var(--dim); font-size:13px; margin:8px 0 16px; font-family:system-ui,sans-serif; }
  .btn { font-family:system-ui,sans-serif; font-size:13px; padding:6px 12px; border:1px solid var(--line);
    border-radius:8px; background:var(--card); cursor:pointer; text-decoration:none; color:var(--text); }
  .empty { color:var(--dim); padding:40px; text-align:center; }
  details { margin-top:24px; font-family:system-ui,sans-serif; font-size:13px; color:var(--dim); }
  details pre { white-space:pre-wrap; background:#0f1115; color:#cdd3df; padding:16px; border-radius:8px; overflow:auto; }
</style>
</head>
<body>
<header>
  <div>
    <h1>第一章 · 多模型对比</h1>
    <div class="sub" id="sub">加载中…</div>
  </div>
  <a class="btn" href="/library">← 书稿库</a>
</header>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="meta" id="meta"></div>
  <div class="chapter" id="chapter"><div class="empty">加载中…</div></div>
  <details id="promptBox" style="display:none;">
    <summary>查看使用的提示词(含去AI味规则 + 本书写作画像)</summary>
    <pre id="promptPre"></pre>
  </details>
</div>
<script>
let DATA = null, active = 0;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  const m = DATA.models[active];
  document.getElementById('meta').textContent = m ? `模型:${m.model} · ${m.chars} 字` : '';
  document.getElementById('chapter').innerHTML = m ? esc(m.content) : '<div class="empty">该模型暂无输出</div>';
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', i===active));
}
async function load(){
  try{
    const r = await fetch('/api/bakeoff'); DATA = await r.json();
    document.getElementById('sub').textContent = DATA.book + ` · 同一设计/同一去AI味提示词 · ${DATA.models.length} 个模型`;
    const tabs = document.getElementById('tabs');
    if(!DATA.models.length){ document.getElementById('chapter').innerHTML='<div class="empty">还没有生成产物。请先运行多模型生成。</div>'; return; }
    tabs.innerHTML = DATA.models.map((m,i)=>`<div class="tab" onclick="active=${i};render()">${esc(m.model)}<span class="n">${m.chars}字</span></div>`).join('');
    if(DATA.prompt_used){ document.getElementById('promptBox').style.display=''; document.getElementById('promptPre').textContent = DATA.prompt_used; }
    render();
  }catch(e){ document.getElementById('chapter').innerHTML = '<div class="empty">加载失败:'+esc(e.message)+'</div>'; }
}
load();
</script>
</body>
</html>
