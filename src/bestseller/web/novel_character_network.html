<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色关系图谱</title>
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2332;
    --surface-2: #243044;
    --border: #2d3f56;
    --text: #e8edf3;
    --text-muted: #8899aa;
    --accent: #4a9eff;
    --accent-dim: #2a5f9e;
    --success: #4ade80;
    --warning: #fbbf24;
    --error: #f87171;
    --purple: #a78bfa;
    --pink: #f472b6;
    --cyan: #22d3ee;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  .layout {
    display: flex;
    height: 100vh;
  }

  /* 左侧面板 */
  .panel {
    width: 320px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(26, 35, 50, 0.95);
    backdrop-filter: blur(12px);
  }

  .panel-header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .panel-header .subtitle {
    font-size: 12px;
    color: var(--text-muted);
  }

  .search-box {
    width: 100%;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    margin-top: 12px;
    transition: border-color 0.2s;
  }

  .search-box:focus {
    outline: none;
    border-color: var(--accent);
  }

  .search-box::placeholder {
    color: var(--text-muted);
  }

  .panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  /* 角色卡片 */
  .char-card {
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .char-card:hover {
    background: rgba(74, 158, 255, 0.1);
    border-color: var(--accent-dim);
  }

  .char-card.active {
    background: rgba(74, 158, 255, 0.15);
    border-color: var(--accent);
  }

  .char-card .name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .char-card .char-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .char-card .char-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }

  .tag-protagonist {
    background: rgba(74, 158, 255, 0.2);
    color: var(--accent);
  }

  .tag-antagonist {
    background: rgba(248, 113, 113, 0.2);
    color: var(--error);
  }

  .tag-supporting {
    background: rgba(167, 139, 250, 0.2);
    color: var(--purple);
  }

  .tag-mentor {
    background: rgba(74, 222, 128, 0.2);
    color: var(--success);
  }

  .tag-broker {
    background: rgba(251, 191, 36, 0.2);
    color: var(--warning);
  }

  .char-card .char-arc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* 关系详情面板 */
  .rel-detail {
    margin-top: 12px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: none;
  }

  .rel-detail.visible {
    display: block;
  }

  .rel-detail h3 {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .rel-item {
    padding: 10px;
    background: var(--surface-2);
    border-radius: 8px;
    margin-bottom: 8px;
    border-left: 3px solid var(--border);
  }

  .rel-item.conflict {
    border-left-color: var(--error);
  }

  .rel-item.ally {
    border-left-color: var(--success);
  }

  .rel-item.neutral {
    border-left-color: var(--purple);
  }

  .rel-item .rel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .rel-item .rel-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .rel-item .rel-type {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
  }

  .rel-item .rel-tension {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* 图表区域 */
  .graph-area {
    flex: 1;
    position: relative;
    background: radial-gradient(ellipse at center, rgba(74, 158, 255, 0.03) 0%, transparent 70%);
  }

  #graph {
    width: 100%;
    height: 100%;
  }

  /* 节点样式 */
  .node-group {
    cursor: pointer;
  }

  .node-circle {
    stroke-width: 2.5;
    transition: all 0.3s;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
  }

  .node-group:hover .node-circle {
    filter: drop-shadow(0 4px 8px rgba(74, 158, 255, 0.4));
    stroke-width: 3.5;
  }

  .node-label {
    font-size: 11px;
    font-weight: 500;
    fill: var(--text);
    text-anchor: middle;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  }

  .node-group.protagonist .node-circle {
    fill: var(--accent);
    stroke: #7bb8ff;
  }

  .node-group.antagonist .node-circle {
    fill: var(--error);
    stroke: #fca5a5;
  }

  .node-group.supporting .node-circle {
    fill: var(--purple);
    stroke: #c4b5fd;
  }

  .node-group.mentor .node-circle {
    fill: var(--success);
    stroke: #86efac;
  }

  .node-group.broker .node-circle {
    fill: var(--warning);
    stroke: #fcd34d;
  }

  /* 连线样式 */
  .link-line {
    stroke-opacity: 0.3;
    transition: all 0.3s;
  }

  .link-line.highlighted {
    stroke-opacity: 0.9;
    stroke-width: 3 !important;
  }

  .link-line.dimmed {
    stroke-opacity: 0.08;
  }

  .link-label {
    font-size: 10px;
    fill: var(--text-muted);
    text-anchor: middle;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .link-label.visible {
    opacity: 1;
  }

  /* 提示框 */
  .tooltip {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-size: 12px;
    line-height: 1.6;
    max-width: 300px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 1000;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  .tooltip.visible {
    opacity: 1;
  }

  .tooltip .tip-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .tooltip .tip-row {
    display: flex;
    margin-bottom: 4px;
  }

  .tooltip .tip-label {
    color: var(--text-muted);
    min-width: 50px;
  }

  .tooltip .tip-value {
    color: var(--text);
    flex: 1;
  }

  /* 图例 */
  .legend {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 11px;
  }

  .legend-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .legend-line {
    width: 20px;
    height: 2px;
  }

  /* 统计信息 */
  .stats-bar {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 12px;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-num {
    font-weight: 600;
    color: var(--accent);
  }

  .stat-label {
    color: var(--text-muted);
  }

  /* 返回按钮 */
  .back-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    text-decoration: none;
    transition: all 0.2s;
  }

  .back-btn:hover {
    background: var(--surface-2);
    border-color: var(--accent);
  }

  ::-webkit-scrollbar {
    width: 6px;
  }

  ::-webkit-scrollbar-track {
    background: var(--surface);
  }

  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
</style>
</head>
<body>

<div class="layout">
  <div class="panel">
    <div class="panel-header">
      <h1>角色关系图谱</h1>
      <div class="subtitle" id="projectTitle">加载中...</div>
      <input type="text" class="search-box" id="searchInput" placeholder="搜索角色名称...">
    </div>
    <div class="panel-content" id="characterList"></div>
  </div>

  <div class="graph-area">
    <svg id="graph"></svg>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-num" id="statChars">0</span>
        <span class="stat-label">角色</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="statRels">0</span>
        <span class="stat-label">关系</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="statTypes">0</span>
        <span class="stat-label">关系类型</span>
      </div>
    </div>

    <a href="/flow/exorcist-detective-1778051012" class="back-btn">返回数据流</a>

    <div class="legend">
      <div class="legend-title">角色类型</div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--accent);"></div>
        <span>主角</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--error);"></div>
        <span>对手</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--purple);"></div>
        <span>配角</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--success);"></div>
        <span>导师</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--warning);"></div>
        <span>中间人</span>
      </div>
      <div class="legend-title" style="margin-top: 12px;">关系类型</div>
      <div class="legend-item">
        <div class="legend-line" style="background: var(--error);"></div>
        <span>冲突</span>
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background: var(--success);"></div>
        <span>同盟</span>
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background: var(--purple);"></div>
        <span>其他</span>
      </div>
    </div>

    <div class="tooltip" id="tooltip"></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const slug = location.pathname.split('/').filter(Boolean).pop() || '';
let allChars = [];
let allRels = [];
let selectedChar = null;
let simulation;

const roleLabels = {
  protagonist: '主角',
  antagonist: '对手',
  supporting: '配角',
  mentor: '导师',
  broker: '中间人',
  victim: '受害者'
};

const relTypeLabels = {
  conflict: '冲突',
  ally: '同盟',
  mentor: '师徒',
  family: '家族',
  romantic: '情感',
  rival: '竞争',
  '旧搭档': '旧搭档',
  '追捕对象': '追捕对象'
};

async function loadData() {
  const res = await fetch(`/api/projects/${encodeURIComponent(slug)}/story-bible`);
  const data = await res.json();

  document.getElementById('projectTitle').textContent = data.title || slug;

  allChars = data.characters || [];
  allRels = data.relationships || [];

  // 统计
  const charSet = new Set();
  allRels.forEach(r => {
    charSet.add(r.character_a);
    charSet.add(r.character_b);
  });

  const typeSet = new Set(allRels.map(r => r.relationship_type));

  document.getElementById('statChars').textContent = charSet.size;
  document.getElementById('statRels').textContent = allRels.length;
  document.getElementById('statTypes').textContent = typeSet.size;

  renderCharList();
  renderGraph();
}

function renderCharList() {
  const container = document.getElementById('characterList');
  const search = document.getElementById('searchInput').value.toLowerCase();

  // 获取关系中的角色
  const relChars = new Set();
  allRels.forEach(r => {
    relChars.add(r.character_a);
    relChars.add(r.character_b);
  });

  const mainChars = allChars
    .filter(c => relChars.has(c.name))
    .filter(c => {
      if (!search) return true;
      return (c.name || '').toLowerCase().includes(search);
    })
    .sort((a, b) => {
      const roleOrder = { protagonist: 0, antagonist: 1, mentor: 2, broker: 3, supporting: 4 };
      return (roleOrder[a.role] || 9) - (roleOrder[b.role] || 9);
    })
    .slice(0, 30);

  container.innerHTML = mainChars.map(c => {
    const roleClass = `tag-${c.role || 'supporting'}`;
    const roleLabel = roleLabels[c.role] || c.role || '未知';
    const isActive = selectedChar === c.name;

    return `
      <div class="char-card ${isActive ? 'active' : ''}" data-name="${c.name}">
        <div class="name-row">
          <span class="char-name">${c.name}</span>
          <span class="char-tag ${roleClass}">${roleLabel}</span>
        </div>
        <div class="char-arc">${(c.arc_state || '').substring(0, 40)}</div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.char-card').forEach(card => {
    card.addEventListener('click', () => {
      selectedChar = card.dataset.name;
      highlightChar(selectedChar);
      renderCharList();
      showRelDetail(selectedChar);
    });
  });
}

function showRelDetail(name) {
  const detail = document.getElementById('relationshipDetail');
  const list = document.getElementById('relationshipList');

  const rels = allRels.filter(r => r.character_a === name || r.character_b === name);

  if (rels.length === 0) {
    document.querySelector('.rel-detail')?.classList.remove('visible');
    return;
  }

  let detailEl = document.querySelector('.rel-detail');
  if (!detailEl) {
    detailEl = document.createElement('div');
    detailEl.className = 'rel-detail';
    document.getElementById('characterList').after(detailEl);
  }

  detailEl.classList.add('visible');
  detailEl.innerHTML = `
    <h3>${name} 的关系 (${rels.length})</h3>
    ${rels.map(r => {
      const other = r.character_a === name ? r.character_b : r.character_a;
      const relLabel = relTypeLabels[r.relationship_type] || r.relationship_type || '未知';
      const relClass = r.relationship_type === 'conflict' ? 'conflict' :
                       r.relationship_type === 'ally' ? 'ally' : 'neutral';
      return `
        <div class="rel-item ${relClass}">
          <div class="rel-header">
            <span class="rel-name">${other}</span>
            <span class="rel-type">${relLabel}</span>
          </div>
          ${r.tension_summary ? `<div class="rel-tension">${r.tension_summary}</div>` : ''}
        </div>
      `;
    }).join('')}
  `;
}

function renderGraph() {
  const container = document.querySelector('.graph-area');
  const width = container.clientWidth;
  const height = container.clientHeight;

  const svg = d3.select('#graph')
    .attr('width', width)
    .attr('height', height);

  svg.selectAll('*').remove();

  // 添加缩放
  const g = svg.append('g');

  svg.call(d3.zoom()
    .scaleExtent([0.3, 3])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
    }));

  // 构建节点和连线
  const charSet = new Set();
  allRels.forEach(r => {
    charSet.add(r.character_a);
    charSet.add(r.character_b);
  });

  const nodes = allChars
    .filter(c => charSet.has(c.name))
    .slice(0, 60)
    .map(c => ({
      id: c.name,
      role: c.role || 'supporting',
      arc: c.arc_state || '',
      goal: c.goal || '',
      power: c.power_tier || ''
    }));

  const nodeIds = new Set(nodes.map(n => n.id));

  const links = allRels
    .filter(r => nodeIds.has(r.character_a) && nodeIds.has(r.character_b))
    .map(r => ({
      source: r.character_a,
      target: r.character_b,
      type: r.relationship_type || 'unknown',
      tension: r.tension_summary || '',
      strength: r.strength || 0
    }));

  // 力导向模拟
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(150))
    .force('charge', d3.forceManyBody().strength(-400))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(40));

  // 绘制连线
  const link = g.append('g')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('class', 'link-line')
    .attr('stroke', d => {
      if (d.type === 'conflict') return 'var(--error)';
      if (d.type === 'ally' || d.type === '旧搭档') return 'var(--success)';
      if (d.type === '追捕对象') return 'var(--warning)';
      return 'var(--purple)';
    })
    .attr('stroke-width', d => Math.max(1.5, Math.abs(d.strength) * 2));

  // 绘制连线标签
  const linkLabel = g.append('g')
    .selectAll('text')
    .data(links)
    .join('text')
    .attr('class', 'link-label')
    .text(d => relTypeLabels[d.type] || d.type);

  // 绘制节点
  const node = g.append('g')
    .selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', d => `node-group ${d.role}`)
    .call(d3.drag()
      .on('start', dragstarted)
      .on('drag', dragged)
      .on('end', dragended));

  // 节点圆圈 - 主角更大
  node.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => d.role === 'protagonist' ? 24 : 16);

  // 节点标签
  node.append('text')
    .attr('class', 'node-label')
    .attr('dy', d => d.role === 'protagonist' ? 36 : 28)
    .text(d => d.id);

  // 提示框
  const tooltip = document.getElementById('tooltip');

  node.on('mouseover', (event, d) => {
    const roleLabel = roleLabels[d.role] || d.role;
    tooltip.innerHTML = `
      <div class="tip-name">${d.id}</div>
      <div class="tip-row">
        <span class="tip-label">角色：</span>
        <span class="tip-value">${roleLabel}</span>
      </div>
      ${d.power ? `<div class="tip-row"><span class="tip-label">能力：</span><span class="tip-value">${d.power}</span></div>` : ''}
      ${d.arc ? `<div class="tip-row"><span class="tip-label">弧线：</span><span class="tip-value">${d.arc}</span></div>` : ''}
      ${d.goal ? `<div class="tip-row"><span class="tip-label">目标：</span><span class="tip-value">${d.goal.substring(0, 60)}</span></div>` : ''}
    `;
    tooltip.classList.add('visible');
    tooltip.style.left = (event.clientX + 16) + 'px';
    tooltip.style.top = (event.clientY - 16) + 'px';
  });

  node.on('mousemove', (event) => {
    tooltip.style.left = (event.clientX + 16) + 'px';
    tooltip.style.top = (event.clientY - 16) + 'px';
  });

  node.on('mouseout', () => {
    tooltip.classList.remove('visible');
  });

  node.on('click', (event, d) => {
    event.stopPropagation();
    selectedChar = d.id;
    highlightChar(d.id);
    renderCharList();
    showRelDetail(d.id);
  });

  // 点击空白取消选择
  svg.on('click', () => {
    selectedChar = null;
    resetHighlight();
    renderCharList();
    document.querySelector('.rel-detail')?.classList.remove('visible');
  });

  // 更新位置
  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    linkLabel
      .attr('x', d => (d.source.x + d.target.x) / 2)
      .attr('y', d => (d.source.y + d.target.y) / 2 - 8);

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }

  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }

  function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }
}

function highlightChar(name) {
  const svg = d3.select('#graph');

  // 获取连接的角色
  const connectedChars = new Set([name]);
  allRels.forEach(r => {
    if (r.character_a === name) connectedChars.add(r.character_b);
    if (r.character_b === name) connectedChars.add(r.character_a);
  });

  // 高亮节点
  svg.selectAll('.node-group')
    .style('opacity', d => connectedChars.has(d.id) ? 1 : 0.15);

  // 高亮连线
  svg.selectAll('.link-line')
    .classed('highlighted', d => d.source.id === name || d.target.id === name)
    .classed('dimmed', d => d.source.id !== name && d.target.id !== name)
    .style('opacity', d => (d.source.id === name || d.target.id === name) ? 1 : 0.08);

  // 显示相关连线标签
  svg.selectAll('.link-label')
    .classed('visible', d => d.source.id === name || d.target.id === name);
}

function resetHighlight() {
  const svg = d3.select('#graph');

  svg.selectAll('.node-group').style('opacity', 1);
  svg.selectAll('.link-line')
    .classed('highlighted', false)
    .classed('dimmed', false)
    .style('opacity', null);
  svg.selectAll('.link-label').classed('visible', false);
}

document.getElementById('searchInput').addEventListener('input', renderCharList);

window.addEventListener('resize', () => {
  renderGraph();
  if (selectedChar) highlightChar(selectedChar);
});

loadData();
</script>
</body>
</html>
