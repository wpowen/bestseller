<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BestSeller 设计审查包</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }

  :root {
    --bg: #f2eee4;
    --paper: #fffaf0;
    --surface: #faf4e8;
    --surface-2: #f4eadc;
    --ink: #25211d;
    --muted: #6e6457;
    --faint: #9a8d79;
    --border: #d7c9b5;
    --strong: #a55738;
    --strong-2: #783720;
    --blue: #27586f;
    --green: #446c3c;
    --amber: #9a6919;
    --red: #8d2b22;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --serif: "Source Serif 4", "Noto Serif SC", Georgia, serif;
  }

  body {
    min-height: 100vh;
    background:
      linear-gradient(180deg, rgba(255,250,240,0.88), rgba(242,238,228,0.96)),
      linear-gradient(90deg, rgba(37,33,29,0.035) 1px, transparent 1px),
      linear-gradient(0deg, rgba(37,33,29,0.03) 1px, transparent 1px),
      var(--bg);
    background-size: auto, 34px 34px, 34px 34px, auto;
    color: var(--ink);
    font-family: var(--serif);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid var(--border);
    background: rgba(242, 238, 228, 0.96);
    backdrop-filter: blur(14px);
  }

  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    width: min(1440px, calc(100% - 48px));
    margin: 0 auto;
    padding: 12px 0;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 14px;
    min-width: 0;
  }

  .brand h1 {
    font-size: 26px;
    line-height: 1;
    font-weight: 700;
    white-space: nowrap;
  }

  .brand .meta {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    white-space: nowrap;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }

  .btn.primary {
    border-color: var(--strong);
    background: var(--strong);
    color: #fffaf0;
  }

  .shell {
    width: min(1440px, calc(100% - 48px));
    margin: 0 auto;
    padding: 22px 0 80px;
  }

  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(320px, 0.7fr);
    gap: 24px;
    align-items: stretch;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  .kicker {
    color: var(--strong);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .hero h2 {
    margin-top: 8px;
    font-size: clamp(30px, 4vw, 56px);
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: 0;
  }

  .hero .subtitle {
    max-width: 860px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 17px;
  }

  .score-panel {
    border: 1px solid var(--border);
    background: rgba(255, 250, 240, 0.78);
    padding: 18px;
  }

  .score-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    border-bottom: 1px solid var(--border);
    padding: 9px 0;
  }

  .score-row:last-child { border-bottom: 0; }
  .score-label { color: var(--muted); font-size: 13px; }
  .score-value { font-family: var(--mono); font-size: 16px; font-weight: 600; }

  .tabs {
    position: sticky;
    top: 59px;
    z-index: 15;
    display: flex;
    gap: 0;
    overflow-x: auto;
    margin-top: 18px;
    border: 1px solid var(--border);
    background: rgba(250, 244, 232, 0.96);
  }

  .tab {
    flex: 0 0 auto;
    min-height: 42px;
    padding: 0 16px;
    border: 0;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }

  .tab.active {
    background: var(--paper);
    color: var(--ink);
    box-shadow: inset 0 -2px 0 var(--strong);
  }

  .section { display: none; padding-top: 22px; }
  .section.active { display: block; }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px;
  }

  .panel {
    border: 1px solid var(--border);
    background: rgba(255, 250, 240, 0.72);
  }

  .panel.span-3 { grid-column: span 3; }
  .panel.span-4 { grid-column: span 4; }
  .panel.span-5 { grid-column: span 5; }
  .panel.span-6 { grid-column: span 6; }
  .panel.span-7 { grid-column: span 7; }
  .panel.span-8 { grid-column: span 8; }
  .panel.span-12 { grid-column: span 12; }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 44px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(244, 234, 220, 0.62);
  }

  .panel-title {
    font-size: 15px;
    font-weight: 700;
  }

  .panel-count {
    color: var(--faint);
    font-family: var(--mono);
    font-size: 11px;
  }

  .panel-body { padding: 14px; }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .metric {
    border: 1px solid var(--border);
    background: rgba(250, 244, 232, 0.66);
    padding: 12px;
  }

  .metric .label {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .metric .value {
    margin-top: 5px;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
  }

  .list {
    display: grid;
    gap: 10px;
  }

  .item {
    border: 1px solid var(--border);
    background: rgba(250, 244, 232, 0.58);
    padding: 12px;
  }

  .item-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
  }

  .item-meta {
    margin-top: 5px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .item-text {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
    white-space: pre-line;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    min-height: 24px;
    padding: 3px 7px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .tag.ok { border-color: rgba(68,108,60,.45); color: var(--green); }
  .tag.warn { border-color: rgba(154,105,25,.45); color: var(--amber); }
  .tag.miss { border-color: rgba(141,43,34,.45); color: var(--red); }

  details.artifact {
    border: 1px solid var(--border);
    background: rgba(250, 244, 232, 0.58);
  }

  details.artifact summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px;
    cursor: pointer;
    list-style: none;
  }

  details.artifact summary::-webkit-details-marker { display: none; }

  .artifact-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 12px 12px;
  }

  .artifact-load {
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--strong-2);
    padding: 6px 9px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
  }

  .artifact-load:disabled {
    cursor: wait;
    color: var(--faint);
  }

  .artifact-action {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--blue);
    padding: 6px 9px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
  }

  .review-banner {
    border: 1px solid var(--border);
    background: rgba(250, 244, 232, 0.78);
    padding: 12px;
  }

  .review-banner.ok { border-color: rgba(68,108,60,.45); }
  .review-banner.warn { border-color: rgba(154,105,25,.45); }
  .review-banner.miss { border-color: rgba(141,43,34,.45); }

  .artifact-hint {
    padding: 0 12px 12px;
    color: var(--muted);
    font-size: 13px;
  }

  pre.json {
    max-height: 420px;
    overflow: auto;
    border-top: 1px solid var(--border);
    background: #231f1b;
    color: #f6ecd8;
    padding: 14px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .outline {
    display: grid;
    gap: 12px;
  }

  .volume {
    border: 1px solid var(--border);
    background: rgba(250, 244, 232, 0.58);
  }

  .volume-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }

  .chapters {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding: 12px;
  }

  .chapter {
    border: 1px solid var(--border);
    background: var(--paper);
    padding: 10px;
  }

  .chapter h4 {
    font-size: 14px;
    font-weight: 700;
  }

  .chapter p {
    margin-top: 5px;
    color: var(--muted);
    font-size: 13px;
  }

  .relationship-board {
    border: 1px solid var(--border);
    background:
      linear-gradient(90deg, rgba(37,33,29,0.04) 1px, transparent 1px),
      linear-gradient(0deg, rgba(37,33,29,0.035) 1px, transparent 1px),
      rgba(250, 244, 232, 0.72);
    background-size: 28px 28px;
  }

  .relationship-map {
    display: grid;
    grid-template-columns: minmax(720px, 1fr) 340px;
    gap: 0;
    min-height: 680px;
  }

  .graph-stage {
    position: relative;
    min-height: 680px;
    overflow: auto;
    border-right: 1px solid var(--border);
  }

  .graph-canvas {
    position: absolute;
    inset: 0;
    min-width: 920px;
    min-height: 680px;
  }

  .case-graph {
    width: 100%;
    height: 680px;
    min-width: 920px;
    display: block;
  }

  .edge-line.conflict { stroke: var(--red); }
  .edge-line.positive { stroke: var(--green); }
  .edge-line.neutral { stroke: var(--blue); }
  .edge-line.unknown { stroke: var(--amber); }

  .edge-label rect {
    fill: rgba(255,250,240,0.95);
    stroke: var(--border);
  }

  .edge-label text {
    font-family: var(--mono);
    font-size: 11px;
    fill: var(--ink);
  }

  .entity-node circle,
  .entity-node rect {
    fill: #fffaf0;
    stroke: var(--border);
    stroke-width: 1.4;
  }

  .entity-node.hub circle {
    fill: #f6dfc9;
    stroke: var(--strong);
    stroke-width: 2;
  }

  .entity-node text {
    fill: var(--ink);
    font-weight: 700;
    font-size: 13px;
  }

  .entity-node .node-meta {
    fill: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
  }

  .map-legend {
    position: absolute;
    left: 14px;
    top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 520px;
    z-index: 2;
  }

  .legend-chip {
    border: 1px solid var(--border);
    background: rgba(255,250,240,0.92);
    padding: 5px 8px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .relation-inspector {
    max-height: 680px;
    overflow: auto;
    background: rgba(255,250,240,0.82);
  }

  .inspector-head {
    position: sticky;
    top: 0;
    z-index: 1;
    border-bottom: 1px solid var(--border);
    background: rgba(244,234,220,0.96);
    padding: 12px;
  }

  .inspector-head strong {
    display: block;
    font-size: 15px;
  }

  .inspector-head span {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .relation-sheet {
    display: grid;
    gap: 8px;
    padding: 12px;
  }

  .sheet-row {
    border: 1px solid var(--border);
    background: rgba(250,244,232,0.7);
    padding: 10px;
  }

  .sheet-row.conflict { border-left: 4px solid var(--red); }
  .sheet-row.positive { border-left: 4px solid var(--green); }
  .sheet-row.neutral { border-left: 4px solid var(--blue); }
  .sheet-row.unknown { border-left: 4px solid var(--amber); }

  .sheet-pair {
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
  }

  .sheet-meta {
    margin-top: 4px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
  }

  .sheet-note {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
  }

  .workbench {
    display: grid;
    gap: 14px;
  }

  .workbench-hero {
    border: 1px solid var(--border);
    background:
      linear-gradient(135deg, rgba(255,250,240,0.94), rgba(244,234,220,0.72));
    padding: 16px;
  }

  .workbench-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
  }

  .workbench-title h3 {
    font-size: 22px;
    line-height: 1.15;
  }

  .workbench-title .meta {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .workbench-copy {
    margin-top: 8px;
    max-width: 900px;
    color: var(--muted);
    font-size: 14px;
  }

  .control-bar {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto auto auto;
    gap: 8px;
    align-items: center;
    border: 1px solid var(--border);
    background: rgba(255,250,240,0.68);
    padding: 10px;
  }

  .control-bar input,
  .control-bar select {
    width: 100%;
    min-height: 34px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    padding: 6px 9px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .toggle-line {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    white-space: nowrap;
  }

  .toggle-line input { width: auto; min-height: auto; }

  .facet-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .facet {
    min-height: 32px;
    border: 1px solid var(--border);
    background: rgba(255,250,240,0.72);
    color: var(--muted);
    padding: 6px 10px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
  }

  .facet.active {
    border-color: var(--strong);
    background: var(--strong);
    color: #fffaf0;
  }

  .insight-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .insight {
    border: 1px solid var(--border);
    background: rgba(250,244,232,0.62);
    padding: 12px;
  }

  .insight .label {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
  }

  .insight .value {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
  }

  .split-workspace {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 14px;
  }

  .side-index {
    border: 1px solid var(--border);
    background: rgba(255,250,240,0.76);
    align-self: start;
  }

  .side-index h3 {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .index-list {
    display: grid;
    max-height: 620px;
    overflow: auto;
  }

  .index-button {
    display: grid;
    gap: 3px;
    border: 0;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--ink);
    text-align: left;
    padding: 10px 12px;
    cursor: pointer;
  }

  .index-button.active {
    background: rgba(165,87,56,0.12);
    box-shadow: inset 3px 0 0 var(--strong);
  }

  .index-button strong {
    font-size: 13px;
  }

  .index-button span {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
  }

  .artifact-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .artifact-card {
    border: 1px solid var(--border);
    background: rgba(255,250,240,0.72);
  }

  .artifact-card summary {
    display: grid;
    gap: 8px;
    padding: 12px;
    cursor: pointer;
    list-style: none;
  }

  .artifact-card summary::-webkit-details-marker { display: none; }

  .artifact-card .card-title {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }

  .artifact-card .card-title strong {
    font-size: 15px;
    line-height: 1.25;
  }

  .artifact-card .preview {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.42;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 52px;
  }

  /* ---- quality panel (规划产物 tab) ---- */
  .q-panel { border: 1px solid var(--border); background: var(--paper); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .q-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .q-score { font-size: 34px; font-weight: 700; line-height: 1; font-family: var(--mono); }
  .q-score small { font-size: 14px; color: var(--faint); font-weight: 400; }
  .q-badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); }
  .q-badge.ok { background: var(--green); color: #fff; border-color: var(--green); }
  .q-badge.fail { background: var(--red); color: #fff; border-color: var(--red); }
  .q-badge.warn { background: var(--amber); color: #fff; border-color: var(--amber); }
  .q-badge.info { background: var(--surface); color: var(--muted); }
  .cap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 14px; margin-top: 12px; }
  .cap-item { font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .cap-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .cap-item.ok .dot { background: var(--green); }
  .cap-item.no { color: var(--red); }
  .cap-item.no .dot { background: var(--red); }
  .q-reports { display: grid; gap: 8px; margin-top: 14px; }
  .q-report { border: 1px solid var(--border); border-left: 4px solid var(--faint); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
  .q-report.ok { border-left-color: var(--green); }
  .q-report.fail { border-left-color: var(--red); }
  .q-report.warn { border-left-color: var(--amber); }
  .q-report.info { border-left-color: var(--blue); }
  .q-report .qr-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .q-report .qr-name { font-weight: 600; }
  .q-report .qr-detail { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .q-report .qr-detail li { margin: 2px 0; }

  /* ---- readable artifact rendering ---- */
  .readable { font-size: 13.5px; line-height: 1.6; }
  .kv-row { display: grid; grid-template-columns: minmax(96px, 168px) 1fr; gap: 12px; padding: 5px 0; border-top: 1px dashed var(--border); }
  .kv-row:first-child { border-top: none; }
  .kv-k { color: var(--strong); font-weight: 600; word-break: break-word; }
  .kv-v { white-space: pre-wrap; word-break: break-word; }
  .kv-v .muted { color: var(--faint); }
  .r-card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; margin: 6px 0; background: var(--paper); }
  .r-card-title { font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .meta-fold, .raw-fold { margin-top: 10px; }
  .meta-fold summary, .raw-fold summary { cursor: pointer; font-size: 12px; color: var(--faint); list-style: none; }
  .meta-fold summary::-webkit-details-marker, .raw-fold summary::-webkit-details-marker { display: none; }
  .artifact-readable { padding: 4px 12px 12px; }
  .artifact-readable .loading-line { color: var(--faint); font-size: 12px; padding: 8px 0; }

  /* ---- per-type curated view (artifact_view) ---- */
  .av-hint { font-size: 12.5px; color: var(--amber); background: var(--surface); border-radius: var(--border-radius-md); padding: 7px 11px; margin-bottom: 14px; }
  .av-hint i { font-style: normal; font-weight: 600; margin-right: 4px; }
  .av-block { margin: 0 0 16px; }
  .av-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 7px; letter-spacing: .02em; }
  .av-note { font-weight: 400; color: var(--faint); }
  .av-prose { font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; }
  .av-callout { border-left: 3px solid var(--blue); background: var(--surface); border-radius: 0; padding: 8px 14px; }
  .av-callout .av-label { color: var(--blue); }
  .av-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
  @media (max-width: 640px) { .av-fields { grid-template-columns: 1fr; } }
  .av-kv .av-k { font-size: 11.5px; color: var(--faint); }
  .av-kv .av-v { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
  .av-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .av-chip { font-size: 12.5px; padding: 3px 11px; border-radius: 999px; background: var(--surface); border: 0.5px solid var(--border); color: var(--ink); }
  .av-ladder { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
  .av-step { flex: 1 1 90px; min-width: 84px; padding: 9px 12px; border-radius: var(--border-radius-md); background: var(--surface); border: 0.5px solid var(--border); font-size: 13.5px; font-weight: 500; display: flex; flex-direction: column; gap: 2px; }
  .av-step.start { background: var(--paper); border-color: var(--blue); }
  .av-step-tag { font-size: 10.5px; font-weight: 400; color: var(--blue); }
  .av-arrow { align-self: center; color: var(--faint); }
  .av-cards { display: grid; gap: 10px; }
  .av-card { border: 0.5px solid var(--border); border-radius: var(--border-radius-md); padding: 11px 13px; background: var(--paper); }
  .av-card-title { font-size: 14px; font-weight: 600; margin-bottom: 7px; }
  .av-card-title .av-sub { font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .av-card-title .av-badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface); color: var(--muted); margin-left: 6px; }
  .av-card .av-line { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin-top: 3px; }
  .scorecard { border: 0.5px solid var(--border); border-radius: var(--border-radius-md); overflow: hidden; }
  .sc-head { display: flex; align-items: baseline; gap: 12px; padding: 9px 13px; background: var(--surface); border-bottom: 0.5px solid var(--border); }
  .sc-grade { font-size: 13px; font-weight: 600; color: var(--green); }
  .sc-total { font-size: 18px; font-weight: 600; font-family: var(--mono); }
  .sc-total small { font-size: 11px; color: var(--faint); font-weight: 400; }
  .sc-row { display: grid; grid-template-columns: minmax(90px, 130px) 56px 1fr; gap: 10px; padding: 7px 13px; border-top: 0.5px dashed var(--border); align-items: baseline; }
  .sc-row:first-child { border-top: none; }
  .sc-dim { font-size: 13px; font-weight: 500; }
  .sc-score { font-size: 13px; font-family: var(--mono); color: var(--strong); }
  .sc-wt { color: var(--faint); }
  .sc-rat { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  @media (max-width: 640px) { .sc-row { grid-template-columns: 1fr 56px; } .sc-rat { grid-column: 1 / -1; } }

  /* ---- design reading menu (规划产物 tab) ---- */
  .reading-head { margin: 16px 0 4px; }
  .reading-head h3 { margin: 0; font-size: 16px; }
  .reading-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .rm-sec-label { font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .03em; margin: 20px 0 8px; }
  .rm-group { border: 0.5px solid var(--border); border-radius: var(--border-radius-lg); overflow: hidden; background: var(--paper); }
  details.rm-row { border: none; background: transparent; }
  details.rm-row + details.rm-row { border-top: 0.5px solid var(--border); }
  .rm-row > summary { display: flex; align-items: center; gap: 10px; padding: 12px 15px; cursor: pointer; list-style: none; }
  .rm-row > summary::-webkit-details-marker { display: none; }
  .rm-row > summary:hover { background: var(--surface); }
  .rm-row[open] > summary { background: var(--surface); }
  .rm-chev { flex: 0 0 auto; width: 12px; color: var(--faint); }
  .rm-chev::before { content: '\203A'; font-size: 16px; display: inline-block; transition: transform .15s ease; }
  .rm-row[open] .rm-chev::before { transform: rotate(90deg); }
  .rm-name { font-weight: 500; font-size: 14.5px; flex: 0 0 auto; }
  .rm-hint { flex: 1 1 auto; min-width: 0; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rm-ver { flex: 0 0 auto; font-size: 11px; color: var(--faint); }
  .rm-row > .artifact-readable { padding: 4px 16px 18px 37px; }
  .rm-advanced { margin-top: 26px; border-top: 0.5px solid var(--border); padding-top: 14px; }
  .rm-advanced > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none; }
  .rm-advanced > summary::-webkit-details-marker { display: none; }
  .rm-advanced > summary::before { content: '\203A'; margin-right: 6px; display: inline-block; transition: transform .15s ease; }
  .rm-advanced[open] > summary::before { transform: rotate(90deg); }
  .rm-advanced > .grid { margin-top: 12px; }

  .pager {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .pager button {
    min-height: 30px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    padding: 5px 9px;
    cursor: pointer;
  }

  .pager button:disabled {
    color: var(--faint);
    cursor: not-allowed;
  }

  .volume-board {
    display: grid;
    grid-template-columns: minmax(260px, 0.34fr) minmax(0, 1fr);
    gap: 14px;
  }

  .volume-card {
    border: 1px solid var(--border);
    background: rgba(255,250,240,0.72);
    padding: 12px;
  }

  .volume-card.active {
    border-color: rgba(165,87,56,0.7);
    background: rgba(244,234,220,0.9);
  }

  .chapter-table {
    display: grid;
    gap: 8px;
  }

  .chapter-row {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: start;
    border: 1px solid var(--border);
    background: rgba(255,250,240,0.72);
    padding: 10px;
  }

  .chapter-row .num {
    color: var(--strong-2);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
  }

  .chapter-row h4 {
    font-size: 14px;
    line-height: 1.25;
  }

  .chapter-row p {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.42;
  }

  .storyline-board {
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    gap: 14px;
  }

  .arc-list {
    display: grid;
    gap: 8px;
    max-height: 720px;
    overflow: auto;
  }

  .arc-card {
    border: 1px solid var(--border);
    background: rgba(255,250,240,0.72);
    padding: 12px;
    cursor: pointer;
  }

  .arc-card.active {
    border-color: var(--strong);
    background: rgba(244,234,220,0.9);
  }

  .arc-card strong {
    display: block;
    font-size: 14px;
    line-height: 1.25;
  }

  .arc-card p {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.42;
  }

  .timeline {
    display: grid;
    gap: 10px;
  }

  .timeline-row {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr);
    gap: 12px;
    position: relative;
  }

  .timeline-row::before {
    content: "";
    position: absolute;
    left: 40px;
    top: 26px;
    bottom: -10px;
    border-left: 1px solid var(--border);
  }

  .timeline-row:last-child::before { display: none; }

  .timeline-marker {
    position: relative;
    z-index: 1;
    justify-self: start;
    min-width: 78px;
    border: 1px solid var(--border);
    background: var(--paper);
    padding: 5px 7px;
    color: var(--strong-2);
    font-family: var(--mono);
    font-size: 11px;
    text-align: center;
  }

  .timeline-card {
    border: 1px solid var(--border);
    background: rgba(255,250,240,0.76);
    padding: 10px;
  }

  .timeline-card strong {
    font-size: 13px;
  }

  .timeline-card p {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
  }

  .ledger-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .empty {
    border: 1px dashed var(--border);
    color: var(--muted);
    padding: 16px;
    font-size: 14px;
  }

  .loading {
    padding: 40px 0;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
  }

  @media (max-width: 980px) {
    .topbar-inner, .shell { width: min(100% - 28px, 1440px); }
    .hero { grid-template-columns: 1fr; }
    .relationship-map { grid-template-columns: 1fr; }
    .control-bar,
    .split-workspace,
    .volume-board,
    .storyline-board { grid-template-columns: 1fr; }
    .artifact-grid,
    .insight-grid,
    .ledger-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .graph-stage { border-right: 0; border-bottom: 1px solid var(--border); }
    .panel.span-3, .panel.span-4, .panel.span-5,
    .panel.span-6, .panel.span-7, .panel.span-8 { grid-column: span 12; }
    .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chapters { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    .topbar-inner { align-items: flex-start; flex-direction: column; }
    .brand { align-items: flex-start; flex-direction: column; gap: 6px; }
    .brand h1 { font-size: 22px; white-space: normal; }
    .metric-grid { grid-template-columns: 1fr; }
    .artifact-grid,
    .insight-grid,
    .ledger-grid { grid-template-columns: 1fr; }
    .chapter-row { grid-template-columns: 1fr; }
    .tab { padding: 0 12px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1 id="pageTitle">设计审查包</h1>
      <div class="meta" id="pageMeta">LOADING</div>
    </div>
    <div class="top-actions">
      <a class="btn" href="/library">书稿库</a>
      <a class="btn" id="readLink" href="#">阅读正文</a>
      <button class="btn" id="approvePrewriteBtn" type="button">审核通过</button>
      <button class="btn primary" id="enterWritingBtn" type="button">进入正文</button>
      <button class="btn primary" id="refreshBtn" type="button">刷新</button>
    </div>
  </div>
</header>

<main class="shell">
  <section class="hero">
    <div>
      <div class="kicker">Design Dossier</div>
      <h2 id="heroTitle">设计阶段产物</h2>
      <p class="subtitle" id="heroSubtitle">正在加载设计资料。</p>
    </div>
    <aside class="score-panel" id="scorePanel"></aside>
  </section>

  <nav class="tabs" aria-label="设计审查导航">
    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="artifacts">规划产物</button>
    <button class="tab" data-tab="outline">大纲</button>
    <button class="tab" data-tab="characters">人物</button>
    <button class="tab" data-tab="relations">关系图</button>
    <button class="tab" data-tab="world">世界观</button>
    <button class="tab" data-tab="narrative">叙事线</button>
    <button class="tab" data-tab="contracts">合约</button>
  </nav>

  <div id="status" class="loading">加载中…</div>
  <section class="section active" id="tab-overview"></section>
  <section class="section" id="tab-artifacts"></section>
  <section class="section" id="tab-outline"></section>
  <section class="section" id="tab-characters"></section>
  <section class="section" id="tab-relations"></section>
  <section class="section" id="tab-world"></section>
  <section class="section" id="tab-narrative"></section>
  <section class="section" id="tab-contracts"></section>
</main>

<script>
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);
  const esc = (s) => { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; };
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  let dossier = null;
  const PAGE_SIZE = 24;
  const artifactState = { phase: 'all', status: 'all', query: '', latestOnly: true, page: 1 };
  const outlineState = { volume: null, status: 'all', query: '', page: 1 };
  const narrativeState = { arc: 'all', query: '', page: 1 };
  const contractState = { kind: 'chapter', query: '', page: 1 };

  function arr(v) { return Array.isArray(v) ? v : []; }
  function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
  function text(v, fallback = '—') {
    if (v === null || v === undefined || v === '') return fallback;
    if (Array.isArray(v)) return v.filter(Boolean).join('、') || fallback;
    if (typeof v === 'object') return JSON.stringify(v, null, 2);
    return String(v);
  }
  function count(v) { return arr(v).length; }
  function norm(v) { return String(v ?? '').trim().toLowerCase(); }
  function includesText(value, query) {
    const q = norm(query);
    if (!q) return true;
    return norm(value).includes(q);
  }
  function clampPage(page, total, size = PAGE_SIZE) {
    const max = Math.max(1, Math.ceil(total / size));
    return Math.min(Math.max(1, Number(page) || 1), max);
  }
  function pageSlice(items, state, size = PAGE_SIZE) {
    state.page = clampPage(state.page, items.length, size);
    const start = (state.page - 1) * size;
    return items.slice(start, start + size);
  }
  function pager(total, state, target, size = PAGE_SIZE) {
    const max = Math.max(1, Math.ceil(total / size));
    state.page = clampPage(state.page, total, size);
    return `<div class="pager" data-page-target="${esc(target)}">
      <span>${esc(state.page)} / ${esc(max)} · ${esc(total)} 项</span>
      <button type="button" data-page-delta="-1" ${state.page <= 1 ? 'disabled' : ''}>上一页</button>
      <button type="button" data-page-delta="1" ${state.page >= max ? 'disabled' : ''}>下一页</button>
    </div>`;
  }
  function statusClass(status) {
    const s = norm(status);
    if (s.includes('approved') || s === 'ok' || s.includes('complete')) return 'ok';
    if (s.includes('need') || s.includes('review') || s.includes('blocked') || s.includes('rewrite')) return 'warn';
    if (s.includes('fail') || s.includes('miss')) return 'miss';
    return '';
  }
  function tag(value, cls = '') { return `<span class="tag ${cls}">${esc(value)}</span>`; }
  function panel(title, body, span = 6, countLabel = '') {
    return `<article class="panel span-${span}">
      <div class="panel-head"><div class="panel-title">${esc(title)}</div>${countLabel ? `<div class="panel-count">${esc(countLabel)}</div>` : ''}</div>
      <div class="panel-body">${body}</div>
    </article>`;
  }
  function empty(label) { return `<div class="empty">${esc(label)}</div>`; }
  function item(title, meta, body, tags = []) {
    return `<div class="item">
      <div class="item-title"><span>${esc(title)}</span></div>
      ${meta ? `<div class="item-meta">${esc(meta)}</div>` : ''}
      ${body ? `<div class="item-text">${esc(body)}</div>` : ''}
      ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
    </div>`;
  }
  function asJson(value) { return esc(JSON.stringify(value, null, 2)); }

  // ---- readable artifact rendering (JSON → 人话卡片) ----
  const FIELD_LABELS = {
    name: '名称', title: '标题', description: '说明', summary: '摘要', role: '角色',
    rule_name: '规则名', story_consequence: '剧情后果', faction: '势力', movement: '动向',
    power_system: '力量体系', tiers: '层级', tier: '层级', tier_progression: '晋升路线',
    bottleneck: '瓶颈', breakthrough_cost: '突破代价', acquisition_method: '获取方式',
    hard_limits: '硬性限制', protagonist_starting_tier: '主角起点',
    world_name: '世界名', world_premise: '世界前提', power_structure: '权力结构',
    forbidden_zones: '禁区', history_key_events: '关键历史', event: '事件', relevance: '意义',
    locations: '地点', factions: '势力', rules: '世界规则', characters: '角色',
    protagonist: '主角', antagonist: '反派', supporting_cast: '配角', conflict_map: '冲突图谱',
    golden_finger: '金手指', core_wound: '核心创伤', external_goal: '外在目标',
    internal_need: '内在需求', archetype: '人物原型', premise: '一句话/前提',
    logline: '一句话', synopsis: '简介', selling_points: '卖点', reader_promise: '读者承诺',
    chapter_number: '章号', chapter_goal: '本章目标', main_conflict: '主要冲突',
    hook_description: '钩子', opening_situation: '开场情境', scenes: '场景',
    volume_number: '卷号', volume_title: '卷名', chapters: '章节',
  };
  function fieldLabel(k) { return FIELD_LABELS[k] || k; }
  const SCALAR_PREVIEW_KEYS = ['name', 'title', 'rule_name', 'event', 'tier', 'label'];

  function isScalar(v) { return v === null || ['string', 'number', 'boolean'].includes(typeof v); }
  function objTitle(o) {
    for (const k of SCALAR_PREVIEW_KEYS) if (o && typeof o[k] === 'string' && o[k].trim()) return o[k];
    return '';
  }
  function renderReadableValue(val, depth) {
    if (val === null || val === undefined || val === '') return '<span class="muted">—</span>';
    if (isScalar(val)) return esc(String(val));
    if (Array.isArray(val)) {
      if (!val.length) return '<span class="muted">（空）</span>';
      if (val.every(isScalar)) return `<div class="chips">${val.slice(0, 40).map(v => `<span class="chip">${esc(String(v))}</span>`).join('')}</div>`;
      const items = val.slice(0, 30).map(v => {
        if (isScalar(v)) return `<div class="r-card">${esc(String(v))}</div>`;
        const t = objTitle(v);
        return `<div class="r-card">${t ? `<div class="r-card-title">${esc(t)}</div>` : ''}${renderReadableObject(v, depth + 1, t)}</div>`;
      }).join('');
      const more = val.length > 30 ? `<div class="muted" style="font-size:12px">…另有 ${val.length - 30} 项</div>` : '';
      return items + more;
    }
    if (typeof val === 'object') return `<div class="r-card">${renderReadableObject(val, depth + 1)}</div>`;
    return esc(String(val));
  }
  function renderReadableObject(o, depth, skipTitleKey) {
    const entries = Object.entries(o).filter(([k]) => k !== '_meta' && !(skipTitleKey && SCALAR_PREVIEW_KEYS.includes(k) && o[k] === skipTitleKey));
    if (!entries.length) return '<span class="muted">—</span>';
    return entries.map(([k, v]) => `<div class="kv-row"><div class="kv-k">${esc(fieldLabel(k))}</div><div class="kv-v">${renderReadableValue(v, depth)}</div></div>`).join('');
  }
  function renderArtifactReadable(content) {
    if (content === null || content === undefined) return empty('无内容');
    if (isScalar(content)) return `<div class="readable">${esc(String(content))}</div>`;
    if (Array.isArray(content)) return `<div class="readable">${renderReadableValue(content, 0)}</div>`;
    const meta = content._meta;
    const main = renderReadableObject(content, 0);
    const metaFold = (meta && typeof meta === 'object')
      ? `<details class="meta-fold"><summary>溯源信息 _meta（点击展开）</summary><div class="readable" style="margin-top:6px">${renderReadableObject(meta, 0)}</div></details>`
      : '';
    const rawFold = `<details class="raw-fold"><summary>查看原始 JSON</summary><pre class="json" style="margin-top:6px">${asJson(content)}</pre></details>`;
    return `<div class="readable">${main}</div>${metaFold}${rawFold}`;
  }

  // ---- per-type curated view (from backend artifact_view) ----
  function renderAvCard(c) {
    const items = arr(c.items).map(i => `<div class="av-kv"><div class="av-k">${esc(i.label)}</div><div class="av-v">${esc(i.value)}</div></div>`).join('');
    const lines = arr(c.lines).map(l => `<div class="av-line">${esc(l)}</div>`).join('');
    const badge = c.badge ? `<span class="av-badge">${esc(c.badge)}</span>` : '';
    const sub = c.subtitle ? `<span class="av-sub">${esc(c.subtitle)}</span>` : '';
    return `<div class="av-card"><div class="av-card-title">${esc(c.title)}${badge}${sub}</div>${items ? `<div class="av-fields">${items}</div>` : ''}${lines}</div>`;
  }
  function renderAvBlock(b) {
    const label = `<div class="av-label">${esc(b.label)}${b.note ? ` <span class="av-note">${esc(b.note)}</span>` : ''}</div>`;
    if (b.kind === 'prose') return `<div class="av-block">${label}<div class="av-prose">${esc(b.text)}</div></div>`;
    if (b.kind === 'callout') return `<div class="av-block av-callout">${label}<div class="av-prose">${esc(b.text)}</div></div>`;
    if (b.kind === 'fields') return `<div class="av-block">${label}<div class="av-fields">${arr(b.items).map(i => `<div class="av-kv"><div class="av-k">${esc(i.label)}</div><div class="av-v">${esc(i.value)}</div></div>`).join('')}</div></div>`;
    if (b.kind === 'chips') return `<div class="av-block">${label}<div class="av-chips">${arr(b.chips).map(c => `<span class="av-chip">${esc(c)}</span>`).join('')}</div></div>`;
    if (b.kind === 'ladder') return `<div class="av-block">${label}<div class="av-ladder">${arr(b.steps).map((st, i) => `${i ? '<span class="av-arrow">→</span>' : ''}<div class="av-step${st.tag ? ' start' : ''}">${st.tag ? `<span class="av-step-tag">${esc(st.tag)}</span>` : ''}<span>${esc(st.name)}</span></div>`).join('')}</div></div>`;
    if (b.kind === 'cards') return `<div class="av-block">${label}<div class="av-cards">${arr(b.cards).map(renderAvCard).join('')}</div></div>`;
    if (b.kind === 'scorecard') {
      const num = (v) => v == null ? '' : (Math.round(Number(v) * 10) / 10);
      const head = (b.grade || b.total != null) ? `<div class="sc-head">${b.grade ? `<span class="sc-grade">${esc(b.grade)}</span>` : ''}${b.total != null ? `<span class="sc-total">${esc(num(b.total))}<small>/100</small></span>` : ''}</div>` : '';
      const rows = arr(b.rows).map(r => `<div class="sc-row"><div class="sc-dim">${esc(r.label)}</div><div class="sc-score">${esc(num(r.score))}${r.weight != null ? `<span class="sc-wt">/${esc(Math.round(Number(r.weight)))}</span>` : ''}</div><div class="sc-rat">${esc(r.rationale || '')}</div></div>`).join('');
      return `<div class="av-block">${label}<div class="scorecard">${head}<div class="sc-rows">${rows}</div></div></div>`;
    }
    return '';
  }
  function renderArtifactView(view, rawContent) {
    const secs = arr(view && view.sections);
    if (!secs.length) return renderArtifactReadable(rawContent);
    const hint = (view && view.hint) ? `<div class="av-hint"><i>看点</i>${esc(view.hint)}</div>` : '';
    const body = secs.map(renderAvBlock).join('');
    const rawFold = `<details class="raw-fold"><summary>查看原始 JSON / 全部字段</summary><pre class="json" style="margin-top:6px">${asJson(rawContent)}</pre></details>`;
    return `<div class="readable">${hint}${body}</div>${rawFold}`;
  }

  // ---- planning-stage quality panel ----
  function renderQualityPanel(q) {
    q = obj(q);
    if (!q.report_count) return '';
    const head = obj(q.headline);
    const scoreHtml = head.score_pct != null
      ? `<div class="q-score">${esc(head.score_pct)}<small>/100</small></div>` : '';
    const passBadge = head.passed === true ? '<span class="q-badge ok">就绪可开写</span>'
      : (head.passed === false ? '<span class="q-badge fail">未就绪</span>' : '');
    const counts = head.score_pct != null || head.passed != null
      ? `<div class="muted" style="font-size:12.5px">${head.warning_count || 0} 警告 · ${head.blocking_count || 0} 阻断</div>` : '';
    const snap = obj(q.capability_snapshot);
    const capKeys = Object.keys(snap);
    const capHtml = capKeys.length ? `<div class="cap-grid">${capKeys.map(k => {
      const okv = snap[k] === true;
      return `<div class="cap-item ${okv ? 'ok' : 'no'}"><span class="dot"></span>${esc(fieldLabel(k))}${okv ? '' : ' ✗'}</div>`;
    }).join('')}</div>` : '';
    const reports = arr(q.reports).map(r => {
      const vc = r.verdict_class || 'info';
      const score = r.score_pct != null ? `<span class="q-badge ${vc}">${esc(r.score_pct)} 分</span>` : '';
      const st = r.status ? `<span class="q-badge ${vc}">${esc(r.status)}</span>` : '';
      const pass = r.passed === true ? '<span class="q-badge ok">通过</span>' : (r.passed === false ? '<span class="q-badge fail">未过</span>' : '');
      const warns = arr(r.warnings).slice(0, 5).map(w => `<li>⚠ ${esc(w.message || w.code || (typeof w === 'string' ? w : JSON.stringify(w)))}</li>`).join('');
      const blocks = arr(r.blocking_findings).slice(0, 5).map(b => `<li>⛔ ${esc(b.message || b.code || (typeof b === 'string' ? b : JSON.stringify(b)))}</li>`).join('');
      const detail = (warns || blocks) ? `<ul class="qr-detail">${blocks}${warns}</ul>` : '';
      return `<div class="q-report ${vc}"><div class="qr-head"><span class="qr-name">${esc(r.label)}</span>${score}${st}${pass}</div>${detail}</div>`;
    }).join('');
    return `<div class="q-panel">
      <div class="q-head">${scoreHtml}<div><div style="font-weight:600">开写前质量体检</div>${counts}</div>${passBadge}</div>
      ${capHtml}
      <div class="q-reports">${reports}</div>
    </div>`;
  }

      outline: '大纲与批次',

    };
    const latestKey = (doc) => `${doc.artifact_type || 'unknown'}::${doc.scope_ref_id || ''}`;

      if (!acc[key] || Number(doc.version_no || 0) > Number(acc[key].version_no || 0)) acc[key] = doc;
      return acc;
    }, {});
    const latestIds = new Set(Object.values(latestByKey).map(doc => doc.artifact_id));
    const phaseCounts = docs.reduce((acc, doc) => {
      const phase = doc.phase || 'other';
      acc[phase] = (acc[phase] || 0) + 1;
      return acc;

      return acc;

    const source = artifactState.latestOnly

  function renderRelationshipGraph() {
    const relations = arr(obj(dossier.story_bible).relationships);
    if (!relations.length) return empty('暂无人物关系边');
    const characters = arr(obj(dossier.story_bible).characters);
    const names = Array.from(new Set(relations.flatMap(r => [r.character_a, r.character_b]).filter(Boolean)));
    const degree = names.reduce((acc, name) => {
      acc[name] = relations.filter(r => r.character_a === name || r.character_b === name).length;
      return acc;
    }, {});
    const protagonist = characters.find(c => c.is_pov_character)
      || characters.find(c => /主角|protagonist|lead/i.test(`${c.role || ''} ${c.name || ''}`))
      || null;
    const hub = protagonist?.name || names.sort((a, b) => (degree[b] || 0) - (degree[a] || 0))[0];
    const hubAliases = new Set([hub, ...String(hub || '').split(/[／/、,，\s]+/).filter(Boolean)]);
    const involvesHub = (name) => {
      const value = String(name || '');
      return [...hubAliases].some(alias => alias && (value === alias || value.includes(alias) || alias.includes(value)));
    };
    const relationTone = (rel) => {
      const type = String(rel.relationship_type || '').toLowerCase();
      const strength = Number(rel.strength || 0);
      if (type.includes('conflict') || type.includes('敌') || strength < 0) return 'conflict';
      if (type.includes('ally') || type.includes('friend') || type.includes('love') || type.includes('mentor') || strength > 0.35) return 'positive';
      if (!type || type === 'unknown') return 'unknown';
      return 'neutral';
    };
    const toneLabel = { conflict: '冲突/对抗', positive: '同盟/亲密', neutral: '中性/组织', unknown: '待判定' };
    const annotated = relations.map((rel, index) => {
      const direct = involvesHub(rel.character_a) || involvesHub(rel.character_b);
      const counterpart = direct
        ? (involvesHub(rel.character_a) ? rel.character_b : rel.character_a)
        : `${rel.character_a || '未知'} / ${rel.character_b || '未知'}`;
      const hasEvidence = Boolean(rel.tension_summary || rel.private_reality || rel.public_face);
      const chapter = Number(rel.last_changed_chapter_no || rel.established_chapter_no || 0);
      const tone = relationTone(rel);
      return { rel, index, direct, counterpart, hasEvidence, chapter, tone };
    }).sort((a, b) => {
      if (a.direct !== b.direct) return a.direct ? -1 : 1;
      if (a.hasEvidence !== b.hasEvidence) return a.hasEvidence ? -1 : 1;
      return b.chapter - a.chapter;
    });
    const visibleEdges = annotated.slice(0, 42);
    const visibleNames = Array.from(new Set([hub, ...visibleEdges.flatMap(item => [item.rel.character_a, item.rel.character_b]).filter(Boolean)]));
    const canonicalHubName = visibleNames.find(involvesHub) || hub;
    const relatedNames = visibleNames.filter(name => name !== canonicalHubName);
    const width = 920;
    const height = 680;
    const cx = 460;
    const cy = 352;
    const radiusX = 330;
    const radiusY = 235;
    const nodePositions = { [canonicalHubName]: { x: cx, y: cy, hub: true } };
    relatedNames.forEach((name, index) => {
      const angle = -Math.PI / 2 + (Math.PI * 2 * index / Math.max(relatedNames.length, 1));
      nodePositions[name] = {
        x: cx + Math.cos(angle) * radiusX,
        y: cy + Math.sin(angle) * radiusY,
      };
    });
    const findPoint = (name) => {
      if (nodePositions[name]) return nodePositions[name];
      const hubLike = visibleNames.find(involvesHub);
      return nodePositions[hubLike] || nodePositions[canonicalHubName];
    };
    const curvePath = (a, b, offset) => {
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.max(1, Math.hypot(dx, dy));
      const ox = (-dy / len) * offset;
      const oy = (dx / len) * offset;
      return `M ${a.x} ${a.y} Q ${mx + ox} ${my + oy} ${b.x} ${b.y}`;
    };
    const edgeSvg = visibleEdges.map((item, visibleIndex) => {
      const a = findPoint(item.rel.character_a);
      const b = findPoint(item.rel.character_b);
      if (!a || !b) return '';
      const offset = ((visibleIndex % 5) - 2) * 14;
      const path = curvePath(a, b, offset);
      const mx = (a.x + b.x) / 2 + offset * 0.45;
      const my = (a.y + b.y) / 2 + offset * 0.45;
      const summary = item.rel.tension_summary || item.rel.private_reality || item.rel.public_face || '';
      const label = `${item.rel.relationship_type || '关系'}${item.chapter ? ` / ${item.chapter}章` : ''}`;
      const labelWidth = Math.min(190, Math.max(78, label.length * 8));
      const lineWidth = Math.max(1.2, Math.min(4.5, Math.abs(Number(item.rel.strength || 0)) * 4 + 1.5));
      return `<path class="edge-line ${item.tone}" d="${path}" fill="none" stroke-width="${lineWidth}" opacity="${item.direct ? '0.58' : '0.32'}"/>
        <g class="edge-label">
          <rect x="${mx - labelWidth / 2}" y="${my - 14}" width="${labelWidth}" height="24" rx="0"/>
          <text x="${mx}" y="${my + 2}" text-anchor="middle">${esc(label).slice(0, 26)}</text>
          ${summary ? `<title>${esc(summary)}</title>` : ''}
        </g>`;
    }).join('');
    const nodeSvg = Object.entries(nodePositions).map(([name, point]) => {
      const nodeDegree = degree[name] || relations.filter(r => r.character_a === name || r.character_b === name || involvesHub(name)).length;
      if (point.hub) {
        return `<g class="entity-node hub" transform="translate(${point.x}, ${point.y})">
          <circle r="58"/>
          <text text-anchor="middle" y="-4">${esc(name).slice(0, 10)}</text>
          <text class="node-meta" text-anchor="middle" y="18">${nodeDegree} 条关系</text>
        </g>`;
      }
      const label = String(name || '未知');
      const rectWidth = Math.min(150, Math.max(78, label.length * 13));
      return `<g class="entity-node" transform="translate(${point.x}, ${point.y})">
        <rect x="${-rectWidth / 2}" y="-24" width="${rectWidth}" height="48" rx="0"/>
        <text text-anchor="middle" y="-3">${esc(label).slice(0, 10)}</text>
        <text class="node-meta" text-anchor="middle" y="16">${nodeDegree || 1} 条</text>
      </g>`;
    }).join('');
    const directCount = annotated.filter(item => item.direct).length;
    const legend = `<div class="map-legend">
      <span class="legend-chip">中心：${esc(hub || '未命名')}</span>
      <span class="legend-chip">上图 ${visibleEdges.length}/${relations.length} 条重点边</span>
      <span class="legend-chip">直接 ${directCount} 条</span>
      <span class="legend-chip">红=冲突 绿=同盟 蓝=中性</span>
    </div>`;
    const sheet = annotated.slice(0, 24).map(item => {
      const rel = item.rel;
      const note = rel.tension_summary || rel.private_reality || rel.public_face || '暂无张力说明，需要补充关系证据。';
      const chapter = [rel.established_chapter_no ? `建立 ${rel.established_chapter_no}章` : '', rel.last_changed_chapter_no ? `变化 ${rel.last_changed_chapter_no}章` : ''].filter(Boolean).join(' / ');
      return `<div class="sheet-row ${item.tone}">
        <div class="sheet-pair">${esc(rel.character_a || '未知')} ↔ ${esc(rel.character_b || '未知')}</div>
        <div class="sheet-meta">${esc(toneLabel[item.tone])} · ${esc(rel.relationship_type || '关系')} · 强度 ${esc(rel.strength ?? '—')}${chapter ? ` · ${esc(chapter)}` : ''}</div>
        <div class="sheet-note">${esc(note)}</div>
      </div>`;
    }).join('');
    return `<div class="relationship-board">
      <div class="relationship-map">
        <div class="graph-stage">
          ${legend}
          <div class="graph-canvas">
            <svg class="case-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="人物关系网络图">
              ${edgeSvg}
              ${nodeSvg}
            </svg>
          </div>
        </div>
        <aside class="relation-inspector">
          <div class="inspector-head"><strong>重点关系线索</strong><span>按中心人物、证据完整度、章节新近度排序</span></div>
          <div class="relation-sheet">${sheet}</div>
        </aside>
      </div>
    </div>`;
  }

  function renderNarrative() {
    const narrative = obj(dossier.narrative);
    const arcs = arr(narrative.plot_arcs);
    const beats = arr(narrative.arc_beats);
    const clues = arr(narrative.clues);
    const payoffs = arr(narrative.payoffs);
    const antagonist = arr(narrative.antagonist_plans);
    const themes = arr(narrative.theme_arcs);
    if (narrativeState.arc === 'all' && arcs[0]?.arc_code) narrativeState.arc = arcs[0].arc_code;
    const selectedArc = arcs.find(arc => String(arc.arc_code) === String(narrativeState.arc)) || arcs[0] || null;
    const selectedCode = selectedArc?.arc_code || 'all';
    const arcCards = arcs.filter(arc => includesText([
      arc.name,
      arc.arc_code,
      arc.arc_type,
      arc.promise,
      arc.core_question,
      arc.target_payoff,
    ].join(' '), narrativeState.query)).map(arc => {
      const arcBeats = beats.filter(beat => beat.arc_code === arc.arc_code);
      const active = String(arc.arc_code) === String(selectedCode);
      return `<button class="arc-card ${active ? 'active' : ''}" type="button" data-narrative-arc="${esc(arc.arc_code || '')}">
        <strong>${esc(arc.name || arc.arc_code || '未命名叙事线')}</strong>
        <p>${esc(arc.promise || arc.core_question || '暂无承诺')}</p>
        <div class="tags">
          ${tag(arc.arc_code || 'arc')}
          ${tag(arc.arc_type || 'type')}
          ${tag(`${arcBeats.length}节拍`)}
          ${arc.scope_volume_number ? tag(`卷${arc.scope_volume_number}`) : ''}
        </div>
      </button>`;
    }).join('');
    const selectedBeats = beats
      .filter(beat => !selectedArc || beat.arc_code === selectedCode)
      .sort((a, b) => Number(a.scope_chapter_number || 0) - Number(b.scope_chapter_number || 0) || Number(a.beat_order || 0) - Number(b.beat_order || 0));
    const pageBeats = pageSlice(selectedBeats, narrativeState);
    const timeline = pageBeats.length ? `<div class="timeline">${pageBeats.map(beat => `
      <div class="timeline-row">
        <div class="timeline-marker">${beat.scope_chapter_number ? `第${esc(beat.scope_chapter_number)}章` : `#${esc(beat.beat_order || '?')}`}</div>
        <div class="timeline-card">
          <strong>${esc(beat.beat_kind || '节拍')} · ${esc(beat.status || '')}</strong>
          <p>${esc(beat.summary || '暂无节拍说明')}</p>
          <div class="tags">
            ${beat.emotional_shift ? tag(beat.emotional_shift) : ''}
            ${beat.arc_code ? tag(beat.arc_code) : ''}
          </div>
        </div>
      </div>
    `).join('')}</div>` : empty('这条叙事线暂无节拍');
    const relatedClues = clues.filter(clue => {
      const haystack = `${clue.arc_code || ''} ${clue.clue_code || ''} ${clue.label || ''} ${clue.description || ''}`;
      return !selectedArc || includesText(haystack, selectedCode) || includesText(haystack, selectedArc.name);
    });
    const relatedPayoffs = payoffs.filter(payoff => {
      const haystack = `${payoff.arc_code || ''} ${payoff.payoff_code || ''} ${payoff.label || ''} ${payoff.description || ''}`;
      return !selectedArc || includesText(haystack, selectedCode) || includesText(haystack, selectedArc.name);
    });
    const clueHtml = relatedClues.length ? `<div class="list">${relatedClues.slice(0, 18).map(c => item(
      c.label || c.clue_code,
      `${c.clue_code || ''} / ${c.status || ''}`,
      c.description,
      [tag(`埋 ${c.planted_in_chapter_number || '?'}`), tag(`兑 ${c.expected_payoff_by_chapter_number || '?'}`)]
    )).join('')}</div>` : empty('当前叙事线暂无可识别伏笔');
    const payoffHtml = relatedPayoffs.length ? `<div class="list">${relatedPayoffs.slice(0, 18).map(p => item(
      p.label || p.payoff_code,
      `${p.payoff_code || ''} / ${p.status || ''}`,
      p.description,
      [tag(`目标 ${p.target_chapter_number || '?'}`)]
    )).join('')}</div>` : empty('当前叙事线暂无兑现项');
    const antagonistHtml = antagonist.length ? `<div class="list">${antagonist.slice(0, 8).map(a => item(a.title, `${a.antagonist_label} / 压力 ${a.pressure_level}`, `${a.goal}\n${a.current_move}\n${a.next_countermove}`, [tag(a.threat_type), a.target_chapter_number ? tag(`目标章 ${a.target_chapter_number}`) : ''].filter(Boolean))).join('')}</div>` : empty('暂无反派计划');
    const themeHtml = themes.length ? `<div class="list">${themes.slice(0, 8).map(t => item(t.theme_code, t.current_stage, t.theme_statement, arr(t.symbol_set).map(v => tag(v)))).join('')}</div>` : empty('暂无主题线');
    const body = `<div class="workbench">
      <div class="workbench-hero">
        <div class="workbench-title">
          <h3>${esc(selectedArc?.name || '叙事线工作台')}</h3>
          <div class="meta">${esc(arcs.length)} 条线 · ${esc(beats.length)} 个节拍 · ${esc(clues.length)}/${esc(payoffs.length)} 伏笔兑现</div>
        </div>
        <p class="workbench-copy">${esc(selectedArc ? [selectedArc.promise, selectedArc.core_question, selectedArc.target_payoff].filter(Boolean).join(' / ') : '从左侧选择故事线，右侧按章节时间轴查看节拍和债务。')}</p>
      </div>
      <div class="control-bar">
        <input id="narrativeSearch" type="search" value="${esc(narrativeState.query)}" placeholder="搜索故事线、承诺、问题、兑现">
        <span class="panel-count">按线索阅读，不铺满全部节拍</span>
        <span></span>
        ${pager(selectedBeats.length, narrativeState, 'narrative')}
      </div>
      <div class="storyline-board">
        <aside class="side-index">
          <h3>故事线</h3>
          <div class="arc-list">${arcCards || empty('暂无叙事线')}</div>
        </aside>
        <section class="workbench">
          ${panel('章节时间轴', timeline, 12, `${selectedBeats.length}`)}
          <div class="ledger-grid">
            ${panel('伏笔', clueHtml, 12, `${relatedClues.length}`)}
            ${panel('兑现', payoffHtml, 12, `${relatedPayoffs.length}`)}
          </div>
          <div class="ledger-grid">
            ${panel('反派压力', antagonistHtml, 12, `${antagonist.length}`)}
            ${panel('主题符号', themeHtml, 12, `${themes.length}`)}
          </div>
        </section>
      </div>
    </div>`;
    $('#tab-narrative').innerHTML = body;
  }

  function renderContracts() {
    const narrative = obj(dossier.narrative);
    const chapterContracts = arr(narrative.chapter_contracts);
    const sceneContracts = arr(narrative.scene_contracts);
    const source = contractState.kind === 'scene' ? sceneContracts : chapterContracts;
    const filtered = source.filter(contract => includesText([
      contract.chapter_number,
      contract.scene_number,
      contract.contract_summary,
      contract.core_conflict,
      contract.closing_hook,
      contract.tail_hook,
      contract.emotional_shift,
      contract.spotlight_character,
      arr(contract.primary_arc_codes).join(' '),
      arr(contract.arc_codes).join(' '),
    ].join(' '), contractState.query));
    const pageItems = pageSlice(filtered, contractState);
    const rows = pageItems.length ? `<div class="chapter-table">${pageItems.map(contract => {
      const isScene = contractState.kind === 'scene';
      return `<div class="chapter-row">
        <div class="num">${isScene ? `第${esc(contract.chapter_number)}章 / 场${esc(contract.scene_number)}` : `第${esc(contract.chapter_number)}章`}</div>
        <div>
          <h4>${esc(isScene ? (contract.contract_summary || contract.core_conflict || '场景合约') : (contract.contract_summary || '章节合约'))}</h4>
          <p>${esc([
            contract.core_conflict ? `冲突：${contract.core_conflict}` : '',
            contract.emotional_shift ? `情绪：${contract.emotional_shift}` : '',
            contract.information_release ? `信息：${contract.information_release}` : '',
            contract.closing_hook ? `尾钩：${contract.closing_hook}` : '',
            contract.tail_hook ? `尾钩：${contract.tail_hook}` : '',
            contract.failure_cost ? `代价：${contract.failure_cost}` : '',
          ].filter(Boolean).join(' / ') || '暂无摘要')}</p>
          <div class="tags">
            ${[...arr(contract.primary_arc_codes), ...arr(contract.arc_codes)].slice(0, 6).map(v => tag(v)).join('')}
            ${arr(contract.hooks_to_plant).slice(0, 3).map(v => tag(v, 'ok')).join('')}
            ${arr(contract.relationship_debts).slice(0, 3).map(v => tag(v, 'warn')).join('')}
            ${contract.signature_image ? tag(contract.signature_image, 'ok') : ''}
            ${contract.cut_point ? tag(contract.cut_point, 'warn') : ''}
          </div>
        </div>
        <div class="panel-count">${esc([contract.pacing_mode, contract.emotion_phase, contract.loop_position, contract.hook_type, contract.information_control_mode].filter(Boolean).join(' / '))}</div>
      </div>`;
    }).join('')}</div>` : empty('当前筛选没有合约');
    const body = `<div class="workbench">
      <div class="workbench-hero">
        <div class="workbench-title">
          <h3>${contractState.kind === 'scene' ? '场景合约索引' : '章节合约索引'}</h3>
          <div class="meta">${esc(chapterContracts.length)} 章合约 · ${esc(sceneContracts.length)} 场景合约</div>
        </div>
        <p class="workbench-copy">合约是正文前最密集的执行资料；这里按合约类型分页阅读，避免一次性渲染几百章和上千场。</p>
      </div>
      <div class="control-bar">
        <input id="contractSearch" type="search" value="${esc(contractState.query)}" placeholder="搜索章节、冲突、尾钩、情绪、弧线代码">
        <button class="facet ${contractState.kind === 'chapter' ? 'active' : ''}" type="button" data-contract-kind="chapter">章节合约</button>
        <button class="facet ${contractState.kind === 'scene' ? 'active' : ''}" type="button" data-contract-kind="scene">场景合约</button>
        ${pager(filtered.length, contractState, 'contracts')}
      </div>
      ${rows}
    </div>`;
    $('#tab-contracts').innerHTML = body;
  }

  async function loadArtifactContent(target) {
    const artifact = target.closest('.artifact');
    const button = artifact?.querySelector('.artifact-load');
    // Reading-menu rows carry the id on the <details> itself (no load button);
    // the legacy workbench cards carry it on the .artifact-load button.
    const artifactId = button?.dataset.artifactId || artifact?.dataset.artifactId;
    const container = artifact?.querySelector('.artifact-readable');
    if (!artifact || artifact.dataset.loaded === 'true' || !artifactId || !container) return;
    let originalLabel = '';
    if (button) { button.disabled = true; originalLabel = button.textContent; button.textContent = '加载中'; }
    container.innerHTML = '<div class="loading-line">正在加载并整理内容…</div>';
    try {
      const response = await fetch(`/api/projects/${encodeURIComponent(slug)}/design-artifact?artifact_id=${encodeURIComponent(artifactId)}`);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || '加载失败');
      const content = data.content ?? data;
      container.innerHTML = data.view ? renderArtifactView(data.view, content) : renderArtifactReadable(content);
      artifact.dataset.contentJson = JSON.stringify(content);
      artifact.dataset.loaded = 'true';
      if (button) button.textContent = '已加载';
    } catch (err) {
      container.innerHTML = `<div class="loading-line">加载失败：${esc(err.message)}</div>`;
      if (button) { button.disabled = false; button.textContent = originalLabel; }
    }
  }

  async function postJson(url, payload) {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload || {}),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  async function editArtifact(button) {
    const artifact = button.closest('.artifact');
    if (!artifact) return;
    await loadArtifactContent(button);
    const artifactId = button.dataset.artifactId;
    if (!artifact.dataset.contentJson) {
      alert('原始内容未加载成功，暂不能编辑。');
      return;
    }
    const current = artifact.dataset.contentJson || '{}';
    const next = window.prompt('编辑这份物料 JSON。提交后会创建新版本并关闭正文门禁。', current);
    if (next === null) return;
    let parsed;
    try {
      parsed = JSON.parse(next);
    } catch (err) {
      alert(`JSON 解析失败：${err.message}`);
      return;
    }
    button.disabled = true;
    try {
      await postJson(`/api/projects/${encodeURIComponent(slug)}/prewrite/materials/${encodeURIComponent(artifactId)}/edit`, {
        content: parsed,
        notes: 'manual edit from design dossier',
      });
      await load();
    } catch (err) {
      alert(`编辑失败：${err.message}`);
    } finally {
      button.disabled = false;
    }
  }

  async function issueArtifact(button) {
    const artifactId = button.dataset.artifactId;
    const instructions = window.prompt('描述这份写前物料需要修复的问题。');
    if (!instructions || !instructions.trim()) return;
    button.disabled = true;
    try {
      const data = await postJson(`/api/projects/${encodeURIComponent(slug)}/prewrite/materials/${encodeURIComponent(artifactId)}/issue`, {
        instructions: instructions.trim(),
      });
      alert(`已创建修复任务：${data.task?.task_id || data.rewrite_task?.rewrite_task_id || 'queued'}`);
      await load();
    } catch (err) {
      alert(`提交失败：${err.message}`);
    } finally {
      button.disabled = false;
    }
  }

  async function approvePrewrite() {
    try {
      await postJson(`/api/projects/${encodeURIComponent(slug)}/prewrite/approve`, {
        notes: 'approved from design dossier',
      });
      await load();
    } catch (err) {
      alert(`审核失败：${err.message}`);
    }
  }

  async function enterWriting() {
    try {
      const data = await postJson(`/api/projects/${encodeURIComponent(slug)}/enter-writing`, {});
      alert(`正文任务已提交：${data.task_id || 'queued'}`);
      window.location.href = `/read/${encodeURIComponent(slug)}`;
    } catch (err) {
      alert(`进入正文失败：${err.message}`);
      await load();
    }
  }

  function renderAll() {
    renderHeader();
    renderOverview();
    renderArtifacts();
    renderOutline();
    renderCharacters();
    renderRelations();
    renderWorld();
    renderNarrative();
    renderContracts();
  }

  async function load() {
    $('#status').style.display = 'block';
    $('#status').textContent = '加载中…';
    try {
      const response = await fetch(`/api/projects/${encodeURIComponent(slug)}/design-dossier`);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || '加载失败');
      dossier = data;
      try {
        const reviewsResp = await fetch(`/api/projects/${encodeURIComponent(slug)}/reviews`);
        if (reviewsResp.ok) dossier._reviews = (await reviewsResp.json()).reviews || [];
      } catch (e) { /* judge reviews are optional */ }
      $('#status').style.display = 'none';
      renderAll();
    } catch (err) {
      $('#status').style.display = 'block';
      $('#status').textContent = `加载失败：${err.message}`;
    }
  }

  $$('.tab').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));
  $('#refreshBtn').addEventListener('click', load);
  $('#approvePrewriteBtn').addEventListener('click', approvePrewrite);
  $('#enterWritingBtn').addEventListener('click', enterWriting);

  function renderTarget(target) {
    if (target === 'artifacts') renderArtifacts();
    if (target === 'outline') renderOutline();
    if (target === 'narrative') renderNarrative();
    if (target === 'contracts') renderContracts();
  }

  function stateForTarget(target) {
    if (target === 'artifacts') return artifactState;
    if (target === 'outline') return outlineState;
    if (target === 'narrative') return narrativeState;
    if (target === 'contracts') return contractState;
    return null;
  }

  document.addEventListener('change', event => {
    const target = event.target instanceof HTMLElement ? event.target : null;
    if (!target) return;
    if (target.id === 'artifactSearch') {
      artifactState.query = target.value || '';
      artifactState.page = 1;
      renderArtifacts();
      return;
    }
    if (target.id === 'artifactStatus') {
      artifactState.status = target.value || 'all';
      artifactState.page = 1;
      renderArtifacts();
      return;
    }
    if (target.id === 'artifactLatestOnly') {
      artifactState.latestOnly = Boolean(target.checked);
      artifactState.page = 1;
      renderArtifacts();
      return;
    }
    if (target.id === 'outlineSearch') {
      outlineState.query = target.value || '';
      outlineState.page = 1;
      renderOutline();
      return;
    }
    if (target.id === 'outlineStatus') {
      outlineState.status = target.value || 'all';
      outlineState.page = 1;
      renderOutline();
      return;
    }
    if (target.id === 'narrativeSearch') {
      narrativeState.query = target.value || '';
      narrativeState.page = 1;
      renderNarrative();
      return;
    }
    if (target.id === 'contractSearch') {
      contractState.query = target.value || '';
      contractState.page = 1;
      renderContracts();
    }
  });

  document.addEventListener('click', event => {
    const target = event.target instanceof HTMLElement ? event.target : null;
    const phaseButton = target?.closest('[data-artifact-phase]');
    if (phaseButton) {
      event.preventDefault();
      artifactState.phase = phaseButton.dataset.artifactPhase || 'all';
      artifactState.page = 1;
      renderArtifacts();
      return;
    }

    const volumeButton = target?.closest('[data-outline-volume]');
    if (volumeButton) {
      event.preventDefault();
      outlineState.volume = volumeButton.dataset.outlineVolume || 'all';
      outlineState.page = 1;
      renderOutline();
      return;
    }

    const arcButton = target?.closest('[data-narrative-arc]');
    if (arcButton) {
      event.preventDefault();
      narrativeState.arc = arcButton.dataset.narrativeArc || 'all';
      narrativeState.page = 1;
      renderNarrative();
      return;
    }

    const contractKindButton = target?.closest('[data-contract-kind]');
    if (contractKindButton) {
      event.preventDefault();
      contractState.kind = contractKindButton.dataset.contractKind || 'chapter';
      contractState.page = 1;
      renderContracts();
      return;
    }

    const pageButton = target?.closest('[data-page-delta]');
    if (pageButton) {
      const pageTarget = pageButton.closest('[data-page-target]')?.dataset.pageTarget;
      const state = stateForTarget(pageTarget);
      if (state) {
        event.preventDefault();
        state.page = Math.max(1, Number(state.page || 1) + Number(pageButton.dataset.pageDelta || 0));
        renderTarget(pageTarget);
      }
      return;
    }

    const editButton = target?.closest('.artifact-edit');
    if (editButton) {
      event.preventDefault();
      editArtifact(editButton);
      return;
    }
    const issueButton = target?.closest('.artifact-issue');
    if (issueButton) {
      event.preventDefault();
      issueArtifact(issueButton);
      return;
    }
    const button = target?.closest('.artifact-load');
    if (!button) return;
    event.preventDefault();
    loadArtifactContent(button);
  });
  document.addEventListener('toggle', event => {
    const target = event.target instanceof HTMLElement ? event.target : null;
    if (!target?.matches('details.artifact') || !target.open) return;
    loadArtifactContent(target);
  }, true);
  load();
})();
</script>
</body>
</html>
