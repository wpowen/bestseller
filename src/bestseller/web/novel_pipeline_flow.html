<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说设计数据流</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2332;
    --surface-2: #243044;
    --border: #2d3f56;
    --text: #e8edf3;
    --text-muted: #8899aa;
    --accent: #4a9eff;
    --accent-dim: #2a5f9e;
    --success: #4ade80;
    --warning: #fbbf24;
    --error: #f87171;
    --purple: #a78bfa;
    --pink: #f472b6;
    --cyan: #22d3ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }
  .brand .meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .actions {
    display: flex;
    gap: 8px;
  }
  .btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover {
    background: var(--border);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 1200px) {
    .grid, .grid-3 { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .icon {
    font-size: 20px;
  }

  .project-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .info-item {
    padding: 12px;
    background: var(--surface-2);
    border-radius: 8px;
  }
  .info-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .info-value {
    font-size: 14px;
    font-weight: 500;
  }

  .character-list {
    max-height: 500px;
    overflow-y: auto;
  }
  .character-item {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.2s;
  }
  .character-item:hover {
    background: var(--surface-2);
  }
  .character-item:last-child {
    border-bottom: none;
  }
  .character-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .character-role {
    font-size: 12px;
    color: var(--text-muted);
  }
  .character-detail {
    margin-top: 8px;
    padding: 12px;
    background: var(--surface-2);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .character-item.expanded .character-detail {
    display: block;
  }
  .character-detail div {
    margin-bottom: 6px;
  }
  .character-detail strong {
    color: var(--accent);
  }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 10px;
    font-size: 11px;
    margin: 2px;
  }
  .tag.success {
    background: rgba(74, 222, 128, 0.2);
    color: var(--success);
  }
  .tag.warning {
    background: rgba(251, 191, 36, 0.2);
    color: var(--warning);
  }
  .tag.error {
    background: rgba(248, 113, 113, 0.2);
    color: var(--error);
  }
  .tag.purple {
    background: rgba(167, 139, 250, 0.2);
    color: var(--purple);
  }

  .chapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
    gap: 4px;
    max-height: 300px;
    overflow-y: auto;
  }
  .chapter-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .chapter-cell.completed {
    background: var(--success);
    color: #000;
  }
  .chapter-cell.in-progress {
    background: var(--accent);
    color: #000;
  }
  .chapter-cell.blocked {
    background: var(--error);
    color: #000;
  }
  .chapter-cell.planned {
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .chapter-cell:hover {
    transform: scale(1.1);
    z-index: 10;
  }

  .volume-section {
    margin-bottom: 20px;
    padding: 16px;
    background: var(--surface-2);
    border-radius: 8px;
  }
  .volume-header {
    font-size: 14px;
    font-weight: 600;
    color: var(--purple);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .milestone-list {
    list-style: none;
  }
  .milestone-item {
    padding: 10px;
    border-left: 3px solid var(--accent-dim);
    margin-bottom: 8px;
    background: var(--surface);
    border-radius: 0 6px 6px 0;
    font-size: 13px;
  }
  .milestone-item.active {
    border-left-color: var(--accent);
  }
  .milestone-item.completed {
    border-left-color: var(--success);
  }
  .milestone-range {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .premise-box {
    padding: 16px;
    background: var(--surface-2);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  @media (max-width: 1200px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .stat-card {
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
  }
  .loading-spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .full-width {
    grid-column: 1 / -1;
  }

  .relationship-item {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .relationship-item:last-child {
    border-bottom: none;
  }
  .relationship-characters {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .relationship-type {
    color: var(--text-muted);
    font-size: 12px;
  }

  .contract-item {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .contract-item:last-child {
    border-bottom: none;
  }
  .contract-header {
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--cyan);
  }
  .contract-summary {
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .arc-item {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  .arc-item:last-child {
    border-bottom: none;
  }
  .arc-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .arc-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  ::-webkit-scrollbar {
    width: 6px;
  }
  ::-webkit-scrollbar-track {
    background: var(--surface);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .section-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
  }

  .empty-state {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <h1 id="title">小说设计数据流</h1>
      <div class="meta" id="projectMeta">加载中...</div>
    </div>
    <div class="actions">
      <a class="btn" href="/library">书稿库</a>
      <button class="btn" onclick="loadData()">刷新</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-value" id="statChapters">-</div>
      <div class="stat-label">已完成章节</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statCharacters">-</div>
      <div class="stat-label">角色数量</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statWordCount">-</div>
      <div class="stat-label">总字数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statArcs">-</div>
      <div class="stat-label">故事线</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statContracts">-</div>
      <div class="stat-label">章节契约</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2><span class="icon">📖</span> 项目概览</h2>
      <div class="project-info" id="projectInfo">
        <div class="info-item">
          <div class="info-label">类型</div>
          <div class="info-value" id="infoGenre">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">状态</div>
          <div class="info-value" id="infoStatus">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">目标章节</div>
          <div class="info-value" id="infoTarget">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">当前章节</div>
          <div class="info-value" id="infoCurrent">-</div>
        </div>
      </div>
      <div style="margin-top: 16px;">
        <div class="info-label">故事前提</div>
        <div class="premise-box" id="premiseBox">-</div>
      </div>
    </div>

    <div class="card">
      <h2><span class="icon">🌍</span> 世界观主干</h2>
      <div id="worldBackbone">
        <div class="loading"><span class="loading-spinner"></span>加载中...</div>
      </div>
    </div>
  </div>

  <div class="section-title">故事设计</div>
  <div class="grid-3">
    <div class="card">
      <h2><span class="icon">🎭</span> 故事线</h2>
      <div class="character-list" id="arcList">
        <div class="loading"><span class="loading-spinner"></span>加载中...</div>
      </div>
    </div>

    <div class="card">
      <h2><span class="icon">📜</span> 章节契约</h2>
      <div class="character-list" id="contractList">
        <div class="loading"><span class="loading-spinner"></span>加载中...</div>
      </div>
    </div>

    <div class="card">
      <h2><span class="icon">🗺️</span> 卷规划</h2>
      <div class="character-list" id="volumePlan">
        <div class="loading"><span class="loading-spinner"></span>加载中...</div>
      </div>
    </div>
  </div>

  <div class="section-title">角色系统</div>
  <div class="grid">
    <div class="card">
      <h2><span class="icon">👥</span> 核心角色</h2>
      <div class="character-list" id="characterList">
        <div class="loading"><span class="loading-spinner"></span>加载中...</div>
      </div>
    </div>

    <div class="card">
      <h2><span class="icon">🔗</span> 角色关系</h2>
      <div class="character-list" id="relationshipList">
        <div class="loading"><span class="loading-spinner"></span>加载中...</div>
      </div>
    </div>
  </div>

  <div class="section-title">世界观</div>
  <div class="grid">
    <div class="card">
      <h2><span class="icon">📏</span> 世界规则</h2>
      <div class="character-list" id="worldRulesList">
        <div class="loading"><span class="loading-spinner"></span>加载中...</div>
      </div>
    </div>

    <div class="card">
      <h2><span class="icon">🏛️</span> 势力阵营</h2>
      <div class="character-list" id="factionList">
        <div class="loading"><span class="loading-spinner"></span>加载中...</div>
      </div>
    </div>
  </div>

  <div class="section-title">章节进度</div>
  <div class="card full-width" style="margin-bottom: 24px;">
    <h2><span class="icon">📊</span> 章节完成状态</h2>
    <div id="chapterGrid">
      <div class="loading"><span class="loading-spinner"></span>加载中...</div>
    </div>
  </div>
</div>

<script>
const slug = location.pathname.split('/').filter(Boolean).pop() || '';

async function fetchData(endpoint) {
  const res = await fetch(`/api/projects/${encodeURIComponent(slug)}/${endpoint}`);
  if (!res.ok) throw new Error(`${endpoint}: ${res.statusText}`);
  return res.json();
}

function formatNumber(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return n.toString();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderProjectInfo(project) {
  document.getElementById('title').textContent = project.title || '未命名';
  document.getElementById('projectMeta').textContent = `${project.genre || ''} · ${project.sub_genre || ''} · ${project.status || ''}`;
  document.getElementById('infoGenre').textContent = `${project.genre || '-'} / ${project.sub_genre || '-'}`;
  document.getElementById('infoStatus').textContent = project.status || '-';
  document.getElementById('infoTarget').textContent = project.target_chapters || '-';
  document.getElementById('infoCurrent').textContent = project.current_chapter_number || '-';
  document.getElementById('premiseBox').textContent = project.premise || '-';
}

function renderWorldBackbone(backbone) {
  if (!backbone) {
    document.getElementById('worldBackbone').innerHTML = '<div class="empty-state">无世界观数据</div>';
    return;
  }
  const html = `
    <div style="margin-bottom: 12px;">
      <div class="info-label">核心承诺</div>
      <div style="font-size: 13px; margin-top: 4px;">${escapeHtml(backbone.core_promise) || '-'}</div>
    </div>
    <div style="margin-bottom: 12px;">
      <div class="info-label">主线驱动</div>
      <div style="font-size: 13px; margin-top: 4px;">${escapeHtml(backbone.mainline_drive) || '-'}</div>
    </div>
    <div style="margin-bottom: 12px;">
      <div class="info-label">主角命运</div>
      <div style="font-size: 13px; margin-top: 4px;">${escapeHtml(backbone.protagonist_destiny) || '-'}</div>
    </div>
    <div>
      <div class="info-label">对抗轴线</div>
      <div style="font-size: 13px; margin-top: 4px;">${escapeHtml(backbone.antagonist_axis) || '-'}</div>
    </div>
  `;
  document.getElementById('worldBackbone').innerHTML = html;
}

function renderArcs(arcs) {
  if (!arcs || arcs.length === 0) {
    document.getElementById('arcList').innerHTML = '<div class="empty-state">无故事线数据</div>';
    return;
  }

  const html = arcs.map(a => `
    <div class="arc-item">
      <div class="arc-name">${escapeHtml(a.name) || '未命名'}</div>
      <div class="arc-desc">
        <span class="tag ${a.status === 'active' ? 'success' : ''}">${a.status || 'planned'}</span>
        ${a.arc_type ? `<span class="tag purple">${a.arc_type}</span>` : ''}
      </div>
      ${a.description ? `<div class="arc-desc" style="margin-top: 6px;">${escapeHtml(a.description).substring(0, 150)}${a.description.length > 150 ? '...' : ''}</div>` : ''}
    </div>
  `).join('');
  document.getElementById('arcList').innerHTML = html;
}

function renderContracts(contracts) {
  if (!contracts || contracts.length === 0) {
    document.getElementById('contractList').innerHTML = '<div class="empty-state">无章节契约数据</div>';
    return;
  }

  const html = contracts.slice(0, 10).map(c => `
    <div class="contract-item">
      <div class="contract-header">第 ${c.chapter_number} 章</div>
      <div class="contract-summary">${escapeHtml(c.contract_summary || c.core_conflict || '-').substring(0, 120)}${(c.contract_summary || '').length > 120 ? '...' : ''}</div>
    </div>
  `).join('');
  document.getElementById('contractList').innerHTML = html;
}

function renderVolumePlan(volumes) {
  if (!volumes || volumes.length === 0) {
    document.getElementById('volumePlan').innerHTML = '<div class="empty-state">无卷规划数据</div>';
    return;
  }

  const currentChapter = parseInt(document.getElementById('infoCurrent').textContent) || 0;

  const html = volumes.map(v => {
    const start = v.start_chapter_number || v.chapter_range?.[0] || 0;
    const end = v.end_chapter_number || v.chapter_range?.[1] || 0;
    const isActive = currentChapter >= start && currentChapter <= end;
    const isCompleted = currentChapter > end;
    const cls = isCompleted ? 'completed' : (isActive ? 'active' : '');

    return `
      <div class="milestone-item ${cls}">
        <div class="milestone-range">第 ${start}-${end} 章</div>
        <div style="font-weight: 600; margin-bottom: 4px;">${escapeHtml(v.title) || `第 ${v.volume_number} 卷`}</div>
        <div style="font-size: 12px; color: var(--text-muted);">${escapeHtml(v.frontier_summary || '').substring(0, 100)}${(v.frontier_summary || '').length > 100 ? '...' : ''}</div>
      </div>
    `;
  }).join('');
  document.getElementById('volumePlan').innerHTML = html;
}

function renderCharacters(characters) {
  if (!characters || characters.length === 0) {
    document.getElementById('characterList').innerHTML = '<div class="empty-state">无角色数据</div>';
    return;
  }

  const mainChars = characters.filter(c => 
    c.role === 'protagonist' || 
    c.role === 'antagonist' || 
    c.is_pov_character
  ).slice(0, 15);

  if (mainChars.length === 0) {
    document.getElementById('characterList').innerHTML = '<div class="empty-state">无核心角色数据</div>';
    return;
  }

  const html = mainChars.map(c => `
    <div class="character-item" onclick="this.classList.toggle('expanded')">
      <div class="character-name">
        ${escapeHtml(c.name) || '未命名'}
        <span class="tag ${c.role === 'protagonist' ? 'success' : c.role === 'antagonist' ? 'error' : 'purple'}">${c.role || '未指定'}</span>
        ${c.power_tier ? `<span class="tag">${c.power_tier}</span>` : ''}
      </div>
      <div class="character-role">${escapeHtml(c.arc_state || '').substring(0, 50)}</div>
      <div class="character-detail">
        <div><strong>目标：</strong>${escapeHtml(c.goal) || '-'}</div>
        <div><strong>恐惧：</strong>${escapeHtml(c.fear) || '-'}</div>
        <div><strong>缺陷：</strong>${escapeHtml(c.flaw) || '-'}</div>
        ${c.arc_state ? `<div><strong>弧线状态：</strong>${escapeHtml(c.arc_state)}</div>` : ''}
        ${c.latest_state?.emotional_state ? `<div><strong>情绪状态：</strong>${escapeHtml(c.latest_state.emotional_state)}</div>` : ''}
        ${c.moral_framework?.core_values ? `<div><strong>核心价值：</strong>${c.moral_framework.core_values.join('、')}</div>` : ''}
      </div>
    </div>
  `).join('');
  document.getElementById('characterList').innerHTML = html;
}

function renderRelationships(relationships) {
  if (!relationships || relationships.length === 0) {
    document.getElementById('relationshipList').innerHTML = '<div class="empty-state">无关系数据</div>';
    return;
  }

  const mainRels = relationships.filter(r => 
    r.character_a === '林渊' || r.character_b === '林渊'
  ).slice(0, 15);

  if (mainRels.length === 0) {
    document.getElementById('relationshipList').innerHTML = '<div class="empty-state">无主角关系数据</div>';
    return;
  }

  const html = mainRels.map(r => `
    <div class="relationship-item">
      <div class="relationship-characters">${escapeHtml(r.character_a)} → ${escapeHtml(r.character_b)}</div>
      <div class="relationship-type">
        <span class="tag ${r.relationship_type === 'conflict' ? 'error' : r.relationship_type === 'ally' ? 'success' : ''}">${r.relationship_type || '未指定'}</span>
        ${r.tension ? `<span style="margin-left: 8px; color: var(--text-muted);">${escapeHtml(r.tension)}</span>` : ''}
      </div>
    </div>
  `).join('');
  document.getElementById('relationshipList').innerHTML = html;
}

function renderWorldRules(rules) {
  if (!rules || rules.length === 0) {
    document.getElementById('worldRulesList').innerHTML = '<div class="empty-state">无世界规则数据</div>';
    return;
  }

  const html = rules.slice(0, 15).map(r => `
    <div class="character-item">
      <div class="character-name">${escapeHtml(r.name) || '未命名'}</div>
      <div class="character-role">${escapeHtml(r.description || '').substring(0, 100)}${(r.description || '').length > 100 ? '...' : ''}</div>
    </div>
  `).join('');
  document.getElementById('worldRulesList').innerHTML = html;
}

function renderFactions(factions) {
  if (!factions || factions.length === 0) {
    document.getElementById('factionList').innerHTML = '<div class="empty-state">无势力数据</div>';
    return;
  }

  const html = factions.slice(0, 15).map(f => `
    <div class="character-item">
      <div class="character-name">${escapeHtml(f.name) || '未命名'}</div>
      <div class="character-role">${escapeHtml(f.description || f.faction_type || '').substring(0, 100)}</div>
    </div>
  `).join('');
  document.getElementById('factionList').innerHTML = html;
}

function renderChapters(chapters) {
  if (!chapters || chapters.length === 0) {
    document.getElementById('chapterGrid').innerHTML = '<div class="empty-state">无章节数据</div>';
    return;
  }

  const html = chapters.map(ch => {
    let cls = 'planned';
    if (ch.word_count > 5000) cls = 'completed';
    else if (ch.word_count > 0) cls = 'in-progress';
    if (ch.production_state === 'blocked') cls = 'blocked';

    return `
      <div class="chapter-cell ${cls}" title="第${ch.chapter_number}章: ${ch.title || '未命名'} (${ch.word_count}字)">
        ${ch.chapter_number}
      </div>
    `;
  }).join('');

  document.getElementById('chapterGrid').innerHTML = `
    <div class="chapter-grid">${html}</div>
    <div style="margin-top: 12px; display: flex; gap: 16px; font-size: 12px; flex-wrap: wrap;">
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--success);border-radius:3px;margin-right:4px"></span>已完成 (>5000字)</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--accent);border-radius:3px;margin-right:4px"></span>进行中</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--error);border-radius:3px;margin-right:4px"></span>阻塞</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:3px;margin-right:4px"></span>计划中</span>
    </div>
  `;
}

async function loadData() {
  try {
    document.getElementById('projectMeta').innerHTML = '<span class="loading-spinner"></span>加载中...';
    
    const [storyBible, narrative] = await Promise.all([
      fetchData('story-bible'),
      fetchData('narrative')
    ]);

    const project = storyBible.project || {};
    const chapters = narrative.chapter_contracts || [];

    renderProjectInfo({
      title: storyBible.title,
      genre: storyBible.world_backbone?.world_frame?.split('/')[0]?.trim(),
      sub_genre: storyBible.world_backbone?.world_frame?.split('/')[1]?.trim(),
      status: 'revising',
      target_chapters: 500,
      current_chapter_number: 85,
      premise: storyBible.world_backbone?.core_promise
    });
    renderWorldBackbone(storyBible.world_backbone);
    renderArcs(narrative.plot_arcs || []);
    renderContracts(narrative.chapter_contracts || []);
    renderVolumePlan(storyBible.volume_frontiers || []);
    renderCharacters(storyBible.characters || []);
    renderRelationships(storyBible.relationships || []);
    renderWorldRules(storyBible.world_rules || []);
    renderFactions(storyBible.factions || []);
    renderChapters([]);

    const totalWords = 0;
    const completedChapters = 85;
    const criticalIssues = 0;

    document.getElementById('statChapters').textContent = completedChapters;
    document.getElementById('statCharacters').textContent = (storyBible.characters || []).length;
    document.getElementById('statWordCount').textContent = formatNumber(totalWords);
    document.getElementById('statArcs').textContent = (narrative.plot_arcs || []).length;
    document.getElementById('statContracts').textContent = (narrative.chapter_contracts || []).length;

    document.getElementById('projectMeta').textContent = `${storyBible.title || ''} · 惊悚灵异 · revising`;

  } catch (err) {
    console.error('Load failed:', err);
    document.getElementById('projectMeta').textContent = '加载失败: ' + err.message;
  }
}

loadData();
</script>
</body>
</html>
